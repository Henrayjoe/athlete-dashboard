<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* ══ FOOTBALLFIT DESIGN SYSTEM ═════════════════════════════════════════════
     Warm-neutral document palette. Charcoal navigation, cream reading column,
     stone panels, hairline rules. --accent stays #1a56db because the SVG and
     Chart.js drawing code references that hex directly.
     ───────────────────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* surfaces */
    --ink:#17181A; --charcoal:#232528; --charcoal-2:#2E3135;
    --cream:#FFFEFA; --surface:#FFFFFF; --surface-alt:#F7F5F0; --stone:#F1EEE7;
    --bg:#EFEDE6;
    /* rules + type */
    --border:#E4E1D9; --line-soft:#EFECE4;
    --text-primary:#17181A; --text-secondary:#4C4E52; --text-muted:#86857F;
    --on-dark:#EDEBE6; --on-dark-soft:#9E9C96;
    /* accent — must stay in sync with the hex used inside the JS drawing code */
    --accent:#1a56db; --accent-light:#ECF1FD; --accent-deep:#1343a8;
    /* five-tier semantic scale (mirrors SCORE_COLS in the script) */
    --c-exceeds-bg:#EDF6F0; --c-exceeds-text:#1F5134; --c-exceeds:#16a34a;
    --c-meets-bg:#ECF1FD;   --c-meets-text:#1B3A6B;   --c-meets:#1a56db;
    --c-near-bg:#FBF4E2;    --c-near-text:#6E5410;    --c-near:#ca8a04;
    --c-below-bg:#FBEEE4;   --c-below-text:#7E3C14;   --c-below:#ea580c;
    --c-priority-bg:#FAEAE7;--c-priority-text:#76241B;--c-priority:#dc2626;
    --radius:9px; --radius-lg:13px; --radius-sm:6px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --shadow-sm:0 1px 2px rgba(23,24,26,.04);
    --shadow-md:0 8px 26px rgba(23,24,26,.10);
  }
  body {
    font-family:var(--font); background:var(--cream); color:var(--text-primary);
    font-size:13px; line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    font-feature-settings:'tnum' 0;
  }
  /* the rail is sticky at 100vh, so its column is painted on .app — otherwise the
     page background shows through below the rail on long pages */
  .app {
    display:grid; grid-template-columns:264px 1fr; min-height:100vh;
    background:linear-gradient(90deg, var(--charcoal) 0 264px, var(--cream) 264px);
  }

  /* ── SIDEBAR — charcoal navigation rail ─────────────────────────────────── */
  .sidebar {
    background:var(--charcoal); color:var(--on-dark);
    border-right:1px solid rgba(255,255,255,.06);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:hidden;
  }
  .sb-brand { padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08); }
  .sb-brand img { filter:brightness(0) invert(1); opacity:.96; }
  .sb-brand h1 {
    font-size:11px; font-weight:600; color:var(--on-dark);
    text-transform:uppercase; letter-spacing:.14em;
  }
  .sb-brand p {
    font-size:10px; color:var(--on-dark-soft); text-transform:uppercase;
    letter-spacing:.12em; margin-top:4px; font-weight:400;
  }
  .sb-search { padding:14px 16px 12px; }
  .sb-search input {
    width:100%; padding:8px 11px; font-size:12px; font-family:var(--font);
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
    border-radius:var(--radius-sm); color:var(--on-dark); outline:none;
    transition:border-color .15s, background .15s;
  }
  .sb-search input:focus { border-color:rgba(255,255,255,.30); background:rgba(255,255,255,.11); }
  .sb-search input::placeholder { color:#7C7B76; }
  .alist { flex:1; overflow-y:auto; padding:4px 10px 10px; }
  .alist::-webkit-scrollbar { width:7px; }
  .alist::-webkit-scrollbar-thumb { background:rgba(255,255,255,.14); border-radius:4px; }
  .aitem {
    display:flex; align-items:center; gap:11px; padding:9px 11px; cursor:pointer;
    border-radius:var(--radius-sm); border-left:2px solid transparent;
    transition:background .14s;
  }
  .aitem:hover { background:rgba(255,255,255,.055); }
  .aitem.active { background:rgba(255,255,255,.11); border-left-color:#fff; }
  .av {
    width:33px; height:33px; border-radius:50%;
    background:rgba(255,255,255,.10); color:var(--on-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600; letter-spacing:.02em; flex-shrink:0;
  }
  .aitem.active .av { background:#fff; color:var(--charcoal); }
  .ameta { flex:1; min-width:0; }
  .aname { font-size:13px; font-weight:500; color:var(--on-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .apos  { font-size:10.5px; color:var(--on-dark-soft); text-transform:uppercase; letter-spacing:.07em; margin-top:1px; }
  .sdot  { width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 2px rgba(255,255,255,.12); }
  .settings-bar {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 16px; border-top:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.18);
  }
  .settings-bar span { font-size:10.5px; color:var(--on-dark-soft); }

  /* ── BUTTONS ───────────────────────────────────────────────────────────── */
  .btn {
    display:inline-flex; align-items:center; gap:7px; padding:9px 18px;
    background:var(--ink); color:#fff; border:none; border-radius:var(--radius-sm);
    font-size:12.5px; font-weight:600; font-family:var(--font); letter-spacing:.01em;
    cursor:pointer; margin-top:12px; transition:background .15s, transform .1s;
  }
  .btn:hover { background:#000; }
  .btn:active { transform:translateY(1px); }
  .btn-sm {
    padding:6px 12px; font-size:11.5px; font-family:var(--font); font-weight:500;
    background:rgba(255,255,255,.08); color:var(--on-dark);
    border:1px solid rgba(255,255,255,.14); border-radius:var(--radius-sm);
    cursor:pointer; transition:background .15s, border-color .15s;
  }
  .btn-sm:hover { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.26); }
  /* buttons that sit on the light document column */
  .main .btn-sm, .print-menu .btn-sm, .tab-card .btn-sm {
    background:var(--surface); color:var(--text-secondary); border-color:var(--border);
  }
  .main .btn-sm:hover, .tab-card .btn-sm:hover { background:var(--stone); border-color:#D6D2C8; color:var(--text-primary); }

  /* ── DOCUMENT COLUMN ───────────────────────────────────────────────────── */
  .main {
    padding:30px 34px 56px; display:flex; flex-direction:column; gap:18px;
    background:var(--cream); width:100%; min-width:0;
  }
  .state-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:62vh; gap:13px; text-align:center; }
  .state-screen h2 { font-size:17px; font-weight:600; letter-spacing:-.01em; color:var(--text-primary); }
  .state-screen p  { font-size:13px; color:var(--text-muted); max-width:450px; line-height:1.65; }
  .config-box {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:28px 30px; max-width:560px; width:100%; text-align:left; box-shadow:var(--shadow-sm);
  }
  .config-box h3 { font-size:16px; font-weight:600; letter-spacing:-.01em; margin-bottom:7px; }
  .config-box p  { font-size:12.5px; color:var(--text-secondary); margin-bottom:18px; line-height:1.65; }
  .config-box label {
    font-size:9.5px; font-weight:600; display:block; margin:16px 0 5px;
    text-transform:uppercase; letter-spacing:.13em; color:var(--text-muted);
  }
  .config-box input {
    width:100%; padding:9px 12px; font-size:13px; font-family:var(--font);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface-alt); outline:none; color:var(--text-primary);
  }
  .config-box input:focus { border-color:var(--accent); background:#fff; }
  .hint { font-size:11px; color:var(--text-muted); margin-top:10px; line-height:1.65; }

  /* ── ATHLETE HERO ──────────────────────────────────────────────────────── */
  .profile-card {
    background:var(--charcoal); color:var(--on-dark);
    border:1px solid var(--charcoal); border-radius:var(--radius-lg);
    padding:22px 26px; display:flex; gap:18px; align-items:flex-start;
  }
  .pav {
    width:54px; height:54px; border-radius:50%;
    background:rgba(255,255,255,.11); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; letter-spacing:.02em; flex-shrink:0;
  }
  .pinfo h2 { font-size:24px; font-weight:600; letter-spacing:-.025em; color:#fff; line-height:1.15; }
  .pinfo .pmeta { font-size:12px; color:var(--on-dark-soft); margin-top:5px; letter-spacing:.01em; }
  .ptags { display:flex; gap:7px; margin-top:13px; flex-wrap:wrap; }
  .ptag {
    font-size:10.5px; padding:4px 10px; border-radius:20px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    color:var(--on-dark); letter-spacing:.01em;
  }
  .ptag.inj { background:rgba(217,169,91,.16); border-color:rgba(217,169,91,.45); color:#E7C583; }

  /* ── CATEGORY SCORECARD ────────────────────────────────────────────────── */
  .cat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:11px; }
  .cat-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px 15px; box-shadow:var(--shadow-sm);
    position:relative; overflow:hidden;
  }
  .cat-name {
    font-size:9px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.14em; font-weight:600; margin-bottom:7px;
  }
  .cat-status { font-size:14px; font-weight:600; letter-spacing:-.01em; }

  /* ── EYEBROW SECTION LABEL ─────────────────────────────────────────────── */
  .sec-heading {
    font-size:9px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.15em; font-weight:600; margin-bottom:10px; padding-left:1px;
  }

  /* ── TAB SHELL ─────────────────────────────────────────────────────────── */
  .tab-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm);
  }
  .tabs {
    display:flex; border-bottom:1px solid var(--border); background:var(--surface-alt);
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    padding:13px 18px 11px; font-size:12.5px; font-weight:500; color:var(--text-muted);
    cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
    transition:color .14s, background .14s;
  }
  .tab:hover { color:var(--text-primary); background:rgba(0,0,0,.018); }
  .tab.active { color:var(--text-primary); border-bottom-color:var(--ink); background:var(--surface); font-weight:600; }
  /* panels are sections in one document now; .tc kept so the print capture
     code and the panel renderers keep finding their containers */
  .tc { display:block; }
  .results-body { padding:20px 22px 22px; display:flex; flex-direction:column; gap:20px; }
  .quadrant-body, .feedback-wrap { padding:20px 22px 22px; }
  #quadrantContainer, #radarContainer, #asrContainer, #mpContainer { display:flex; justify-content:center; }
  #quadrantContainer > svg, #radarContainer > svg, #asrContainer > svg, #mpContainer > svg { max-width:100%; height:auto; }

  /* ── TABLES ────────────────────────────────────────────────────────────── */
  table { width:100%; border-collapse:collapse; font-size:12px; }
  thead th {
    padding:9px 14px; text-align:left; font-size:9px; font-weight:600;
    color:var(--text-muted); letter-spacing:.14em; text-transform:uppercase;
    background:var(--surface-alt); border-bottom:1px solid var(--border);
    border-top:1px solid var(--border);
  }
  tbody td { padding:11px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:var(--surface-alt); }
  td.lbl { color:var(--text-secondary); font-weight:500; }
  .miss  { color:var(--text-muted); font-style:italic; font-size:11px; }
  .rval  { font-size:15px; font-weight:600; letter-spacing:-.015em; font-variant-numeric:tabular-nums; }
  .runit { font-size:10.5px; color:var(--text-muted); margin-left:3px; font-weight:400; letter-spacing:.02em; }
  .rsub  { font-size:10.5px; color:var(--text-muted); margin-left:6px; }
  .delta { font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }

  /* ── STATUS PILLS ──────────────────────────────────────────────────────── */
  .pill {
    display:inline-flex; align-items:center; gap:6px; padding:4px 11px;
    border-radius:20px; font-size:10.5px; font-weight:600; white-space:nowrap;
    letter-spacing:.01em;
  }
  .pill-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .p4{background:var(--c-exceeds-bg); color:var(--c-exceeds-text); box-shadow:inset 0 0 0 1px rgba(22,163,74,.18)}
  .p3{background:var(--c-meets-bg);   color:var(--c-meets-text);   box-shadow:inset 0 0 0 1px rgba(26,86,219,.16)}
  .p2{background:var(--c-near-bg);    color:var(--c-near-text);    box-shadow:inset 0 0 0 1px rgba(202,138,4,.22)}
  .p1{background:var(--c-below-bg);   color:var(--c-below-text);   box-shadow:inset 0 0 0 1px rgba(234,88,12,.20)}
  .p0{background:var(--c-priority-bg);color:var(--c-priority-text);box-shadow:inset 0 0 0 1px rgba(220,38,38,.20)}
  .calc-badge {
    display:inline-block; font-size:9px; background:var(--stone); color:var(--text-muted);
    border:1px solid var(--border); border-radius:4px; padding:2px 6px; margin-left:6px;
    font-weight:600; vertical-align:middle; text-transform:uppercase; letter-spacing:.09em;
  }
  .status-key {
    display:flex; flex-wrap:wrap; gap:7px; padding:15px 22px;
    border-top:1px solid var(--border); background:var(--surface-alt); align-items:center;
  }
  .key-label {
    font-size:9px; color:var(--text-muted); font-weight:600;
    text-transform:uppercase; letter-spacing:.14em; margin-right:5px;
  }
  .norm-source { display:block; font-size:9.5px; color:#AFADA6; margin-top:3px; font-style:italic; }
  .pb-badge {
    display:inline-flex; align-items:center; font-size:8.5px; font-weight:700;
    background:#FBF4E2; color:#6E5410; border:1px solid rgba(202,138,4,.32);
    border-radius:4px; padding:2px 6px; margin-left:6px; vertical-align:middle;
    text-transform:uppercase; letter-spacing:.08em;
  }
  @media print { .norm-source { display:none !important; } }

  /* ── CHARTS ────────────────────────────────────────────────────────────── */
  .charts-body { padding:20px 22px 22px; display:flex; flex-direction:column; gap:16px; }
  .chart-grid  { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chart-wrap  {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 18px 14px;
  }
  .chart-title {
    font-size:9px; font-weight:600; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.15em; margin-bottom:12px;
  }
  .chart-note { font-size:11px; color:var(--text-muted); display:flex; gap:18px; flex-wrap:wrap; }

  /* ── CONTROLS ──────────────────────────────────────────────────────────── */
  .quadrant-controls { display:flex; align-items:center; gap:8px; }
  .control-label {
    font-size:9px; font-weight:600; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.14em; margin-right:4px;
  }
  .axis-btn {
    padding:6px 13px; font-size:11.5px; font-weight:500; font-family:var(--font);
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); cursor:pointer; color:var(--text-secondary);
    transition:all .14s;
  }
  .axis-btn:hover { background:var(--stone); color:var(--text-primary); border-color:#D6D2C8; }
  .axis-btn.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .axis-select {
    font-size:11.5px; padding:6px 10px; border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--surface);
    color:var(--text-secondary); cursor:pointer; font-family:var(--font);
  }
  .axis-select:focus { outline:none; border-color:var(--accent); }
  .quadrant-legend { display:flex; align-items:center; gap:11px; flex-wrap:wrap; font-size:11px; color:var(--text-muted); }
  .ql-dot { display:inline-block; width:10px; height:10px; border-radius:50%; }
  .ql-you  { background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 1px var(--accent); }
  .ql-anon { background:#CFCCC4; border:1px solid #AEABA3; }
  .quad-ctrl-row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

  /* ── PRINT MENU ────────────────────────────────────────────────────────── */
  .print-menu-wrap { position:relative; display:inline-block; }
  .print-menu {
    position:absolute; right:0; top:calc(100% + 7px); z-index:50;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow-md);
    padding:13px 15px; min-width:244px;
  }
  .print-menu h4 {
    font-size:9px; font-weight:600; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.14em; margin-bottom:9px;
  }
  .print-menu label {
    display:flex; align-items:center; gap:9px; font-size:12px;
    color:var(--text-secondary); padding:5px 0; cursor:pointer;
  }
  .print-menu label:hover { color:var(--text-primary); }
  .print-menu input { cursor:pointer; margin:0; accent-color:var(--ink); }
  .print-menu .pm-note {
    font-size:10px; color:var(--text-muted); margin-top:9px; padding-top:9px;
    border-top:1px solid var(--line-soft); line-height:1.55;
  }

  /* ── FEEDBACK ──────────────────────────────────────────────────────────── */
  .feedback-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 20px; gap:15px; text-align:center; }
  .feedback-empty h3 { font-size:16px; font-weight:600; letter-spacing:-.01em; color:var(--text-primary); }
  .feedback-empty p  { font-size:13px; color:var(--text-muted); max-width:380px; line-height:1.65; }
  .feedback-loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:52px 20px; gap:14px; }
  .feedback-loading p { font-size:13px; color:var(--text-muted); }
  .spinner { width:28px; height:28px; border:2.5px solid var(--border); border-top-color:var(--ink); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .feedback-section {
    background:var(--surface-alt); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden; margin-bottom:14px;
  }
  .feedback-section-head {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 17px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .feedback-section-label {
    font-size:9px; font-weight:600; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.14em;
  }
  .feedback-section-label span {
    font-size:10px; font-weight:400; color:var(--text-muted);
    margin-left:9px; text-transform:none; letter-spacing:0;
  }
  .feedback-text {
    padding:18px 20px; font-size:13px; line-height:1.8; color:var(--text-primary);
    white-space:pre-wrap; background:var(--surface);
  }
  .copy-btn {
    display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:5px 11px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    cursor:pointer; color:var(--text-secondary); font-weight:500; font-family:var(--font);
    transition:all .14s;
  }
  .copy-btn:hover { background:var(--stone); color:var(--text-primary); border-color:#D6D2C8; }
  .copy-btn.copied { background:var(--c-exceeds-bg); color:var(--c-exceeds-text); border-color:rgba(22,163,74,.35); }
  .feedback-meta { font-size:11px; color:var(--text-muted); padding:0 2px 14px; }
  .regenerate-row { display:flex; justify-content:flex-end; padding-top:4px; }

  /* ══ REPORT ARCHITECTURE ═══════════════════════════════════════════════════
     Full-bleed charcoal hero band, then one cream reading column of eyebrow-
     labelled sections. Replaces the sidebar + tab-card layout.
     ───────────────────────────────────────────────────────────────────────── */
  .wrap { max-width:1060px; margin:0 auto; padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px)); }

  /* ── HERO ──────────────────────────────────────────────────────────────── */
  .hero { background:var(--charcoal); color:var(--surface); }
  .hero .wrap { padding-block:20px 32px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
            border-bottom:1px solid var(--charcoal-2); padding-bottom:16px; }
  .brandmark { display:flex; align-items:center; gap:14px; }
  .brandmark img { width:150px; height:auto; display:block; filter:brightness(0) invert(1); }
  .brandmark .bsub { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--on-dark-soft);
                     border-left:1px solid var(--charcoal-2); padding-left:14px; line-height:1.5; }
  .ctrls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .hsel, .hbtn {
    background:transparent; border:1px solid #4A4C50; color:var(--surface); border-radius:999px;
    padding:7px 15px; font-size:12.5px; font-family:var(--font); cursor:pointer; transition:all .14s;
  }
  .hsel { padding-right:10px; max-width:230px; }
  .hsel option { color:var(--ink); }
  .hbtn:hover, .hsel:hover { border-color:#7A7C80; }
  .hbtn.on { background:var(--surface); color:var(--ink); border-color:var(--surface); }
  .seg2 { display:inline-flex; background:rgba(255,255,255,.08); border-radius:999px; padding:3px; gap:2px; }
  .seg2 button {
    background:transparent; border:0; color:var(--on-dark-soft); border-radius:999px;
    padding:6px 14px; font-size:12.5px; font-family:var(--font); cursor:pointer; transition:all .14s;
  }
  .seg2 button[aria-pressed="true"] { background:var(--surface); color:var(--ink); font-weight:500; }

  .heroGrid { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:32px; align-items:center; margin-top:26px; }
  .hero h1 { font-size:clamp(30px,5vw,46px); line-height:1.06; font-weight:500; letter-spacing:-.028em;
             color:#fff; margin-top:10px; text-wrap:balance; }
  .hero .sub { font-size:15px; color:var(--on-dark); margin-top:11px; max-width:540px; line-height:1.55; }
  .meta { display:flex; gap:26px; flex-wrap:wrap; margin-top:22px; }
  .meta div { display:flex; flex-direction:column; gap:3px; }
  .meta b { font-weight:500; font-size:15px; color:#fff; font-variant-numeric:tabular-nums; }
  .meta span { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--on-dark-soft); }
  .ringBox { display:flex; flex-direction:column; align-items:center; gap:9px; }
  .ringBox svg { max-width:100%; height:auto; }
  .rcap { font-size:11px; color:var(--on-dark-soft); text-align:center; max-width:230px; line-height:1.45; }
  .hnote { margin-top:18px; padding:11px 14px; background:rgba(255,255,255,.055);
           border-left:2px solid var(--amber-rule, #D9A95B); border-radius:0 7px 7px 0; }
  .hnote .eb { color:var(--on-dark-soft); }
  .hnote p { font-size:13px; color:var(--on-dark); margin-top:3px; }

  /* ── CHIPS ─────────────────────────────────────────────────────────────── */
  .chip { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 11px;
          font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
  .c-s4 { background:#D8EADF; color:#1F5134; }
  .c-s3 { background:#DDE7FA; color:#1B3A6B; }
  .c-s2 { background:#F4E6C2; color:#6E5410; }
  .c-s1 { background:#F6DCC8; color:#7E3C14; }
  .c-s0 { background:#F3D4CE; color:#76241B; }
  .c-line { border:1px solid var(--border); color:var(--text-muted); }
  .c-dark { background:var(--ink); color:#fff; }

  /* ── SECTION RHYTHM ────────────────────────────────────────────────────── */
  main.wrap { padding-bottom:64px; }
  .sec { border-top:1px solid var(--border); padding-top:28px; margin-top:36px; scroll-margin-top:68px; }
  .sec.first { border-top:0; margin-top:28px; padding-top:0; }
  .h2 { font-size:26px; font-weight:500; letter-spacing:-.022em; margin-top:7px; text-wrap:balance; }
  .lead { color:var(--text-muted); margin-top:8px; max-width:660px; font-size:13.5px; line-height:1.6; }
  .sechead { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }

  /* sticky section nav */
  .secnav { position:sticky; top:0; z-index:40; background:rgba(255,254,250,.93);
            backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  .secnav .wrap { display:flex; gap:3px; overflow-x:auto; scrollbar-width:none; padding-block:8px; }
  .secnav .wrap::-webkit-scrollbar { display:none; }
  .secnav a { font-size:12px; color:var(--text-muted); text-decoration:none; padding:6px 12px;
              border-radius:999px; white-space:nowrap; transition:all .14s; }
  .secnav a:hover { background:var(--stone); color:var(--text-primary); }
  .secnav a.on { background:var(--ink); color:#fff; }

  /* ── HIGHLIGHT TILES ───────────────────────────────────────────────────── */
  .hlgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:18px; }
  .hl { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:17px 16px;
        display:flex; flex-direction:column; gap:9px; min-width:0; }
  .hl .chip { align-self:flex-start; }
  .big { font-size:29px; letter-spacing:-.025em; font-variant-numeric:tabular-nums; line-height:1.08; font-weight:500; }
  .big small { font-size:13px; color:var(--text-muted); margin-left:3px; font-weight:400; letter-spacing:0; }
  .cap { font-size:12.5px; color:var(--text-muted); line-height:1.45; }
  .up { color:#2F7A4A; font-weight:600; } .down { color:#B5523B; font-weight:600; } .flat { color:var(--text-muted); font-weight:600; }

  /* ── RESULT ROWS (replaces the results tables) ─────────────────────────── */
  .split { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:22px; margin-top:16px; align-items:start; }
  .rhead, .row { display:grid; grid-template-columns:minmax(0,1.45fr) 98px minmax(0,1.3fr) 72px; gap:12px; align-items:center; }
  .rhead { padding:0 10px 8px; font-size:9px; font-weight:600; letter-spacing:.15em; color:var(--text-muted);
           border-bottom:1.5px solid var(--ink); margin-top:14px; text-transform:uppercase; }
  .rhead span:nth-child(2), .rhead span:last-child { text-align:right; }
  .ghead { font-size:9px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
           color:var(--text-muted); padding:18px 10px 6px; }
  .row { all:unset; box-sizing:border-box;
         display:grid; grid-template-columns:minmax(0,1.45fr) 98px minmax(0,1.3fr) 72px; gap:12px;
         align-items:center; padding:11px 10px; border-bottom:1px solid var(--line-soft);
         border-radius:8px; cursor:pointer; font-size:13.5px; width:100%; }
  .row:hover { background:var(--stone); }
  .row[aria-pressed="true"] { background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--ink); }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row .lbl { min-width:0; color:var(--text-primary); font-weight:400; }
  .row .lbl small { display:block; font-size:11.5px; color:var(--text-muted); margin-top:1px; }
  .row .val { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .row .val small { font-weight:400; color:var(--text-muted); font-size:11px; margin-left:2px; }
  .row .chg { text-align:right; font-size:12px; font-variant-numeric:tabular-nums; }
  .row.dim .val, .row.dim .lbl { color:var(--text-muted); }
  .bar { position:relative; height:8px; background:var(--line-soft); border-radius:4px; }
  .bar .band { position:absolute; top:0; bottom:0; background:#BFD6C6; opacity:.75; border-radius:4px; }
  .bar .mk { position:absolute; top:-4px; width:11px; height:16px; margin-left:-5.5px; border-radius:3px;
             background:var(--ink); border:2px solid var(--surface); }
  .bar.none { background:transparent; height:auto; font-size:11.5px; color:var(--text-muted); font-style:italic; }

  /* sticky inspector */
  .trend { position:sticky; top:62px; background:var(--surface); border:1px solid var(--border);
           border-radius:12px; padding:17px; min-width:0; }
  .trend h3 { font-size:18px; font-weight:500; margin-top:6px; letter-spacing:-.015em; }
  .trend svg { width:100%; height:auto; display:block; margin-top:12px; }
  .tleg { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); margin-top:8px; }
  .tleg i { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .trend .note { font-size:12px; color:var(--text-muted); margin-top:11px; line-height:1.5; }
  .trend .src { font-size:10.5px; color:#AFADA6; margin-top:9px; font-style:italic; line-height:1.45; }

  /* ── DETAILS / DRAWER ──────────────────────────────────────────────────── */
  details { border-top:1px solid var(--border); padding:12px 0; }
  details > summary { cursor:pointer; font-size:13px; font-weight:500; list-style:none; display:flex;
                      align-items:center; gap:8px; color:var(--text-secondary); }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::before { content:'+'; display:inline-flex; align-items:center; justify-content:center;
    width:17px; height:17px; border:1px solid var(--border); border-radius:5px; font-size:12px; color:var(--text-muted); }
  details[open] > summary::before { content:'–'; }
  .drawer { background:var(--stone); border-bottom:1px solid var(--border); }
  .drawer .wrap { padding-block:26px 30px; }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-top:16px; }
  .field label { display:block; font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
                 color:var(--text-muted); margin-bottom:5px; }
  .field input { width:100%; padding:9px 12px; font-size:13px; font-family:var(--font);
                 border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface);
                 outline:none; color:var(--text-primary); }
  .field input:focus { border-color:var(--accent); }
  .btns { display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .btns .btn { margin-top:0; }
  .btn.ghost { background:transparent; color:var(--text-secondary); border:1px solid var(--border); }
  .btn.ghost:hover { background:var(--surface); color:var(--text-primary); }
  .msg { font-size:12px; color:var(--text-muted); }

  /* coach-only content, hidden in athlete view and never printed */
  body[data-view="athlete"] .coachonly { display:none !important; }
  @media print { .coachonly { display:none !important; } }

  /* ── PRINT ─────────────────────────────────────────────────────────────── */
  .print-header { display:none; }
  @page { size:A4; margin:12mm 11mm; }
  @media print {
    body { background:#fff; font-size:11px; }
    .app { display:block; }
    .sidebar, .no-print, .settings-bar { display:none !important; }
    .main { padding:0; max-width:none; background:#fff; gap:12px; }
    .print-header {
      display:flex; align-items:center; gap:14px;
      padding-bottom:12px; margin-bottom:12px; border-bottom:1.5px solid var(--ink);
    }
    .print-header img { height:30px; }
    .print-header-meta { font-size:11px; color:var(--text-secondary); display:flex; flex-direction:column; }
    .print-header-meta strong { font-size:15px; color:var(--ink); font-weight:600; letter-spacing:-.015em; }
    /* hero flips to paper */
    .profile-card { background:#fff !important; color:var(--ink) !important; border:1px solid #CFCCC4 !important; }
    .pinfo h2 { color:var(--ink) !important; }
    .pinfo .pmeta { color:var(--text-secondary) !important; }
    .pav { background:var(--stone) !important; color:var(--ink) !important; }
    .ptag { background:#fff !important; border-color:#CFCCC4 !important; color:var(--text-secondary) !important; }
    .cat-card, .chart-wrap, .tab-card, .feedback-section { border:1px solid #CFCCC4 !important; box-shadow:none !important; }
    .tabs { display:none !important; }
    .tc, .tc.active { display:block !important; }
    table { font-size:10px; }
    thead th { background:#F4F2EC !important; }
    .chart-grid { grid-template-columns:1fr 1fr; page-break-inside:avoid; }
    .chart-wrap, .test-section, .results-body > div, .cat-grid, .profile-card { page-break-inside:avoid; }
    a { color:inherit; text-decoration:none; }
  }

  /* ── RESPONSIVE ────────────────────────────────────────────────────────── */
  @media(max-width:1000px){
    .app{grid-template-columns:1fr; background:var(--cream)} .sidebar{position:static;height:auto}
    .alist{max-height:230px}
    .main{padding:22px 18px 40px}
    .cat-grid{grid-template-columns:repeat(2,1fr)} .chart-grid{grid-template-columns:1fr}
  }
  @media(max-width:620px){
    .cat-grid{grid-template-columns:1fr}
    .profile-card{flex-direction:column; gap:14px}
    .main{padding:18px 14px 36px}
  }
</style>

<script>
// ─── NORMATIVE BANDS ─────────────────────────────────────────────────────────
// Sources:
//   Jump/RSI:  Badby, Comfort et al. JSS 2025; McMahon et al. Sensors 2022
//   EUR:       McGuigan et al. JSCR 2006
//   DSI:       Thomas, Dos'Santos, Jones. Sports 2017
//   IMTP:      Badby et al. JSS 2025 (professional soccer N/kg benchmarks)
//   Aerobic:   Cardamone et al. Front Physiol 2025 (Serie A VO2 ~61.5); Buchheit & Laursen
//   Strength:  Comfort et al. JSCR 2019; professional football literature
//   Speed:     Haugen et al. IJSPP 2019
// lb:true = lower is better

const NORMS = {
  // ── Jump / Power ──────────────────────────────────────────────────────────
  broad_jump:    { min:220,  max:260,  u:'cm',        lb:false, label:'Broad jump',              cat:'jump', source:'Loturco et al.; professional football literature' },
  // No validated professional football-specific normative dataset exists for SL broad jump absolute distance.
  // Tracked for individual longitudinal comparison only — no min/max scoring applied.
  slbj_L:        { min:null, max:null, u:'cm',        lb:false, label:'SL broad jump — L',       cat:'jump', noNorm:true, source:'No validated professional norm' },
  slbj_R:        { min:null, max:null, u:'cm',        lb:false, label:'SL broad jump — R',       cat:'jump', noNorm:true, source:'No validated professional norm' },
  // LSI: healthy footballers show natural variance of 97-106% (scoping review, 27 studies, JOSPT 2024).
  // <90% is a distinct injury-risk threshold (not a benchmark tier) — flagged separately in the UI.
  slbj_LSI:      { min:90,   max:100,  u:'%',         lb:false, label:'SL broad jump LSI',       cat:'jump', injuryFloor:90, source:'JOSPT scoping review 2024 (27 studies, soccer)' },
  // Triple hop (single-leg): collegiate male soccer/basketball average 632±72cm (Myers et al. 2014).
  // No professional-specific dataset found — moderate confidence, not pro-validated.
  triple_hop:    { min:560,  max:704,  u:'cm',        lb:false, label:'Triple hop (SL) — best leg', cat:'jump', note:'Collegiate data, not pro-specific', source:'Myers et al. 2014 (collegiate soccer/basketball)' },
  // L/R legs tracked individually — no separate norm, benchmarked against the same band
  triple_hop_L:  { min:560,  max:704,  u:'cm',        lb:false, label:'Triple hop — L',          cat:'jump', source:'Myers et al. 2014 (collegiate soccer/basketball)' },
  triple_hop_R:  { min:560,  max:704,  u:'cm',        lb:false, label:'Triple hop — R',          cat:'jump', source:'Myers et al. 2014 (collegiate soccer/basketball)' },
  // LSI: healthy athletes average 98.8% (SD 4.6); post-ACLR collegiate ~94.4%. <90% = flag.
  triple_hop_LSI:{ min:90,   max:100,  u:'%',         lb:false, label:'Triple hop LSI',          cat:'jump', injuryFloor:90, source:'Healthy mean 98.8% (Pilot ref values 2018); post-ACLR ~94.4% (IJSPT)' },
  // Height-normalised — removes the advantage taller athletes have on absolute distance
  triple_hop_norm:{min:3.2,  max:4.0,  u:'×height',   lb:false, label:'Triple hop ÷ height',     cat:'jump', note:'Distance ÷ body height', source:'Normalisation method per Compound Hop Index, JCM 2022 (first-league soccer)' },
  cmj:           { min:35,   max:55,   u:'cm',        lb:false, label:'CMJ height',              cat:'jump', source:'Badby et al. 2025; VALD ForceDecks normative data' },
  sj:            { min:30,   max:50,   u:'cm',        lb:false, label:'Squat jump (SJ)',         cat:'jump', source:'Professional football literature' },
  // Flight-time derived jump heights (force plate / jump mat). Same benchmark band as impulse-derived height.
  cmj_flight:    { min:35,   max:55,   u:'cm',        lb:false, label:'CMJ flight height',       cat:'jump', note:'Flight-time derived', source:'Systematic review: 33.6–57.2 cm across 54 studies, senior professional soccer' },
  sj_flight:     { min:30,   max:50,   u:'cm',        lb:false, label:'SJ flight height',        cat:'jump', note:'Flight-time derived', source:'Professional football literature' },
  // CMJ concentric (propulsive) force — benchmarked relative to body mass, not absolute N
  cmj_con_force: { min:25.7, max:31.4, u:'N/kg',      lb:false, label:'CMJ concentric force',    cat:'jump', note:'Requires force plate · relative to BW', source:'EFL professional soccer benchmarks 2025 (relative peak propulsive force)' },
  eur:           { min:0.90, max:1.15, u:'EUR',       lb:false, label:'EUR (CMJ÷SJ)',            cat:'jump',  note:'Auto: CMJ÷SJ', source:'McGuigan et al. 2006' },
  // mRSI: CMJ jump height (m) ÷ contraction time (s). Pro football ~0.8–1.4 (McMahon/Badby)
  cmj_mrsi:      { min:0.80, max:1.40, u:'m/s',       lb:false, label:'CMJ mRSI',               cat:'jump',  note:'Auto: JH(m)÷CT(s) — needs contraction time', source:'McMahon et al. 2022; Badby et al. 2025' },
  // DJ RSI: DJ height (m) ÷ contact time (s). Pro football ~1.0–1.8 (McMahon 2021)
  dj_rsi:        { min:1.00, max:1.80, u:'m/s',       lb:false, label:'DJ RSI',                 cat:'jump',  note:'Auto: JH(m)÷CT(s) — needs contact time', source:'McMahon et al. 2021' },
  dj:            { min:30,   max:50,   u:'cm',        lb:false, label:'Drop jump height (DJ)',   cat:'jump', source:'Professional football literature' },
  // DSI: ballistic PF ÷ isometric PF. Optimal 0.60–0.80 (Thomas et al. 2017)
  // >0.80 = needs strength work; <0.60 = needs plyometric work
  dsi:           { min:0.60, max:0.80, u:'DSI',       lb:false, label:'DSI',                    cat:'jump',  note:'Requires force plate', source:'Thomas, Dos\'Santos & Jones 2017' },
  // ── Aerobic ───────────────────────────────────────────────────────────────
  mas:           { min:4.5,  max:5.0,  u:'m/s',       lb:false, label:'MAS',          cat:'aero', source:'Elite benchmarks: professional soccer 4.5–5.0 m/s, rugby 4.5–4.8 m/s' },
  vo2max:        { min:58,   max:68,   u:'ml/kg/min', lb:false, label:'Est. VO₂ max',            cat:'aero', source:'Cardamone et al. 2025 (Serie A ~61.5 ml/kg/min); Buchheit' },
  // ── Strength ──────────────────────────────────────────────────────────────
  sq_1rm_bw:     { min:1.5,  max:2.0,  u:'×BW',       lb:false, label:'Back squat',             cat:'strength', source:'Comfort et al. 2019 (professional football)' },
  tb_1rm_bw:     { min:2.0,  max:2.8,  u:'×BW',       lb:false, label:'Trap bar DL',            cat:'strength', source:'Professional football literature' },
  bp_1rm_bw:     { min:0.9,  max:1.3,  u:'×BW',       lb:false, label:'Bench press',            cat:'strength', source:'Professional football literature' },
  // IMTP: relative peak force N/kg. Pro soccer median ~40 N/kg (Badby et al. 2025)
  // <30 N/kg = below norm for professional; 30–45 = within range; >45 = exceeds
  imtp:          { min:30,   max:45,   u:'N/kg',      lb:false, label:'IMTP',                   cat:'strength', note:'Requires force plate', source:'Badby et al. 2025 (professional soccer; median ~40 N/kg)' },
  // ── Additional aerobic tests ──────────────────────────────────────────────
  // Beep test (MSFT) level norm — professional footballers typically reach level 13–16.
  beep_level:   { min:13, max:16, u:'level', lb:false, label:'Beep test level', cat:'aero', source:'Ramsbottom et al. 1988; professional football literature' },
  // Bronco: time in seconds, lower is better. Limited football data; rugby league reference.
  bronco:       { min:240,  max:280,  u:'s',   lb:true,  label:'Bronco',     cat:'aero', note:'Lower is better · Limited football data', source:'Rugby league reference; limited football-specific data' },
  // Yo-Yo IR2: total distance in metres (Castagna et al. 2006 professional football data)
  yoyo_ir2:     { min:640,  max:1200, u:'m',   lb:false, label:'Yo-Yo IR2',  cat:'aero', note:'Castagna et al. 2006', source:'Castagna et al. 2006; professional football' },
  // ── Speed ─────────────────────────────────────────────────────────────────
  sprint10:      { min:1.65, max:1.80, u:'s',         lb:true,  label:'10m sprint',             cat:'speed', tiers:[0.05,0.12], source:'Haugen et al. 2019' },
  sprint20:      { min:2.85, max:3.05, u:'s',         lb:true,  label:'20m sprint',             cat:'speed', tiers:[0.05,0.12], source:'Haugen et al. 2019' },
  // Match-derived peak speed: pro average ~31-32 km/h (8.6-8.9 m/s); EPL all-time fastest ~37.4 km/h (10.4 m/s, Van de Ven).
  // 8.3-9.5 m/s covers typical professional range; >9.5 m/s is genuinely elite outlier territory.
  max_vel:       { min:8.3,  max:9.5,  u:'m/s',       lb:false, label:'Max velocity (20m fly)', cat:'speed', source:'LaLiga match-speed data; EPL fastest-ever ~10.4 m/s' },
};

let currentYAxis = QUAD_PRESETS[0].y;


const CAT_LABELS = { jump:'Jump / Power', aero:'Aerobic', strength:'Strength', speed:'Speed' };
const SL = ['Primary Focus','Building','Approaching Standard','At Standard','Above Standard'];
const SC = ['p0','p1','p2','p3','p4'];
// Five-tier colour scale, index 0 (worst) -> 4 (best).
// Deliberately separated in hue so adjacent tiers never read as the same colour:
// red -> orange -> amber -> blue -> green.
const SCORE_COLS = ['#dc2626','#ea580c','#ca8a04','#1a56db','#16a34a'];
const SD = SCORE_COLS;
const CC = ['#1a56db','#7c3aed','#0891b2','#16a34a','#dc2626','#c2410c','#6b7280'];

// ─── CALCULATIONS ─────────────────────────────────────────────────────────────
const pf  = v => { const n = parseFloat(v); return isNaN(n) || n === 0 ? null : n; };
const epley = (kg, reps) => { const k=pf(kg),r=pf(reps); if(!k||!r)return null; return r===1?k:+(k*(1+r/30)).toFixed(1); };
const masFromDist = d => { const v=pf(d); return v?+(v/300).toFixed(2):null; }; // m/s
// Léger & Mercier (1984): VO2max (ml/kg/min) = MAS (km/h) × 3.5. MAS is stored in m/s, so convert to km/h first.
const vo2FromMas  = mas_ms => { const v=pf(mas_ms); return v?+((v*3.6)*3.5).toFixed(1):null; };
const calcLSI     = (L,R) => { const l=pf(L),r=pf(R); return(l&&r)?+(Math.min(l,r)/Math.max(l,r)*100).toFixed(1):null; };
// Format seconds → MM:SS
const fmtTime = s => { if(!s)return'—'; const m=Math.floor(s/60),sec=Math.round(s%60); return `${m}:${String(sec).padStart(2,'0')}`; };
// VO2max from any distance TT — Daniels & Gilbert 1979
function vo2FromDistTT(dist_m, time_s) {
  if(!dist_m||!time_s||time_s<60)return null;
  const v=(dist_m/time_s)*60; // m/min
  const t=time_s/60;          // min
  const frac=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
  const vo2v=-4.60+0.182258*v+0.000104*v*v;
  const est=+(vo2v/frac).toFixed(1);
  return est>20&&est<100?est:null; // sanity bounds
}
// VO2max from Yo-Yo IR2 distance — Castagna et al. 2006
const vo2FromYoyo = d => { const v=pf(d); return v?+(v*0.0136+45.3).toFixed(1):null; };
// Beep test speed (km/h) from level
const beepSpeed = lvl => { const v=pf(lvl); return v?+(8.5+(v-1)*0.5):null; };
// VO2max from beep test level + age — Léger et al. 1988
function vo2FromBeep(level, age_yr) {
  const v=beepSpeed(level); if(!v)return null;
  const a=parseFloat(age_yr)||25;
  const est=+(31.025+3.238*v-3.248*a+0.1536*v*a).toFixed(1);
  return est>20&&est<100?est:null;
}
const bwRatio     = (rm,bw) => (rm&&bw)?+(rm/bw).toFixed(2):null;
const imtpNkg     = (N,bw) => { const n=pf(N),b=pf(bw); return(n&&b)?+(n/b).toFixed(2):null; };
// mRSI = jump height (m) ÷ contraction time (s)
const calcMrsi    = (cm,ms) => { const h=pf(cm),t=pf(ms); return(h&&t)?+((h/100)/(t/1000)).toFixed(2):null; };
// DJ RSI = jump height (m) ÷ contact time (s)
const calcDjRsi   = (cm,ms) => { const h=pf(cm),t=pf(ms); return(h&&t)?+((h/100)/(t/1000)).toFixed(2):null; };
// EUR = CMJ ÷ SJ (jump height)
const calcEur     = (cmj,sj) => { const c=pf(cmj),s=pf(sj); return(c&&s)?+(c/s).toFixed(2):null; };

function deriveSession(row, bw_kg, age_yr, height_cm) {
  // Per-session bodyweight takes priority; falls back to athlete's profile weight
  const bw = pf(row.weight_kg) || pf(bw_kg);
  const d  = {};
  d.weight_kg   = bw; // store whichever was used, for display
  d.notes       = (row.notes || '').trim();
  // Jump — direct
  d.broad_jump  = pf(row.broad_jump_cm);
  d.slbj_L      = pf(row.slbj_L_cm);
  d.slbj_R      = pf(row.slbj_R_cm);
  d.slbj_LSI    = calcLSI(row.slbj_L_cm, row.slbj_R_cm);
  // Triple hop — accepts L/R split, or a single legacy triple_hop_cm value
  d.triple_hop_L   = pf(row.triple_hop_L_cm);
  d.triple_hop_R   = pf(row.triple_hop_R_cm);
  d.triple_hop_LSI = calcLSI(row.triple_hop_L_cm, row.triple_hop_R_cm);
  // Headline value = best leg if L/R given, else the legacy single column
  d.triple_hop = (d.triple_hop_L!=null||d.triple_hop_R!=null)
    ? Math.max(d.triple_hop_L||0, d.triple_hop_R||0) || null
    : pf(row.triple_hop_cm);
  // Height-normalised (distance cm ÷ height cm)
  const _ht = pf(height_cm);
  d.triple_hop_norm = (d.triple_hop && _ht) ? +(d.triple_hop/_ht).toFixed(2) : null;
  d.cmj         = pf(row.cmj_cm);
  d.sj          = pf(row.sj_cm);
  d.dj          = pf(row.dj_cm);
  // EUR — auto from CMJ and SJ
  d.eur         = calcEur(row.cmj_cm, row.sj_cm);
  // mRSI — auto if contraction time provided, else null (future-proof)
  d.cmj_ct_ms   = pf(row.cmj_contraction_time_ms);
  d.cmj_mrsi    = calcMrsi(row.cmj_cm, row.cmj_contraction_time_ms);
  // DJ RSI — auto if contact time provided
  d.dj_ct_ms    = pf(row.dj_contact_time_ms);
  d.dj_rsi      = calcDjRsi(row.dj_cm, row.dj_contact_time_ms);
  // DSI — direct (force plate only)
  d.dsi         = pf(row.dsi);
  // Aerobic
  d.tt5min_dist = pf(row.tt5min_dist_m);
  d.mas         = masFromDist(row.tt5min_dist_m);
  d.mas_vo2max  = d.mas ? vo2FromMas(d.mas) : null;
  // General distance TT (any distance)
  d.tt_dist     = pf(row.tt_dist_m);
  d.tt_time     = pf(row.tt_time_s);
  d.tt_speed    = (d.tt_dist&&d.tt_time)?+(d.tt_dist/d.tt_time).toFixed(3):null; // m/s
  d.tt_vo2max   = vo2FromDistTT(d.tt_dist, d.tt_time);
  // Yo-Yo IR2
  d.yoyo_ir2     = pf(row.yoyo_ir2_dist_m);
  d.yoyo_vo2max  = vo2FromYoyo(row.yoyo_ir2_dist_m);
  // Beep test (MSFT)
  d.beep_level   = pf(row.beep_level);
  d.beep_shuttle = pf(row.beep_shuttle);
  d.beep_speed   = beepSpeed(row.beep_level); // km/h
  d.beep_vo2max  = vo2FromBeep(row.beep_level, age_yr);
  // Bronco
  d.bronco       = pf(row.bronco_time_s);
  // Best available VO2max — 5-min TT first priority, then others
  d.vo2max = d.mas_vo2max || d.tt_vo2max || d.yoyo_vo2max || d.beep_vo2max || pf(row.vo2max);
  // ── MAS resolution ──────────────────────────────────────────────────────
  // A maximal TT of ~4-8 min has an average speed that approximates MAS directly.
  // Outside that window a duration correction is applied: efforts shorter than ~4 min
  // are run above MAS, efforts longer than ~8 min below it.
  d.mas_src = d.mas ? '5-min TT' : null;
  if (d.mas == null && d.tt_speed != null && d.tt_time != null) {
    const tmin = d.tt_time / 60;
    let corr;
    if      (tmin < 3)   corr = 0.92;
    else if (tmin < 4)   corr = 0.96;
    else if (tmin <= 8)  corr = 1.00;   // avg speed ≈ MAS
    else if (tmin <= 12) corr = 1.04;
    else if (tmin <= 20) corr = 1.08;
    else                 corr = 1.12;
    d.mas = +(d.tt_speed * corr).toFixed(2);
    d.mas_src = `${d.tt_dist}m TT` + (corr !== 1.00 ? ` (${tmin.toFixed(1)}min, ×${corr})` : ` (${tmin.toFixed(1)}min)`);
  }
  // Bronco (1200m shuttle, 30 direction changes): apply World Rugby's 0.7s per
  // change-of-direction correction to get an equivalent straight-line 1200m time,
  // then treat it like any other distance TT.
  if (d.mas == null && d.bronco != null) {
    const BRONCO_DIST = 1200, BRONCO_TURNS = 30, TURN_COST = 0.7;
    const corrT = d.bronco - (BRONCO_TURNS * TURN_COST);
    if (corrT > 60) {
      const tmin = corrT / 60;
      let corr;
      if      (tmin < 3)   corr = 0.92;
      else if (tmin < 4)   corr = 0.96;
      else if (tmin <= 8)  corr = 1.00;
      else if (tmin <= 12) corr = 1.04;
      else                 corr = 1.08;
      d.mas = +((BRONCO_DIST / corrT) * corr).toFixed(2);
      d.mas_src = `Bronco ${fmtTime(d.bronco)} (turn-corrected)`;
    }
  }
  // Yo-Yo / beep only: back-calculate MAS from estimated VO2max as a last resort
  if (d.mas == null && d.vo2max != null) {
    d.mas = +(((d.vo2max/3.5)/3.6)).toFixed(2);
    d.mas_src = 'estimated from VO\u2082max';
  }
  // Strength — Epley → BW ratio (uses session bodyweight)
  const sq1rm   = epley(row.sq_kg, row.sq_reps);
  const tb1rm   = epley(row.tb_kg, row.tb_reps);
  const bp1rm   = epley(row.bp_kg, row.bp_reps);
  d.sq_1rm      = sq1rm; d.sq_kg_raw = pf(row.sq_kg); d.sq_reps_raw = pf(row.sq_reps);
  d.tb_1rm      = tb1rm; d.tb_kg_raw = pf(row.tb_kg); d.tb_reps_raw = pf(row.tb_reps);
  d.bp_1rm      = bp1rm; d.bp_kg_raw = pf(row.bp_kg); d.bp_reps_raw = pf(row.bp_reps);
  d.sq_1rm_bw   = bwRatio(sq1rm, bw);
  d.tb_1rm_bw   = bwRatio(tb1rm, bw);
  d.bp_1rm_bw   = bwRatio(bp1rm, bw);
  // Flight-time derived jump heights (optional — separate from impulse-derived cmj/sj)
  d.cmj_flight  = pf(row.cmj_flight_cm);
  d.sj_flight   = pf(row.sj_flight_cm);
  // CMJ concentric force — raw Newtons in, N/kg out (same pattern as IMTP)
  d.cmj_con_force_N = pf(row.cmj_con_force_N);
  d.cmj_con_force   = (d.cmj_con_force_N && bw) ? +(d.cmj_con_force_N / bw).toFixed(1) : null;
  d.imtp_raw_N  = pf(row.imtp_N);
  d.imtp        = imtpNkg(row.imtp_N, bw);
  // Speed
  d.sprint10    = pf(row.sprint10_s);
  d.sprint20    = pf(row.sprint20_s);
  d.max_vel     = pf(row.max_vel_ms);
  // ── Motor preference (VueMotion) — z-scores per leg, per run type ──
  // ── Motor preference (VueMotion) — RAW values transcribed from the report ──
  // Run types: 'acc' (Run Type: Acc) and 'fly' (Run Type: Fly / max velocity).
  ['acc','fly'].forEach(pfx=>{
    d[pfx+'_sl_L']      = pf(row[pfx+'_sl_L']);      // step length, m
    d[pfx+'_sl_R']      = pf(row[pfx+'_sl_R']);
    d[pfx+'_sf_L']      = pf(row[pfx+'_sf_L']);      // step frequency, Hz
    d[pfx+'_sf_R']      = pf(row[pfx+'_sf_R']);
    d[pfx+'_gct_L']     = pf(row[pfx+'_gct_L']);     // ground contact time, s
    d[pfx+'_gct_R']     = pf(row[pfx+'_gct_R']);
    d[pfx+'_ft_L']      = pf(row[pfx+'_ft_L']);      // flight time, s
    d[pfx+'_ft_R']      = pf(row[pfx+'_ft_R']);
    d[pfx+'_max_speed'] = pf(row[pfx+'_max_speed']);
    // Authoritative: z-score coordinates read straight off the VueMotion
    // Motor Preference chart. These override anything computed from raw values.
    d[pfx+'_mp_x']   = pf(row[pfx+'_mp_x']);
    d[pfx+'_mp_y']   = pf(row[pfx+'_mp_y']);
    d[pfx+'_mp_x_L'] = pf(row[pfx+'_mp_x_L']);
    d[pfx+'_mp_x_R'] = pf(row[pfx+'_mp_x_R']);
    d[pfx+'_mp_y_L'] = pf(row[pfx+'_mp_y_L']);
    d[pfx+'_mp_y_R'] = pf(row[pfx+'_mp_y_R']);
  });
  // Legacy 'mv_' prefix accepted as an alias for 'fly_'
  ['sl_L','sl_R','sf_L','sf_R','gct_L','gct_R','ft_L','ft_R','max_speed'].forEach(k=>{
    if (d['fly_'+k]==null && row['mv_'+k]!=null) d['fly_'+k] = pf(row['mv_'+k]);
  });
  d.test_date   = row.test_date;
  return d;
}

// ─── BENCHMARK SCORING ───────────────────────────────────────────────────────
// Tier bands are measured OUTWARD from the boundary an athlete falls short of:
//   higher-is-better -> below n.min ;  lower-is-better -> above n.max
// A norm can override the default 10% / 20% via  tiers:[near, far].
function bs(v, nk) {
  const n = NORMS[nk]; if (!n || v==null || n.noNorm) return null;
  const [t1,t2] = n.tiers || [0.10, 0.20];
  if (n.lb) {
    if (v<=n.min) return 4; if (v<=n.max) return 3;
    if (v<=n.max*(1+t1)) return 2; if (v<=n.max*(1+t2)) return 1; return 0;
  } else {
    if (v>=n.max) return 4; if (v>=n.min) return 3;
    if (v>=n.min*(1-t1)) return 2; if (v>=n.min*(1-t2)) return 1; return 0;
  }
}
function injuryFlag(v, nk) {
  const n = NORMS[nk];
  if (!n || !n.injuryFloor || v==null) return null;
  return v < n.injuryFloor;
}
function pill(s) {
  if (s===null) return '';
  return `<span class="pill ${SC[s]}"><span class="pill-dot" style="background:${SD[s]}"></span>${SL[s]}</span>`;
}
function dHtml(val, prev, lb) {
  if (val==null||prev==null) return '<span class="miss">—</span>';
  const d=((val-prev)/prev*100), imp=lb?d<0:d>0, unc=Math.abs(d)<0.5;
  const col=unc?'#7a8290':imp?'#16a34a':'#dc2626';
  return `<span class="delta" style="color:${col}">${unc?'→':imp?'↑':'↓'} ${d>0?'+':''}${d.toFixed(1)}%</span>`;
}
function catLabel(avg) {
  if (avg===null) return null;
  if (avg>=3.5) return {l:'Above Standard', c:SCORE_COLS[4]};
  if (avg>=2.5) return {l:'At Standard',    c:SCORE_COLS[3]};
  if (avg>=1.5) return {l:'Building',       c:SCORE_COLS[1]};
  return              {l:'Primary Focus',  c:SCORE_COLS[0]};
}
function catCard(catKey, keys, d) {
  const scores = keys.map(k=>bs(d[k],k)).filter(s=>s!==null);
  if (!scores.length) return `<div class="cat-card"><div class="cat-name">${CAT_LABELS[catKey]}</div><div class="cat-status" style="color:#7a8290">No data</div></div>`;
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  const cl  = catLabel(avg);
  return `<div class="cat-card" style="border-left:3px solid ${cl.c}"><div class="cat-name">${CAT_LABELS[catKey]}</div><div class="cat-status" style="color:${cl.c}">${cl.l}</div></div>`;
}
function sidebarCol(d) {
  if (!d) return '#7a8290';
  const scores = Object.keys(NORMS).map(k=>bs(d[k],k)).filter(s=>s!==null);
  if (!scores.length) return '#7a8290';
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  return SCORE_COLS[Math.max(0,Math.min(4,Math.round(avg)))];
}
// Get most recently tested value for a key across all sessions (sessions sorted newest-first)
function latestVal(sessions, key) {
  for (const s of sessions) { if (s[key]!=null) return s[key]; }
  return null;
}
// Build a composite "best available" data object across all sessions for category scoring
// Raw / derived fields that are not scored against a norm but are still needed for
// display (the "150kg x 3 -> est. 1RM 164kg" sub-lines, IMTP Newtons, TT inputs).
// Carried here so EVERY consumer gets them — the results table, the print report and
// the feedback builder all read the same object.
const CARRY_KEYS = [
  'sq_1rm','tb_1rm','bp_1rm','sq_kg_raw','tb_kg_raw','bp_kg_raw',
  'sq_reps_raw','tb_reps_raw','bp_reps_raw','imtp_raw_N','cmj_con_force_N',
  'tt5min_dist','tt_dist','tt_time','tt_speed','tt_vo2max',
  'yoyo_vo2max','beep_level','beep_shuttle','beep_speed','beep_vo2max',
  'cmj_ct_ms','dj_ct_ms','bronco_time_s',
];

function buildLatestAcrossSessions(sessions) {
  const out = {};
  Object.keys(NORMS).forEach(k => { out[k] = latestVal(sessions, k); });
  CARRY_KEYS.forEach(k => { const v = latestVal(sessions, k); if (v != null) out[k] = v; });
  // carry the MAS source label from whichever session supplied the MAS value
  for (const s of sessions) { if (s.mas != null) { out.mas_src = s.mas_src; break; } }
  return out;
}

// ─── TABLE ROW BUILDERS ───────────────────────────────────────────────────────
let _rSessions=[]; // set in renderMain for PB detection
let _rDateSrc={};   // metric -> session date it came from
let _rLatestDate=null;

function mRow(nk, val, prevVal, subtext, isAuto) {
  const n = NORMS[nk]; if (!n) return '';
  const normText = n.noNorm ? 'No validated norm' : `${n.min}–${n.max} ${n.u}`;
  const normStyle = n.noNorm ? 'font-style:italic;color:var(--text-muted)' : 'color:var(--text-muted)';
  if (val==null) return `<tr><td class="lbl">${n.label}${n.note?` <span style="font-size:10px;color:var(--text-muted)">(${n.note})</span>`:''}</td><td colspan="2" class="miss">— not tested</td><td style="font-size:11px;${normStyle}">${normText}${n.source?`<span class="norm-source">${n.source}</span>`:''}</td><td class="miss">—</td></tr>`;
  const s = bs(val, nk);
  const sub = subtext ? `<span class="rsub">${subtext}</span>` : '';
  const badge = isAuto ? '<span class="calc-badge">auto</span>' : '';
  const flagged = injuryFlag(val, nk);
  // PB detection
  let pbHtml = '';
  if (val != null && _rSessions.length >= 2) {
    const hist = _rSessions.map(sess=>sess[nk]).filter(v=>v!=null);
    if (hist.length >= 2) {
      const best = n.lb ? Math.min(...hist) : Math.max(...hist);
      if (val === best) pbHtml = '<span class="pb-badge">★ PB</span>';
    }
  }
  const statusCell = n.noNorm
    ? `<span style="font-size:11px;color:var(--text-muted);font-style:italic">Track individually</span>`
    : flagged
      ? `<span class="pill p0" style="background:#fef2f2"><span class="pill-dot" style="background:#dc2626"></span>Below symmetry threshold (&lt;${n.injuryFloor}%)</span>`
      : pill(s);
  return `<tr>
    <td class="lbl">${n.label}</td>
    <td><span class="rval">${val}</span><span class="runit">${n.u}</span>${sub}${badge}${pbHtml}${(_rDateSrc[nk]&&_rLatestDate&&_rDateSrc[nk]!==_rLatestDate)?`<span class="rsub" style="color:#b0b6bd">tested ${_rDateSrc[nk]}</span>`:''}</td>
    <td>${statusCell}</td>
    <td style="font-size:11px;${normStyle}">${normText}${n.source?`<span class="norm-source">${n.source}</span>`:''}</td>
    <td>${dHtml(val, prevVal, n.lb)}</td>
  </tr>`;
}
function strengthRow(nk, d, pv, label) {
  const n = NORMS[nk];
  const normText  = `${n.min}–${n.max} ${n.u}`;
  const srcAttr   = '';
  const srcIcon   = '';
  const srcText   = n.source ? `<span class="norm-source">${n.source}</span>` : '';
  const val  = d[nk], prev = pv?pv[nk]:null;
  const pfx  = nk.replace('_1rm_bw','');
  const kg   = d[pfx+'_kg_raw'], reps = d[pfx+'_reps_raw'], rm1 = d[pfx+'_1rm'];
  if (val==null) return `<tr><td class="lbl">${label}</td><td colspan="2" class="miss">— not tested</td><td style="font-size:11px;color:var(--text-muted)">${normText}${n.source?`<span class="norm-source">${n.source}</span>`:''}</td><td class="miss">—</td></tr>`;
  const s = bs(val, nk);
  let sub = reps&&reps>1 ? `<span class="rsub">(${kg}kg × ${reps} → est. 1RM ${rm1}kg)</span>` : rm1?`<span class="rsub">(1RM ${rm1}kg)</span>`:'';
  return `<tr>
    <td class="lbl">${label}</td>
    <td><span class="rval">${val}</span><span class="runit">×BW</span>${sub}<span class="calc-badge">auto</span></td>
    <td>${pill(s)}</td>
    <td style="font-size:11px;color:var(--text-muted)">${normText}${srcText}</td>
    <td>${dHtml(val, prev, false)}</td>
  </tr>`;
}

let athleteMap={}, selectedId=null, searchQ='';

const getConfig = () => { try{return JSON.parse(localStorage.getItem('dashConfig')||'{}')}catch(e){return{}} };
const saveConfig = c => localStorage.setItem('dashConfig', JSON.stringify(c));

async function fetchSheet(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} — check the URL`);
  return r.text();
}
function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => {
    const cols=[]; let cur='', inQ=false;
    for (const ch of l) {
      if (ch==='"'){inQ=!inQ} else if (ch===','&&!inQ){cols.push(cur.trim());cur=''} else {cur+=ch}
    }
    cols.push(cur.trim()); return cols;
  });
  const headers = lines[0].map(h=>h.trim());
  return lines.slice(1).filter(r=>r.some(c=>c)).map(r=>{
    const obj={}; headers.forEach((h,i)=>obj[h]=(r[i]||'').trim()); return obj;
  });
}
async function loadData() {
  const cfg = getConfig();
  if (!cfg.athletesUrl||!cfg.resultsUrl){showSetup();return;}
  showLoading();
  try {
    const [aText,rText] = await Promise.all([fetchSheet(cfg.athletesUrl),fetchSheet(cfg.resultsUrl)]);
    const athletes=parseCSV(aText), results=parseCSV(rText);
    athleteMap={};
    athletes.forEach(a=>{
      // Calculate age from birthdate (YYYY-MM-DD) if present; fall back to static age field
      let computedAge = null;
      if (a.birthdate && /\d{4}-\d{2}-\d{2}/.test(a.birthdate)) {
        const diff = Date.now() - new Date(a.birthdate).getTime();
        computedAge = Math.floor(diff / (365.25*24*60*60*1000));
      } else {
        computedAge = parseFloat(a.age) || null;
      }
      athleteMap[a.id]={...a, age:computedAge, leg_length_cm:a.leg_length_cm, sessions:[]};
    });
    results.forEach(r=>{
      if(athleteMap[r.athlete_id]) athleteMap[r.athlete_id].sessions.push(deriveSession(r,athleteMap[r.athlete_id].weight_kg,athleteMap[r.athlete_id].age,athleteMap[r.athlete_id].height_cm));
    });
    Object.values(athleteMap).forEach(a=>a.sessions.sort((x,y)=>new Date(y.test_date)-new Date(x.test_date)));
    const st=document.getElementById('syncMsg');
    if(st) st.textContent=`Synced — ${athletes.length} athletes · ${results.length} sessions`;
    renderList();
    const ids=Object.keys(athleteMap);
    if(ids.length){selectedId=ids[0];renderMain();}
  } catch(e){showError(e.message);}
}

// ─── READINESS RING ───────────────────────────────────────────────────────────
// Four arcs, one per performance domain, each filled to that domain's mean
// benchmark score out of 4. The centre carries the overall score.
const RING_CATS = [
  { key:'jump',     label:'Power',    keys:['broad_jump','slbj_LSI','triple_hop','triple_hop_LSI','cmj','sj','eur','cmj_mrsi','cmj_con_force','dj','dj_rsi','dsi'] },
  { key:'speed',    label:'Speed',    keys:['sprint10','sprint20','max_vel'] },
  { key:'strength', label:'Strength', keys:['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw','imtp'] },
  { key:'aero',     label:'Aerobic',  keys:['mas','vo2max','yoyo_ir2','bronco'] },
];
function catMean(keys, ld){
  const sc = keys.map(k=>bs(ld[k],k)).filter(v=>v!==null);
  return sc.length ? sc.reduce((x,y)=>x+y,0)/sc.length : null;
}
function _pxy(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function _arc(cx,cy,r,a0,a1){
  const [x0,y0]=_pxy(cx,cy,r,a0), [x1,y1]=_pxy(cx,cy,r,a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function readinessRing(ld){
  const S=260, c=S/2, r=78, GAP=7;
  let svg=`<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="Benchmark readiness by domain">`;
  const means=[];
  RING_CATS.forEach((cat,i)=>{
    const m = catMean(cat.keys, ld); means.push(m);
    const a0 = i*90 + GAP/2, a1 = (i+1)*90 - GAP/2;
    svg += `<path d="${_arc(c,c,r,a0,a1)}" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="11" stroke-linecap="round"/>`;
    if (m!==null){
      const end = a0 + (a1-a0)*Math.max(0.04, m/4);
      const col = SCORE_COLS[Math.max(0,Math.min(4,Math.round(m)))];
      svg += `<path d="${_arc(c,c,r,a0,end)}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"/>`;
    }
    const [lx,ly]=_pxy(c,c,r+22,(a0+a1)/2);
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="#9E9C96" font-size="8.5" font-weight="600"
      letter-spacing="1.4" text-anchor="middle" dominant-baseline="middle">${cat.label.toUpperCase()}</text>`;
  });
  const valid = means.filter(m=>m!==null);
  const overall = valid.length ? valid.reduce((x,y)=>x+y,0)/valid.length : null;
  svg += `<text x="${c}" y="${c-4}" fill="#fff" font-size="34" font-weight="500" letter-spacing="-1"
    text-anchor="middle" dominant-baseline="middle">${overall!==null?overall.toFixed(1):'—'}</text>`;
  svg += `<text x="${c}" y="${c+20}" fill="#9E9C96" font-size="8.5" font-weight="600" letter-spacing="1.6"
    text-anchor="middle" dominant-baseline="middle">OF 4</text>`;
  svg += `</svg>`;
  return { svg, overall };
}

// ─── RESULT ROWS ──────────────────────────────────────────────────────────────
let inspectKey = null;

function barHtml(val, nk){
  const n = NORMS[nk];
  if (!n || n.noNorm || n.min==null || val==null) return '<div class="bar none">tracked individually</div>';
  const span = (n.max - n.min) || Math.abs(n.max||1)*0.2 || 1;
  const lo = n.min - span*0.9, hi = n.max + span*0.9;
  const pc = v => Math.max(0, Math.min(100, (v-lo)/(hi-lo)*100));
  const b0 = pc(n.min), b1 = pc(n.max);
  const sc = bs(val, nk);
  const mkCol = sc===null ? 'var(--ink)' : SCORE_COLS[sc];
  return `<div class="bar"><div class="band" style="left:${b0.toFixed(1)}%;width:${(b1-b0).toFixed(1)}%"></div>`
       + `<div class="mk" style="left:${pc(val).toFixed(1)}%;background:${mkCol}"></div></div>`;
}
function chgHtml(val, prev, lb){
  if (val==null||prev==null||prev===0) return '<span class="flat">—</span>';
  const d = (val-prev)/Math.abs(prev)*100;
  if (Math.abs(d) < 0.5) return `<span class="flat">→ ${d>0?'+':''}${d.toFixed(1)}%</span>`;
  const imp = lb ? d<0 : d>0;
  return `<span class="${imp?'up':'down'}">${imp?'↑':'↓'} ${d>0?'+':''}${d.toFixed(1)}%</span>`;
}
function vRow(nk, val, prev, sub){
  const n = NORMS[nk]; if (!n || val==null) return '';
  const dsrc = _rDateSrc[nk];
  const stale = dsrc && _rLatestDate && dsrc !== _rLatestDate ? `tested ${dsrc}` : '';
  const note  = [sub, stale].filter(Boolean).join(' · ');
  return `<button class="row" type="button" data-k="${nk}" aria-pressed="${inspectKey===nk}" onclick="inspect('${nk}')">
    <span class="lbl">${n.label}${note?`<small>${note}</small>`:''}</span>
    <span class="val">${val}<small>${n.u||''}</small></span>
    ${barHtml(val, nk)}
    <span class="chg">${chgHtml(val, prev, n.lb)}</span>
  </button>`;
}

function inspect(nk){
  inspectKey = nk;
  document.querySelectorAll('.row[data-k]').forEach(r =>
    r.setAttribute('aria-pressed', String(r.dataset.k === nk)));
  drawInspector(nk);
}

function drawInspector(nk){
  const box = document.getElementById('inspector'); if(!box) return;
  const a = athleteMap[selectedId]; const n = NORMS[nk];
  if (!a || !n){ box.innerHTML=''; return; }
  const pts = [...a.sessions].reverse()
    .map(s => ({ d:s.test_date, v:s[nk] })).filter(p => p.v!=null);
  const cur = pts.length ? pts[pts.length-1].v : null;
  const sc  = bs(cur, nk);

  const W=340, H=150, PL=38, PR=12, PT=14, PB=26;
  let chart;
  if (!pts.length){
    chart = `<p class="note">No recorded value for this test yet.</p>`;
  } else {
    const vals = pts.map(p=>p.v).concat(n.noNorm?[]:[n.min,n.max]);
    let lo=Math.min(...vals), hi=Math.max(...vals);
    const pad=(hi-lo)*0.2 || Math.abs(hi)*0.08 || 1; lo-=pad; hi+=pad;
    const X = i => PL + (pts.length===1 ? (W-PL-PR)/2 : i*(W-PL-PR)/(pts.length-1));
    const Y = v => PT + (H-PT-PB) * (1 - (v-lo)/(hi-lo));
    let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${n.label} over time">`;
    if (!n.noNorm && n.min!=null){
      const yTop=Y(n.max), yBot=Y(n.min);
      g += `<rect x="${PL}" y="${Math.min(yTop,yBot).toFixed(1)}" width="${W-PL-PR}"
             height="${Math.abs(yBot-yTop).toFixed(1)}" fill="#BFD6C6" opacity=".38"/>`;
      g += `<line x1="${PL}" x2="${W-PR}" y1="${yBot.toFixed(1)}" y2="${yBot.toFixed(1)}"
             stroke="#8FB49C" stroke-width="1" stroke-dasharray="4,3"/>`;
    }
    [lo,hi].forEach(v => {
      g += `<text x="${PL-7}" y="${Y(v).toFixed(1)}" fill="#86857F" font-size="9" text-anchor="end"
             dominant-baseline="middle">${(+v.toFixed(2))}</text>`;
    });
    if (pts.length>1){
      g += `<polyline fill="none" stroke="#17181A" stroke-width="1.8" stroke-linejoin="round"
             points="${pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}"/>`;
    }
    pts.forEach((p,i) => {
      const last = i===pts.length-1;
      g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?4.5:3.2}"
             fill="${last?'#17181A':'#FFFFFF'}" stroke="#17181A" stroke-width="1.6"/>`;
      if (i===0 || last){
        g += `<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#86857F" font-size="8.5"
               text-anchor="${pts.length>1?(last?'end':'start'):'middle'}">${p.d}</text>`;
      }
    });
    g += `</svg>`;
    chart = g;
  }

  const range = n.noNorm || n.min==null ? 'No validated professional norm'
              : `${n.min}–${n.max} ${n.u||''}`;
  box.innerHTML = `
    <div class="eb">Inspecting</div>
    <h3>${n.label}</h3>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap">
      <span class="big">${cur??'—'}<small>${n.u||''}</small></span>
      ${sc!==null?`<span class="chip c-s${sc}">${SL[sc]}</span>`:''}
    </div>
    ${chart}
    <div class="tleg"><span><i style="background:#BFD6C6"></i>Professional range ${range}</span></div>
    ${n.note?`<p class="note">${n.note}</p>`:''}
    ${n.source?`<p class="src coachonly">Source: ${n.source}</p>`:''}`;
}

let _secObserver = null;
function buildSecNav(){
  const nav = document.getElementById('secnav'), inner = document.getElementById('secnavInner');
  if(!nav||!inner) return;
  const secs = [...document.querySelectorAll('main .sec[id]')]
    .filter(s => !(viewMode==='athlete' && s.classList.contains('coachonly')));
  if(!secs.length){ nav.setAttribute('hidden',''); return; }
  nav.removeAttribute('hidden');
  inner.innerHTML = secs.map(s => `<a href="#${s.id}">${s.dataset.nav||s.id}</a>`).join('');
  if (_secObserver) _secObserver.disconnect();
  _secObserver = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      inner.querySelectorAll('a').forEach(l =>
        l.classList.toggle('on', l.getAttribute('href') === '#'+e.target.id));
    });
  }, { rootMargin:'-60px 0px -70% 0px' });
  secs.forEach(s => _secObserver.observe(s));
}

      ['cmj_con_force', d.cmj_con_force_N!=null?`${d.cmj_con_force_N} N raw`:''],
      ['eur','CMJ ÷ SJ'],
      ['cmj_mrsi', (d.cmj!=null&&d.cmj_ct_ms!=null)?`${d.cmj}cm ÷ ${d.cmj_ct_ms}ms`:''],
      ['dj'], ['dj_rsi', (d.dj!=null&&d.dj_ct_ms!=null)?`${d.dj}cm ÷ ${d.dj_ct_ms}ms`:''], ['dsi'],
    ]},
    { name:'Aerobic', rows:[
      ['mas', d.mas_src?`from ${d.mas_src}${d.mas?` · ${(d.mas*3.6).toFixed(1)} km/h`:''}`:''],

      ['sq_1rm_bw', d.sq_kg_raw?`${d.sq_kg_raw}kg × ${d.sq_reps_raw} → est. 1RM ${d.sq_1rm}kg`:''],

  // ── DOCUMENT ────────────────────────────────────────────────────────────
  document.getElementById('main').innerHTML = `
