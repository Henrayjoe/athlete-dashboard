// ─── MOTOR PREFERENCE (VueMotion) ───────────────────────────────────────────
// Framework: Wild, J.J. & Bezodis, N.E. — sprint acceleration technique and lower
// limb injury epidemiology in professional male Rugby Union (seven-season analysis).
// Axes are cohort z-scores: x = ground contact vs flight time, y = step length vs step rate.
let mpRunType = 'acc'; // 'acc' | 'fly'
let mpReference = 'study'; // 'study' | 'roster'

// ── Which sections appear on the athlete printout ───────────────────────────
// Stored in the same localStorage config as the sheet URLs.
const PRINT_SECTIONS = [
  { key:'radar',    label:'Athletic Profile (spider)', def:true  },
  { key:'charts',   label:'Trend Charts',              def:true  },
  { key:'quadrant', label:'Strength-Speed Quadrant',   def:true  },
  { key:'motorpref',label:'Motor Preference',          def:false },
  { key:'speedres', label:'Speed Reserve',             def:true  },
  { key:'feedback', label:'Athlete Message',           def:true  },
];
function printPrefs() {
  const saved = getConfig().printSections || {};
  const out = {};
  PRINT_SECTIONS.forEach(s => { out[s.key] = (saved[s.key] === undefined) ? s.def : !!saved[s.key]; });
  return out;
}
function togglePrintSection(key, on) {
  const cfg = getConfig();
  const ps = cfg.printSections || {};
  ps[key] = !!on;
  saveConfig({ ...cfg, printSections: ps });
}

// ── Wild & Bezodis (2026) reference values ──────────────────────────────────
// Reconstructed by pooling the four group tables in Figure 1 (n=85, 63,786 hr).
// Validated: pooled n = 85 exactly; all four centroids fall in their stated quadrant.
// Ratios are dimensionless (Hof 1996 normalisation).
const MP_STUDY = {
  slsr: { mean:1.1162, sd:0.1075 },   // step length / step rate
  ctft: { mean:2.3169, sd:0.3874 },   // contact time / flight time
  groups: {
    bounders:{ n:25, exp:22460, sl:1.57, sr:1.29, slsr:1.22, ct:0.517, ft:0.260, ctft:2.00, burden:65.0 },
    striders:{ n:16, exp:13311, sl:1.53, sr:1.30, slsr:1.18, ct:0.560, ft:0.212, ctft:2.65, burden:30.9 },
    bouncers:{ n:18, exp:10283, sl:1.45, sr:1.40, slsr:1.04, ct:0.476, ft:0.242, ctft:1.98, burden:22.9 },
    spinners:{ n:26, exp:17909, sl:1.42, sr:1.39, slsr:1.03, ct:0.527, ft:0.199, ctft:2.65, burden:52.1 },
  }
};
const G_ACCEL = 9.81;
// Leg length: measured value preferred; 0.53 x height is a rough fallback.
// The SL/SR axis scales with leg length^1.5, so this matters a great deal.
const LEG_LENGTH_RATIO_DEFAULT = 0.53;

// Solve for the leg-length ratio implied by an athlete who has BOTH raw values and a
// VueMotion chart position. Applying that ratio to everyone absorbs whatever leg-length
// definition VueMotion uses, so estimated athletes line up with the charted one.
function mpCalibratedRatio() {
  const cfg = getConfig();
  if (cfg.legRatio) return { r:+cfg.legRatio, source:'set manually' };
  for (const a of Object.values(athleteMap)) {
    const h = pf(a.height_cm); if (!h) continue;
    for (const pfx of ['acc','fly']) {
      const gv = k => latestVal(a.sessions, pfx+'_'+k);
      const chartY = gv('mp_y') != null ? gv('mp_y')
                   : (gv('mp_y_L')!=null && gv('mp_y_R')!=null ? (gv('mp_y_L')+gv('mp_y_R'))/2 : null);
      if (chartY == null) continue;
      const avg=(x,y)=>(x!=null&&y!=null)?(x+y)/2:(x!=null?x:y);
      const sA=avg(gv('sl_L'),gv('sl_R')), qA=avg(gv('sf_L'),gv('sf_R'));
      if (sA==null || !qA) continue;
      const targetRatio = MP_STUDY.slsr.mean + chartY*MP_STUDY.slsr.sd;
      if (targetRatio <= 0) continue;
      const l0 = Math.pow((sA*Math.sqrt(G_ACCEL))/(qA*targetRatio), 2/3);
      const r = l0/(h/100);
      if (r > 0.40 && r < 0.70) return { r:+r.toFixed(3), source:`calibrated from ${a.name}`, from:a.name };
    }
  }
  return null;
}

function mpLegLength(a) {
  const measured = pf(a?.leg_length_cm);
  if (measured) return { m: measured/100, estimated:false, ratio:null, calib:null };
  const h = pf(a?.height_cm); if (!h) return null;
  const cal = mpCalibratedRatio();
  const r = cal ? cal.r : LEG_LENGTH_RATIO_DEFAULT;
  return { m:(h*r)/100, estimated:true, ratio:r, calib:cal };
}

function setMpReference(r, btn) {
  mpReference = r;
  document.querySelectorAll('.mp-ref-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderMotorPref();
}

// Relative risks from Wild, Bezodis et al. — 85 professional male Rugby Union players,
// 7 seasons, 63,786 player-hours, 123 non-contact lower-limb running injuries.
// The study's own smallest-association thresholds were 1.85 (raised) and 0.38 (lowered);
// values beyond those AND statistically significant are marked below.
// Compass bearings are the study's original group names.
const MP_RR_UPPER = 1.85, MP_RR_LOWER = 0.38;
const MP_QUADRANTS = {
  bounders: { name:'Bounders', bearing:'NW', sub:'Long step length / long flight time',
              rr:{ 'Hip/groin':0.34, 'Hamstring':0.70, 'Calf':2.53 }, flag:['Calf'],
              note:'Highest overall injury burden of the four strategies. Greater plantarflexor and Achilles loading — longer flight raises downward velocity at touchdown while shorter contact demands more force per unit time.' },
  striders: { name:'Striders', bearing:'NE', sub:'Long step length / long contact time',
              rr:{ 'Hip/groin':0.70, 'Hamstring':0.55, 'Calf':0.93 }, flag:[],
              note:'Lowest risk profile across all three sites. Longer contact and shorter flight shift load toward the knee extensors rather than the plantarflexors.' },
  bouncers: { name:'Bouncers', bearing:'SW', sub:'High step rate / short contact time',
              rr:{ 'Hip/groin':2.12, 'Hamstring':0.51, 'Calf':0.86 }, flag:[],
              note:'Highest share of hip/groin injuries (35%), though not statistically significant — confidence intervals overlapped. Rapid limb repositioning spikes hip flexor force late in stance.' },
  spinners: { name:'Spinners', bearing:'SE', sub:'High step rate / short flight time',
              rr:{ 'Hip/groin':0.72, 'Hamstring':2.53, 'Calf':0.31 }, flag:['Hamstring','Calf'],
              note:'Half of all hamstring injuries in the study occurred in this group (0.84 vs 0.30 per 1000h). Higher step rate increases biceps femoris long-head demand in late swing. Notably, calf risk is 3.2× LOWER.' },
};

function mpQuadrantKey(x, y) {
  if (y >= 0) return x < 0 ? 'bounders' : 'striders';
  return x < 0 ? 'bouncers' : 'spinners';
}

// ── Population reference norms ──────────────────────────────────────────────
// 'fly' values are back-calculated from a VueMotion 20m Fly report's "vs Norms %"
// column. 'acc' values are PROVISIONAL — replace them from an acceleration report
// when one is available. Editing these two blocks re-baselines every athlete.
// Both sets back-calculated from real VueMotion "Progress Over Time" reports and
// verified against every per-leg figure to within 0.1%.
// NOTE: ground contact time is scored INVERTED by VueMotion (shorter = better %),
// which is accounted for in the derivation below.
const MP_NORMS = {
  fly: { sl:1.9932, sf:3.9463, gct:0.1525, ft:0.1047, provisional:false },
  acc: { sl:1.3925, sf:4.3359, gct:0.1702, ft:0.0626, provisional:false },
};


// ── Cohort statistics from your own athletes ────────────────────────────────
// Motor preference axes are z-scores, which need each metric's standard deviation.
// VueMotion never prints those, so we derive them from every session in the sheet.
// Reference group = your roster, not VueMotion's population.
function mpCohortStats(pfx) {
  const cols = { sl:[], sf:[], gct:[], ft:[] };
  const avg = (a,b) => (a!=null&&b!=null) ? (a+b)/2 : (a!=null?a:b);
  Object.values(athleteMap).forEach(a => {
    (a.sessions||[]).forEach(s => {
      const sl  = avg(s[pfx+'_sl_L'],  s[pfx+'_sl_R']);
      const sf  = avg(s[pfx+'_sf_L'],  s[pfx+'_sf_R']);
      const gct = avg(s[pfx+'_gct_L'], s[pfx+'_gct_R']);
      const ft  = avg(s[pfx+'_ft_L'],  s[pfx+'_ft_R']);
      if (sl!=null)  cols.sl.push(sl);
      if (sf!=null)  cols.sf.push(sf);
      if (gct!=null) cols.gct.push(gct);
      if (ft!=null)  cols.ft.push(ft);
    });
  });
  const stat = arr => {
    const n = arr.length; if (n < 2) return null;
    const m = arr.reduce((x,y)=>x+y,0)/n;
    const sd = Math.sqrt(arr.reduce((acc,v)=>acc+Math.pow(v-m,2),0)/(n-1));
    return { n, mean:m, sd };
  };
  const out = { sl:stat(cols.sl), sf:stat(cols.sf), gct:stat(cols.gct), ft:stat(cols.ft) };
  const ok = ['sl','sf','gct','ft'].every(k => out[k] && out[k].sd > 0);
  out.n = Math.min(...['sl','sf','gct','ft'].map(k => out[k] ? out[k].n : 0));
  out.usable = ok && out.n >= 3;
  return out;
}

function mpSpeedBand(v) {
  if (v == null)   return { col:'#94a3b8', label:'no speed recorded' };
  if (v < 7.2)     return { col:'#dc2626', label:'below 7.2 m/s' };
  if (v <= 8.09)   return { col:'#f59e0b', label:'around cohort average' };
  return             { col:'#16a34a', label:'above 8.09 m/s' };
}

function setMpRunType(t, btn) {
  mpRunType = t;
  document.querySelectorAll('.mp-run-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderMotorPref();
}

// Percentage deviation of a ratio from its population norm
function mpPct(val, norm) { return (norm && val!=null) ? +(((val-norm)/norm)*100).toFixed(1) : null; }

function mpData(sessions, pfx, athlete) {
  const g = k => latestVal(sessions, pfx+'_'+k);
  const N = MP_NORMS[pfx]; if (!N) return null;

  // ── Preferred path: coordinates transcribed from the VueMotion chart ──
  // These are true z-scores against VueMotion's cohort and are authoritative.
  const vx=g('mp_x'), vy=g('mp_y');
  const vxL=g('mp_x_L'), vxR=g('mp_x_R'), vyL=g('mp_y_L'), vyR=g('mp_y_R');
  const haveLegs = [vxL,vxR,vyL,vyR].every(v=>v!=null);
  if (vx!=null && vy!=null || haveLegs) {
    const X = vx!=null ? vx : (vxL+vxR)/2;
    const Y = vy!=null ? vy : (vyL+vyR)/2;
    let dt=null;
    for (const s of sessions){ if (s[pfx+'_mp_x']!=null||s[pfx+'_mp_x_L']!=null){ dt=s.test_date; break; } }
    return { xL:vxL, xR:vxR, yL:vyL, yR:vyR, x:+X.toFixed(2), y:+Y.toFixed(2),
      l2:+Math.sqrt(X*X+Y*Y).toFixed(2),
      asym: haveLegs ? +Math.sqrt(Math.pow(vxL-vxR,2)+Math.pow(vyL-vyR,2)).toFixed(2) : null,
      maxSpeed:g('max_speed'), date:dt, unit:'SD', source:'VueMotion chart',
      ctft:null, slsr:null, ctftNorm:null, slsrNorm:null };
  }


  const raw = { slL:g('sl_L'), slR:g('sl_R'), sfL:g('sf_L'), sfR:g('sf_R'),
                gctL:g('gct_L'), gctR:g('gct_R'), ftL:g('ft_L'), ftR:g('ft_R') };
  if (Object.values(raw).every(v=>v==null)) return null;

  // ── Study reference: Wild & Bezodis pooled z-scores ──
  if (mpReference === 'study') {
    const avgS = (a,b) => (a!=null&&b!=null)?(a+b)/2:(a!=null?a:b);
    const gA=avgS(g('gct_L'),g('gct_R')), fA=avgS(g('ft_L'),g('ft_R'));
    const sA=avgS(g('sl_L'),g('sl_R')),   qA=avgS(g('sf_L'),g('sf_R'));
    const LL = mpLegLength(athlete);
    if (gA!=null && fA && sA!=null && qA && LL) {
      // CT/FT is unaffected by Hof normalisation — the leg-length term cancels.
      const ctftR = gA/fA;
      // SL/SR does NOT cancel: SL*sqrt(g) / (SR * l0^1.5)
      const slsrR = (sA*Math.sqrt(G_ACCEL)) / (qA * Math.pow(LL.m,1.5));
      const zx = (ctftR - MP_STUDY.ctft.mean)/MP_STUDY.ctft.sd;
      const zy = (slsrR - MP_STUDY.slsr.mean)/MP_STUDY.slsr.sd;
      const legZ = (gv,fv,sv,qv) => {
        if(gv==null||!fv||sv==null||!qv) return [null,null];
        return [ +(((gv/fv)-MP_STUDY.ctft.mean)/MP_STUDY.ctft.sd).toFixed(2),
                 +((((sv*Math.sqrt(G_ACCEL))/(qv*Math.pow(LL.m,1.5)))-MP_STUDY.slsr.mean)/MP_STUDY.slsr.sd).toFixed(2) ];
      };
      const [sxL,syL] = legZ(g('gct_L'),g('ft_L'),g('sl_L'),g('sf_L'));
      const [sxR,syR] = legZ(g('gct_R'),g('ft_R'),g('sl_R'),g('sf_R'));
      let dtS=null;
      for (const s of sessions){ if (s[pfx+'_gct_L']!=null||s[pfx+'_gct_R']!=null){ dtS=s.test_date; break; } }
      return { xL:sxL, xR:sxR, yL:syL, yR:syR,
        x:+zx.toFixed(2), y:+zy.toFixed(2),
        l2:+Math.sqrt(zx*zx+zy*zy).toFixed(2),
        asym:(sxL!=null&&sxR!=null&&syL!=null&&syR!=null)
          ? +Math.sqrt(Math.pow(sxL-sxR,2)+Math.pow(syL-syR,2)).toFixed(2) : null,
        maxSpeed:g('max_speed'), date:dtS, unit:'SD',
        source:'Wild & Bezodis study reference',
        ctft:+ctftR.toFixed(3), slsr:+slsrR.toFixed(3),
        ctftNorm:MP_STUDY.ctft.mean, slsrNorm:MP_STUDY.slsr.mean,
        legLen:LL.m, legEstimated:LL.estimated, legRatio:LL.ratio, legCalib:LL.calib };
    }
  }

  // ── Second choice: z-scores against your own roster ──
  const CS = mpCohortStats(pfx);
  if (mpReference === 'roster' && CS.usable) {
    const z = (v,k) => (v==null) ? null : (v - CS[k].mean) / CS[k].sd;
    const avg2 = (a,b) => (a!=null&&b!=null)?(a+b)/2:(a!=null?a:b);
    const gA=avg2(g('gct_L'),g('gct_R')), fA=avg2(g('ft_L'),g('ft_R'));
    const sA=avg2(g('sl_L'),g('sl_R')),   qA=avg2(g('sf_L'),g('sf_R'));
    if (gA!=null && fA!=null && sA!=null && qA!=null) {
      // x = contact vs flight · y = step length vs step rate
      const X = z(gA,'gct') - z(fA,'ft');
      const Y = z(sA,'sl')  - z(qA,'sf');
      const legX = (gv,fv) => (gv!=null&&fv!=null) ? +(z(gv,'gct')-z(fv,'ft')).toFixed(2) : null;
      const legY = (sv,qv) => (sv!=null&&qv!=null) ? +(z(sv,'sl') -z(qv,'sf')).toFixed(2) : null;
      const zxL=legX(g('gct_L'),g('ft_L')), zxR=legX(g('gct_R'),g('ft_R'));
      const zyL=legY(g('sl_L'),g('sf_L')),  zyR=legY(g('sl_R'),g('sf_R'));
      let dt2=null;
      for (const s of sessions){ if (s[pfx+'_gct_L']!=null||s[pfx+'_gct_R']!=null){ dt2=s.test_date; break; } }
      return { xL:zxL, xR:zxR, yL:zyL, yR:zyR,
        x:+X.toFixed(2), y:+Y.toFixed(2),
        l2:+Math.sqrt(X*X+Y*Y).toFixed(2),
        asym:(zxL!=null&&zxR!=null&&zyL!=null&&zyR!=null)
          ? +Math.sqrt(Math.pow(zxL-zxR,2)+Math.pow(zyL-zyR,2)).toFixed(2) : null,
        maxSpeed:g('max_speed'), date:dt2, unit:'SD',
        source:`your roster · n=${CS.n} sessions`, cohortN:CS.n,
        ctft:null, slsr:null, ctftNorm:null, slsrNorm:null };
    }
  }

  const ctftNorm = N.gct / N.ft;    // contact ÷ flight at population norm
  const slsrNorm = N.sl  / N.sf;    // step length ÷ step rate at population norm

  // Per-leg ratios → % deviation from norm
  const legX = (gct,ft) => (gct!=null&&ft) ? mpPct(gct/ft, ctftNorm) : null;
  const legY = (sl,sf)  => (sl!=null&&sf)  ? mpPct(sl/sf,  slsrNorm) : null;
  const xL=legX(raw.gctL,raw.ftL), xR=legX(raw.gctR,raw.ftR);
  const yL=legY(raw.slL,raw.sfL),  yR=legY(raw.slR,raw.sfR);

  // Session average — from averaged raw values where both legs exist
  const avg=(a,b)=>(a!=null&&b!=null)?(a+b)/2:(a!=null?a:b);
  const gctA=avg(raw.gctL,raw.gctR), ftA=avg(raw.ftL,raw.ftR);
  const slA =avg(raw.slL,raw.slR),   sfA=avg(raw.sfL,raw.sfR);
  const x = (gctA!=null&&ftA) ? mpPct(gctA/ftA, ctftNorm) : null;
  const y = (slA!=null&&sfA)  ? mpPct(slA/sfA,  slsrNorm) : null;
  if (x==null || y==null) return null;

  const asym = (xL!=null&&xR!=null&&yL!=null&&yR!=null)
    ? +Math.sqrt(Math.pow(xL-xR,2)+Math.pow(yL-yR,2)).toFixed(1) : null;

  let date=null;
  for (const s of sessions){ if (s[pfx+'_gct_L']!=null||s[pfx+'_gct_R']!=null){ date=s.test_date; break; } }

  return { xL,xR,yL,yR, x, y,
    l2:+Math.sqrt(x*x+y*y).toFixed(1), asym,
    maxSpeed:g('max_speed'), date, raw, unit:'%', source:'computed from raw values',
    ctft:(gctA!=null&&ftA)?+(gctA/ftA).toFixed(3):null,
    slsr:(slA!=null&&sfA)?+(slA/sfA).toFixed(3):null,
    ctftNorm:+ctftNorm.toFixed(3), slsrNorm:+slsrNorm.toFixed(3),
    provisional:N.provisional };
}

function renderMotorPref() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('mpContent');
  if (!a || !el) return;

  const pfx = mpRunType === 'acc' ? 'acc' : 'fly';
  const runLabel = mpRunType === 'acc' ? 'Acceleration' : 'Fly (max velocity)';
  const d = mpData(a.sessions, pfx, a);

  const toggle = `
    <div class="quad-ctrl-row" style="justify-content:center">
      <span class="control-label">Reference</span>
      <button class="axis-btn mp-ref-btn${mpReference==='study'?' active':''}" onclick="setMpReference('study',this)">Study (n=85 pro rugby)</button>
      <button class="axis-btn mp-ref-btn${mpReference==='roster'?' active':''}" onclick="setMpReference('roster',this)">My roster</button>
    </div>
    <div class="quad-ctrl-row" style="justify-content:center">
      <span class="control-label">Run type</span>
      <button class="axis-btn mp-run-btn${mpRunType==='acc'?' active':''}" onclick="setMpRunType('acc',this)">Acceleration</button>
      <button class="axis-btn mp-run-btn${mpRunType==='fly'?' active':''}" onclick="setMpRunType('fly',this)">Fly (max velocity)</button>
    </div>`;

  if (!d) {
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;align-items:center">${toggle}
      <div style="padding:28px 20px;text-align:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;max-width:460px">
        <h3 style="font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">No ${runLabel.toLowerCase()} profile recorded</h3>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.6">
          Transcribe these raw values from the VueMotion report — the dashboard z-scores them
          against your own roster automatically:<br>
          <strong>${pfx}_sl_L / ${pfx}_sl_R</strong> (step length) ·
          <strong>${pfx}_sf_L / ${pfx}_sf_R</strong> (step frequency) ·
          <strong>${pfx}_gct_L / ${pfx}_gct_R</strong> (ground contact) ·
          <strong>${pfx}_ft_L / ${pfx}_ft_R</strong> (flight time)<br><br>
          <span style="font-size:11.5px">If you also have that athlete's Motor Preference chart, adding
          <strong>${pfx}_mp_x</strong> and <strong>${pfx}_mp_y</strong> will match VueMotion exactly.</span>
          </p></div></div>`;
    return;
  }

  const qk = mpQuadrantKey(d.x, d.y);
  const q  = MP_QUADRANTS[qk];
  const band = mpSpeedBand(d.maxSpeed);

  // ── Quadrant SVG ────────────────────────────────────────────────────────
  const W=520, H=500, CX=W/2, CY=245, R=175;
  // Axis auto-scales so no point can ever render outside the plot area.
  const isSD = d.unit === 'SD';
  const mpPts = [d.x, d.y, d.xL, d.xR, d.yL, d.yR].filter(v=>v!=null).map(Math.abs);
  const mpMax = mpPts.length ? Math.max(...mpPts) : 0;
  const LIM = isSD ? Math.max(3.5, Math.ceil(mpMax*1.15*2)/2)
                   : Math.max(45,  Math.ceil((mpMax*1.15)/10)*10);
  const tickStep = isSD ? (LIM<=3.5?1:LIM<=7?2:5)
                        : (LIM<=45?10:LIM<=100?20:LIM<=200?50:100);
  const ticks = []; for(let v=-LIM+tickStep; v<LIM; v+=tickStep){ if(Math.abs(v)>0.01) ticks.push(v); }
  const ringVals = (isSD ? [0.5,1.5,2.5] : [10,20,30]).filter(r=>r<LIM);
  const U = isSD ? '' : '%';
  const sx = v => CX + (v/LIM)*R;
  const sy = v => CY - (v/LIM)*R;

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">`;
  // SD rings
  ringVals.forEach(sd=>{
    const half=(sd/LIM)*R;
    s+=`<rect x="${CX-half}" y="${CY-half}" width="${half*2}" height="${half*2}" fill="none" stroke="rgba(15,23,42,0.18)" stroke-width="1" stroke-dasharray="4,3"/>`;
  });
  // Axes
  s+=`<line x1="${CX-R}" y1="${CY}" x2="${CX+R}" y2="${CY}" stroke="#334155" stroke-width="1.2"/>`;
  s+=`<line x1="${CX}" y1="${CY-R}" x2="${CX}" y2="${CY+R}" stroke="#334155" stroke-width="1.2"/>`;
  // Ticks
  ticks.forEach(v=>{
    s+=`<line x1="${sx(v)}" y1="${CY-3}" x2="${sx(v)}" y2="${CY+3}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${sx(v)}" y="${CY+13}" font-size="7" fill="#94a3b8" text-anchor="middle">${v>0?'+':''}${v}</text>`;
    s+=`<line x1="${CX-3}" y1="${sy(v)}" x2="${CX+3}" y2="${sy(v)}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${CX-7}" y="${sy(v)+2.5}" font-size="7" fill="#94a3b8" text-anchor="end">${v>0?'+':''}${v}</text>`;
  });
  // Quadrant labels
  const qlab=[
    ['Bounders','long step length / long flight time', CX-R+4, CY-R+14, 'start', qk==='bounders'],
    ['Striders','long step length / long contact time', CX+R-4, CY-R+14, 'end',   qk==='striders'],
    ['Bouncers','high step rate / short contact time',  CX-R+4, CY+R-8,  'start', qk==='bouncers'],
    ['Spinners','high step rate / short flight time',   CX+R-4, CY+R-8,  'end',   qk==='spinners'],
  ];
  qlab.forEach(([t,sub,x,y,anch,isCur])=>{
    s+=`<text x="${x}" y="${y}" font-size="12" font-weight="700" fill="${isCur?'#0d1117':'#94a3b8'}" text-anchor="${anch}">${t}</text>`;
    s+=`<text x="${x}" y="${y+11}" font-size="7.5" fill="${isCur?'#64748b':'#c3c9d1'}" text-anchor="${anch}">${sub}</text>`;
  });
  // Axis descriptors
  s+=`<text x="${CX}" y="${CY-R-20}" font-size="9" fill="#64748b" text-anchor="middle">greater step length relative to step rate</text>`;
  s+=`<text x="${CX}" y="${CY+R+26}" font-size="9" fill="#64748b" text-anchor="middle">greater step rate relative to step length</text>`;
  s+=`<text x="${CX-R-6}" y="${CY-8}" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,${CX-R-6},${CY-8})">greater flight time rel. to contact</text>`;
  s+=`<text x="${CX+R+8}" y="${CY-8}" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(90,${CX+R+8},${CY-8})">greater contact time rel. to flight</text>`;
  // Study group centroids, shown faintly for context when using the study reference
  if (d.source.indexOf('Wild')>=0) {
    Object.entries(MP_STUDY.groups).forEach(([key,gr])=>{
      const gz = { x:(gr.ctft-MP_STUDY.ctft.mean)/MP_STUDY.ctft.sd,
                   y:(gr.slsr-MP_STUDY.slsr.mean)/MP_STUDY.slsr.sd };
      if (Math.abs(gz.x)>LIM||Math.abs(gz.y)>LIM) return;
      s+=`<circle cx="${sx(gz.x)}" cy="${sy(gz.y)}" r="7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.75"/>`;
      s+=`<text x="${sx(gz.x)}" y="${sy(gz.y)+2.5}" font-size="6.5" fill="#94a3b8" text-anchor="middle">${key.slice(0,2).toUpperCase()}</text>`;
    });
  }

  // Session-average bubble
  s+=`<circle cx="${sx(d.x)}" cy="${sy(d.y)}" r="15" fill="${band.col}" fill-opacity="0.5" stroke="${band.col}" stroke-width="1.5"/>`;
  // Per-leg markers
  if (d.xL!=null&&d.yL!=null)
    s+=`<circle cx="${sx(d.xL)}" cy="${sy(d.yL)}" r="6" fill="#2563eb" stroke="#fff" stroke-width="1.6"/>`;
  if (d.xR!=null&&d.yR!=null)
    s+=`<circle cx="${sx(d.xR)}" cy="${sy(d.yR)}" r="6" fill="#ec4899" stroke="#fff" stroke-width="1.6"/>`;
  if (d.xL!=null&&d.xR!=null&&d.yL!=null&&d.yR!=null)
    s+=`<line x1="${sx(d.xL)}" y1="${sy(d.yL)}" x2="${sx(d.xR)}" y2="${sy(d.yR)}" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>`;
  s+='</svg>';

  // ── 1-D axis bars ───────────────────────────────────────────────────────
  const bar = (leftLbl,rightLbl,val) => {
    const BW=440, BH=60, BML=18, BCW=BW-BML*2, ByC=38;
    const bTicks=[]; for(let v=-LIM; v<=LIM; v+=tickStep) bTicks.push(v);
    const bx = v => BML + ((v+LIM)/(2*LIM))*BCW;
    let b=`<svg viewBox="0 0 ${BW} ${BH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${BW}px">`;
    b+=`<text x="${BML}" y="12" font-size="10.5" font-weight="700" fill="#334155">${leftLbl}</text>`;
    b+=`<text x="${BW-BML}" y="12" font-size="10.5" font-weight="700" fill="#334155" text-anchor="end">${rightLbl}</text>`;
    b+=`<line x1="${BML}" y1="${ByC}" x2="${BW-BML}" y2="${ByC}" stroke="#334155" stroke-width="1.2"/>`;
    bTicks.forEach(v=>{
      b+=`<line x1="${bx(v)}" y1="${ByC-4}" x2="${bx(v)}" y2="${ByC+4}" stroke="#94a3b8" stroke-width="1"/>`;
      b+=`<text x="${bx(v)}" y="${ByC+16}" font-size="7" fill="#94a3b8" text-anchor="middle">${v>0?'+':''}${v}</text>`;
    });
    b+=`<circle cx="${bx(val)}" cy="${ByC}" r="11" fill="${band.col}" fill-opacity="0.55" stroke="${band.col}" stroke-width="1.5"/>`;
    b+=`<text x="${bx(val)}" y="${ByC+3.5}" font-size="8" font-weight="700" fill="#0d1117" text-anchor="middle">${val>0?'+':''}${val}${U}</text>`;
    b+='</svg>';
    return b;
  };

  // ── Injury relative risk — coach view only ──────────────────────────────
  const rrRows = Object.entries(q.rr).map(([site,rr])=>{
    const sig = q.flag.includes(site);
    const raised = rr >= MP_RR_UPPER, lowered = rr <= MP_RR_LOWER;
    const col = raised ? '#dc2626' : lowered ? '#16a34a' : '#64748b';
    const barW = Math.min(100, (rr/3)*100);
    return `<div style="margin-bottom:7px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="flex:1;font-size:11px;color:var(--text-secondary)">${site}</span>
        <span style="font-size:11.5px;font-weight:700;color:${col}">${rr.toFixed(2)}×${sig?' *':''}</span>
      </div>
      <div style="height:4px;background:#eef0f2;border-radius:2px;margin-top:2px;position:relative">
        <div style="position:absolute;left:0;top:0;height:4px;border-radius:2px;width:${barW}%;background:${col}"></div>
        <div style="position:absolute;left:33.3%;top:-2px;width:1px;height:8px;background:#c3c9d1" title="RR = 1.0"></div>
      </div>
    </div>`;
  }).join('') + `<p style="font-size:10px;color:var(--text-secondary);line-height:1.55;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)">${q.note}</p>`;

  const card=(l,v,sub)=>`<div style="flex:1;min-width:105px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface)">
    <div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">${l}</div>
    <div style="font-size:17px;font-weight:700;color:var(--text-primary);line-height:1.1">${v}</div>
    ${sub?`<div style="font-size:9.5px;color:var(--text-muted);margin-top:2px">${sub}</div>`:''}</div>`;

  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;align-items:center;width:100%">
      ${toggle}
      <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:center">
        <span style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em">Preference</span>
        <span style="display:inline-flex;align-items:center;gap:7px;background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:5px 14px">
          <span style="width:9px;height:9px;border-radius:50%;background:${band.col};display:inline-block"></span>
          <span style="font-size:14px;font-weight:700;color:var(--text-primary)">${q.name}</span></span>
        <span style="font-size:12px;color:var(--text-secondary)">${q.sub}</span>
      </div>
      ${s}
      <div style="display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--text-muted);flex-wrap:wrap;justify-content:center">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#2563eb;margin-right:4px"></span>Left leg</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ec4899;margin-right:4px"></span>Right leg</span>
        <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${band.col};opacity:.5;margin-right:4px;vertical-align:middle"></span>Session average — ${band.label}</span>
        <span style="color:#c3c9d1">Rings = ${ringVals.join(' / ')}${isSD?' SD':'% from norm'} · axis ±${LIM}${U}</span>
        ${d.source.indexOf('Wild')>=0?'<span style="color:#c3c9d1">Dashed circles = study group centroids</span>':''}
        <span style="color:${d.source.indexOf('VueMotion')>=0?'#16a34a':(isSD&&!d.legEstimated)?'#1a56db':'#c2410c'};font-weight:600">${
          d.source.indexOf('VueMotion')>=0 ? '✓ VueMotion chart values'
          : d.source.indexOf('Wild')>=0 ? (d.legEstimated
              ? '<span style="color:#c2410c">⚠ leg length estimated'+(d.legCalib?' (calibrated)':'')+'</span>'
              : '◆ z-scores vs Wild &amp; Bezodis (n=85)')
          : isSD ? '◆ z-scores vs '+d.source
          : '⚠ estimated from raw values'}</span>
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;width:100%;max-width:520px">
        ${card('Preference strength', d.l2+U, isSD?'distance from cohort mean':'distance from norm')}
        ${card('Asymmetry', d.asym!=null?d.asym+U:'—', 'L–R separation')}
        ${d.ctft!=null?card('Contact ÷ flight', d.ctft, `ref ${d.ctftNorm} · ${d.x>0?'+':''}${d.x}${U||' SD'}`):''}
        ${d.slsr!=null?card('Step len ÷ rate', d.slsr, `ref ${d.slsrNorm} · ${d.y>0?'+':''}${d.y}${U||' SD'}`):''}
        ${card('Max speed', d.maxSpeed!=null?d.maxSpeed+' m/s':'—', band.label)}
        ${card('Tested', d.date||'—', runLabel)}
      </div>
      <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:2px">
        ${bar('flight time','ground contact time', d.x)}
        ${bar('step frequency','step length', d.y)}
      </div>
      <div class="no-print" style="width:100%;max-width:520px;border:1px solid var(--border);border-left:3px solid #64748b;border-radius:0 8px 8px 0;padding:12px 15px;background:var(--surface-alt)">
        <div style="font-size:9.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px">
          Injury association — ${q.name} · coach reference only</div>
        ${rrRows}
        <p style="font-size:9.5px;color:var(--text-muted);line-height:1.55;margin-top:7px">
          ${d.source.indexOf('VueMotion')>=0
            ? 'Position taken directly from the VueMotion Motor Preference chart, so it matches that report exactly.'
            : d.source.indexOf('Wild')>=0
            ? 'Z-scored against the published reference: SL/SR '+MP_STUDY.slsr.mean+' ± '+MP_STUDY.slsr.sd
              +', CT/FT '+MP_STUDY.ctft.mean+' ± '+MP_STUDY.ctft.sd+' (pooled from Fig. 1, n=85). '
              +'Ratios are Hof-normalised. Contact ÷ flight needs no leg length — it cancels — but '
              +'step length ÷ step rate scales with leg length<sup>1.5</sup>.'
              + (d.legEstimated
                 ? (d.legCalib
                    ? ' <strong style="color:#c2410c">Leg length estimated, not measured</strong> — '
                      +d.legRatio+' × height ('+(d.legLen*100).toFixed(1)+' cm), '+d.legCalib.source+', '
                      +'i.e. the ratio that makes that athlete\'s computed position match their VueMotion chart. '
                      +'Better than a textbook ratio, but this axis scales with leg length<sup>1.5</sup> and body '
                      +'proportions vary between athletes. Measure greater trochanter to floor and add '
                      +'<strong>leg_length_cm</strong> to the Athletes tab for an exact position.'
                    : ' <strong style="color:#c2410c">Leg length estimated at '+d.legRatio+' × height ('
                      +(d.legLen*100).toFixed(1)+' cm) — uncalibrated.</strong> This axis scales with leg '
                      +'length<sup>1.5</sup>, so a 9 cm error can move an athlete across the boundary. Either measure it '
                      +'(<strong>leg_length_cm</strong>, Athletes tab) or add <strong>'+pfx+'_mp_x</strong> / '
                      +'<strong>'+pfx+'_mp_y</strong> for one athlete so the ratio can be calibrated for everyone.')
                 : ' Leg length measured: '+(d.legLen*100).toFixed(1)+' cm.')
            : isSD
            ? 'True z-scores, but computed against <strong>your own roster</strong> ('+d.cohortN+' sessions) rather than '
              +'VueMotion\'s population. An athlete at zero is average <em>for your group</em>. '
              +'Reliability improves as you add athletes. To pin an athlete to VueMotion exactly, add '
              +'<strong>'+pfx+'_mp_x</strong> and <strong>'+pfx+'_mp_y</strong> from their chart.'
            : '<strong style="color:#c2410c">Estimated position — may not match your VueMotion chart.</strong> '
              +'Derived from raw values as % deviation from population norms. VueMotion plots z-scores '
              +'(deviation ÷ standard deviation) against a narrower cohort, and because step frequency varies '
              +'far less than step length, the two methods can disagree on which quadrant an athlete falls in. '
              +'For an exact match, add <strong>'+pfx+'_mp_x</strong> and <strong>'+pfx+'_mp_y</strong> read off the chart.'}<br>
          Relative risk vs the other three strategies. <strong>*</strong> = statistically significant and beyond the
          study's own smallest-association thresholds (${MP_RR_UPPER} raised / ${MP_RR_LOWER} lowered).
          Tick on each bar marks RR&nbsp;=&nbsp;1.0.<br><br>
          Source: Wild, Bezodis et al., <em>"Sprint acceleration technique is associated with lower-limb injury
          epidemiology in professional male Rugby Union players: a seven-season analysis"</em> — 85 players,
          63,786 player-hours, 123 non-contact lower-limb running injuries. Group is <strong>${q.bearing}</strong>
          in the paper's compass notation.<br><br>
          The authors note findings may be specific to that single club, and that acceleration strategy is
          <em>one component of a multifactorial risk profile, not a direct cause of injury</em>. Applying it to
          football is a further extrapolation. Not shown on athlete reports.</p>
      </div>
    </div>`;
}

function togglePrintMenu(e) {
  if (e) e.stopPropagation();
  const m = document.getElementById('printMenu'); if (!m) return;
  m.style.display = (m.style.display === 'none' || !m.style.display) ? 'block' : 'none';
}
document.addEventListener('click', e => {
  const m = document.getElementById('printMenu');
  if (m && m.style.display === 'block' && !e.target.closest('.print-menu-wrap')) m.style.display = 'none';
});

loadData();

// ─── STRENGTH-SPEED QUADRANT ─────────────────────────────────────────────────
// Extensible axis options — add new entries here as tests are added.
// Future option example (when force plate available):
//   { key: 'cmj_peak_power_bw', label: 'CMJ peak power ×BW' }


function applyPreset(x, y) {
  currentXAxis = x; currentYAxis = y;
  const xs = document.getElementById('xAxisSel');
  const ys = document.getElementById('yAxisSel');
  if(xs) xs.value = x;
  if(ys) ys.value = y;
  document.querySelectorAll('.axis-btn').forEach(b => b.classList.remove('active'));
  const match = [...document.querySelectorAll('.axis-btn')].find(b => b.textContent === QUAD_PRESETS.find(p=>p.x===x&&p.y===y)?.name);
  if(match) match.classList.add('active');
  drawQuadrant(x, y);
}

function setQuadAxes(x, y) {
  currentXAxis = x; currentYAxis = y;
  // Clear preset button active states; re-highlight if combination matches a preset
  document.querySelectorAll('.axis-btn').forEach(b => {
    const p = QUAD_PRESETS.find(p=>p.name===b.textContent);
    if(p) b.classList.toggle('active', p.x===x && p.y===y);
  });
  drawQuadrant(x, y);
}

// Keep backward-compat alias
function setStrengthAxis(key) { setQuadAxes(key, currentYAxis); }

function drawQuadrant(xKey, yKey) {
  const container = document.getElementById('quadrantContainer');
  if (!container) return;

  // If a flight-height axis has no data, fall back to the standard height measure
  // (same benchmark band). Track whether a fallback was actually used, for labelling.
  const xDef = QUAD_X_AXES.find(o=>o.key===xKey);
  const yDef = QUAD_Y_AXES.find(o=>o.key===yKey);
  const xFb = xDef?.fb || null;
  const yFb = yDef?.fb || null;
  let xUsedFb = false, yUsedFb = false;
  const xNorm = NORMS[xKey];
  const yNorm = NORMS[yKey];
  if (!xNorm || !yNorm) {
    container.innerHTML=`<p style="padding:20px;color:var(--text-muted)">No normative data for selected axes.</p>`;
    return;
  }

  const yLb = !!yNorm.lb; // true = lower is better (sprint times)

  // Quad labels: use preset if combination matches, else generic
  const preset = QUAD_PRESETS.find(p => p.x===xKey && p.y===yKey);
  const ql = preset ? preset.ql : {
    tl:[`High ${yNorm.label}`, `Low ${xNorm.label}`],
    tr:['Well-rounded','→ Maintain'],
    bl:['Developing','→ Foundation needed'],
    br:[`High ${xNorm.label}`, `Low ${yNorm.label}`]
  };

  const allAthletes = Object.values(athleteMap);
  const points = [];

  allAthletes.forEach(a => {
    const ld = buildLatestAcrossSessions(a.sessions);
    let xv = ld[xKey], yv = ld[yKey];
    if (xv == null && xFb && ld[xFb] != null) { xv = ld[xFb]; xUsedFb = true; }
    if (yv == null && yFb && ld[yFb] != null) { yv = ld[yFb]; yUsedFb = true; }
    if (xv == null || yv == null) return;
    const isCurrent = a.id === selectedId;
    const ini = a.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const trail = [];
    if (isCurrent && a.sessions.length > 1) {
      a.sessions.slice(1).forEach(s => {
        const sx2 = s[xKey] ?? (xFb ? s[xFb] : null);
        const sy2 = s[yKey] ?? (yFb ? s[yFb] : null);
        if(sx2!=null&&sy2!=null) trail.push({xv:sx2,yv:sy2,date:s.test_date});
      });
      trail.reverse();
    }
    points.push({id:a.id,name:a.name,ini,xv,yv,isCurrent,trail});
  });

  const W=580,H=460,ML=56,MR=24,MT=24,MB=56;
  const CW=W-ML-MR, CH=H-MT-MB;

  const xPad=(xNorm.max-xNorm.min)*0.7, yPad=(yNorm.max-yNorm.min)*1.0;
  let xMin=Math.max(0,xNorm.min-xPad), xMax=xNorm.max+xPad;
  let yMin=Math.max(0,yNorm.min-yPad), yMax=yNorm.max+yPad;

  if(points.length){
    const aX=points.map(p=>p.xv), aY=points.map(p=>p.yv);
    const xP=(xMax-xMin)*0.12, yP=(yMax-yMin)*0.12;
    xMin=Math.min(xMin,Math.min(...aX)-xP); xMax=Math.max(xMax,Math.max(...aX)+xP);
    yMin=Math.min(yMin,Math.min(...aY)-yP); yMax=Math.max(yMax,Math.max(...aY)+yP);
  }

  if (xMax===xMin) { xMax = xMin + 1; }
  if (yMax===yMin) { yMax = yMin + 1; }
  const sx = v => ML+(v-xMin)/(xMax-xMin)*CW;
  // Invert Y for lb=true metrics (lower val = higher on chart = better)
  const sy = yLb
    ? v => MT+(v-yMin)/(yMax-yMin)*CH
    : v => MT+CH-(v-yMin)/(yMax-yMin)*CH;

  const xDiv=(xNorm.min+xNorm.max)/2, yDiv=(yNorm.min+yNorm.max)/2;
  const xDivPx=sx(xDiv), yDivPx=sy(yDiv);

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:440px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">`;

  // Quadrant backgrounds (TL=amber, TR=green, BL=red, BR=blue)
  [[ML,MT,xDivPx-ML,yDivPx-MT,'#fff8e1'],[xDivPx,MT,W-MR-xDivPx,yDivPx-MT,'#f0fdf4'],
   [ML,yDivPx,xDivPx-ML,H-MB-yDivPx,'#fef2f2'],[xDivPx,yDivPx,W-MR-xDivPx,H-MB-yDivPx,'#eff6ff']]
    .forEach(([x,y,w,h,fill])=>{s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" opacity="0.75"/>`;});

  // Norm band overlays
  s+=`<rect x="${sx(xNorm.min)}" y="${MT}" width="${sx(xNorm.max)-sx(xNorm.min)}" height="${CH}" fill="rgba(26,86,219,0.04)"/>`;
  const yNormTop=sy(yLb?yNorm.min:yNorm.max), yNormBot=sy(yLb?yNorm.max:yNorm.min);
  s+=`<rect x="${ML}" y="${yNormTop}" width="${CW}" height="${yNormBot-yNormTop}" fill="rgba(26,86,219,0.04)"/>`;

  // Norm boundary dashes
  [sx(xNorm.min),sx(xNorm.max)].forEach(px=>{s+=`<line x1="${px}" y1="${MT}" x2="${px}" y2="${H-MB}" stroke="rgba(26,86,219,0.2)" stroke-width="1" stroke-dasharray="3,3"/>`;});
  [sy(yLb?yNorm.min:yNorm.max),sy(yLb?yNorm.max:yNorm.min)].forEach(py=>{s+=`<line x1="${ML}" y1="${py}" x2="${W-MR}" y2="${py}" stroke="rgba(26,86,219,0.2)" stroke-width="1" stroke-dasharray="3,3"/>`;});

  // Main dividers
  s+=`<line x1="${xDivPx}" y1="${MT}" x2="${xDivPx}" y2="${H-MB}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>`;
  s+=`<line x1="${ML}" y1="${yDivPx}" x2="${W-MR}" y2="${yDivPx}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>`;

  // Border
  s+=`<rect x="${ML}" y="${MT}" width="${CW}" height="${CH}" fill="none" stroke="#e4e6ea" stroke-width="1"/>`;

  // Quadrant labels — TL, TR, BL, BR
  [
    [ql.tl[0],ql.tl[1], ML+8,   MT+16,  'start'],
    [ql.tr[0],ql.tr[1], W-MR-8, MT+16,  'end'  ],
    [ql.bl[0],ql.bl[1], ML+8,   H-MB-8, 'start'],
    [ql.br[0],ql.br[1], W-MR-8, H-MB-8, 'end'  ],
  ].forEach(([title,sub,x,y,anchor])=>{
    s+=`<text x="${x}" y="${y}"    font-size="10" font-weight="600" fill="#64748b" text-anchor="${anchor}">${title}</text>`;
    s+=`<text x="${x}" y="${y+13}" font-size="9"  fill="#94a3b8"   text-anchor="${anchor}">${sub}</text>`;
  });

  // Axis ticks
  for(let i=0;i<=5;i++){
    const vx=xMin+(xMax-xMin)*i/5, px=sx(vx);
    s+=`<line x1="${px}" y1="${H-MB}" x2="${px}" y2="${H-MB+4}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${px}" y="${H-MB+15}" font-size="9" text-anchor="middle" fill="#7a8290">${vx.toFixed(1)}</text>`;
    const vy=yMin+(yMax-yMin)*i/5, py=sy(vy);
    s+=`<line x1="${ML-4}" y1="${py}" x2="${ML}" y2="${py}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${ML-7}" y="${py+3}" font-size="9" text-anchor="end" fill="#7a8290">${vy.toFixed(1)}</text>`;
  }

  // Axis labels (Y label notes inversion for lb metrics)
  const yAxisLabel = (yLb ? `${yNorm.label} (${yNorm.u}) ← lower=better` : `${yNorm.label} (${yNorm.u})`)
    + (yUsedFb ? ` — using ${NORMS[yFb].label}` : '');
  const xAxisLabel = `${xNorm.label} (${xNorm.u})` + (xUsedFb ? ` — using ${NORMS[xFb].label}` : '');
  s+=`<text x="${ML+CW/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="#444c56" font-weight="500">${xAxisLabel}</text>`;
  s+=`<text x="11" y="${MT+CH/2}" font-size="11" text-anchor="middle" fill="#444c56" font-weight="500" transform="rotate(-90,11,${MT+CH/2})">${yAxisLabel}</text>`;

  // Anonymous other athletes
  points.filter(p=>!p.isCurrent).forEach(p=>{
    s+=`<circle cx="${sx(p.xv)}" cy="${sy(p.yv)}" r="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" opacity="0.65"/>`;
  });

  // Selected athlete
  const cur=points.find(p=>p.isCurrent);
  if(cur){
    // Trail
    if(cur.trail.length>0){
      const allT=[...cur.trail,{xv:cur.xv,yv:cur.yv}];
      s+=`<path d="${allT.map((p,i)=>`${i===0?'M':'L'}${sx(p.xv).toFixed(1)},${sy(p.yv).toFixed(1)}`).join(' ')}" fill="none" stroke="#1a56db" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>`;
      cur.trail.forEach(p=>{s+=`<circle cx="${sx(p.xv)}" cy="${sy(p.yv)}" r="5" fill="#bfdbfe" stroke="#1a56db" stroke-width="1.5" opacity="0.55"/>`;});
    }
    const dotCol=sidebarCol(buildLatestAcrossSessions(athleteMap[selectedId]?.sessions||[]));
    const px=sx(cur.xv), py=sy(cur.yv);
    s+=`<circle cx="${px}" cy="${py}" r="12" fill="${dotCol}" stroke="#fff" stroke-width="2.5"/>`;
    s+=`<text x="${px}" y="${py+4}" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">${cur.ini}</text>`;
    const lx=px+16>W-MR-90?px-16:px+16, la=px+16>W-MR-90?'end':'start', ly=py-10<MT+20?py+22:py-10;
    s+=`<text x="${lx}" y="${ly}"    font-size="11" text-anchor="${la}" fill="#0d1117" font-weight="600">${cur.name}</text>`;
    s+=`<text x="${lx}" y="${ly+13}" font-size="10" text-anchor="${la}" fill="#7a8290">${cur.xv}${xNorm.u} · ${cur.yv}${yNorm.u}</text>`;
  } else {
    // Name exactly which axis is missing so it's actionable
    const selA = athleteMap[selectedId];
    const selLd = selA ? buildLatestAcrossSessions(selA.sessions) : {};
    const missing = [];
    if (selLd[xKey] == null && !(xFb && selLd[xFb] != null)) missing.push(xNorm.label);
    if (selLd[yKey] == null && !(yFb && selLd[yFb] != null)) missing.push(yNorm.label);
    const msg = missing.length
      ? `Missing: ${missing.join(' and ')}`
      : 'No data for this athlete on selected axes.';
    s+=`<text x="${ML+CW/2}" y="${MT+CH/2-14}" font-size="13" text-anchor="middle" fill="#7a8290" font-weight="600">${msg}</text>`;
    s+=`<text x="${ML+CW/2}" y="${MT+CH/2+8}" font-size="11" text-anchor="middle" fill="#94a3b8">Add to your Google Sheet, or pick different axes above.</text>`;
    // List axes this athlete DOES have data for
    const haveX = QUAD_X_AXES.filter(o=>selLd[o.key]!=null).map(o=>o.label);
    const haveY = QUAD_Y_AXES.filter(o=>selLd[o.key]!=null).map(o=>o.label);
    if (haveX.length && haveY.length) {
      s+=`<text x="${ML+CW/2}" y="${MT+CH/2+30}" font-size="10" text-anchor="middle" fill="#94a3b8">Available X: ${haveX.join(', ')}</text>`;
      s+=`<text x="${ML+CW/2}" y="${MT+CH/2+45}" font-size="10" text-anchor="middle" fill="#94a3b8">Available Y: ${haveY.join(', ')}</text>`;
    }
  }

  s+='</svg>';
  container.innerHTML=s;
}
</script>
