// Every section opens the same way: icon + eyebrow, heading, one lead line.
function secHead(icon, eb, title, lead){
  return `<div class="sechd">${ebrow(icon, eb)}<h2 class="h2">${title}</h2>`
       + (lead ? `<p class="lead">${lead}</p>` : '') + `</div>`;
}
function callout(text){
  return `<div class="callout">${ICO.bulb}<div>${text}</div></div>`;
}

// ─── READINESS RING ───────────────────────────────────────────────────────────
// Four arcs, one per performance domain, each filled to that domain's mean
// benchmark score out of 4. The centre carries the overall score.
const RING_CATS = [
  { key:'jump',     label:'Power',    keys:['broad_jump','slbj_LSI','triple_hop','triple_hop_LSI','cmj','sj','eur','cmj_mrsi','cmj_con_force','dj','dj_rsi','dsi'] },
  { key:'speed',    label:'Speed',    keys:['sprint10','sprint20','max_vel'] },
  { key:'strength', label:'Strength', keys:['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw','imtp'] },
  { key:'aero',     label:'Aerobic',  keys:['mas','vo2max','yoyo_ir2','bronco'] },
];
function catMean(keys, ld){
  const sc = keys.map(k=>bs(ld[k],k)).filter(v=>v!==null);
  return sc.length ? sc.reduce((x,y)=>x+y,0)/sc.length : null;
}
function _pxy(cx,cy,r,deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function _arc(cx,cy,r,a0,a1){
  const [x0,y0]=_pxy(cx,cy,r,a0), [x1,y1]=_pxy(cx,cy,r,a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function readinessRing(ld){
  const S=260, c=S/2, r=78, GAP=7;
  let svg=`<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="Benchmark readiness by domain">`;
  const means=[];
  RING_CATS.forEach((cat,i)=>{
    const m = catMean(cat.keys, ld); means.push(m);
    const a0 = i*90 + GAP/2, a1 = (i+1)*90 - GAP/2;
    svg += `<path d="${_arc(c,c,r,a0,a1)}" fill="none" stroke="rgba(175,208,232,.16)" stroke-width="11" stroke-linecap="round"/>`;
    if (m!==null){
      const end = a0 + (a1-a0)*Math.max(0.04, m/4);
      const col = SCORE_COLS[Math.max(0,Math.min(4,Math.round(m)))];
      svg += `<path d="${_arc(c,c,r,a0,end)}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"/>`;
    }
    const [lx,ly]=_pxy(c,c,r+22,(a0+a1)/2);
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="#9E9C96" font-size="8.5" font-weight="600"
      letter-spacing="1.4" text-anchor="middle" dominant-baseline="middle">${cat.label.toUpperCase()}</text>`;
  });
  const valid = means.filter(m=>m!==null);
  const overall = valid.length ? valid.reduce((x,y)=>x+y,0)/valid.length : null;
  svg += `<text x="${c}" y="${c-4}" fill="#fff" font-size="34" font-weight="500" letter-spacing="-1"
    text-anchor="middle" dominant-baseline="middle">${overall!==null?overall.toFixed(1):'—'}</text>`;
  svg += `<text x="${c}" y="${c+20}" fill="#9E9C96" font-size="8.5" font-weight="600" letter-spacing="1.6"
    text-anchor="middle" dominant-baseline="middle">OF 4</text>`;
  svg += `</svg>`;
  return { svg, overall };
}

// ─── RESULT ROWS ──────────────────────────────────────────────────────────────
let inspectKey = null;

function barHtml(val, nk, withValue){
  const n = NORMS[nk];
  const rv = withValue ? `<span class="rv">${val}<small>${n&&n.u?n.u:''}</small></span>` : '';
  if (!n || n.noNorm || n.min==null || val==null)
    return `<div class="bar"><div class="trk"></div>${rv}
      <span class="cx" style="left:0;transform:none">Tracked individually</span></div>`;
  const span = (n.max - n.min) || Math.abs(n.max||1)*0.2 || 1;
  const lo = n.min - span*0.95, hi = n.max + span*0.95;
  // leave the right-hand slice clear so the value label never sits on the bar
  const pc = v => Math.max(0, Math.min(100, (v-lo)/(hi-lo)*100)) * 0.76;
  const b0 = pc(n.min), b1 = pc(n.max), mid = pc((n.min+n.max)/2);
  const sc = bs(val, nk);
  const col = sc===null ? '#2A4FB7' : SCORE_COLS[sc];
  return `<div class="bar">`
    + `<span class="cx lo" style="left:${b0.toFixed(1)}%;transform:translateX(-50%)">${n.min}</span>`
    + `<span class="cx hi" style="left:${b1.toFixed(1)}%;right:auto;transform:translateX(-50%)">${n.max}</span>`
    + `<div class="trk" style="right:26%"></div>`
    + `<div class="band" style="left:${b0.toFixed(1)}%;width:${(b1-b0).toFixed(1)}%"></div>`
    + `<div class="tick" style="left:${mid.toFixed(1)}%"></div>`
    + `<div class="mk" style="left:${pc(val).toFixed(1)}%;background:${col}"></div>`
    + rv + `</div>`;
}
function chgHtml(val, prev, lb){
  if (val==null||prev==null||prev===0) return '<span class="cbadge none">·</span>';
  const d = (val-prev)/Math.abs(prev)*100;
  const pct = `${d>0?'+':''}${d.toFixed(1)}%`;
  if (Math.abs(d) < 0.5)
    return `<span class="cbadge" title="${pct}">=</span><em class="cpct flat">${pct}</em>`;
  const imp = lb ? d<0 : d>0;
  return `<span class="cbadge ${imp?'on':'off'}" title="${pct}">${imp?'\u25B2':'\u25BC'}</span>`
       + `<em class="cpct ${imp?'up':'down'}">${pct}</em>`;
}
function vRow(nk, val, prev, sub){
  const n = NORMS[nk]; if (!n || val==null) return '';
  const dsrc = _rDateSrc[nk];
  const stale = dsrc && _rLatestDate && dsrc !== _rLatestDate ? `tested ${dsrc}` : '';
  const note  = [sub, stale].filter(Boolean).join(' · ');
  return `<button class="row" type="button" data-k="${nk}" aria-pressed="${inspectKey===nk}" onclick="inspect('${nk}')">
    <span class="lbl">${n.label}${note?`<small>${note}</small>`:''}</span>
    ${barHtml(val, nk, true)}
    <span class="chg">${chgHtml(val, prev, n.lb)}</span>
  </button>`;
}

function inspect(nk){
  inspectKey = nk;
  document.querySelectorAll('.row[data-k]').forEach(r =>
    r.setAttribute('aria-pressed', String(r.dataset.k === nk)));
  drawInspector(nk);
}

function isDarkSection(id){
  const el = document.getElementById(id);
  return !!(el && el.closest('.sec.dark'));
}
function drawInspector(nk){
  const box = document.getElementById('inspector'); if(!box) return;
  const a = athleteMap[selectedId]; const n = NORMS[nk];
  if (!a || !n){ box.innerHTML=''; return; }
  const pts = [...a.sessions].reverse()
    .map(s => ({ d:s.test_date, v:s[nk] })).filter(p => p.v!=null);
  const cur = pts.length ? pts[pts.length-1].v : null;
  const sc  = bs(cur, nk);

  const W=360, H=172, PL=42, PR=16, PT=18, PB=30;
  let chart;
  if (!pts.length){
    chart = `<p class="note">No recorded value for this test yet.</p>`;
  } else {
    const vals = pts.map(p=>p.v).concat(n.noNorm?[]:[n.min,n.max]);
    let lo=Math.min(...vals), hi=Math.max(...vals);
    const pad=(hi-lo)*0.22 || Math.abs(hi)*0.1 || 1; lo-=pad; hi+=pad;
    const X = i => PL + (pts.length===1 ? (W-PL-PR)/2 : i*(W-PL-PR)/(pts.length-1));
    const Y = v => PT + (H-PT-PB) * (1 - (v-lo)/(hi-lo));
    const dk = isDarkSection('inspector');
    const rule = dk ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.14)';
    const tint = dk ? '#A6A39D' : '#8A8883';
    let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${n.label} over time">`
      + `<defs><linearGradient id="ffg" x1="0" y1="0" x2="1" y2="0">`
      + `<stop offset="0%" stop-color="${dk?GRAD[1]:GRAD[0]}"/><stop offset="55%" stop-color="${dk?'#8FA9ED':GRAD[1]}"/>`
      + `<stop offset="100%" stop-color="${dk?'#DCE4F8':GRAD[2]}"/></linearGradient></defs>`;

    // bracket frame, as the report's charts
    const BX0=PL-14, BX1=W-PR+14, BY0=PT-10, BY1=H-PB+8, BW=9;
    g += `<path d="M${BX0+BW} ${BY0} H${BX0} V${BY1} H${BX0+BW}" fill="none" stroke="${rule}" stroke-width="1"/>`
       + `<path d="M${BX1-BW} ${BY0} H${BX1} V${BY1} H${BX1-BW}" fill="none" stroke="${rule}" stroke-width="1"/>`;

    // hairline gridlines with tick dots
    for (let r=0; r<=3; r++){
      const y = PT + (H-PT-PB)*r/3;
      g += `<line x1="${PL}" x2="${W-PR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${rule}" stroke-width=".5" opacity=".65"/>`;
      for (let c=0;c<=4;c++){
        const x = PL + (W-PL-PR)*c/4;
        g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r=".9" fill="${rule}"/>`;
      }
    }

    // professional range: translucent blue with a dotted lower threshold
    if (!n.noNorm && n.min!=null){
      const yTop=Y(n.max), yBot=Y(n.min);
      g += `<rect x="${PL}" y="${Math.min(yTop,yBot).toFixed(1)}" width="${W-PL-PR}"
             height="${Math.abs(yBot-yTop).toFixed(1)}" fill="${GRAD[1]}" opacity="${dk?.14:.12}"/>`;
      g += `<line x1="${PL}" x2="${W-PR}" y1="${yBot.toFixed(1)}" y2="${yBot.toFixed(1)}"
             stroke="${GRAD[1]}" stroke-width="1" stroke-dasharray="2,3" opacity=".8"/>`;
      g += `<text x="${PL+2}" y="${(yBot-5).toFixed(1)}" fill="${tint}" font-size="6.5"
             letter-spacing="1.1">STANDARD</text>`;
    }

    // round the axis labels to the precision the metric is actually read at
    const dp = (hi-lo) < 2 ? 2 : (hi-lo) < 20 ? 1 : 0;
    [hi-pad*0.15, lo+pad*0.15].forEach(v => {
      g += `<text x="${PL-9}" y="${Y(v).toFixed(1)}" fill="${tint}" font-size="7.5" text-anchor="end"
             dominant-baseline="middle">${v.toFixed(dp)}</text>`;
    });

    if (pts.length>1){
      g += `<polyline fill="none" stroke="url(#ffg)" stroke-width="2.6" stroke-linecap="round"
             stroke-linejoin="round" points="${pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}"/>`;
    }
    pts.forEach((p,i) => {
      const last = i===pts.length-1;
      if (last) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="9"
                       fill="${dk?'#8FA9ED':GRAD[0]}" opacity=".22"/>`;
      g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?4.6:3}"
             fill="${last?(dk?'#8FA9ED':GRAD[0]):(dk?'#2A2A2A':'#FFFFFF')}" stroke="${dk?'#8FA9ED':GRAD[0]}" stroke-width="1.5"/>`;
      if (i===0 || last){
        g += `<text x="${X(i).toFixed(1)}" y="${H-9}" fill="${tint}" font-size="7" letter-spacing=".9"
               text-anchor="${pts.length>1?(last?'end':'start'):'middle'}">${p.d.toUpperCase()}</text>`;
      }
    });
    g += `</svg>`;
    chart = g;
  }

  const range = n.noNorm || n.min==null ? 'No validated professional norm'
              : `${n.min}–${n.max} ${n.u||''}`;
  box.innerHTML = `
    <div class="eb">Inspecting</div>
    <h3>${n.label}</h3>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap">
      <span class="big">${cur??'—'}<small>${n.u||''}</small></span>
      ${sc!==null?`<span class="chip c-s${sc}">${SL[sc]}</span>`:''}
    </div>
    ${chart}
    <div class="tleg"><span><i style="background:linear-gradient(90deg,${GRAD[0]},${GRAD[2]})"></i>Professional range ${range}</span></div>
    ${n.note?`<p class="note">${n.note}</p>`:''}
    ${n.source?`<p class="src coachonly">Source: ${n.source}</p>`:''}`;
}

// ─── SECTION NAV ──────────────────────────────────────────────────────────────
let _secObserver = null;
function buildSecNav(){
  const nav = document.getElementById('secnav'), inner = document.getElementById('secnavInner');
  if(!nav||!inner) return;
  const secs = [...document.querySelectorAll('main .sec[id]')]
    .filter(s => !(viewMode==='athlete' && s.classList.contains('coachonly')));
  if(!secs.length){ nav.setAttribute('hidden',''); return; }
  nav.removeAttribute('hidden');
  inner.innerHTML = secs.map(s => `<a href="#${s.id}">${s.dataset.nav||s.id}</a>`).join('');
  if (_secObserver) _secObserver.disconnect();
  _secObserver = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      inner.querySelectorAll('a').forEach(l =>
        l.classList.toggle('on', l.getAttribute('href') === '#'+e.target.id));
    });
  }, { rootMargin:'-60px 0px -70% 0px' });
  secs.forEach(s => _secObserver.observe(s));
}

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────
function renderMain(){
  const a = athleteMap[selectedId]; if(!a) return;
  _rSessions = a.sessions;
  const latestSession = a.sessions[0];

  if (!a.sessions.length){
    document.getElementById('hero').innerHTML =
      `<div class="heroGrid"><div><div class="eb">Athlete</div><h1>${a.name}</h1>
       <p class="sub">No test sessions recorded yet. Add a row to the Results tab of your sheet.</p></div><div></div></div>`;
    document.getElementById('main').innerHTML = '';
    document.getElementById('secnav')?.setAttribute('hidden','');
    return;
  }

  const d = { ...buildLatestAcrossSessions(a.sessions),
    test_date: latestSession?.test_date, notes: latestSession?.notes, weight_kg: latestSession?.weight_kg };
  const dateSrcMain = {};
  Object.keys(NORMS).forEach(k => { for(const s of a.sessions){ if(s[k]!=null){ dateSrcMain[k]=s.test_date; break; } } });
  _rDateSrc = dateSrcMain; _rLatestDate = latestSession?.test_date;
  const prevVal = k => { for(let i=1;i<a.sessions.length;i++){ if(a.sessions[i][k]!=null) return a.sessions[i][k]; } return null; };

  // every scored metric, with its change since the last session that recorded it
  const scoredPre = Object.keys(NORMS).filter(k=>d[k]!=null && bs(d[k],k)!==null)
    .map(k => { const p=prevVal(k);
      const ch = (p!=null&&p!==0)?((d[k]-p)/Math.abs(p)*100):null;
      return { k, v:d[k], s:bs(d[k],k), ch, imp: ch===null?null:(NORMS[k].lb?ch<0:ch>0) }; })
    .sort((x,y)=>y.s-x.s);

  const ring = readinessRing(d);

  // ── HIGHLIGHT TILES ─────────────────────────────────────────────────────
  const scored = scoredPre;
  const gains  = scored.filter(m=>m.imp===true).sort((x,y)=>Math.abs(y.ch)-Math.abs(x.ch));
  const worst  = [...scored].sort((x,y)=>x.s-y.s)[0];
  const atOrAbove = scored.filter(m=>m.s>=3).length;
  // The at-a-glance numbers now live in the hero rather than in a section of
  // their own, which was repeating what the highlight cards already say.
  const heroStats = [
    ['Readiness',     ring.overall!==null?ring.overall.toFixed(1)+' / 4':'—'],
    ['Standards met', `${atOrAbove} / ${scored.length}`],
    ['Biggest gain',  gains.length?`${gains[0].ch>0?'+':''}${gains[0].ch.toFixed(1)}%`:'—'],
    ['Primary focus', worst?NORMS[worst.k].label:'—'],
  ].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');

  // One closing takeaway per highlight section, in plain language.
  const inSet = keys => scored.filter(m=>keys.includes(m.k));
  function setCallout(keys){
    const ms = inSet(keys); if (!ms.length) return '';
    const tops = ms.filter(m=>m.s>=4), gaps = ms.filter(m=>m.s<=1);
    const bits = [];
    if (tops.length) bits.push(`<b>${tops.map(m=>NORMS[m.k].label).join('</b>, <b>')}</b> ${tops.length>1?'are':'is'} above the professional range`);
    if (gaps.length) bits.push(`<b>${gaps.map(m=>NORMS[m.k].label).join('</b>, <b>')}</b> ${gaps.length>1?'are':'is'} the clearest gap to close`);
    if (!bits.length) return callout('Everything in this group sits inside the professional range.');
    return callout(bits.join('. ') + '.');
  }
  const powerCallout = setCallout(HIGHLIGHT_SETS[0].keys);
  const speedCallout = setCallout(HIGHLIGHT_SETS[1].keys);

  // ── HERO ────────────────────────────────────────────────────────────────
  const overallChip = ring.overall===null ? '' :
    (()=>{ const cl=catLabel(ring.overall); const idx=ring.overall>=3.5?4:ring.overall>=2.5?3:ring.overall>=1.5?1:0;
           return `<span class="chip c-s${idx}">${cl.l}</span>`; })();
  const meta = [
    ['Position', a.position||'—'],
    ['Age', a.age?a.age+' yrs':'—'],
    ['Height', a.height_cm?a.height_cm+' cm':'—'],
    ['Weight', (d.weight_kg||a.weight_kg)?((d.weight_kg||a.weight_kg)+' kg'):'—'],
    ['Last tested', d.test_date||'—'],
    ['Sessions', String(a.sessions.length)],
  ].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');

  // Opening sentence, written from the numbers — the report leads with plain
  // language before it shows a single chart.
  const B = v => `<b>${v}</b>`;
  const sent = [];
  if (d.max_vel!=null) sent.push(`topped out at ${B(d.max_vel+' m/s')}`);
  else if (d.sprint10!=null) sent.push(`ran ${B(d.sprint10+'s')} over 10 m`);
  if (d.cmj!=null) sent.push(`jumped ${B(d.cmj+' cm')}`);
  if (d.mas!=null) sent.push(`held ${B(d.mas+' m/s')} MAS`);
  const bestLift = [['sq_1rm_bw','back squat'],['tb_1rm_bw','trap bar'],['bp_1rm_bw','bench']]
    .filter(([k])=>d[k]!=null).sort((x,y)=>bs(d[y[0]],y[0])-bs(d[x[0]],x[0]))[0];
  if (bestLift) sent.push(`pulled ${B(d[bestLift[0]]+'×BW')} on the ${bestLift[1]}`);
  const lead = sent.length
    ? `In the ${d.test_date||'latest'} block you ${sent.slice(0,3).join(', ')}.`
    : 'Add results to this athlete to build the report.';
  const standout = (()=>{
    const best = scoredPre.filter(m=>m.s>=4)[0];
    return best ? ` Above the professional standard for <span class="hl-blue">${NORMS[best.k].label}</span>.` : '';
  })();

  document.getElementById('hero').innerHTML = `
    <div class="heroGrid">
      <div>
        <div class="eb">Performance report · ${d.test_date||'—'} · ${getConfig().coachName||'FootballFit'}</div>
        <h1>${a.name}</h1>
        <p class="sub">${lead}${standout}</p>
        <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
          ${overallChip}
          ${a.injury_hx?`<span class="chip c-s2">${a.injury_hx}</span>`:''}
        </div>
        <div class="meta">${meta}</div>
        <div class="meta" style="margin-top:22px;padding-top:20px;border-top:1px solid #343434">${heroStats}</div>
        ${d.notes?`<div class="hnote">${ICO.note}<div><div class="eb">Session note</div><p>${d.notes}</p></div></div>`:''}
      </div>
      <div class="ringBox">
        ${ring.svg}
        <p class="rcap">Mean benchmark score per domain</p>
      </div>
    </div>`;

  // ── RESULT GROUPS ───────────────────────────────────────────────────────
  const GROUPS = [
    { name:'Jump / Power', rows:[
      ['broad_jump'], ['slbj_L'], ['slbj_R'], ['slbj_LSI'],
      ['triple_hop'], ['triple_hop_L'], ['triple_hop_R'], ['triple_hop_LSI'], ['triple_hop_norm'],
      ['cmj'], ['sj'], ['cmj_flight'], ['sj_flight'],
      ['cmj_con_force', d.cmj_con_force_N!=null?`${d.cmj_con_force_N} N raw`:''],
      ['eur','CMJ ÷ SJ'],
      ['cmj_mrsi', (d.cmj!=null&&d.cmj_ct_ms!=null)?`${d.cmj}cm ÷ ${d.cmj_ct_ms}ms`:''],
      ['dj'], ['dj_rsi', (d.dj!=null&&d.dj_ct_ms!=null)?`${d.dj}cm ÷ ${d.dj_ct_ms}ms`:''], ['dsi'],
    ]},
    { name:'Aerobic', rows:[
      ['mas', d.mas_src?`from ${d.mas_src}${d.mas?` · ${(d.mas*3.6).toFixed(1)} km/h`:''}`:''],
      ['vo2max','estimated'], ['yoyo_ir2'], ['bronco'],
    ]},
    { name:'Strength — lifts', rows:[
      ['sq_1rm_bw', d.sq_kg_raw?`${d.sq_kg_raw}kg × ${d.sq_reps_raw} → est. 1RM ${d.sq_1rm}kg`:''],
      ['tb_1rm_bw', d.tb_kg_raw?`${d.tb_kg_raw}kg × ${d.tb_reps_raw} → est. 1RM ${d.tb_1rm}kg`:''],
      ['bp_1rm_bw', d.bp_kg_raw?`${d.bp_kg_raw}kg × ${d.bp_reps_raw} → est. 1RM ${d.bp_1rm}kg`:''],
      ['imtp', d.imtp_raw_N?`${d.imtp_raw_N} N peak force`:''],
    ]},
    { name:'Speed', rows:[ ['sprint10'], ['sprint20'], ['max_vel'] ]},
  ];

  const untested = [];
  const groupHtml = GROUPS.map(g => {
    const body = g.rows.map(([k,sub]) => {
      if (!NORMS[k]) return '';
      if (d[k]==null){ untested.push(k); return ''; }
      return vRow(k, d[k], prevVal(k), sub);
    }).join('');
    return body ? `<div class="ghead">${g.name}</div>${body}` : '';
  }).join('');

  const untestedHtml = untested.length ? `<details><summary>Not recorded this block (${untested.length})</summary>
    <p class="lead" style="margin-top:10px;font-size:12.5px">${untested.map(k=>{
      const n=NORMS[k]; const hint = n.note?` — ${n.note}`:'';
      return `<b>${n.label}</b>${hint}`;
    }).join(' · ')}</p></details>` : '';

let CI={};
function mkChart(id,labels,datasets,yLabel,nMin,nMax){
  if(CI[id]){CI[id].destroy();delete CI[id];}
  const el=document.getElementById(id); if(!el)return;
  const allV=datasets.flatMap(d=>d.data).filter(v=>v!=null&&!isNaN(v));
  if(!allV.length){el.parentElement.style.display='none';return;}
  el.parentElement.style.display='';
  // Primary series is stroked with the house gradient (navy into near-white,
  // left to right). A second series keeps a solid mid-slate + dash so L/R and
  // CMJ/SJ pairs stay tellable apart.
  const g = el.getContext('2d').createLinearGradient(0,0,el.offsetWidth||420,0);
  g.addColorStop(0,   GRAD[0]);
  g.addColorStop(0.55,GRAD[1]);
  g.addColorStop(1,   GRAD[2]);
  datasets.forEach((ds,i) => {
    if (i===0){ ds.borderColor=g; ds.backgroundColor=GRAD[0]; ds.pointBackgroundColor=GRAD[0]; ds.pointBorderColor=GRAD[0]; }
    else { ds.borderColor=GRAD[3]; ds.backgroundColor=GRAD[3]; ds.pointBackgroundColor=GRAD[3]; ds.pointBorderColor=GRAD[3];
           if(!ds.borderDash||!ds.borderDash.length) ds.borderDash=[5,3]; }
  });
  const hasNorm=nMin!=null&&nMax!=null;
  const dMin=hasNorm?Math.min(...allV,nMin):Math.min(...allV);
  const dMax=hasNorm?Math.max(...allV,nMax):Math.max(...allV);
  const pad=(dMax-dMin)*0.22;
  const bandDS=hasNorm?[
    {label:'_nu',data:labels.map(()=>nMax),borderColor:'transparent',backgroundColor:'rgba(30,68,176,0.09)',fill:'+1',pointRadius:0,tension:0,borderWidth:0},
    {label:'_nl',data:labels.map(()=>nMin),borderColor:'rgba(30,68,176,0.34)',backgroundColor:'transparent',fill:false,pointRadius:0,tension:0,borderDash:[4,3],borderWidth:1.5}
  ]:[];
  CI[id]=new Chart(el.getContext('2d'),{
    type:'line',
    data:{labels,datasets:bandDS.concat(datasets)},
    options:{
      responsive:true,maintainAspectRatio:true,aspectRatio:1.9,
      plugins:{
        legend:{display:datasets.length>1,position:'bottom',labels:{font:{size:9},boxWidth:9,padding:9,filter:i=>!i.text.startsWith('_')}},
        tooltip:{filter:i=>!i.dataset.label.startsWith('_'),callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y} ${yLabel}`}}
      },
      scales:{
        x:{ticks:{font:{size:8.5}},grid:{display:false}},
        y:{min:+(dMin-pad).toFixed(2),max:+(dMax+pad).toFixed(2),ticks:{font:{size:8.5},maxTicksLimit:4},grid:{color:'rgba(0,0,0,0.08)'},title:{display:true,text:(yLabel||'').toUpperCase(),font:{size:8},color:'#8A8883'}}
      }
    }
  });
}
// Value label plugin — passed directly into each chart instance (more reliable than Chart.register in CJ4)
const ValueLabelPlugin = {
  id:'valueLabels',
  afterDatasetsDraw(chart){
    const ctx=chart.ctx;
    chart.data.datasets.forEach((ds,i)=>{
      if(!ds.label||ds.label.startsWith('_'))return;
      const meta=chart.getDatasetMeta(i);
      if(meta.hidden)return;
      meta.data.forEach((pt,j)=>{
        const v=ds.data[j];
        if(v==null||isNaN(v))return;
        const disp=typeof v==='number'
          ?(v<5&&!Number.isInteger(v)?v.toFixed(2):v%1!==0?v.toFixed(1):String(v))
          :String(v);
        ctx.save();
        ctx.font="500 9px 'Neue Haas Display',-apple-system,BlinkMacSystemFont,sans-serif";
        ctx.fillStyle='#5F5D58';
        ctx.textAlign='center';
        ctx.textBaseline='bottom';
        ctx.fillText(disp,pt.x,pt.y-5);
        ctx.restore();
      });
    });
  }
};

function ls(col,dash=[]){return{borderColor:col,backgroundColor:col,fill:false,tension:0.3,pointRadius:4,pointHoverRadius:6,borderWidth:2,borderDash:dash,spanGaps:true};}

function drawCharts(){
  const a=athleteMap[selectedId]; if(!a||!a.sessions.length)return;
  const sessions=[...a.sessions].reverse();
  const ld=buildLatestAcrossSessions(a.sessions); // for dynamic chart titles
  const singleSession = sessions.length === 1;
  // For single-session athletes, pad x-axis with empty labels so the
  // normative band fills the chart and the dot sits centred — no connecting line.
  const lb = singleSession
    ? ['', sessions[0].test_date, '']
    : sessions.map(s=>s.test_date);
  const ser=(key,col,dash=[])=>({label:NORMS[key]?.label||key,...ls(col,dash),
    data: singleSession
      ? [null, sessions[0][key], null]   // null edges = no connecting line
      : sessions.map(s=>s[key])
  });

  const charts=[
    {id:'ch-broadjump',  title:'Broad jump',  u:'cm', nk:'broad_jump',  ds:[ser('broad_jump',CC[0])]},
    {id:'ch-thlr', title:`Triple Hop — L vs R${ld.triple_hop_LSI!=null?' (LSI: '+ld.triple_hop_LSI+'%)':''}`, u:'cm', nk:null, nMin:null, nMax:null, ds:[ser('triple_hop_L',CC[0]),ser('triple_hop_R',CC[1],[5,3])]},
    {id:'ch-triplehop',  title:'Triple hop (best leg)',  u:'cm', nk:'triple_hop',  ds:[ser('triple_hop',CC[2])]},
    {id:'ch-lsi', title:`SL Broad Jump — L vs R${ld.slbj_LSI!=null?' (LSI: '+ld.slbj_LSI+'%)':''}`, u:'cm', nk:null, nMin:null, nMax:null, ds:[ser('slbj_L',CC[0]),ser('slbj_R',CC[1],[5,3])]},
    {id:'ch-cmj',    title:'CMJ / SJ heights',        u:'cm',   nk:'cmj',         ds:[ser('cmj',CC[0]),ser('sj',CC[1],[5,3])]},
    {id:'ch-conforce', title:'CMJ concentric force',   u:'N/kg', nk:'cmj_con_force', ds:[ser('cmj_con_force',CC[5])]},
    {id:'ch-eur',    title:'EUR (CMJ÷SJ)',             u:'ratio',nk:'eur',         ds:[ser('eur',CC[3])]},
    {id:'ch-mrsi',   title:'CMJ mRSI',                u:'m/s',  nk:'cmj_mrsi',    ds:[ser('cmj_mrsi',CC[0])]},
    {id:'ch-djrsi',  title:'DJ RSI',                  u:'m/s',  nk:'dj_rsi',      ds:[ser('dj_rsi',CC[4])]},
    {id:'ch-mas',    title:'MAS',          u:'m/s',  nk:'mas',         ds:[ser('mas',CC[3])]},
    {id:'ch-squat', title:'Back squat (×BW)',    u:'×BW', nk:'sq_1rm_bw', ds:[ser('sq_1rm_bw',CC[4])]},
    {id:'ch-tb',    title:'Trap bar DL (×BW)',   u:'×BW', nk:'tb_1rm_bw', ds:[ser('tb_1rm_bw',CC[5])]},
    {id:'ch-bp',    title:'Bench press (×BW)',   u:'×BW', nk:'bp_1rm_bw', ds:[ser('bp_1rm_bw',CC[6])]},
    {id:'ch-sprint10', title:'10m sprint', u:'s', nk:'sprint10', ds:[ser('sprint10',CC[0])]},
    {id:'ch-sprint20', title:'20m sprint', u:'s', nk:'sprint20', ds:[ser('sprint20',CC[1])]},
    {id:'ch-vel',    title:'Max velocity (20m fly)',  u:'m/s',  nk:'max_vel',     ds:[ser('max_vel',CC[4])]},
  ];

  const grid=document.getElementById('chartGrid'); if(!grid)return;
  grid.innerHTML=charts.map(ch=>`<div class="chart-wrap" id="wrap-${ch.id}"><div class="chart-title">${ch.title}</div><canvas id="${ch.id}"></canvas></div>`).join('');
  charts.forEach(ch=>{
    try {
      if(ch.nk===null){mkChart(ch.id,lb,ch.ds,ch.u,ch.nMin,ch.nMax);return;}
      const n=NORMS[ch.nk];if(n)mkChart(ch.id,lb,ch.ds,ch.u,n.min,n.max);
    } catch(e){ console.warn('Chart error:',ch.id,e); }
  });
}

function buildResultsForPrompt(a) {
  const ld = buildLatestAcrossSessions(a.sessions);
  const pv = a.sessions.length > 1 ? a.sessions[1] : null;
  const bw = parseFloat(a.weight_kg);
  const lines = [];

  function dText(val, prev, lb) {
    if (!val || !prev) return '';
    const d = ((val-prev)/prev*100);
    const imp = lb ? d<0 : d>0;
    return ` (${imp?'improved':'regressed'} ${d>0?'+':''}${d.toFixed(1)}%)`;
  }
  function row(label, val, nk, prevVal, lb=false) {
    if (val==null) return;
    const s = bs(val, nk);
    const status = s!==null ? SL[s] : 'no validated norm';
    lines.push(`${label}: ${val} ${NORMS[nk]?.u||''} — ${status}${dText(val, prevVal, lb)}`);
  }

  lines.push('=== JUMP / POWER ===');
  row('Broad jump',    ld.broad_jump, 'broad_jump', prevVal('broad_jump'));
  if (ld.slbj_L)  lines.push(`SL broad jump L: ${ld.slbj_L}cm (no validated norm)`);
  if (ld.slbj_R)  lines.push(`SL broad jump R: ${ld.slbj_R}cm (no validated norm)`);
  if (ld.slbj_LSI!=null) {
    const flag = ld.slbj_LSI < 90 ? ' [below 90% symmetry threshold]' : '';
    const stat = bs(ld.slbj_LSI,'slbj_LSI')!==null ? SL[bs(ld.slbj_LSI,'slbj_LSI')] : '';
    lines.push(`SL broad jump LSI: ${ld.slbj_LSI}% — ${stat}${flag}${dText(ld.slbj_LSI, pv?.slbj_LSI, false)}`);
  }
  row('Triple hop',   ld.triple_hop, 'triple_hop', prevVal('triple_hop'));
  row('CMJ height',   ld.cmj,        'cmj',        prevVal('cmj'));
  row('SJ height',    ld.sj,         'sj',         prevVal('sj'));
  row('EUR',          ld.eur,        'eur',        prevVal('eur'));
  row('CMJ mRSI',     ld.cmj_mrsi,   'cmj_mrsi',   prevVal('cmj_mrsi'));
  row('DJ height',    ld.dj,         'dj',         prevVal('dj'));
  row('DJ RSI',       ld.dj_rsi,     'dj_rsi',     prevVal('dj_rsi'));
  row('DSI',          ld.dsi,        'dsi',        prevVal('dsi'));

  lines.push('=== AEROBIC ===');
  row('MAS',          ld.mas,        'mas',        pv?.mas);
  row('Est. VO2max',  ld.vo2max,     'vo2max',     pv?.vo2max);

  lines.push('=== STRENGTH ===');
  if (ld.sq_1rm_bw!=null) lines.push(`Back squat: ${ld.sq_1rm_bw}xBW${ld.sq_1rm?' (est. 1RM '+ld.sq_1rm+'kg)':''} — ${SL[bs(ld.sq_1rm_bw,'sq_1rm_bw')]||''}${dText(ld.sq_1rm_bw, pv&&bw?+(pv.sq_1rm/bw).toFixed(2):null, false)}`);
  if (ld.tb_1rm_bw!=null) lines.push(`Trap bar DL: ${ld.tb_1rm_bw}xBW${ld.tb_1rm?' (est. 1RM '+ld.tb_1rm+'kg)':''} — ${SL[bs(ld.tb_1rm_bw,'tb_1rm_bw')]||''}${dText(ld.tb_1rm_bw, pv&&bw?+(pv.tb_1rm/bw).toFixed(2):null, false)}`);
  if (ld.bp_1rm_bw!=null) lines.push(`Bench press: ${ld.bp_1rm_bw}xBW${ld.bp_1rm?' (est. 1RM '+ld.bp_1rm+'kg)':''} — ${SL[bs(ld.bp_1rm_bw,'bp_1rm_bw')]||''}${dText(ld.bp_1rm_bw, pv&&bw?+(pv.bp_1rm/bw).toFixed(2):null, false)}`);
  row('IMTP',         ld.imtp,       'imtp',       prevVal('imtp'));

  lines.push('=== SPEED ===');
  row('10m sprint',   ld.sprint10,   'sprint10',   pv?.sprint10, true);
  row('20m sprint',   ld.sprint20,   'sprint20',   pv?.sprint20, true);
  row('Max velocity', ld.max_vel,    'max_vel',    prevVal('max_vel'));

  return lines.join('\n');
}

function buildCategoryStatusForPrompt(a) {
  const ld = buildLatestAcrossSessions(a.sessions);
  const cats = [
    {name:'Jump/Power', keys:['broad_jump','slbj_LSI','triple_hop','cmj','sj','eur','cmj_mrsi','dj','dj_rsi','dsi']},
    {name:'Aerobic',    keys:['mas','vo2max']},
    {name:'Strength',   keys:['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw','imtp']},
    {name:'Speed',      keys:['sprint10','sprint20','max_vel']},
  ];
  return cats.map(cat => {
    const scores = cat.keys.map(k=>bs(ld[k],k)).filter(s=>s!==null);
    if (!scores.length) return `${cat.name}: No data available`;
    const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
    return `${cat.name}: ${catLabel(avg).l}`;
  }).join('\n');
}

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function copyText(id, btn) {
  const text = document.getElementById(id)?.innerText || '';
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘ Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

  jump:     'Plyometric volume and specificity should be reviewed. Consider bilateral and unilateral jump progressions to address the power deficit.',
  aero:     'Aerobic base development warrants prioritisation. Structured MAS-based interval sessions and repeated high-intensity running should be the central stimulus.',
  strength: 'Maximal strength development is the primary training priority for this athlete. Progressive overload in squat and trap bar deadlift should anchor the programme.',
  speed:    'Sprint mechanics and acceleration development require targeted attention. Repeated sprint sessions and max velocity exposure should be built into the weekly structure.',
};

function analyseFeedbackData(a) {
  const ld = buildLatestAcrossSessions(a.sessions);
  const pv = a.sessions.length > 1 ? a.sessions[1] : null;
  const bw = parseFloat(a.weight_kg);

  // Category scores
  const catAvg = {};
  Object.keys(CAT_KEYS).forEach(cat => {
    const scores = CAT_KEYS[cat].map(k => bs(ld[k], k)).filter(s => s !== null);
    catAvg[cat] = scores.length ? +(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2) : null;
  });

  // All scored metrics
  const metrics = [];
  Object.keys(NORMS).forEach(k => {
    const val = ld[k]; if (val == null) return;
    const score = bs(val, k); if (score === null) return;
    const prevVal = pv ? pv[k] : null;
    const changePct = (prevVal && prevVal !== 0) ? ((val - prevVal) / Math.abs(prevVal) * 100) : null;
    const improved = changePct !== null ? (NORMS[k].lb ? changePct < -0.5 : changePct > 0.5) : null;
    metrics.push({ k, val, score, changePct, improved, label: NORMS[k].label, u: NORMS[k].u, lb: NORMS[k].lb });
  });

  // Sort categories best → worst
  const rankedCats = Object.keys(catAvg).filter(c => catAvg[c] !== null).sort((a,b) => catAvg[b] - catAvg[a]);
  const best  = rankedCats[0] || null;
  const worst = rankedCats[rankedCats.length - 1] || null;

  const improved   = metrics.filter(m => m.improved === true).sort((a,b) => Math.abs(b.changePct) - Math.abs(a.changePct));
  const regressed  = metrics.filter(m => m.improved === false).sort((a,b) => Math.abs(b.changePct) - Math.abs(a.changePct));
  const exceedsCats = rankedCats.filter(c => catAvg[c] >= 3.5);
  const onTrackCats = rankedCats.filter(c => catAvg[c] >= 2.5 && catAvg[c] < 3.5);
  const concernCats = rankedCats.filter(c => catAvg[c] < 2.5);
  const lsiFlag  = ld.slbj_LSI != null && ld.slbj_LSI < 90;
  const hasPrev  = a.sessions.length > 1;

  return { ld, pv, bw, catAvg, rankedCats, best, worst, metrics, improved, regressed, exceedsCats, onTrackCats, concernCats, lsiFlag, hasPrev };
}

function buildCoachNotes(a, f) {
  const { ld, pv, catAvg, best, worst, improved, regressed, exceedsCats, concernCats, lsiFlag, hasPrev } = f;
  const date     = a.sessions[0]?.test_date || '—';
  const prevDate = pv?.test_date;
  const paras    = [];

  // ── Para 1: Profile overview ──
  const validCats = Object.values(catAvg).filter(s => s !== null);
  const overall   = validCats.length ? validCats.reduce((a,b)=>a+b,0)/validCats.length : null;
  const overallLbl = overall !== null ? catLabel(overall).l : 'insufficient data to rate';
  let p1 = `${a.name} (${a.position||'—'}, ${a.age||'—'} yrs, ${a.weight_kg||'—'} kg) most recently tested ${date} with ${a.sessions.length} session${a.sessions.length!==1?'s':''} on record. Overall physical profile: ${overallLbl}.`;
  if (a.injury_hx) p1 += ` Injury history: ${a.injury_hx}.`;
  if (!hasPrev)    p1 += ' Note: first session recorded — inter-session comparison not yet available.';
  paras.push(p1);

  // ── Para 2: Category breakdown ──
  const catLines = [];
  ['jump','aero','strength','speed'].forEach(cat => {
    if (catAvg[cat] === null) return;
    const cl = catLabel(catAvg[cat]);
    // Find best and worst metric in this category that have a score
    const catMetrics = CAT_KEYS[cat]
      .map(k => ({ k, val: ld[k], score: bs(ld[k], k) }))
      .filter(m => m.val != null && m.score !== null)
      .sort((a,b) => b.score - a.score);
    let line = `${CAT_LABELS[cat]}: ${cl.l}.`;
    if (catMetrics.length > 0) {
      const top = catMetrics[0];
      if (top.score >= 3) line += ` ${NORMS[top.k].label} is a highlight at ${top.val} ${NORMS[top.k].u} (${SL[top.score]}).`;
    }
    if (catMetrics.length > 1) {
      const bot = catMetrics[catMetrics.length - 1];
      if (bot.score <= 1) line += ` ${NORMS[bot.k].label} at ${bot.val} ${NORMS[bot.k].u} is a concern (${SL[bot.score]}).`;
    }
    catLines.push(line);
  });
  if (catLines.length) paras.push(catLines.join(' '));

  // ── Para 3: Progress since last session ──
  if (hasPrev && (improved.length || regressed.length)) {
    let p3 = `Progress since ${prevDate}: `;
    if (improved.length) {
      const names = improved.slice(0,2).map(m => `${m.label} (${m.changePct > 0 ? '+' : ''}${m.changePct.toFixed(1)}%)`);
      p3 += `Improvements noted in ${names.join(' and ')}. `;
    }
    if (regressed.length) {
      const names = regressed.slice(0,2).map(m => `${m.label} (${m.changePct.toFixed(1)}%)`);
      p3 += `Regressions observed in ${names.join(' and ')} — monitor whether this reflects fatigue, detraining, or measurement variance.`;
    }
    paras.push(p3.trim());
  }

  // ── Para 4: Priorities and flags ──
  let p4 = '';
  if (worst && catAvg[worst] !== null && catAvg[worst] < 2.5) {
    p4 += `Primary development focus: ${CAT_LABELS[worst]} (${catLabel(catAvg[worst]).l}). ${CAT_COACH_REC[worst]}`;
  } else if (worst) {
    p4 += `No category is in critical deficit. Continue general programme progression with emphasis on maintaining ${CAT_LABELS[best]||'current strengths'} while driving adaptation in ${CAT_LABELS[worst]}.`;
  }
  if (lsiFlag) p4 += ` LSI below the 90% symmetry threshold. Targeted unilateral work is indicated, alongside clinical review before unrestricted progression.`;
  if (p4) paras.push(p4.trim());

  return paras.join('\n\n');
}

function positionArchetype(pos) {
  const p=(pos||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(/GK|GOALKEEPER/.test(p))            return 'goalkeeper';
  if(/^(CB|CD)$|CENTREBACK|CENTREDEF|DEFENDER/.test(p)) return 'centre-back';
  if(/^(RB|LB|WB)$|FULLBACK|WINGBACK/.test(p)) return 'fullback';
  if(/^CDM$|DEFENSIVEMID|HOLDINGMID/.test(p)) return 'defensive-mid';
  if(/^(CM|CMF)$|CENTRALMID/.test(p))   return 'central-mid';
  if(/^(CAM|AM)$|ATTACKINGMID/.test(p)) return 'attacking-mid';
  if(/^(LW|RW|LM|RM)$|WINGER/.test(p)) return 'winger';
  if(/^(ST|CF|FW|SS)$|STRIKER|FORWARD/.test(p)) return 'forward';
  return 'professional footballer';
}

  'goalkeeper':     (b,w) => `As a goalkeeper, your explosive power and reactive speed are directly relevant to your shot-stopping and cross-claiming — keep investing in those qualities.`,
  'centre-back':    (b,w) => w==='speed'?`At centre-back, top-end speed matters, but dominant strength and aerial power are the foundation of your position — those remain the priority.`:`As a centre-back, your ${CAT_PLAIN[b]} is a genuine physical weapon at this level.`,
  'fullback':       (b,w) => `Full-backs at professional level need to cover ground repeatedly and contribute to attacks — your ${CAT_PLAIN[b]} is a real asset for this role.`,
  'defensive-mid':  (b,w) => `As a holding midfielder, your ability to sustain high-intensity actions is what you'll be judged on. Your ${CAT_PLAIN[b]} gives you a strong foundation for that.`,
  'central-mid':    (b,w) => `Central midfielders need everything. Your ${CAT_PLAIN[b]} stands out right now — it's a genuine advantage in transitions and high-pressure situations.`,
  'attacking-mid':  (b,w) => `As a 10, your ability to accelerate into space and repeat explosive actions is what separates you. Your ${CAT_PLAIN[b]} is a real weapon in tight areas.`,
  'winger':         (b,w) => (w==='speed'||w==='jump')?`Wide players at professional level are judged on their ability to beat defenders with pace and power — getting your ${CAT_PLAIN[w]} up is the priority for your position.`:`As a winger, your ${CAT_PLAIN[b]} is exactly what the position demands. You're building the right physical profile.`,
  'forward':        (b,w) => `Strikers who can accelerate explosively and maintain power late in games are the most dangerous. Your ${CAT_PLAIN[b]} translates directly to your threat in behind.`,
  'professional footballer': (b,w) => `Your ${CAT_PLAIN[b]} stands out as a physical strength right now — keep building on it.`,
};

function buildAthleteMessage(a, f) {
  const { catAvg, best, worst, improved, regressed, exceedsCats, concernCats, lsiFlag, hasPrev } = f;
  const firstName = a.name.split(' ')[0];
  const paras = [];

  // ── Para 1: Positive opening ──
  let p1 = '';
  const goodCats = Object.keys(catAvg).filter(c => catAvg[c] !== null && catAvg[c] >= 3.0).sort((a,b) => catAvg[b] - catAvg[a]);
  if (goodCats.length > 0 && improved.length > 0) {
    p1 = `Good work in the testing. Your ${CAT_PLAIN[goodCats[0]]} is a real strength in your profile right now`;
    if (goodCats.length > 1) p1 += `, and your ${CAT_PLAIN[goodCats[1]]} is also tracking well`;
    p1 += '. ';
    p1 += `You\'ve also shown clear improvement since your last session, which shows the training is working — keep that consistency going.`;
  } else if (goodCats.length > 0) {
    p1 = `Your testing results show some clear positives. Your ${CAT_PLAIN[goodCats[0]]} is a genuine strength`;
    if (goodCats.length > 1) p1 += `, and ${CAT_PLAIN[goodCats[1]]} is tracking solidly too`;
    p1 += `. These are areas you can feel confident about going into the next block.`;
  } else if (improved.length > 0) {
    p1 = `The most important thing from this testing block is that you\'ve improved since last time. Progress is progress — the work you\'re putting in is showing up in the numbers. Keep the consistency going.`;
  } else {
    p1 = `Your testing results give us a clear baseline to work from. There are no red flags, and you have a solid foundation to build on going into the next block.`;
  }
  paras.push(p1.trim());

  // ── Position-specific context ──
  const archetype = positionArchetype(a.position);
  const posFn = POS_CONTEXT[archetype] || POS_CONTEXT['professional footballer'];
  const posLine = posFn(best, worst);
  if (posLine) paras.push(posLine);

  // ── Para 2: Honest about areas needing work ──
  let p2 = '';
  if (concernCats.length > 0 || lsiFlag || regressed.length > 0) {
    if (worst && catAvg[worst] !== null && catAvg[worst] < 2.5) {
      p2 = `The main opportunity right now is your ${CAT_PLAIN[worst]}. There\'s clear room to build here, and it\'s where we\'ll put the emphasis in the next block. `;
    }
    if (regressed.length > 0 && hasPrev) {
      p2 += `There are a couple of areas that have dipped slightly since your last session. Nothing to be alarmed about, but it\'s a signal that we may need to look at your recovery or training load. `;
    }
    if (lsiFlag) {
      p2 += `There\'s also a measurable difference between your left and right leg at the moment. We\'ll target that directly — evening it up supports both how you perform on the pitch and how well you hold up across a season.`;
    }
  }
  if (p2) paras.push(p2.trim());

  // ── Para 3: Clear focus ──
  let p3 = '';
  if (worst) {
    p3 = `For the next training block, the focus is ${CAT_FOCUS[worst]}. `;
    if (goodCats.length > 0 && goodCats[0] !== worst) {
      p3 += `Keep maintaining your ${CAT_PLAIN[goodCats[0]]} alongside this — we don\'t want that to drop while we bring the other areas up. `;
    }
  } else {
    p3 = `For the next block, the goal is to keep building across the board. `;
  }
  p3 += `Stay consistent with your sessions, look after your recovery, and the improvements will follow.`;
  paras.push(p3.trim());

  return paras.join('\n\n');
}

function generateFeedback() {
  const a = athleteMap[selectedId]; if (!a) return;
  const fc = document.getElementById('feedbackContent'); if (!fc) return;
  if (!a.sessions.length) {
    fc.innerHTML = `<div class="feedback-empty"><h3>No data yet</h3><p>Add test sessions for ${a.name} to generate feedback.</p></div>`;
    return;
  }
  const f = analyseFeedbackData(a);
  const coachNotes  = buildCoachNotes(a, f);
  const athleteMsg  = buildAthleteMessage(a, f);
  renderFeedback(a, coachNotes, athleteMsg);
}

// ─── PRINT REPORT GENERATOR ──────────────────────────────────────────────────
// ─── PRINT ────────────────────────────────────────────────────────────────────
// The printout is the live document, paginated. We clone the hero and the
// permitted sections into #printAll, swap each Chart.js canvas for a PNG of
// itself (a cloned canvas is blank), and let the browser print that. There is
// no second stylesheet to keep in step.
// Page 1 is a cover (hero only). Everything after it flows, so pages fill
// instead of each group forcing a break and leaving half a page empty.
// Only these start a fresh page.
// Grouped into page-sized blocks. Each .ppage is at least one A4 sheet tall so
// the dark ground bleeds to the trim, and grows past it rather than clipping
// when an athlete has a long battery.
// One continuous flow after the cover, so the sheets keep overlapping. Order
// only; pages fall where they fall and no section is cut (see PRINT_TALL).
const PRINT_ORDER = ['s-power','s-speed','s-results','s-radar','s-runs',
                     's-trends','s-asr','s-history','s-key'];
// Sections taller than a sheet cannot avoid a break, so they break between
// their own rows or cards instead of being refused outright.
const PRINT_TALL = ['s-results','s-trends','s-history'];
// Which print toggle, if any, governs each section.
const PRINT_GATE = { 's-radar':'radar', 's-trends':'charts', 's-quadrant':'quadrant',
                     's-motorpref':'motorpref', 's-asr':'speedres', 's-feedback':'feedback' };

function snapshotSection(el){
  const clone = el.cloneNode(true);
  // a cloned <canvas> carries no bitmap, so bake each one into an <img>
  const srcCanvases = el.querySelectorAll('canvas');
  const dstCanvases = clone.querySelectorAll('canvas');
  dstCanvases.forEach((c,i) => {
    try {
      const url = srcCanvases[i].toDataURL('image/png');
      const img = document.createElement('img');
      img.src = url; img.style.width = '100%'; img.style.height = 'auto'; img.style.display = 'block';
      c.replaceWith(img);
    } catch(e) { c.remove(); }
  });
  clone.querySelectorAll('.no-print').forEach(n => n.remove());
  // coach-only content is stripped outright, not merely hidden
  clone.querySelectorAll('.coachonly').forEach(n => n.remove());
  // ids would collide with the live document; querySelectorAll misses the root,
  // so prefix that too, and SVG gradient references along with it
  if (clone.id) clone.id = 'p_' + clone.id;
  clone.querySelectorAll('[id]').forEach(n => { n.id = 'p_' + n.id; });
  let html = clone.outerHTML;
  html = html.replace(/url\(#(?!p_)/g, 'url(#p_');
  return html;
}

function buildPrintPages(){
  const a = athleteMap[selectedId]; if (!a) return '';
  const prefs = printPrefs();
  const logoSrc = document.querySelector('.brandmark img')?.src || '';
  const logo  = logoSrc ? `<span class="plogo"><img src="${logoSrc}" alt="FOOTBALLFIT"></span>` : '';
  const today = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const coach = getConfig().coachName || '';

  const sectionHtml = k => {
    const el = document.getElementById(k);
    if (!el) return '';
    if (el.classList.contains('coachonly')) return '';          // never printed
    const gate = PRINT_GATE[k];
    if (gate && prefs[gate] === false) return '';
    let html = snapshotSection(el);
    if (PRINT_TALL.includes(k)) html = html.replace('class="sec', 'class="tall sec');
    return html;
  };

  const foot = `<div class="runfoot"><div class="wrap">${logo}
      <span>${a.name} · ${a.sessions[0]?.test_date||''}${coach?` · ${coach}`:''}</span></div></div>`;

  const cover = `<div class="ppage cover">
      <header class="hero"><div class="wrap">
        <div class="topbar">${logo}<span class="eb">Performance report · ${today}</span></div>
        ${document.getElementById('hero')?.innerHTML || ''}
      </div></header>
    </div>`;

  const flow = PRINT_ORDER.map(sectionHtml).filter(Boolean).join('');
  return cover + `<div class="pflow">${flow}${foot}</div>`;
}

function generatePrintReport(){
  const a = athleteMap[selectedId];
  if (!a || !a.sessions.length){ alert('No data available to print.'); return; }
  const host = document.getElementById('printAll'); if (!host) return;
  host.innerHTML = buildPrintPages();
  document.body.classList.add('pall');
  setTimeout(() => { try { window.print(); } catch(e) {} }, 120);
}
window.addEventListener('afterprint', () => {
  document.body.classList.remove('pall');
  const host = document.getElementById('printAll'); if (host) host.innerHTML = '';
});

function _unused_buildAndOpenPrintReport(a, chartImages, quadrantSVG, radarSVG, radarModeUsed) {
  const ld    = buildLatestAcrossSessions(a.sessions);
  // prevVal(key): find most recent previous session with a value for this key
  const prevVal = k => { for(let i=1;i<a.sessions.length;i++){ if(a.sessions[i][k]!=null) return a.sessions[i][k]; } return null; };
  const pv    = a.sessions.length > 1 ? a.sessions[1] : null; // kept for backward compat
  const bw    = parseFloat(a.weight_kg);
  const logoSrc   = document.querySelector('.sb-brand img')?.src || '';
  const coachName = getConfig().coachName || 'Physical Performance Coach - Henri Joensuu';
  const today = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  // Build a date map: for each metric key, which session date was the source?
  const dateSrc = {};
  Object.keys(NORMS).forEach(k => {
    for (const s of a.sessions) {
      if (s[k] != null) { dateSrc[k] = s.test_date; break; }
    }
  });
  // Also map derived keys back to the session that provided the raw input
  ['slbj_L','slbj_R','slbj_LSI'].forEach(k => {
    for (const s of a.sessions) {
      if (s.slbj_L != null || s.slbj_R != null) { dateSrc[k] = s.test_date; break; }
    }
  });
  ['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw'].forEach((k,i) => {
    const rawKey = ['sq_1rm','tb_1rm','bp_1rm'][i];
    for (const s of a.sessions) {
      if (s[rawKey] != null) { dateSrc[k] = s.test_date; break; }
    }
  });
  // EUR and MAS/VO2 derive from CMJ+SJ and TT distance
  for (const s of a.sessions) { if (s.cmj!=null&&s.sj!=null){ dateSrc['eur']=s.test_date; break; } }
  for (const s of a.sessions) { if (s.mas!=null){ dateSrc['mas']=dateSrc['vo2max']=s.test_date; break; } }

  const latestDate = a.sessions[0]?.test_date;

  function getCatStatus(keys) {
    const scores = keys.map(k=>bs(ld[k],k)).filter(s=>s!==null);
    if (!scores.length) return null;
    return catLabel(scores.reduce((a,b)=>a+b,0)/scores.length);
  }
  const catDefs = [
    { name:'Jump / Power',  keys:['broad_jump','slbj_LSI','triple_hop','cmj','sj','eur','cmj_mrsi','dj','dj_rsi','dsi'] },
    { name:'Aerobic',       keys:['mas','vo2max'] },
    { name:'Strength',      keys:['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw','imtp'] },
    { name:'Speed',         keys:['sprint10','sprint20','max_vel'] },
  ];

  function pctHtml(val, prev, lb) {
    if (val==null||prev==null||isNaN(prev)||prev===0) return '<span style="color:#A8A7A3">—</span>';
    const d=((val-prev)/Math.abs(prev)*100);
    const unc=Math.abs(d)<0.5, imp=lb?d<0:d>0;
    const col=unc?'#8A8986':imp?'#3F7D55':'#B5523B';
    return `<span style="color:${col}">${unc?'=':imp?'▲':'▼'} ${d>0?'+':''}${d.toFixed(1)}%</span>`;
  }
  function badge(score, noNorm) {
    if (noNorm||score===null) return '<span class="cap">No norm</span>';
    return `<span class="chip c-s${score}">${SL[score]}</span>`;
  }
  // Range strip, identical in construction to the on-screen rows.
  function stripHtml(val, m) {
    if (m.noNorm || m.nMin==null || val==null) return '<span class="cap">Tracked individually</span>';
    const span=(m.nMax-m.nMin)||Math.abs(m.nMax||1)*0.2||1;
    const lo=m.nMin-span*0.95, hi=m.nMax+span*0.95;
    const pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
    const b0=pc(m.nMin), b1=pc(m.nMax);
    const col = m.score===null ? '#2A4FB7' : SCORE_COLS[m.score];
    return `<div class="strip">
      <span class="cx" style="left:${b0.toFixed(1)}%">${m.nMin}</span>
      <span class="cx" style="left:${b1.toFixed(1)}%">${m.nMax}</span>
      <div class="trk"></div>
      <div class="band" style="left:${b0.toFixed(1)}%;width:${(b1-b0).toFixed(1)}%"></div>
      <div class="mk" style="left:${pc(val).toFixed(1)}%;background:${col}"></div>
    </div>`;
  }
  function section(title, metrics) {
    const rows = metrics.filter(m => m.val != null);
    if (!rows.length) return '';
    const body = rows.map(m => {
      const sub = [m.sub, (m.date && m.date!==latestDate) ? `tested ${m.date}` : '']
                    .filter(Boolean).join(' · ');
      return `<div class="rrow">
        <span class="rlbl">${m.label}${sub?`<small>${sub}</small>`:''}</span>
        <span class="rval">${m.val}<small>${m.u||''}</small></span>
        ${stripHtml(m.val, m)}
        <span class="rchg">${pctHtml(m.val,m.prevVal,m.lb)}</span>
      </div>`;
    }).join('');
    return `<div class="ghd">${title}</div>${body}`;
  }
  function mk(nk, val, prevVal, sub='', auto=false) {
    if (val==null) return {val:null};
    const n=NORMS[nk]||{};
    return { val, prevVal, label:n.label||nk, u:n.u||'', score:bs(val,nk), lb:n.lb||false, noNorm:n.noNorm||false, nMin:n.min, nMax:n.max, sub, auto, date:dateSrc[nk]||null };
  }
  function strMk(nk, rawPfx) {
    const val=ld[nk], prev=pv?pv[nk]:null;
    if (val==null) return {val:null};
    const n=NORMS[nk]; const kg=ld[rawPfx+'_kg_raw'], reps=ld[rawPfx+'_reps_raw'], rm1=ld[rawPfx+'_1rm'];
    const sub=reps&&reps>1?`${kg}kg×${reps} → est. 1RM ${rm1}kg`:rm1?`1RM ${rm1}kg`:'';
    return { val, prevVal:prev, label:n.label, u:n.u, score:bs(val,nk), lb:false, noNorm:false, nMin:n.min, nMax:n.max, sub, auto:true, date:dateSrc[nk]||null };
  }

  const lsi=(ld.slbj_L!=null&&ld.slbj_R!=null)?+(Math.min(ld.slbj_L,ld.slbj_R)/Math.max(ld.slbj_L,ld.slbj_R)*100).toFixed(1):null;
  const lsiPv=(pv?.slbj_L!=null&&pv?.slbj_R!=null)?+(Math.min(pv.slbj_L,pv.slbj_R)/Math.max(pv.slbj_L,pv.slbj_R)*100).toFixed(1):null;
  const lsiFlag=lsi!=null&&lsi<90;

  const jumpM=[
    mk('broad_jump',ld.broad_jump,prevVal('broad_jump')),
