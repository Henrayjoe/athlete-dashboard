const CAT_KEYS = {
  jump:     ['broad_jump','slbj_LSI','triple_hop','cmj','sj','eur','cmj_mrsi','dj','dj_rsi','dsi'],
  aero:     ['mas','vo2max'],
  strength: ['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw','imtp'],
  speed:    ['sprint10','sprint20','max_vel'],
};
const CAT_PLAIN = {
  jump:     'explosive power and jump ability',
  aero:     'aerobic fitness and running capacity',
  strength: 'overall strength levels',
  speed:    'sprint speed and acceleration',
};
const CAT_FOCUS = {
  jump:     'explosive power — jumping, bounding, and sprint-specific plyometrics',
  aero:     'aerobic base development — consistent high-intensity running and MAS-based interval sessions',
  strength: 'maximal strength — prioritising heavy compound lifts with progressive overload',
  speed:    'speed development — sprint mechanics, acceleration work, and max velocity exposure',
};
const CAT_COACH_REC = {
  jump:     'Plyometric volume and specificity should be reviewed. Consider bilateral and unilateral jump progressions to address the power deficit.',
  aero:     'Aerobic base development warrants prioritisation. Structured MAS-based interval sessions and repeated high-intensity running should be the central stimulus.',
  strength: 'Maximal strength development is the primary training priority for this athlete. Progressive overload in squat and trap bar deadlift should anchor the programme.',
  speed:    'Sprint mechanics and acceleration development require targeted attention. Repeated sprint sessions and max velocity exposure should be built into the weekly structure.',
};

function analyseFeedbackData(a) {
  const ld = buildLatestAcrossSessions(a.sessions);
  const pv = a.sessions.length > 1 ? a.sessions[1] : null;
  const bw = parseFloat(a.weight_kg);

  // Category scores
  const catAvg = {};
  Object.keys(CAT_KEYS).forEach(cat => {
    const scores = CAT_KEYS[cat].map(k => bs(ld[k], k)).filter(s => s !== null);
    catAvg[cat] = scores.length ? +(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2) : null;
  });

  // All scored metrics
  const metrics = [];
  Object.keys(NORMS).forEach(k => {
    const val = ld[k]; if (val == null) return;
    const score = bs(val, k); if (score === null) return;
    const prevVal = pv ? pv[k] : null;
    const changePct = (prevVal && prevVal !== 0) ? ((val - prevVal) / Math.abs(prevVal) * 100) : null;
    const improved = changePct !== null ? (NORMS[k].lb ? changePct < -0.5 : changePct > 0.5) : null;
    metrics.push({ k, val, score, changePct, improved, label: NORMS[k].label, u: NORMS[k].u, lb: NORMS[k].lb });
  });

  // Sort categories best → worst
  const rankedCats = Object.keys(catAvg).filter(c => catAvg[c] !== null).sort((a,b) => catAvg[b] - catAvg[a]);
  const best  = rankedCats[0] || null;
  const worst = rankedCats[rankedCats.length - 1] || null;

  const improved   = metrics.filter(m => m.improved === true).sort((a,b) => Math.abs(b.changePct) - Math.abs(a.changePct));
  const regressed  = metrics.filter(m => m.improved === false).sort((a,b) => Math.abs(b.changePct) - Math.abs(a.changePct));
  const exceedsCats = rankedCats.filter(c => catAvg[c] >= 3.5);
  const onTrackCats = rankedCats.filter(c => catAvg[c] >= 2.5 && catAvg[c] < 3.5);
  const concernCats = rankedCats.filter(c => catAvg[c] < 2.5);
  const lsiFlag  = ld.slbj_LSI != null && ld.slbj_LSI < 90;
  const hasPrev  = a.sessions.length > 1;

  return { ld, pv, bw, catAvg, rankedCats, best, worst, metrics, improved, regressed, exceedsCats, onTrackCats, concernCats, lsiFlag, hasPrev };
}

function buildCoachNotes(a, f) {
  const { ld, pv, catAvg, best, worst, improved, regressed, exceedsCats, concernCats, lsiFlag, hasPrev } = f;
  const date     = a.sessions[0]?.test_date || '—';
  const prevDate = pv?.test_date;
  const paras    = [];

  // ── Para 1: Profile overview ──
  const validCats = Object.values(catAvg).filter(s => s !== null);
  const overall   = validCats.length ? validCats.reduce((a,b)=>a+b,0)/validCats.length : null;
  const overallLbl = overall !== null ? catLabel(overall).l : 'insufficient data to rate';
  let p1 = `${a.name} (${a.position||'—'}, ${a.age||'—'} yrs, ${a.weight_kg||'—'} kg) most recently tested ${date} with ${a.sessions.length} session${a.sessions.length!==1?'s':''} on record. Overall physical profile: ${overallLbl}.`;
  if (a.injury_hx) p1 += ` Injury history: ${a.injury_hx}.`;
  if (!hasPrev)    p1 += ' Note: first session recorded — inter-session comparison not yet available.';
  paras.push(p1);

  // ── Para 2: Category breakdown ──
  const catLines = [];
  ['jump','aero','strength','speed'].forEach(cat => {
    if (catAvg[cat] === null) return;
    const cl = catLabel(catAvg[cat]);
    // Find best and worst metric in this category that have a score
    const catMetrics = CAT_KEYS[cat]
      .map(k => ({ k, val: ld[k], score: bs(ld[k], k) }))
      .filter(m => m.val != null && m.score !== null)
      .sort((a,b) => b.score - a.score);
    let line = `${CAT_LABELS[cat]}: ${cl.l}.`;
    if (catMetrics.length > 0) {
      const top = catMetrics[0];
      if (top.score >= 3) line += ` ${NORMS[top.k].label} is a highlight at ${top.val} ${NORMS[top.k].u} (${SL[top.score]}).`;
    }
    if (catMetrics.length > 1) {
      const bot = catMetrics[catMetrics.length - 1];
      if (bot.score <= 1) line += ` ${NORMS[bot.k].label} at ${bot.val} ${NORMS[bot.k].u} is a concern (${SL[bot.score]}).`;
    }
    catLines.push(line);
  });
  if (catLines.length) paras.push(catLines.join(' '));

  // ── Para 3: Progress since last session ──
  if (hasPrev && (improved.length || regressed.length)) {
    let p3 = `Progress since ${prevDate}: `;
    if (improved.length) {
      const names = improved.slice(0,2).map(m => `${m.label} (${m.changePct > 0 ? '+' : ''}${m.changePct.toFixed(1)}%)`);
      p3 += `Improvements noted in ${names.join(' and ')}. `;
    }
    if (regressed.length) {
      const names = regressed.slice(0,2).map(m => `${m.label} (${m.changePct.toFixed(1)}%)`);
      p3 += `Regressions observed in ${names.join(' and ')} — monitor whether this reflects fatigue, detraining, or measurement variance.`;
    }
    paras.push(p3.trim());
  }

  // ── Para 4: Priorities and flags ──
  let p4 = '';
  if (worst && catAvg[worst] !== null && catAvg[worst] < 2.5) {
    p4 += `Primary development focus: ${CAT_LABELS[worst]} (${catLabel(catAvg[worst]).l}). ${CAT_COACH_REC[worst]}`;
  } else if (worst) {
    p4 += `No category is in critical deficit. Continue general programme progression with emphasis on maintaining ${CAT_LABELS[best]||'current strengths'} while driving adaptation in ${CAT_LABELS[worst]}.`;
  }
  if (lsiFlag) p4 += ` LSI below the 90% symmetry threshold. Targeted unilateral work is indicated, alongside clinical review before unrestricted progression.`;
  if (p4) paras.push(p4.trim());

  return paras.join('\n\n');
}

function positionArchetype(pos) {
  const p=(pos||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(/GK|GOALKEEPER/.test(p))            return 'goalkeeper';
  if(/^(CB|CD)$|CENTREBACK|CENTREDEF|DEFENDER/.test(p)) return 'centre-back';
  if(/^(RB|LB|WB)$|FULLBACK|WINGBACK/.test(p)) return 'fullback';
  if(/^CDM$|DEFENSIVEMID|HOLDINGMID/.test(p)) return 'defensive-mid';
  if(/^(CM|CMF)$|CENTRALMID/.test(p))   return 'central-mid';
  if(/^(CAM|AM)$|ATTACKINGMID/.test(p)) return 'attacking-mid';
  if(/^(LW|RW|LM|RM)$|WINGER/.test(p)) return 'winger';
  if(/^(ST|CF|FW|SS)$|STRIKER|FORWARD/.test(p)) return 'forward';
  return 'professional footballer';
}

function buildAthleteMessage(a, f) {
  const { catAvg, best, worst, improved, regressed, exceedsCats, concernCats, lsiFlag, hasPrev } = f;
  const firstName = a.name.split(' ')[0];
  const paras = [];

  // ── Para 1: Positive opening ──
  let p1 = '';
  const goodCats = Object.keys(catAvg).filter(c => catAvg[c] !== null && catAvg[c] >= 3.0).sort((a,b) => catAvg[b] - catAvg[a]);
  if (goodCats.length > 0 && improved.length > 0) {
    p1 = `Good work in the testing. Your ${CAT_PLAIN[goodCats[0]]} is a real strength in your profile right now`;
    if (goodCats.length > 1) p1 += `, and your ${CAT_PLAIN[goodCats[1]]} is also tracking well`;
    p1 += '. ';
    p1 += `You\'ve also shown clear improvement since your last session, which shows the training is working — keep that consistency going.`;
  } else if (goodCats.length > 0) {
    p1 = `Your testing results show some clear positives. Your ${CAT_PLAIN[goodCats[0]]} is a genuine strength`;
    if (goodCats.length > 1) p1 += `, and ${CAT_PLAIN[goodCats[1]]} is tracking solidly too`;
    p1 += `. These are areas you can feel confident about going into the next block.`;
  } else if (improved.length > 0) {
    p1 = `The most important thing from this testing block is that you\'ve improved since last time. Progress is progress — the work you\'re putting in is showing up in the numbers. Keep the consistency going.`;
  } else {
    p1 = `Your testing results give us a clear baseline to work from. There are no red flags, and you have a solid foundation to build on going into the next block.`;
  }
  paras.push(p1.trim());

  // ── Position-specific context ──
  const archetype = positionArchetype(a.position);
  const posFn = POS_CONTEXT[archetype] || POS_CONTEXT['professional footballer'];
  const posLine = posFn(best, worst);
  if (posLine) paras.push(posLine);

  // ── Para 2: Honest about areas needing work ──
  let p2 = '';
  if (concernCats.length > 0 || lsiFlag || regressed.length > 0) {
    if (worst && catAvg[worst] !== null && catAvg[worst] < 2.5) {
      p2 = `The main opportunity right now is your ${CAT_PLAIN[worst]}. There\'s clear room to build here, and it\'s where we\'ll put the emphasis in the next block. `;
    }
    if (regressed.length > 0 && hasPrev) {
      p2 += `There are a couple of areas that have dipped slightly since your last session. Nothing to be alarmed about, but it\'s a signal that we may need to look at your recovery or training load. `;
    }
    if (lsiFlag) {
      p2 += `There\'s also a measurable difference between your left and right leg at the moment. We\'ll target that directly — evening it up supports both how you perform on the pitch and how well you hold up across a season.`;
    }
  }
  if (p2) paras.push(p2.trim());

  // ── Para 3: Clear focus ──
  let p3 = '';
  if (worst) {
    p3 = `For the next training block, the focus is ${CAT_FOCUS[worst]}. `;
    if (goodCats.length > 0 && goodCats[0] !== worst) {
      p3 += `Keep maintaining your ${CAT_PLAIN[goodCats[0]]} alongside this — we don\'t want that to drop while we bring the other areas up. `;
    }
  } else {
    p3 = `For the next block, the goal is to keep building across the board. `;
  }
  p3 += `Stay consistent with your sessions, look after your recovery, and the improvements will follow.`;
  paras.push(p3.trim());

  return paras.join('\n\n');
}

function generateFeedback() {
  const a = athleteMap[selectedId]; if (!a) return;
  const fc = document.getElementById('feedbackContent'); if (!fc) return;
  if (!a.sessions.length) {
    fc.innerHTML = `<div class="feedback-empty"><h3>No data yet</h3><p>Add test sessions for ${a.name} to generate feedback.</p></div>`;
    return;
  }
  const f = analyseFeedbackData(a);
  const coachNotes  = buildCoachNotes(a, f);
  const athleteMsg  = buildAthleteMessage(a, f);
  renderFeedback(a, coachNotes, athleteMsg);
}

// ─── PRINT REPORT GENERATOR ──────────────────────────────────────────────────
function generatePrintReport() {
  const a = athleteMap[selectedId];
  if (!a || !a.sessions.length) { alert('No data available to print.'); return; }

  // Temporarily show hidden tabs so Chart.js and the quadrant SVG can render
  const trendsEl   = document.querySelector('.tc[data-t="trends"]');
  const quadrantEl = document.querySelector('.tc[data-t="quadrant"]');
  const radarEl    = document.querySelector('.tc[data-t="radar"]');
  const origT = trendsEl?.style.display;
  const origQ = quadrantEl?.style.display;
  const origR = radarEl?.style.display;
  const origRadarMode = radarMode;
  if (trendsEl)   trendsEl.style.display   = 'block';
  if (quadrantEl) quadrantEl.style.display = 'block';
  if (radarEl)    radarEl.style.display    = 'block';
  // Render the radar in "all tests" mode for the printout; fall back to domains
  // if the athlete doesn't have enough scored metrics for a detailed spider.
  radarMode = 'tests';
  renderRadar();
  if (!(document.getElementById('radarContent')?.innerHTML || '').includes('<svg')) {
    radarMode = 'domains';
    renderRadar();
  }
  const radarModeUsed = radarMode;
  drawCharts();
  drawQuadrant(currentXAxis, currentYAxis);

  // Wait for Chart.js to finish rendering before capturing canvas data
  setTimeout(() => {
    // ── Capture trend chart images ──────────────────────────────────────────
    const chartImages = [];
    document.getElementById('chartGrid')?.querySelectorAll('.chart-wrap').forEach(wrap => {
      if (wrap.style.display === 'none') return;
      const title  = wrap.querySelector('.chart-title')?.textContent?.trim() || '';
      const canvas = wrap.querySelector('canvas');
      if (canvas) {
        try {
          const url = canvas.toDataURL('image/png', 0.85);
          if (url && url.length > 200) chartImages.push({ title, url });
        } catch(e) {}
      }
    });

    // ── Capture radar SVG ───────────────────────────────────────────────────
    const rWrap = document.getElementById('radarContent');
    const rHtml = rWrap?.innerHTML || '';
    let radarSVG = '';
    if (rHtml.includes('<svg')) {
      const st = rHtml.indexOf('<svg');
      const en = rHtml.indexOf('</svg>', st);
      if (en > st) radarSVG = rHtml.slice(st, en + 6);
    }

    // ── Capture quadrant SVG ────────────────────────────────────────────────
    const qContainer = document.getElementById('quadrantContainer');
    const quadrantSVG = (qContainer?.innerHTML || '').includes('<svg') ? qContainer.innerHTML : '';

    // Restore tabs to original state
    if (trendsEl)   trendsEl.style.display   = origT   || '';
    if (quadrantEl) quadrantEl.style.display = origQ   || '';
    if (radarEl)    radarEl.style.display    = origR   || '';
    radarMode = origRadarMode; renderRadar();

    // ── Build the print report ──────────────────────────────────────────────
    _buildAndOpenPrintReport(a, chartImages, quadrantSVG, radarSVG, radarModeUsed);
  }, 350);
}

function _buildAndOpenPrintReport(a, chartImages, quadrantSVG, radarSVG, radarModeUsed) {
  const ld    = buildLatestAcrossSessions(a.sessions);
  // prevVal(key): find most recent previous session with a value for this key
  const prevVal = k => { for(let i=1;i<a.sessions.length;i++){ if(a.sessions[i][k]!=null) return a.sessions[i][k]; } return null; };
  const pv    = a.sessions.length > 1 ? a.sessions[1] : null; // kept for backward compat
  const bw    = parseFloat(a.weight_kg);
  const logoSrc   = document.querySelector('.sb-brand img')?.src || '';
  const coachName = getConfig().coachName || 'Physical Performance Coach - Henri Joensuu';
  const today = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  // Build a date map: for each metric key, which session date was the source?
  const dateSrc = {};
  Object.keys(NORMS).forEach(k => {
    for (const s of a.sessions) {

    }
  });
  // Also map derived keys back to the session that provided the raw input
  ['slbj_L','slbj_R','slbj_LSI'].forEach(k => {
    for (const s of a.sessions) {
      if (s.slbj_L != null || s.slbj_R != null) { dateSrc[k] = s.test_date; break; }
    }
  });
  ['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw'].forEach((k,i) => {
    const rawKey = ['sq_1rm','tb_1rm','bp_1rm'][i];
    for (const s of a.sessions) {
      if (s[rawKey] != null) { dateSrc[k] = s.test_date; break; }
    }
  });
  // EUR and MAS/VO2 derive from CMJ+SJ and TT distance
  for (const s of a.sessions) { if (s.cmj!=null&&s.sj!=null){ dateSrc['eur']=s.test_date; break; } }
  for (const s of a.sessions) { if (s.mas!=null){ dateSrc['mas']=dateSrc['vo2max']=s.test_date; break; } }

  const latestDate = a.sessions[0]?.test_date;

  function getCatStatus(keys) {
    const scores = keys.map(k=>bs(ld[k],k)).filter(s=>s!==null);
    if (!scores.length) return null;

  }
  const catDefs = [
    { name:'Jump / Power',  keys:['broad_jump','slbj_LSI','triple_hop','cmj','sj','eur','cmj_mrsi','dj','dj_rsi','dsi'] },
    { name:'Aerobic',       keys:['mas','vo2max'] },

  function pctHtml(val, prev, lb) {

  function badge(score, noNorm) {

  function section(title, metrics) {

  const lsi=(ld.slbj_L!=null&&ld.slbj_R!=null)?+(Math.min(ld.slbj_L,ld.slbj_R)/Math.max(ld.slbj_L,ld.slbj_R)*100).toFixed(1):null;
  const lsiPv=(pv?.slbj_L!=null&&pv?.slbj_R!=null)?+(Math.min(pv.slbj_L,pv.slbj_R)/Math.max(pv.slbj_L,pv.slbj_R)*100).toFixed(1):null;
  const lsiFlag=lsi!=null&&lsi<90;

  const jumpM=[
    mk('broad_jump',ld.broad_jump,prevVal('broad_jump')),
    ld.slbj_L!=null?{val:ld.slbj_L,prevVal:prevVal('slbj_L'),label:'SL broad jump — L',u:'cm',score:null,noNorm:true,lb:false,sub:'',date:dateSrc['slbj_L']||null}:{val:null},
    ld.slbj_R!=null?{val:ld.slbj_R,prevVal:prevVal('slbj_R'),label:'SL broad jump — R',u:'cm',score:null,noNorm:true,lb:false,sub:'',date:dateSrc['slbj_R']||null}:{val:null},
    lsi!=null?{val:lsi,prevVal:(()=>{const pS=prevVal('slbj_L'),pR=prevVal('slbj_R');return(pS!=null&&pR!=null)?+(Math.min(pS,pR)/Math.max(pS,pR)*100).toFixed(1):null;})(),label:'SL broad jump LSI'+(lsiFlag?' ⚠':''),u:'%',score:lsiFlag?null:bs(lsi,'slbj_LSI'),noNorm:false,lb:false,nMin:90,nMax:100,sub:'',auto:true,date:dateSrc['slbj_LSI']||null}:{val:null},
    mk('triple_hop',ld.triple_hop,prevVal('triple_hop')),
    mk('triple_hop_L',ld.triple_hop_L,prevVal('triple_hop_L')),

    (ld.tt_dist&&ld.tt_speed)?{val:fmtTime(ld.tt_time),prevVal:null,label:`Distance TT (${(ld.tt_dist/1000).toFixed(ld.tt_dist%1000===0?0:1)}km)`,u:'',score:bs(ld.tt_speed,'mas'),lb:false,noNorm:false,nMin:NORMS.mas.min,nMax:NORMS.mas.max,sub:`${ld.tt_speed} m/s avg${ld.tt_vo2max?' · est. VO₂max '+ld.tt_vo2max+' ml/kg/min':''}`,auto:true,date:dateSrc['mas']||null}:{val:null},

    return `<div style="flex:1;border:1px solid #e8e8e8;border-left:3px solid ${col};border-radius:6px;padding:9px 11px;background:#fff">

      <div style="font-size:11.5px;font-weight:700;color:${col}">${lbl}</div>
    </div>`;
  }).join('');

  // Charts HTML (2-column grid of captured images)
  const PP = printPrefs();
  const chartsHtml = (PP.charts && chartImages.length) ? `
    <div style="page-break-before:always"></div>

        const pStep=pSD?(LIM<=3.5?1:LIM<=7?2:5):(LIM<=45?10:LIM<=100?20:LIM<=200?50:100);

        g+=`<line x1="${CX-R}" y1="${CY}" x2="${CX+R}" y2="${CY}" stroke="#334155" stroke-width="1.1"/>`;

        pTicks.forEach(v=>{

          g+=`<line x1="${CX-3}" y1="${sy(v)}" x2="${CX+3}" y2="${sy(v)}" stroke="#94a3b8" stroke-width="1"/>`;});
        const qk2=mpQuadrantKey(d.x,d.y);
        [['Bounders',CX-R+3,CY-R+12,'start','bounders'],['Striders',CX+R-3,CY-R+12,'end','striders'],
         ['Bouncers',CX-R+3,CY+R-6,'start','bouncers'],['Spinners',CX+R-3,CY+R-6,'end','spinners']]
         .forEach(([t,x,y,an,key])=>{

        g+=`<text x="${CX}" y="${CY-R-14}" font-size="8" fill="#777" text-anchor="middle">greater step length</text>`;
        g+=`<text x="${CX}" y="${CY+R+20}" font-size="8" fill="#777" text-anchor="middle">greater step rate</text>`;
        g+=`<text x="${CX-R-5}" y="${CY-6}" font-size="8" fill="#777" text-anchor="middle" transform="rotate(-90,${CX-R-5},${CY-6})">greater flight time</text>`;
        g+=`<text x="${CX+R+7}" y="${CY-6}" font-size="8" fill="#777" text-anchor="middle" transform="rotate(90,${CX+R+7},${CY-6})">greater contact time</text>`;
        g+=`<circle cx="${sx(d.x)}" cy="${sy(d.y)}" r="13" fill="${band.col}" fill-opacity="0.5" stroke="${band.col}" stroke-width="1.4"/>`;
        if(d.xL!=null&&d.yL!=null) g+=`<circle cx="${sx(d.xL)}" cy="${sy(d.yL)}" r="5.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>`;
        if(d.xR!=null&&d.yR!=null) g+=`<circle cx="${sx(d.xR)}" cy="${sy(d.yR)}" r="5.5" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>`;
        g+='</svg>';
        return `<div style="margin-top:16px;page-break-inside:avoid">
          <div style="font-size:9px;font-weight:700;color:#7a8290;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #ebebeb">Motor Preference — ${runLbl}</div>
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
            <span style="display:inline-flex;align-items:center;gap:5px;background:#f8f8f8;border:1px solid #e0e0e0;border-radius:13px;padding:3px 11px">
              <span style="width:7px;height:7px;border-radius:50%;background:${band.col};display:inline-block"></span>
              <span style="font-size:12px;font-weight:700;color:#111">${q.name}</span></span>
            <span style="font-size:10.5px;color:#555">${q.sub}</span>
          </div>
          <div style="text-align:center">${g}</div>
          <div style="display:flex;gap:16px;font-size:9px;color:#888;justify-content:center;margin-top:3px">
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;margin-right:3px"></span>Left</span>
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ec4899;margin-right:3px"></span>Right</span>
            <span>Preference strength ${d.l2}${pSD?'':'%'}${d.asym!=null?' · asymmetry '+d.asym+(pSD?'':'%'):''}</span>
            <span>Rings = ${pRings.join(' / ')}${pSD?' SD':'%'} · axis ±${LIM}${pSD?'':'%'}</span>
          </div>
        </div>`;
      }).join('');
    }
  }

  // ── Athletic profile spider — only if an SVG was captured ──
  const radarHtml = (PP.radar && radarSVG && radarSVG.includes('<svg')) ? `
    <div style="page-break-before:always"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:2px solid #111;margin-bottom:14px">
      ${logoSrc?`<img src="${logoSrc}" style="height:22px;width:auto" alt="FootballFit">`:''}
      <div style="font-size:14px;font-weight:700;color:#111">${a.name} — Athletic Profile</div>
      <div style="font-size:10px;color:#aaa">${today}</div>
    </div>
    <div style="text-align:center;page-break-inside:avoid">
      <div style="max-width:430px;margin:0 auto">${radarSVG}</div>
      <p style="font-size:9px;color:#aaa;margin-top:4px">
        ${radarModeUsed==='tests' ? 'One axis per recorded test' : 'Performance domains'} ·
        Dashed ring = professional benchmark · Rings 1–4 = benchmark score
      </p>
    </div>` : '';

  // ── Speed Reserve — only rendered when both MAS and MSS are available ──
  const _mas = resolveMAS(ld);
  const _mss = ld.max_vel;
  let speedReserveHtml = '';
  if (PP.speedres && _mas && _mss != null) {
    const MAS=_mas.val, MSS=_mss;
    const ASR=+(MSS-MAS).toFixed(2), SRR=+(MSS/MAS).toFixed(2);
    const cls=classifySRR(SRR);
    const kmh=v=>(v*3.6).toFixed(1);
    const BW2=560, BML=15, BMR=15, BBY=52, BBH=44, BCW=BW2-BML-BMR;
    const smax=MSS*1.08, spx=v=>BML+(v/smax)*BCW;
    const mW=spx(MAS)-BML, aW=spx(MSS)-spx(MAS);
    let bar=`<svg viewBox="0 0 ${BW2} 132" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${BW2}px">`;
    bar+=`<rect x="${BML}" y="${BBY}" width="${BCW}" height="${BBH}" fill="#f1f3f5" rx="4"/>`;
    bar+=`<rect x="${BML}" y="${BBY}" width="${mW}" height="${BBH}" fill="#1a56db" rx="4"/>`;
    bar+=`<rect x="${BML+mW-6}" y="${BBY}" width="6" height="${BBH}" fill="#1a56db"/>`;
    bar+=`<rect x="${spx(MAS)}" y="${BBY}" width="${aW}" height="${BBH}" fill="#f59e0b"/>`;
    if(mW>90){
      bar+=`<text x="${BML+mW/2}" y="${BBY+18}" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">MAS (aerobic)</text>`;
      bar+=`<text x="${BML+mW/2}" y="${BBY+33}" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">${MAS} m/s</text>`;}
    if(aW>80){
      bar+=`<text x="${spx(MAS)+aW/2}" y="${BBY+18}" font-size="9.5" font-weight="700" fill="#7c4a03" text-anchor="middle">ASR (anaerobic)</text>`;
      bar+=`<text x="${spx(MAS)+aW/2}" y="${BBY+33}" font-size="12" font-weight="700" fill="#7c4a03" text-anchor="middle">${ASR} m/s</text>`;}
    bar+=`<text x="${BML}" y="${BBY-12}" font-size="9" fill="#aaa">0</text>`;
    bar+=`<text x="${spx(MAS)}" y="${BBY-12}" font-size="10" font-weight="700" fill="#1a56db" text-anchor="middle">MAS ${MAS}</text>`;
    bar+=`<text x="${spx(MSS)}" y="${BBY-12}" font-size="10" font-weight="700" fill="#d97706" text-anchor="${spx(MSS)>BW2-55?'end':'middle'}">MSS ${MSS}</text>`;
    bar+=`<text x="${spx(MAS)}" y="${BBY+BBH+22}" font-size="9" fill="#888" text-anchor="middle">${kmh(MAS)} km/h</text>`;
    bar+=`<text x="${spx(MSS)}" y="${BBY+BBH+22}" font-size="9" fill="#888" text-anchor="${spx(MSS)>BW2-55?'end':'middle'}">${kmh(MSS)} km/h</text>`;
    bar+='</svg>';
    const pcard=(l,v,u)=>`<div style="flex:1;border:1px solid #e8e8e8;border-radius:6px;padding:8px 10px;text-align:center">
      <div style="font-size:8.5px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.06em">${l}</div>
      <div style="font-size:15px;font-weight:700;color:#111;margin-top:2px">${v}<span style="font-size:9px;font-weight:400;color:#999;margin-left:2px">${u}</span></div></div>`;
    speedReserveHtml = `
    <div style="margin-top:22px;page-break-inside:avoid">
      <div style="font-size:9px;font-weight:700;color:#7a8290;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #ebebeb">Anaerobic Speed Reserve</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:8.5px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.06em">Profile</span>
        <span style="display:inline-flex;align-items:center;gap:5px;background:${cls.bg};border:1px solid ${cls.col};border-radius:14px;padding:3px 11px">
          <span style="width:7px;height:7px;border-radius:50%;background:${cls.col};display:inline-block"></span>
          <span style="font-size:12px;font-weight:700;color:${cls.col}">${cls.label}</span></span>
        <span style="font-size:10.5px;color:#555">${cls.desc}</span>
      </div>
      <div style="text-align:center">${bar}</div>
      <div style="display:flex;gap:7px;margin-top:8px">
        ${pcard('MAS',MAS,'m/s')}${pcard('MSS',MSS,'m/s')}${pcard('ASR',ASR,'m/s')}${pcard('SRR',SRR,'')}
      </div>
      ${(()=>{ const z=mssZoneSvg(selectedId); return z ? `
        <div style="margin-top:14px;page-break-inside:avoid">
          <div style="font-size:9px;font-weight:700;color:#7a8290;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">MAS vs MSS profile zones</div>
          <div style="text-align:center;max-width:520px;margin:0 auto">${z}</div>
          <div style="display:flex;gap:14px;font-size:9px;color:#888;justify-content:center;margin-top:3px">
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cls.col};margin-right:3px"></span>${a.name}</span>
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;border:1px solid #94a3b8;margin-right:3px"></span>Other athletes (anonymous)</span>
            <span>Diagonals are fixed SRR ratios</span>
          </div>
        </div>` : ''; })()}
      <p style="font-size:8.5px;color:#bbb;margin-top:6px">MAS from ${_mas.src}. SRR classification varies with aerobic test protocol.</p>
    </div>`;
  }

  // Feedback if generated
  const coachTxt  = document.getElementById('coachText')?.innerText?.trim();
  const athleteTxt= document.getElementById('athleteText')?.innerText?.trim();
  const esc = str => (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const feedbackHtml = (PP.feedback && athleteTxt) ? `
    <div style="page-break-before:always"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:2px solid #111;margin-bottom:16px">
      ${logoSrc?`<img src="${logoSrc}" style="height:22px;width:auto" alt="FootballFit">`:''}
      <div style="font-size:14px;font-weight:700;color:#111">${a.name} — Athlete Message</div>
      <div style="font-size:10px;color:#aaa">${today}</div>
    </div>
    <div style="background:#f8f8f8;border:1px solid #ebebeb;border-radius:6px;padding:14px 16px;font-size:11px;line-height:1.75;white-space:pre-wrap">${esc(athleteTxt)}</div>
  ` : '';

  // carry the embedded Neue Haas faces into the print window
  let fontCss = '';
  try {
    for (const sheet of document.styleSheets) {
      let rules; try { rules = sheet.cssRules; } catch(e) { continue; }
      if (!rules) continue;
      for (const r of rules) if (r.type === CSSRule.FONT_FACE_RULE) fontCss += r.cssText + '\n';
    }
  } catch(e) {}

  const reportHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
  <title>Performance Report — ${a.name}</title>
  <style>
    ${fontCss}
    *{box-sizing:border-box;margin:0;padding:0}
    @page{size:A4;margin:14mm 16mm}
    body{font-family:'Neue Haas Display','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      font-size:11px;color:#17181A;background:#fff;line-height:1.5;
      -webkit-font-smoothing:antialiased;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .page{max-width:182mm;margin:0 auto}
    img{max-width:100%}
    /* tabular figures so columns of results line up down the page */
    td,th{font-variant-numeric:tabular-nums}
    /* eyebrow-style column headers and section labels */
    th{letter-spacing:.12em!important;text-transform:uppercase}
    h1,h2,h3{letter-spacing:-.015em;font-weight:600}
  </style>
</head><body><div class="page">

  <!-- Page 1 Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid #111;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:12px">
      ${logoSrc?`<img src="${logoSrc}" style="height:26px;width:auto" alt="FootballFit">`:''}
      <div>
        <div style="font-size:17px;font-weight:700;color:#111;letter-spacing:-.02em">Performance Report</div>
        ${coachName?`<div style="font-size:11px;font-weight:500;color:#444;margin-top:2px">${coachName}</div>`:''}
        <div style="font-size:10px;color:#888;margin-top:1px">Generated ${today}</div>
      </div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;color:#888">Last tested</div>
      <div style="font-size:14px;font-weight:700;color:#111">${a.sessions[0]?.test_date||'—'}</div>
      ${pv?`<div style="font-size:10px;color:#aaa">Previous: ${pv.test_date}</div>`:''}
    </div>
  </div>

  <!-- Athlete Profile -->
  <div style="display:flex;align-items:flex-start;gap:14px;padding:13px;background:#f8f8f8;border-radius:8px;margin-bottom:16px;border:1px solid #ebebeb">
    <div style="width:40px;height:40px;border-radius:50%;background:#1a56db;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">${a.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
    <div>
      <div style="font-size:17px;font-weight:700;color:#111;letter-spacing:-.01em">${a.name}</div>
      <div style="font-size:10.5px;color:#555;margin-top:3px">${a.position||'—'} · ${a.age||'—'} yrs · ${a.height_cm||'—'} cm · ${a.weight_kg||'—'} kg · ${a.sessions.length} session${a.sessions.length!==1?'s':''}</div>
      ${a.injury_hx?`<div style="margin-top:6px;font-size:10px;background:#fff8e6;border:1px solid #f59e0b;border-radius:12px;padding:3px 10px;display:inline-block;color:#92400e;font-weight:600">⚠ ${a.injury_hx}</div>`:''}
      ${ld.weight_kg && ld.weight_kg !== parseFloat(a.weight_kg)?`<div style="margin-top:4px;font-size:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:3px 10px;display:inline-block;color:#1e40af;font-weight:600;margin-left:4px">⚖ Body weight at testing: ${ld.weight_kg} kg</div>`:''}
      ${a.sessions[0]?.notes?`<div style="margin-top:10px;padding:8px 12px;background:#f8f8f8;border-left:3px solid #1a56db;border-radius:0 4px 4px 0;font-size:10.5px;color:#444;line-height:1.6"><span style="font-size:9px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px">Session note</span>${a.sessions[0].notes}</div>`:''}

  <div style="display:flex;gap:8px;margin-bottom:18px">${catCardsHtml}</div>

  <!-- Test Results -->
  <div style="font-size:9px;font-weight:700;color:#7a8290;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-bottom:3px;border-bottom:1px solid #ebebeb">
    Test Results${pv?` <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#bbb">vs previous: ${pv.test_date}</span>`:''}

    <span>Normative ranges: professional football literature</span>
  </div>

</div>
<script>window.onload=()=>setTimeout(()=>window.print(),500);<\/script>

  const win = window.open('','_blank','width=900,height=700');

// ─── TEST HISTORY LOG ────────────────────────────────────────────────────────
function renderHistory() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('historyContent');
  if (!a || !el) return;
  if (!a.sessions.length) { el.innerHTML='<p style="color:var(--text-muted);padding:8px">No sessions recorded.</p>'; return; }

  const COLS = [
    { key:'broad_jump', label:'Broad jump',   u:'cm',  cat:'Jump' },
    { key:'slbj_L',     label:'SL jump L',    u:'cm',  cat:'Jump' },
    { key:'slbj_R',     label:'SL jump R',    u:'cm',  cat:'Jump' },
    { key:'slbj_LSI',   label:'LSI',          u:'%',   cat:'Jump' },
    { key:'triple_hop',     label:'Triple hop',   u:'cm', cat:'Jump' },
    { key:'triple_hop_L',   label:'T-hop L',      u:'cm', cat:'Jump' },
    { key:'triple_hop_R',   label:'T-hop R',      u:'cm', cat:'Jump' },
    { key:'triple_hop_LSI', label:'T-hop LSI',    u:'%',  cat:'Jump' },
    { key:'cmj',        label:'CMJ',          u:'cm',  cat:'Jump' },
    { key:'sj',            label:'SJ',            u:'cm',   cat:'Jump' },
    { key:'cmj_flight',    label:'CMJ flight',    u:'cm',   cat:'Jump' },
    { key:'sj_flight',     label:'SJ flight',     u:'cm',   cat:'Jump' },
    { key:'cmj_con_force', label:'CMJ con force', u:'N/kg', cat:'Jump' },
    { key:'eur',        label:'EUR',          u:'',    cat:'Jump' },
    { key:'cmj_mrsi',   label:'CMJ mRSI',     u:'m/s', cat:'Jump' },
    { key:'dj',         label:'DJ',           u:'cm',  cat:'Jump' },
    { key:'dj_rsi',     label:'DJ RSI',       u:'m/s', cat:'Jump' },
    { key:'dsi',        label:'DSI',          u:'',    cat:'Jump' },
    { key:'mas',        label:'MAS',          u:'m/s', cat:'Aerobic' },
    { key:'vo2max',     label:'VO₂max',       u:'ml/kg/min', cat:'Aerobic' },
    { key:'tt_speed',   label:'TT speed',     u:'m/s', cat:'Aerobic' },
    { key:'yoyo_ir2',   label:'Yo-Yo IR2',    u:'m',   cat:'Aerobic' },
    { key:'beep_level', label:'Beep',         u:'lvl', cat:'Aerobic' },
    { key:'bronco',     label:'Bronco',       u:'s',   cat:'Aerobic', lb:true },
    { key:'sq_1rm_bw',  label:'Squat ×BW',   u:'',    cat:'Strength' },
    { key:'tb_1rm_bw',  label:'Trap DL ×BW', u:'',    cat:'Strength' },
    { key:'bp_1rm_bw',  label:'Bench ×BW',   u:'',    cat:'Strength' },
    { key:'imtp',       label:'IMTP',         u:'N/kg',cat:'Strength' },
    { key:'sprint10',   label:'10m',          u:'s',   cat:'Speed', lb:true },
    { key:'sprint20',   label:'20m',          u:'s',   cat:'Speed', lb:true },
    { key:'max_vel',    label:'Max vel',      u:'m/s', cat:'Speed' },
  ];

  const sessions = [...a.sessions].reverse(); // oldest → newest
  const activeCols = COLS.filter(c => sessions.some(s => s[c.key] != null));
  const cats = ['Jump','Aerobic','Strength','Speed'];
  const catSpans = cats.map(cat => ({ cat, count: activeCols.filter(c=>c.cat===cat).length })).filter(c=>c.count>0);

  const scoreColor = (key, val) => {
    if (val==null) return '';
    const s = bs(val, key); if (s===null) return '';
    return SCORE_COLS[s];
  };

  const fmtCell = (key, val) => {
    if (val==null) return `<span style="color:var(--border)">—</span>`;
    let display = val;
    if (key==='bronco') display = fmtTime(val);
    else if (key==='tt_speed') display = val.toFixed(2);
    else if (typeof val==='number' && !Number.isInteger(val)) display = val < 5 ? val.toFixed(2) : val.toFixed(1);
    const col = scoreColor(key, val);
    return `<span style="${col?`color:${col};font-weight:700`:'color:var(--text-secondary)'}">${display}</span>`;
  };

  const th = (txt, extra='') => `<th style="padding:6px 9px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);background:var(--surface-alt);border:1px solid var(--border);white-space:nowrap;text-align:center${extra}">${txt}</th>`;

  let t = `<table style="border-collapse:collapse;font-size:11px">
  <thead>
    <tr>
      <th style="padding:6px 10px;font-size:9px;font-weight:700;color:var(--text-muted);background:var(--surface-alt);border:1px solid var(--border);text-align:left;position:sticky;left:0;z-index:2" rowspan="2">Date</th>
      ${catSpans.map(c=>`<th colspan="${c.count}" style="padding:6px 9px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--surface-alt);border:1px solid var(--border);border-bottom:2px solid var(--accent);text-align:center">${c.cat}</th>`).join('')}
    </tr>
    <tr>${activeCols.map(c=>th(`${c.label}${c.u?`<br><span style="font-weight:400;font-size:8px;opacity:.7">${c.u}</span>`:''}`)).join('')}</tr>
  </thead>
  <tbody>`;

  sessions.forEach((s,i) => {
    const bg = i%2===0 ? 'var(--surface)' : 'var(--surface-alt)';
    const noteHtml = s.notes ? `<br><span style="font-size:9px;color:var(--text-muted);font-style:italic;font-weight:400">${s.notes}</span>` : '';
    t += `<tr>
      <td style="padding:6px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);background:${bg};border:1px solid var(--border);position:sticky;left:0;z-index:1;min-width:88px">${s.test_date||'—'}${noteHtml}</td>
      ${activeCols.map(c=>`<td style="padding:5px 9px;text-align:center;background:${bg};border:1px solid var(--border)">${fmtCell(c.key,s[c.key])}</td>`).join('')}
    </tr>`;
  });

  el.innerHTML = t + `</tbody></table>
  <p style="font-size:10px;color:var(--text-muted);margin-top:8px">Oldest → newest · Values colour-coded: <span style="color:#16a34a">●</span> Above Standard <span style="color:#1a56db">●</span> At Standard <span style="color:#ca8a04">●</span> Approaching <span style="color:#ea580c">●</span> Building <span style="color:#dc2626">●</span> Primary Focus</p>`;
}

// ─── ATHLETIC PROFILE RADAR ──────────────────────────────────────────────────
let radarMode = 'domains'; // 'domains' | 'tests'

const RADAR_DOMAINS = [
  { label:'Jump / Power', short:'Jump',     keys:['broad_jump','triple_hop','cmj','cmj_flight','sj','sj_flight','eur','cmj_mrsi','cmj_con_force','dj','dj_rsi','dsi'] },
  { label:'Speed',        short:'Speed',    keys:['sprint10','sprint20','max_vel'] },
  { label:'Strength',     short:'Strength', keys:['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw','imtp'] },
  { label:'Aerobic',      short:'Aerobic',  keys:['mas','vo2max','yoyo_ir2','beep_level','bronco'] },
  { label:'Symmetry',     short:'Symmetry', keys:['slbj_LSI','triple_hop_LSI'] },
];

function setRadarMode(m, btn) {
  radarMode = m;
  document.querySelectorAll('.radar-mode-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderRadar();
}

function renderRadar() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('radarContent');
  if (!a || !el) return;
  if (!a.sessions.length) { el.innerHTML='<p style="color:var(--text-muted)">No sessions recorded.</p>'; return; }

  const ld = buildLatestAcrossSessions(a.sessions);
  const scCol = s => s===null ? '#c3c9d1'
    : SCORE_COLS[Math.max(0,Math.min(4,Math.round(s)))];

  // ── Build axis set for the chosen mode ──────────────────────────────────
  let axes; // [{label, short, score, detail}]
  if (radarMode === 'tests') {
    axes = [];
    RADAR_DOMAINS.forEach(dm => dm.keys.forEach(k => {
      const sc = bs(ld[k], k);
      if (sc === null) return;
      const n = NORMS[k];
      let lbl = (n.label||k).replace(/\s*\(.*?\)\s*/g,'').trim();
      if (lbl.length > 15) lbl = lbl.slice(0,14)+'…';
      axes.push({ label:lbl, short:lbl, score:sc, val:ld[k], u:n.u, domain:dm.short });
    }));
    if (axes.length < 3) {
      el.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-muted);font-size:13px">
        Not enough tested metrics for a detailed profile — at least 3 are needed.<br>
        <button class="btn-sm" style="margin-top:12px" onclick="setRadarMode('domains')">Show domain view</button></div>`;
      return;
    }
  } else {
    axes = RADAR_DOMAINS.map(dm => {
      const ss = dm.keys.map(k=>bs(ld[k],k)).filter(s=>s!==null);
      return { label:dm.label, short:dm.short, score: ss.length ? +(ss.reduce((x,y)=>x+y,0)/ss.length) : null };
    });
  }

  // ── Geometry ────────────────────────────────────────────────────────────
  const N = axes.length;
  const W = 540, H = 500, CX = W/2, CY = 245;
  const R  = N > 8 ? 140 : 155;
  const ang = i => -Math.PI/2 + i*2*Math.PI/N;
  const pt  = (i,f) => ({ x:+(CX+R*f*Math.cos(ang(i))).toFixed(1), y:+(CY+R*f*Math.sin(ang(i))).toFixed(1) });
  const poly = fs => fs.map((f,i)=>`${pt(i,f).x},${pt(i,f).y}`).join(' ');

  const vals = axes.map(x=>x.score).filter(s=>s!==null);
  const overall = vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : null;
  const pCol = scCol(overall);

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:540px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="${pCol}" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="${pCol}" stop-opacity="0.14"/>
    </radialGradient>
    <filter id="radarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="${pCol}" flood-opacity="0.22"/>
    </filter>
  </defs>`;

  // Rings
  // Benchmark ring is drawn later so the athlete's fill cannot paint over it
  [1,2,4].forEach(sc => {
    svg += `<polygon points="${poly(Array(N).fill(sc/4))}"
      fill="${sc===4?'#fbfcfd':'none'}"
      stroke="rgba(15,23,42,0.075)" stroke-width="1" stroke-linejoin="round"/>`;
  });

  // Spokes
  for (let i=0;i<N;i++){
    const t = pt(i,1);
    svg += `<line x1="${CX}" y1="${CY}" x2="${t.x}" y2="${t.y}" stroke="rgba(15,23,42,0.09)" stroke-width="1"/>`;
  }

  // Athlete shape — drawn as segments so each pair of adjacent axes blends
  // between their own status colours, making strengths readable from the shape itself.
  if (vals.length) {
    const fracs = axes.map(x => x.score!==null ? Math.max(x.score/4, 0.02) : 0.02);

    // Gradient defs, one per segment, blending neighbouring axis colours
    let gdefs = '';
    for (let i=0;i<N;i++){
      const j=(i+1)%N;
      const c1=scCol(axes[i].score), c2=scCol(axes[j].score);
      const p1=pt(i,fracs[i]), p2=pt(j,fracs[j]);
      gdefs += `<linearGradient id="seg${i}" gradientUnits="userSpaceOnUse"
        x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}">
        <stop offset="0%" stop-color="${c1}" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="${c2}" stop-opacity="0.55"/></linearGradient>`;
    }
    svg = svg.replace('</defs>', gdefs + '</defs>');

    // Filled segments
    for (let i=0;i<N;i++){
      const j=(i+1)%N;
      const p1=pt(i,fracs[i]), p2=pt(j,fracs[j]);
      svg += `<path d="M${CX},${CY} L${p1.x},${p1.y} L${p2.x},${p2.y} Z" fill="url(#seg${i})" stroke="none"/>`;
    }
    // Outline over the top
    svg += `<polygon points="${poly(fracs)}" fill="none" stroke="${pCol}" stroke-width="2.4" stroke-linejoin="round" stroke-opacity="0.85" filter="url(#radarShadow)"/>`;

    axes.forEach((x,i)=>{
      if (x.score===null) return;
      const p = pt(i, Math.max(x.score/4,0.02));
      svg += `<circle cx="${p.x}" cy="${p.y}" r="5.5" fill="#fff" stroke="${scCol(x.score)}" stroke-width="2.6"/>`;
      svg += `<circle cx="${p.x}" cy="${p.y}" r="2"   fill="${scCol(x.score)}"/>`;
    });
  }

  // Benchmark ring — on top of the athlete fill so it stays legible
  svg += `<polygon points="${poly(Array(N).fill(0.75))}" fill="none"
    stroke="#1a56db" stroke-opacity="0.75" stroke-width="1.8"
    stroke-dasharray="7,4" stroke-linejoin="round"/>`;
  const bRef = pt(0, 0.75);
  svg += `<rect x="${+bRef.x+5}" y="${+bRef.y-9}" width="76" height="15" rx="7.5" fill="#fff" stroke="#1a56db" stroke-opacity="0.5"/>`;
  svg += `<text x="${+bRef.x+43}" y="${+bRef.y+1.5}" font-size="8.5" fill="#1a56db" font-weight="700" text-anchor="middle">Pro benchmark</text>`;

  // Axis labels
  axes.forEach((x,i)=>{
    const lf = N > 8 ? 1.20 : 1.17;
    const lp = pt(i, lf);
    const anchor = lp.x < CX-8 ? 'end' : lp.x > CX+8 ? 'start' : 'middle';
    const col = scCol(x.score);
    const fs  = N > 8 ? 9.5 : 12;
    svg += `<text x="${lp.x}" y="${lp.y}" font-size="${fs}" font-weight="700" fill="#1f2937" text-anchor="${anchor}">${x.label}</text>`;
    if (N <= 8) {
      svg += `<text x="${lp.x}" y="${+lp.y+14}" font-size="9.5" font-weight="600" fill="${col}" text-anchor="${anchor}">${x.score!==null?SL[Math.round(x.score)]:'No data'}</text>`;
      if (x.score!==null)
        svg += `<text x="${lp.x}" y="${+lp.y+26}" font-size="9" fill="#9aa3ad" text-anchor="${anchor}">${x.score.toFixed(1)} / 4</text>`;
    } else if (x.score!==null) {
      svg += `<text x="${lp.x}" y="${+lp.y+11}" font-size="8.5" font-weight="600" fill="${col}" text-anchor="${anchor}">${x.score.toFixed(1)}</text>`;
    }
  });

  // Ring scale numbers
  [1,2,3,4].forEach(sc=>{
    const p = pt(0, sc/4);
    svg += `<text x="${+p.x+6}" y="${+p.y+3}" font-size="8" fill="#c3c9d1">${sc}</text>`;
  });

  // Centre score
  if (overall!==null) {
    svg += `<circle cx="${CX}" cy="${CY}" r="27" fill="#fff" stroke="${pCol}" stroke-width="2"/>`;
    svg += `<text x="${CX}" y="${CY-1}" font-size="17" font-weight="700" fill="${pCol}" text-anchor="middle">${overall.toFixed(1)}</text>`;
    svg += `<text x="${CX}" y="${CY+12}" font-size="7.5" fill="#9aa3ad" text-anchor="middle">OVERALL</text>`;
  }
  svg += '</svg>';

  // ── Mode toggle ─────────────────────────────────────────────────────────
  const toggle = `
    <div class="quad-ctrl-row" style="justify-content:center;margin-bottom:2px">
      <span class="control-label">View</span>
      <button class="axis-btn radar-mode-btn${radarMode==='domains'?' active':''}" onclick="setRadarMode('domains',this)">Domains</button>
      <button class="axis-btn radar-mode-btn${radarMode==='tests'?' active':''}" onclick="setRadarMode('tests',this)">All tests</button>
    </div>`;

  // ── Breakdown panel — every contributing test per domain ────────────────
  const breakdown = RADAR_DOMAINS.map(dm => {
    const rows = dm.keys.map(k=>({k,sc:bs(ld[k],k),val:ld[k],n:NORMS[k]}))
                        .filter(r=>r.val!=null && r.sc!==null);
    const ss = rows.map(r=>r.sc);
    const avg = ss.length ? ss.reduce((x,y)=>x+y,0)/ss.length : null;
    const dCol = scCol(avg);
    const untested = dm.keys.filter(k=>ld[k]==null).length;
    return `
      <div style="border:1px solid var(--border);border-top:3px solid ${dCol};border-radius:8px;padding:11px 13px;background:var(--surface)">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:11px;font-weight:700;color:var(--text-primary)">${dm.label}</span>
          <span style="font-size:10px;font-weight:700;color:${dCol}">${avg!==null?avg.toFixed(1)+' / 4':'—'}</span>
        </div>
        ${rows.length ? rows.map(r=>`
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
            <span style="flex:1;font-size:10.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.n.label}</span>
            <span style="font-size:10.5px;font-weight:600;color:var(--text-primary);white-space:nowrap">${r.val}<span style="font-size:8.5px;color:var(--text-muted);margin-left:2px">${r.n.u}</span></span>
            <span style="display:inline-block;width:44px;height:5px;border-radius:3px;background:#eef0f2;position:relative;flex-shrink:0">
              <span style="position:absolute;left:0;top:0;height:5px;border-radius:3px;width:${(r.sc/4*100).toFixed(0)}%;background:${scCol(r.sc)}"></span>
            </span>
          </div>`).join('')
        : '<div style="font-size:10px;color:var(--text-muted);font-style:italic">No tested metrics</div>'}
        ${untested ? `<div style="font-size:9px;color:#c3c9d1;margin-top:6px">${untested} test${untested!==1?'s':''} not recorded</div>` : ''}
      </div>`;
  }).join('');

  const legend = `
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;font-size:10.5px;color:var(--text-muted);flex-wrap:wrap">
      <span><span style="display:inline-block;width:14px;height:3px;background:${pCol};vertical-align:middle;border-radius:2px;margin-right:5px"></span>${a.name}</span>
      <span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed rgba(26,86,219,0.5);vertical-align:middle;margin-right:5px"></span>Professional benchmark</span>
      <span style="color:#c3c9d1">Rings = benchmark score 1–4</span>
    </div>`;

  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%">
      ${toggle}
      ${svg}
      ${legend}
      <div style="width:100%;margin-top:8px">
        <div style="font-size:9.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px">Domain breakdown</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px">${breakdown}</div>
      </div>
    </div>`;
}

// ─── ANAEROBIC SPEED RESERVE ────────────────────────────────────────────────
// ASR = MSS - MAS ; SRR = MSS / MAS
// Profile: Speed >=1.90 | Hybrid 1.70-1.90 | Endurance <1.70
function resolveMAS(ld) {
  // d.mas is resolved in deriveSession (5-min TT > distance TT > VO2max estimate)
  // and carries its own source label.
  if (ld.mas != null) return { val: ld.mas, src: ld.mas_src || 'aerobic test' };
  return null;
}

function classifySRR(srr) {
  if (srr >= 1.90) return {
    label:'Speed', col:'#dc2626', bg:'#fef2f2',
    desc:'Fast-twitch dominant with high power output, but fatigues quickly.'
  };
  if (srr >= 1.70) return {
    label:'Hybrid', col:'#1a56db', bg:'#eff6ff',
    desc:'Balanced fibre composition with versatile training tolerance.'
  };
  return {
    label:'Endurance', col:'#16a34a', bg:'#f0fdf4',
    desc:'Slow-twitch dominant with high volume tolerance.'
  };
}

// ── MAS vs MSS profile zones ────────────────────────────────────────────────
// SRR = MSS/MAS, so each classification boundary is a straight line through the
// origin: MSS = 1.90*MAS (Speed) and MSS = 1.70*MAS (Hybrid). Zones are drawn by
// clipping the plot rectangle against each half-plane, then layering.
function mssZoneSvg(selId) {
  // Gather every athlete that has both values
  const pts = [];
  Object.values(athleteMap).forEach(a => {
    if (!a.sessions || !a.sessions.length) return;
    const ld = buildLatestAcrossSessions(a.sessions);
    const m = resolveMAS(ld), s = ld.max_vel;
    if (!m || s == null) return;
    pts.push({ id:a.id, name:a.name, mas:m.val, mss:s,
               ini:a.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
               isCur:a.id===selId });
  });
  if (!pts.some(p=>p.isCur)) return '';

  const W=620,H=420,ML=54,MR=22,MT=20,MB=50;
  const CW=W-ML-MR, CH=H-MT-MB;

  const masVals=pts.map(p=>p.mas), mssVals=pts.map(p=>p.mss);
  const pad=(lo,hi,min)=>{ let r=hi-lo; if(r<min){const c=(lo+hi)/2; lo=c-min/2; hi=c+min/2; r=min;} 
                           return [lo-r*0.18, hi+r*0.18]; };
  let [xMin,xMax]=pad(Math.min(...masVals),Math.max(...masVals),1.2);
  let [yMin,yMax]=pad(Math.min(...mssVals),Math.max(...mssVals),1.8);
  xMin=Math.max(0.5,xMin); yMin=Math.max(1,yMin);

  const sx=v=>ML+(v-xMin)/(xMax-xMin)*CW;
  const sy=v=>MT+CH-(v-yMin)/(yMax-yMin)*CH;

  // Clip a polygon to the half-plane  y - k*x >= 0  (Sutherland–Hodgman)
  const clipAbove=(poly,k)=>{
    const f=p=>p.y-k*p.x, out=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length], fa=f(a), fb=f(b);
      if(fa>=0) out.push(a);
      if((fa>=0)!==(fb>=0)){
        const t=fa/(fa-fb);
        out.push({x:a.x+t*(b.x-a.x), y:a.y+t*(b.y-a.y)});
      }
    }
    return out;
  };
  const rect=[{x:xMin,y:yMin},{x:xMax,y:yMin},{x:xMax,y:yMax},{x:xMin,y:yMax}];
  const toPath=poly=>poly.length?poly.map(p=>`${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' '):'';

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">`;
  // Layer: whole rect = Endurance, then Hybrid above 1.70, then Speed above 1.90
  s+=`<rect x="${ML}" y="${MT}" width="${CW}" height="${CH}" fill="#f0fdf4"/>`;
  const hyb=clipAbove(rect,1.70), spd=clipAbove(rect,1.90);
  if(hyb.length) s+=`<polygon points="${toPath(hyb)}" fill="#eff6ff"/>`;
  if(spd.length) s+=`<polygon points="${toPath(spd)}" fill="#fef2f2"/>`;

  // Boundary lines
  [[1.90,'#dc2626','Speed ≥ 1.90'],[1.70,'#1a56db','Hybrid ≥ 1.70']].forEach(([k,col,lbl])=>{
    const ptsOn=[];
    [[xMin,k*xMin],[xMax,k*xMax],[yMin/k,yMin],[yMax/k,yMax]].forEach(([px,py])=>{
      if(px>=xMin-1e-9&&px<=xMax+1e-9&&py>=yMin-1e-9&&py<=yMax+1e-9) ptsOn.push([px,py]);
    });
    if(ptsOn.length<2) return;
    ptsOn.sort((a,b)=>a[0]-b[0]);
    const [p1,p2]=[ptsOn[0],ptsOn[ptsOn.length-1]];
    s+=`<line x1="${sx(p1[0])}" y1="${sy(p1[1])}" x2="${sx(p2[0])}" y2="${sy(p2[1])}" stroke="${col}" stroke-width="1.6" stroke-dasharray="6,4"/>`;
    s+=`<rect x="${sx(p1[0])+3}" y="${sy(p1[1])-15}" width="${lbl.length*5.9+10}" height="15" rx="3" fill="${col}" opacity="0.92"/>`;
    s+=`<text x="${sx(p1[0])+8}" y="${sy(p1[1])-4}" font-size="9.5" font-weight="600" fill="#fff">${lbl}</text>`;
  });

  // Zone names in the corners they occupy
  s+=`<text x="${ML+8}" y="${MT+16}" font-size="10.5" font-weight="700" fill="#dc2626" opacity="0.75">Speed</text>`;
  s+=`<text x="${W-MR-8}" y="${MT+CH-8}" font-size="10.5" font-weight="700" fill="#16a34a" opacity="0.75" text-anchor="end">Endurance</text>`;

  // Grid + axes
  const tick=(lo,hi)=>{const r=hi-lo;const st=r<=2?0.5:r<=5?1:2;const out=[];
    for(let v=Math.ceil(lo/st)*st; v<=hi+1e-9; v+=st) out.push(+v.toFixed(2)); return out;};
  tick(xMin,xMax).forEach(v=>{
    s+=`<line x1="${sx(v)}" y1="${MT}" x2="${sx(v)}" y2="${MT+CH}" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>`;
    s+=`<text x="${sx(v)}" y="${MT+CH+16}" font-size="9.5" fill="#7a8290" text-anchor="middle">${v}</text>`;});
  tick(yMin,yMax).forEach(v=>{
    s+=`<line x1="${ML}" y1="${sy(v)}" x2="${ML+CW}" y2="${sy(v)}" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>`;
    s+=`<text x="${ML-7}" y="${sy(v)+3}" font-size="9.5" fill="#7a8290" text-anchor="end">${v}</text>`;});
  s+=`<rect x="${ML}" y="${MT}" width="${CW}" height="${CH}" fill="none" stroke="#e4e6ea" stroke-width="1"/>`;
  s+=`<text x="${ML+CW/2}" y="${H-8}" font-size="11" fill="#444c56" font-weight="500" text-anchor="middle">MAS (m/s)</text>`;
  s+=`<text x="13" y="${MT+CH/2}" font-size="11" fill="#444c56" font-weight="500" text-anchor="middle" transform="rotate(-90,13,${MT+CH/2})">MSS (m/s)</text>`;

  // Other athletes, anonymous
  pts.filter(p=>!p.isCur).forEach(p=>{
    s+=`<circle cx="${sx(p.mas)}" cy="${sy(p.mss)}" r="6.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>`;
  });
  // Selected athlete
  const cur=pts.find(p=>p.isCur);
  const cls=classifySRR(+(cur.mss/cur.mas).toFixed(2));
  s+=`<circle cx="${sx(cur.mas)}" cy="${sy(cur.mss)}" r="12" fill="${cls.col}" stroke="#fff" stroke-width="2.5"/>`;
  s+=`<text x="${sx(cur.mas)}" y="${sy(cur.mss)+4}" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">${cur.ini}</text>`;
  const lx=sx(cur.mas)+16>W-MR-95?sx(cur.mas)-16:sx(cur.mas)+16;
  const la=sx(cur.mas)+16>W-MR-95?'end':'start';
  const ly=sy(cur.mss)-10<MT+18?sy(cur.mss)+22:sy(cur.mss)-10;
  s+=`<text x="${lx}" y="${ly}" font-size="11" font-weight="600" fill="#0d1117" text-anchor="${la}">${cur.name}</text>`;
  s+=`<text x="${lx}" y="${ly+13}" font-size="10" fill="#7a8290" text-anchor="${la}">SRR ${(cur.mss/cur.mas).toFixed(2)} · ${cls.label}</text>`;
  s+='</svg>';
  return s;
}

function renderASR() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('asrContent');
  if (!a || !el) return;
  if (!a.sessions.length) { el.innerHTML='<p style="color:var(--text-muted)">No sessions recorded.</p>'; return; }

  const ld  = buildLatestAcrossSessions(a.sessions);
  const mas = resolveMAS(ld);
  const mss = ld.max_vel;

  if (!mas || mss == null) {
    const missing = [];
    if (!mas)        missing.push('an aerobic test (5-min TT, distance TT, Yo-Yo, or beep test)');
    if (mss == null) missing.push('max velocity (20m fly)');
    el.innerHTML = `<div style="padding:28px 20px;text-align:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px">
      <h3 style="font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">Not enough data</h3>
      <p style="font-size:13px;color:var(--text-muted);max-width:420px;margin:0 auto;line-height:1.6">
        Anaerobic Speed Reserve needs both a maximal aerobic speed and a maximal sprint speed.<br><br>
        Missing: <strong>${missing.join(' and ')}</strong>.</p></div>`;
    return;
  }

  const MAS = mas.val, MSS = mss;
  const ASR = +(MSS - MAS).toFixed(2);
  const SRR = +(MSS / MAS).toFixed(2);
  const cls = classifySRR(SRR);
  const kmh = v => (v*3.6).toFixed(1);
