// ─── TEST HISTORY LOG ────────────────────────────────────────────────────────
function renderHistory() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('historyContent');
  if (!a || !el) return;
  if (!a.sessions.length) { el.innerHTML='<p style="color:var(--text-muted);padding:8px">No sessions recorded.</p>'; return; }

  const COLS = [
    { key:'broad_jump', label:'Broad jump',   u:'cm',  cat:'Jump' },
    { key:'slbj_L',     label:'SL jump L',    u:'cm',  cat:'Jump' },
    { key:'slbj_R',     label:'SL jump R',    u:'cm',  cat:'Jump' },
    { key:'slbj_LSI',   label:'LSI',          u:'%',   cat:'Jump' },
    { key:'triple_hop',     label:'Triple hop',   u:'cm', cat:'Jump' },
    { key:'triple_hop_L',   label:'T-hop L',      u:'cm', cat:'Jump' },
    { key:'triple_hop_R',   label:'T-hop R',      u:'cm', cat:'Jump' },
    { key:'triple_hop_LSI', label:'T-hop LSI',    u:'%',  cat:'Jump' },
    { key:'cmj',        label:'CMJ',          u:'cm',  cat:'Jump' },
    { key:'sj',            label:'SJ',            u:'cm',   cat:'Jump' },
    { key:'cmj_flight',    label:'CMJ flight',    u:'cm',   cat:'Jump' },
    { key:'sj_flight',     label:'SJ flight',     u:'cm',   cat:'Jump' },
    { key:'cmj_con_force', label:'CMJ con force', u:'N/kg', cat:'Jump' },
    { key:'eur',        label:'EUR',          u:'',    cat:'Jump' },
    { key:'cmj_mrsi',   label:'CMJ mRSI',     u:'m/s', cat:'Jump' },
    { key:'dj',         label:'DJ',           u:'cm',  cat:'Jump' },
    { key:'dj_rsi',     label:'DJ RSI',       u:'m/s', cat:'Jump' },
    { key:'dsi',        label:'DSI',          u:'',    cat:'Jump' },
    { key:'mas',        label:'MAS',          u:'m/s', cat:'Aerobic' },
    { key:'vo2max',     label:'VO₂max',       u:'ml/kg/min', cat:'Aerobic' },
    { key:'tt_speed',   label:'TT speed',     u:'m/s', cat:'Aerobic' },
    { key:'yoyo_ir2',   label:'Yo-Yo IR2',    u:'m',   cat:'Aerobic' },
    { key:'beep_level', label:'Beep',         u:'lvl', cat:'Aerobic' },
    { key:'bronco',     label:'Bronco',       u:'s',   cat:'Aerobic', lb:true },
    { key:'sq_1rm_bw',  label:'Squat ×BW',   u:'',    cat:'Strength' },
    { key:'tb_1rm_bw',  label:'Trap DL ×BW', u:'',    cat:'Strength' },
    { key:'bp_1rm_bw',  label:'Bench ×BW',   u:'',    cat:'Strength' },
    { key:'imtp',       label:'IMTP',         u:'N/kg',cat:'Strength' },
    { key:'sprint10',   label:'10m',          u:'s',   cat:'Speed', lb:true },
    { key:'sprint20',   label:'20m',          u:'s',   cat:'Speed', lb:true },
    { key:'max_vel',    label:'Max vel',      u:'m/s', cat:'Speed' },
  ];

  const sessions = [...a.sessions].reverse(); // oldest → newest
  const activeCols = COLS.filter(c => sessions.some(s => s[c.key] != null));
  const cats = ['Jump','Aerobic','Strength','Speed'];
  const catSpans = cats.map(cat => ({ cat, count: activeCols.filter(c=>c.cat===cat).length })).filter(c=>c.count>0);

  const scoreColor = (key, val) => {
    if (val==null) return '';
    const s = bs(val, key); if (s===null) return '';
    return SCORE_COLS[s];
  };

  const fmtCell = (key, val) => {
    if (val==null) return `<span style="color:var(--border)">—</span>`;
    let display = val;
    if (key==='bronco') display = fmtTime(val);
    else if (key==='tt_speed') display = val.toFixed(2);
    else if (typeof val==='number' && !Number.isInteger(val)) display = val < 5 ? val.toFixed(2) : val.toFixed(1);
    const col = scoreColor(key, val);
    return `<span style="${col?`color:${col};font-weight:700`:'color:var(--text-secondary)'}">${display}</span>`;
  };

  const th = (txt, extra='') => `<th style="padding:6px 9px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);background:var(--surface-alt);border:1px solid var(--border);white-space:nowrap;text-align:center${extra}">${txt}</th>`;

  let t = `<table style="border-collapse:collapse;font-size:11px">
  <thead>
    <tr>
      <th style="padding:6px 10px;font-size:9px;font-weight:700;color:var(--text-muted);background:var(--surface-alt);border:1px solid var(--border);text-align:left;position:sticky;left:0;z-index:2" rowspan="2">Date</th>
      ${catSpans.map(c=>`<th colspan="${c.count}" style="padding:6px 9px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--surface-alt);border:1px solid var(--border);border-bottom:2px solid var(--accent);text-align:center">${c.cat}</th>`).join('')}
    </tr>
    <tr>${activeCols.map(c=>th(`${c.label}${c.u?`<br><span style="font-weight:400;font-size:8px;opacity:.7">${c.u}</span>`:''}`)).join('')}</tr>
  </thead>
  <tbody>`;

  sessions.forEach((s,i) => {
    const bg = i%2===0 ? 'var(--surface)' : 'var(--surface-alt)';
    const noteHtml = s.notes ? `<br><span style="font-size:9px;color:var(--text-muted);font-style:italic;font-weight:400">${s.notes}</span>` : '';
    t += `<tr>
      <td style="padding:6px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);background:${bg};border:1px solid var(--border);position:sticky;left:0;z-index:1;min-width:88px">${s.test_date||'—'}${noteHtml}</td>
      ${activeCols.map(c=>`<td style="padding:5px 9px;text-align:center;background:${bg};border:1px solid var(--border)">${fmtCell(c.key,s[c.key])}</td>`).join('')}
    </tr>`;
  });

  el.innerHTML = t + `</tbody></table>
  <p style="font-size:10px;color:var(--text-muted);margin-top:8px">Oldest → newest · Values colour-coded: <span style="color:#16a34a">●</span> Above Standard <span style="color:#1a56db">●</span> At Standard <span style="color:#ca8a04">●</span> Approaching <span style="color:#ea580c">●</span> Building <span style="color:#dc2626">●</span> Primary Focus</p>`;
}

// ─── ATHLETIC PROFILE RADAR ──────────────────────────────────────────────────
let radarMode = 'domains'; // 'domains' | 'tests'

const RADAR_DOMAINS = [
  { label:'Jump / Power', short:'Jump',     keys:['broad_jump','triple_hop','cmj','cmj_flight','sj','sj_flight','eur','cmj_mrsi','cmj_con_force','dj','dj_rsi','dsi'] },
  { label:'Speed',        short:'Speed',    keys:['sprint10','sprint20','max_vel'] },
  { label:'Strength',     short:'Strength', keys:['sq_1rm_bw','tb_1rm_bw','bp_1rm_bw','imtp'] },
  { label:'Aerobic',      short:'Aerobic',  keys:['mas','vo2max','yoyo_ir2','beep_level','bronco'] },
  { label:'Symmetry',     short:'Symmetry', keys:['slbj_LSI','triple_hop_LSI'] },
];

function setRadarMode(m, btn) {
  radarMode = m;
  document.querySelectorAll('.radar-mode-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderRadar();
}

function renderRadar() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('radarContent');
  if (!a || !el) return;
  if (!a.sessions.length) { el.innerHTML='<p style="color:var(--text-muted)">No sessions recorded.</p>'; return; }

  const ld = buildLatestAcrossSessions(a.sessions);
  const scCol = s => s===null ? '#c3c9d1'
    : SCORE_COLS[Math.max(0,Math.min(4,Math.round(s)))];

  // ── Build axis set for the chosen mode ──────────────────────────────────
  let axes; // [{label, short, score, detail}]
  if (radarMode === 'tests') {
    axes = [];
    RADAR_DOMAINS.forEach(dm => dm.keys.forEach(k => {
      const sc = bs(ld[k], k);
      if (sc === null) return;
      const n = NORMS[k];
      let lbl = (n.label||k).replace(/\s*\(.*?\)\s*/g,'').trim();
      if (lbl.length > 15) lbl = lbl.slice(0,14)+'…';
      axes.push({ label:lbl, short:lbl, score:sc, val:ld[k], u:n.u, domain:dm.short });
    }));
    if (axes.length < 3) {
      el.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-muted);font-size:13px">
        Not enough tested metrics for a detailed profile — at least 3 are needed.<br>
        <button class="btn-sm" style="margin-top:12px" onclick="setRadarMode('domains')">Show domain view</button></div>`;
      return;
    }
  } else {
    axes = RADAR_DOMAINS.map(dm => {
      const ss = dm.keys.map(k=>bs(ld[k],k)).filter(s=>s!==null);
      return { label:dm.label, short:dm.short, score: ss.length ? +(ss.reduce((x,y)=>x+y,0)/ss.length) : null };
    });
  }

  // ── Geometry ────────────────────────────────────────────────────────────
  const N = axes.length;
  const W = 540, H = 500, CX = W/2, CY = 245;
  const R  = N > 8 ? 140 : 155;
  const ang = i => -Math.PI/2 + i*2*Math.PI/N;
  const pt  = (i,f) => ({ x:+(CX+R*f*Math.cos(ang(i))).toFixed(1), y:+(CY+R*f*Math.sin(ang(i))).toFixed(1) });
  const poly = fs => fs.map((f,i)=>`${pt(i,f).x},${pt(i,f).y}`).join(' ');

  const vals = axes.map(x=>x.score).filter(s=>s!==null);
  const overall = vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : null;
  const pCol = scCol(overall);

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:540px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="${pCol}" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="${pCol}" stop-opacity="0.14"/>
    </radialGradient>
    <filter id="radarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="${pCol}" flood-opacity="0.22"/>
    </filter>
  </defs>`;

  // ── Spider, drawn in the match-report idiom: hairline rings, one solid blue
  //    outline for the athlete, a dotted ring for the professional benchmark,
  //    and wide-tracked caps for the axis labels. Status colour is carried by
  //    the vertex dots rather than by a filled shape.
  const dkR = !!document.getElementById('radarContent')?.closest('.sec.dark');
  const rRule = dkR ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.12)';
  const rText = dkR ? '#A6A39D' : '#8A8883';
  const rName = dkR ? '#F2EFE9' : '#161616';
  const rBlue = '#1E44B0', rBlueL = '#7C9BEA';

  [1,2,3,4].forEach(sc => {
    svg += `<polygon points="${poly(Array(N).fill(sc/4))}" fill="none"
      stroke="${rRule}" stroke-width="${sc===4?1:.7}" stroke-linejoin="round"/>`;
  });
  for (let i=0;i<N;i++){
    const t = pt(i,1);
    svg += `<line x1="${CX}" y1="${CY}" x2="${t.x}" y2="${t.y}" stroke="${rRule}" stroke-width=".7"/>`;
  }

  // Benchmark ring — dotted, as "your average" on the report
  svg += `<polygon points="${poly(Array(N).fill(0.75))}" fill="none"
    stroke="${dkR?'#8F8D88':'#B9B6AF'}" stroke-width="1" stroke-dasharray="2,3" stroke-linejoin="round"/>`;

  if (vals.length) {
    const fracs = axes.map(x => x.score!==null ? Math.max(x.score/4, 0.02) : 0.02);
    svg += `<polygon points="${poly(fracs)}" fill="${rBlue}" fill-opacity="${dkR?.14:.09}"
      stroke="${dkR?rBlueL:rBlue}" stroke-width="1.8" stroke-linejoin="round"/>`;
    axes.forEach((x,i)=>{
      if (x.score===null) return;
      const p = pt(i, Math.max(x.score/4,0.02));
      svg += `<circle cx="${p.x}" cy="${p.y}" r="3.6" fill="${scCol(x.score)}"
        stroke="${dkR?'#2A2A2A':'#F7F6F2'}" stroke-width="1.4"/>`;
      if (x.score>=4){
        const st = pt(i, Math.max(x.score/4,0.02)+0.1);
        svg += `<text x="${st.x}" y="${+st.y+3}" font-size="9" fill="${dkR?rBlueL:rBlue}" text-anchor="middle">★</text>`;
      }
    });
  }

  // Axis labels — tiny, wide-tracked, uppercase
  axes.forEach((x,i)=>{
    const lf = N > 8 ? 1.22 : 1.18;
    const lp = pt(i, lf);
    const anc = lp.x < CX-8 ? 'end' : lp.x > CX+8 ? 'start' : 'middle';
    const fs  = N > 8 ? 7.5 : 8.5;
    svg += `<text x="${lp.x}" y="${lp.y}" font-size="${fs}" letter-spacing="1.3"
      fill="${rName}" text-anchor="${anc}">${(x.label||'').toUpperCase()}</text>`;
    if (x.score!==null) {
      svg += `<text x="${lp.x}" y="${+lp.y+(N>8?10:12)}" font-size="${N>8?7:7.5}" letter-spacing=".9"
        fill="${rText}" text-anchor="${anc}">${x.score.toFixed(1)} / 4</text>`;
    }
  });

  // Ring scale numbers
  [1,2,3,4].forEach(sc=>{
    const p = pt(0, sc/4);
    svg += `<text x="${+p.x+6}" y="${+p.y+3}" font-size="7" fill="${rText}" opacity=".7">${sc}</text>`;
  });

  // Centre score
  if (overall!==null) {
    svg += `<circle cx="${CX}" cy="${CY}" r="27" fill="#fff" stroke="${pCol}" stroke-width="2"/>`;
    svg += `<text x="${CX}" y="${CY-1}" font-size="17" font-weight="700" fill="${pCol}" text-anchor="middle">${overall.toFixed(1)}</text>`;
    svg += `<text x="${CX}" y="${CY+12}" font-size="7.5" fill="#9aa3ad" text-anchor="middle">OVERALL</text>`;
  }
  svg += '</svg>';

  // ── Mode toggle ─────────────────────────────────────────────────────────
  const toggle = `
    <div class="quad-ctrl-row" style="justify-content:center;margin-bottom:2px">
      <span class="control-label">View</span>
      <button class="axis-btn radar-mode-btn${radarMode==='domains'?' active':''}" onclick="setRadarMode('domains',this)">Domains</button>
      <button class="axis-btn radar-mode-btn${radarMode==='tests'?' active':''}" onclick="setRadarMode('tests',this)">All tests</button>
    </div>`;

  // ── Breakdown panel — every contributing test per domain ────────────────
  const breakdown = RADAR_DOMAINS.map(dm => {
    const rows = dm.keys.map(k=>({k,sc:bs(ld[k],k),val:ld[k],n:NORMS[k]}))
                        .filter(r=>r.val!=null && r.sc!==null);
    const ss = rows.map(r=>r.sc);
    const avg = ss.length ? ss.reduce((x,y)=>x+y,0)/ss.length : null;
    const dCol = scCol(avg);
    const untested = dm.keys.filter(k=>ld[k]==null).length;
    return `
      <div class="brk" style="padding:16px 20px 18px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px">
          <span class="eb">${dm.label}</span>
          <span style="font-size:19px;font-weight:300;color:${dCol};font-variant-numeric:tabular-nums">${avg!==null?avg.toFixed(1):'—'}<span style="font-size:10px;color:var(--muted);margin-left:3px">/ 4</span></span>
        </div>
        ${rows.length ? rows.map(r=>`
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
            <span style="flex:1;min-width:0;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.n.label}</span>
            <span style="font-size:13px;font-weight:300;white-space:nowrap;font-variant-numeric:tabular-nums">${r.val}<span style="font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:3px">${r.n.u}</span></span>
            <span style="display:inline-block;width:52px;height:3px;border-radius:2px;background:#DFDDD7;position:relative;flex-shrink:0">
              <span style="position:absolute;left:0;top:0;height:3px;border-radius:2px;width:${(r.sc/4*100).toFixed(0)}%;background:linear-gradient(90deg,var(--grad-0),var(--grad-mid))"></span>
              <span style="position:absolute;top:-2.5px;left:${(r.sc/4*100).toFixed(0)}%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:${scCol(r.sc)}"></span>
            </span>
          </div>`).join('')
        : '<div class="cap">No tested metrics</div>'}
        ${untested ? `<div class="cap" style="margin-top:10px">${untested} test${untested!==1?'s':''} not recorded</div>` : ''}
      </div>`;
  }).join('');

  const legend = `
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;font-size:10.5px;color:var(--text-muted);flex-wrap:wrap">
      <span><span style="display:inline-block;width:14px;height:3px;background:${pCol};vertical-align:middle;border-radius:2px;margin-right:5px"></span>${a.name}</span>
      <span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed rgba(26,86,219,0.5);vertical-align:middle;margin-right:5px"></span>Professional benchmark</span>
      <span style="color:#c3c9d1">Rings = benchmark score 1–4</span>
    </div>`;

  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%">
      ${toggle}
      ${svg}
      ${legend}
      <div style="width:100%;margin-top:8px">
        <div class="eb" style="margin-bottom:14px">Domain breakdown</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:18px">${breakdown}</div>
      </div>
    </div>`;
}

// ─── ANAEROBIC SPEED RESERVE ────────────────────────────────────────────────
// ASR = MSS - MAS ; SRR = MSS / MAS
// Profile: Speed >=1.90 | Hybrid 1.70-1.90 | Endurance <1.70
function resolveMAS(ld) {
  // d.mas is resolved in deriveSession (5-min TT > distance TT > VO2max estimate)
  // and carries its own source label.
  if (ld.mas != null) return { val: ld.mas, src: ld.mas_src || 'aerobic test' };
  return null;
}

function classifySRR(srr) {
  if (srr >= 1.90) return {
    label:'Speed', col:'#C2563B', bg:'rgba(194,86,59,.10)',
    desc:'Fast-twitch dominant with high power output, but fatigues quickly.'
  };
  if (srr >= 1.70) return {
    label:'Hybrid', col:'#2A4FB7', bg:'rgba(42,79,183,.09)',
    desc:'Balanced fibre composition with versatile training tolerance.'
  };
  return {
    label:'Endurance', col:'#5E9E76', bg:'rgba(94,158,118,.12)',
    desc:'Slow-twitch dominant with high volume tolerance.'
  };
}

// ── MAS vs MSS profile zones ────────────────────────────────────────────────
// SRR = MSS/MAS, so each classification boundary is a straight line through the
// origin: MSS = 1.90*MAS (Speed) and MSS = 1.70*MAS (Hybrid). Zones are drawn by
// clipping the plot rectangle against each half-plane, then layering.
function mssZoneSvg(selId) {
  // Gather every athlete that has both values
  const pts = [];
  Object.values(athleteMap).forEach(a => {
    if (!a.sessions || !a.sessions.length) return;
    const ld = buildLatestAcrossSessions(a.sessions);
    const m = resolveMAS(ld), s = ld.max_vel;
    if (!m || s == null) return;
    pts.push({ id:a.id, name:a.name, mas:m.val, mss:s,
               ini:a.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
               isCur:a.id===selId });
  });
  if (!pts.some(p=>p.isCur)) return '';

  const W=620,H=420,ML=54,MR=22,MT=20,MB=50;
  const CW=W-ML-MR, CH=H-MT-MB;

  const masVals=pts.map(p=>p.mas), mssVals=pts.map(p=>p.mss);
  const pad=(lo,hi,min)=>{ let r=hi-lo; if(r<min){const c=(lo+hi)/2; lo=c-min/2; hi=c+min/2; r=min;} 
                           return [lo-r*0.18, hi+r*0.18]; };
  let [xMin,xMax]=pad(Math.min(...masVals),Math.max(...masVals),1.2);
  let [yMin,yMax]=pad(Math.min(...mssVals),Math.max(...mssVals),1.8);
  xMin=Math.max(0.5,xMin); yMin=Math.max(1,yMin);

  const sx=v=>ML+(v-xMin)/(xMax-xMin)*CW;
  const sy=v=>MT+CH-(v-yMin)/(yMax-yMin)*CH;

  // Clip a polygon to the half-plane  y - k*x >= 0  (Sutherland–Hodgman)
  const clipAbove=(poly,k)=>{
    const f=p=>p.y-k*p.x, out=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length], fa=f(a), fb=f(b);
      if(fa>=0) out.push(a);
      if((fa>=0)!==(fb>=0)){
        const t=fa/(fa-fb);
        out.push({x:a.x+t*(b.x-a.x), y:a.y+t*(b.y-a.y)});
      }
    }
    return out;
  };
  const rect=[{x:xMin,y:yMin},{x:xMax,y:yMin},{x:xMax,y:yMax},{x:xMin,y:yMax}];
  const toPath=poly=>poly.length?poly.map(p=>`${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' '):'';

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">`;
  // Layer: whole rect = Endurance, then Hybrid above 1.70, then Speed above 1.90
  s+=`<rect x="${ML}" y="${MT}" width="${CW}" height="${CH}" fill="rgba(94,158,118,.08)"/>`;
  const hyb=clipAbove(rect,1.70), spd=clipAbove(rect,1.90);
  if(hyb.length) s+=`<polygon points="${toPath(hyb)}" fill="rgba(42,79,183,.06)"/>`;
  if(spd.length) s+=`<polygon points="${toPath(spd)}" fill="rgba(194,86,59,.06)"/>`;

  // Boundary lines
  [[1.90,'#C2563B','SPEED ≥ 1.90'],[1.70,'#2A4FB7','HYBRID ≥ 1.70']].forEach(([k,col,lbl])=>{
    const ptsOn=[];
    [[xMin,k*xMin],[xMax,k*xMax],[yMin/k,yMin],[yMax/k,yMax]].forEach(([px,py])=>{
      if(px>=xMin-1e-9&&px<=xMax+1e-9&&py>=yMin-1e-9&&py<=yMax+1e-9) ptsOn.push([px,py]);
    });
    if(ptsOn.length<2) return;
    ptsOn.sort((a,b)=>a[0]-b[0]);
    const [p1,p2]=[ptsOn[0],ptsOn[ptsOn.length-1]];
    s+=`<line x1="${sx(p1[0])}" y1="${sy(p1[1])}" x2="${sx(p2[0])}" y2="${sy(p2[1])}" stroke="${col}" stroke-width="1" stroke-dasharray="3,4"/>`;
    s+=`<rect x="${sx(p1[0])+3}" y="${sy(p1[1])-15}" width="${lbl.length*6.1+12}" height="14" rx="7" fill="${col}" opacity="0.14"/>`;
    s+=`<text x="${sx(p1[0])+8}" y="${sy(p1[1])-4}" font-size="7.5" letter-spacing="1" fill="${col}">${lbl}</text>`;
  });

  // Zone names in the corners they occupy
  s+=`<text x="${ML+8}" y="${MT+16}" font-size="8" letter-spacing="1.5" fill="#C2563B" opacity="0.8">SPEED</text>`;
  s+=`<text x="${W-MR-8}" y="${MT+CH-8}" font-size="8" letter-spacing="1.5" fill="#5E9E76" opacity="0.8" text-anchor="end">ENDURANCE</text>`;

  // Grid + axes
  const tick=(lo,hi)=>{const r=hi-lo;const st=r<=2?0.5:r<=5?1:2;const out=[];
    for(let v=Math.ceil(lo/st)*st; v<=hi+1e-9; v+=st) out.push(+v.toFixed(2)); return out;};
  tick(xMin,xMax).forEach(v=>{
    s+=`<line x1="${sx(v)}" y1="${MT}" x2="${sx(v)}" y2="${MT+CH}" stroke="rgba(22,22,22,.055)" stroke-width=".7"/>`;
    s+=`<text x="${sx(v)}" y="${MT+CH+16}" font-size="7.5" letter-spacing=".6" fill="#8A8986" text-anchor="middle">${v}</text>`;});
  tick(yMin,yMax).forEach(v=>{
    s+=`<line x1="${ML}" y1="${sy(v)}" x2="${ML+CW}" y2="${sy(v)}" stroke="rgba(15,23,42,0.06)" stroke-width="1"/>`;
    s+=`<text x="${ML-7}" y="${sy(v)+3}" font-size="7.5" letter-spacing=".6" fill="#8A8986" text-anchor="end">${v}</text>`;});
  s+=`<rect x="${ML}" y="${MT}" width="${CW}" height="${CH}" fill="none" stroke="#D7D6D2" stroke-width=".8"/>`;
  s+=`<text x="${ML+CW/2}" y="${H-8}" font-size="8" letter-spacing="1.8" fill="#706F6D" text-anchor="middle">MAS (M/S)</text>`;
  s+=`<text x="13" y="${MT+CH/2}" font-size="8" letter-spacing="1.8" fill="#706F6D" text-anchor="middle" transform="rotate(-90,13,${MT+CH/2})">MSS (M/S)</text>`;

  // Other athletes, anonymous
  pts.filter(p=>!p.isCur).forEach(p=>{
    s+=`<circle cx="${sx(p.mas)}" cy="${sy(p.mss)}" r="5" fill="#C7C5C0" stroke="none" opacity="0.9"/>`;
  });
  // Selected athlete
  const cur=pts.find(p=>p.isCur);
  const cls=classifySRR(+(cur.mss/cur.mas).toFixed(2));
  s+=`<circle cx="${sx(cur.mas)}" cy="${sy(cur.mss)}" r="11" fill="${cls.col}" stroke="#F7F6F2" stroke-width="2.5"/>`;
  s+=`<text x="${sx(cur.mas)}" y="${sy(cur.mss)+4}" font-size="8" letter-spacing=".6" fill="#fff" text-anchor="middle">${cur.ini}</text>`;
  const lx=sx(cur.mas)+16>W-MR-95?sx(cur.mas)-16:sx(cur.mas)+16;
  const la=sx(cur.mas)+16>W-MR-95?'end':'start';
  const ly=sy(cur.mss)-10<MT+18?sy(cur.mss)+22:sy(cur.mss)-10;
  s+=`<text x="${lx}" y="${ly}" font-size="9" letter-spacing="1.2" fill="#161616" text-anchor="${la}">${cur.name.toUpperCase()}</text>`;
  s+=`<text x="${lx}" y="${ly+13}" font-size="8.5" fill="#8A8986" text-anchor="${la}">SRR ${(cur.mss/cur.mas).toFixed(2)} · ${cls.label}</text>`;
  s+='</svg>';
  return s;
}

function renderASR() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('asrContent');
  if (!a || !el) return;
  if (!a.sessions.length) { el.innerHTML='<p style="color:var(--text-muted)">No sessions recorded.</p>'; return; }

  const ld  = buildLatestAcrossSessions(a.sessions);
  const mas = resolveMAS(ld);
  const mss = ld.max_vel;

  if (!mas || mss == null) {
    const missing = [];
    if (!mas)        missing.push('an aerobic test (5-min TT, distance TT, Yo-Yo, or beep test)');
    if (mss == null) missing.push('max velocity (20m fly)');
    el.innerHTML = `<div style="padding:28px 20px;text-align:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px">
      <h3 style="font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">Not enough data</h3>
      <p style="font-size:13px;color:var(--text-muted);max-width:420px;margin:0 auto;line-height:1.6">
        Anaerobic Speed Reserve needs both a maximal aerobic speed and a maximal sprint speed.<br><br>
        Missing: <strong>${missing.join(' and ')}</strong>.</p></div>`;
    return;
  }

  const MAS = mas.val, MSS = mss;
  const ASR = +(MSS - MAS).toFixed(2);
  const SRR = +(MSS / MAS).toFixed(2);
  const cls = classifySRR(SRR);
  const kmh = v => (v*3.6).toFixed(1);

  const W=640, H=210, ML=20, MR=20, BY=74, BH=52;
  const CW=W-ML-MR;
  const scaleMax = MSS*1.08;
  const px = v => ML + (v/scaleMax)*CW;
  const masW = px(MAS)-ML, asrW = px(MSS)-px(MAS);

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:640px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">`;
  s+=`<defs>
    <linearGradient id="asrMas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A4FB7"/><stop offset="100%" stop-color="#7292E4"/></linearGradient>
    <linearGradient id="asrRes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FB6EE"/><stop offset="100%" stop-color="#E4EAFA"/></linearGradient>
  </defs>`;
  // full span, then the aerobic portion and the reserve above it
  s+=`<rect x="${ML}" y="${BY+BH/2-2}" width="${CW}" height="4" fill="#E4E2DC" rx="2"/>`;
  s+=`<rect x="${ML}" y="${BY+BH/2-5}" width="${masW}" height="10" fill="url(#asrMas)" rx="5"/>`;
  s+=`<rect x="${px(MAS)}" y="${BY+BH/2-5}" width="${asrW}" height="10" fill="url(#asrRes)" rx="5"/>`;
  // boundary ticks
  [[px(MAS),'#2A4FB7'],[px(MSS),'#5577D2']].forEach(([X,c])=>{
    s+=`<line x1="${X}" y1="${BY+BH/2-14}" x2="${X}" y2="${BY+BH/2+14}" stroke="${c}" stroke-width="1" stroke-dasharray="2,2"/>`;
    s+=`<circle cx="${X}" cy="${BY+BH/2}" r="5" fill="${c}" stroke="#F7F6F2" stroke-width="2"/>`;
  });
  // labels, wide-tracked caps above and plain values below
  s+=`<text x="${ML}" y="${BY-18}" font-size="8" letter-spacing="1.6" fill="#8A8986">0</text>`;
  s+=`<text x="${px(MAS)}" y="${BY-18}" font-size="8" letter-spacing="1.6" fill="#2A4FB7" text-anchor="middle">MAS ${MAS}</text>`;
  s+=`<text x="${px(MSS)}" y="${BY-18}" font-size="8" letter-spacing="1.6" fill="#5577D2" text-anchor="${px(MSS)>W-60?'end':'middle'}">MSS ${MSS}</text>`;
  s+=`<text x="${ML+masW/2}" y="${BY+BH/2+30}" font-size="8" letter-spacing="1.5" fill="#706F6D" text-anchor="middle">AEROBIC ${MAS} M/S</text>`;
  if (asrW>80) s+=`<text x="${px(MAS)+asrW/2}" y="${BY+BH/2+30}" font-size="8" letter-spacing="1.5" fill="#706F6D" text-anchor="middle">RESERVE ${ASR} M/S</text>`;
  s+=`<text x="${ML}" y="${BY+BH+30}" font-size="8" letter-spacing="1.2" fill="#A8A7A3">0 KM/H</text>`;
  s+=`<text x="${px(MSS)}" y="${BY+BH+30}" font-size="8" letter-spacing="1.2" fill="#A8A7A3" text-anchor="${px(MSS)>W-60?'end':'middle'}">${kmh(MSS)} KM/H</text>`;
  s+=`<text x="${ML+CW/2}" y="${H-6}" font-size="8" letter-spacing="1.5" fill="#A8A7A3" text-anchor="middle">SPEED BAND AVAILABLE ABOVE AEROBIC CAPACITY</text>`;
  s+='</svg>';

  const card = (lbl,val,unit,sub,col) => `
    <div class="brk" style="flex:1;min-width:132px;padding:16px 20px 18px">
      <div class="eb">${lbl}</div>
      <div class="big" style="font-size:32px;margin-top:10px">${val}<small>${unit}</small></div>
      ${sub?`<p class="cap" style="margin-top:8px">${sub}</p>`:''}
    </div>`;

  const srrMin=1.4, srrMax=2.3;
  const srrPct = Math.max(0,Math.min(100, ((SRR-srrMin)/(srrMax-srrMin))*100));
  const bandPct = v => ((v-srrMin)/(srrMax-srrMin))*100;
  const srrBar = `
    <div style="margin-top:6px">
      <div style="position:relative;height:10px;border-radius:5px;overflow:hidden;display:flex">
        <div style="width:${bandPct(1.70)}%;background:linear-gradient(90deg,#D4E2D8,#C2D8C9)"></div>
        <div style="width:${bandPct(1.90)-bandPct(1.70)}%;background:linear-gradient(90deg,#C9D6F7,#A8BCF2)"></div>
        <div style="width:${100-bandPct(1.90)}%;background:linear-gradient(90deg,#EDD6CD,#E3C0B3)"></div>
      </div>
      <div style="position:relative;height:0">
        <div style="position:absolute;left:${srrPct}%;top:-14px;transform:translateX(-50%);width:2px;height:18px;background:#161616"></div>
        <div style="position:absolute;left:${srrPct}%;top:8px;transform:translateX(-50%);font-size:15px;font-weight:300;color:#161616;white-space:nowrap;font-variant-numeric:tabular-nums">${SRR}</div>
      </div>
      <div style="display:flex;font-size:9.5px;color:var(--text-muted);margin-top:26px">
        <div style="width:${bandPct(1.70)}%;text-align:center;color:#5E9E76;font-size:8px;letter-spacing:.14em;text-transform:uppercase">Endurance &lt;1.70</div>
        <div style="width:${bandPct(1.90)-bandPct(1.70)}%;text-align:center;color:#2A4FB7;font-size:8px;letter-spacing:.14em;text-transform:uppercase">Hybrid 1.70–1.90</div>
        <div style="width:${100-bandPct(1.90)}%;text-align:center;color:#C2563B;font-size:8px;letter-spacing:.14em;text-transform:uppercase">Speed ≥1.90</div>
      </div>
    </div>`;

  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="control-label">Profile</div>
        <div class="chip" style="background:${cls.bg};color:${cls.col};box-shadow:inset 0 0 0 1px ${cls.col}55">
          <span style="width:7px;height:7px;border-radius:50%;background:${cls.col};display:inline-block"></span>
          <span>${cls.label}</span>
        </div>
        <span style="font-size:12px;color:var(--text-secondary)">${cls.desc}</span>
      </div>
      <div>${s}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${card('MAS',MAS,'m/s',`${kmh(MAS)} km/h · ${mas.src}`,'#1a56db')}
        ${card('MSS',MSS,'m/s',`${kmh(MSS)} km/h · 20m fly`,'#d97706')}
        ${card('ASR',ASR,'m/s',`${kmh(ASR)} km/h reserve`,'#7c3aed')}
        ${card('SRR',SRR,'',`MSS ÷ MAS`,cls.col)}
      </div>
      <div>
        <div style="font-size:9.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Speed Reserve Ratio</div>
        ${srrBar}
      </div>
      ${(()=>{ const z=mssZoneSvg(selectedId); return z ? `
      <div>
        <div style="font-size:9.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">MAS vs MSS profile zones</div>
        <div style="text-align:center">${z}</div>
        <div style="display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--text-muted);flex-wrap:wrap;justify-content:center;margin-top:4px">
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${cls.col};margin-right:4px;vertical-align:middle"></span>${a.name}</span>
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#cbd5e1;border:1px solid #94a3b8;margin-right:4px;vertical-align:middle"></span>Other athletes (anonymous)</span>
          <span style="color:#c3c9d1">Diagonals are fixed SRR ratios — zones widen as speeds rise</span>
        </div>
      </div>` : ''; })()}
      <p style="font-size:10.5px;color:var(--text-muted);line-height:1.6;margin-top:2px">
        SRR classification is sensitive to how MAS is determined — a 5-min time trial typically yields a higher MAS
        than an incremental protocol, which lowers SRR. MAS here was taken from <strong>${mas.src}</strong>.
        Compare athletes only when the same aerobic test was used.
      </p>
    </div>`;
}

// ─── MOTOR PREFERENCE (VueMotion) ───────────────────────────────────────────
// Framework: Wild, J.J. & Bezodis, N.E. — sprint acceleration technique and lower
// limb injury epidemiology in professional male Rugby Union (seven-season analysis).
// Axes are cohort z-scores: x = ground contact vs flight time, y = step length vs step rate.
let mpRunType = 'acc'; // 'acc' | 'fly'
let mpReference = 'study'; // 'study' | 'roster'

// ── Which sections appear on the athlete printout ───────────────────────────
// Stored in the same localStorage config as the sheet URLs.
const PRINT_SECTIONS = [
  { key:'radar',    label:'Athletic Profile (spider)', def:true  },
  { key:'charts',   label:'Trend Charts',              def:true  },
  { key:'quadrant', label:'Strength-Speed Quadrant',   def:true  },
  { key:'motorpref',label:'Motor Preference',          def:false },
  { key:'speedres', label:'Speed Reserve',             def:true  },
  { key:'feedback', label:'Athlete Message',           def:true  },
];
function printPrefs() {
  const saved = getConfig().printSections || {};
  const out = {};
  PRINT_SECTIONS.forEach(s => { out[s.key] = (saved[s.key] === undefined) ? s.def : !!saved[s.key]; });
  return out;
}
function togglePrintSection(key, on) {
  const cfg = getConfig();
  const ps = cfg.printSections || {};
  ps[key] = !!on;
  saveConfig({ ...cfg, printSections: ps });
}

// ── Wild & Bezodis (2026) reference values ──────────────────────────────────
// Reconstructed by pooling the four group tables in Figure 1 (n=85, 63,786 hr).
// Validated: pooled n = 85 exactly; all four centroids fall in their stated quadrant.
// Ratios are dimensionless (Hof 1996 normalisation).
const MP_STUDY = {
  slsr: { mean:1.1162, sd:0.1075 },   // step length / step rate
  ctft: { mean:2.3169, sd:0.3874 },   // contact time / flight time
  groups: {
    bounders:{ n:25, exp:22460, sl:1.57, sr:1.29, slsr:1.22, ct:0.517, ft:0.260, ctft:2.00, burden:65.0 },
    striders:{ n:16, exp:13311, sl:1.53, sr:1.30, slsr:1.18, ct:0.560, ft:0.212, ctft:2.65, burden:30.9 },
    bouncers:{ n:18, exp:10283, sl:1.45, sr:1.40, slsr:1.04, ct:0.476, ft:0.242, ctft:1.98, burden:22.9 },
    spinners:{ n:26, exp:17909, sl:1.42, sr:1.39, slsr:1.03, ct:0.527, ft:0.199, ctft:2.65, burden:52.1 },
  }
};
const G_ACCEL = 9.81;
// Leg length: measured value preferred; 0.53 x height is a rough fallback.
// The SL/SR axis scales with leg length^1.5, so this matters a great deal.
const LEG_LENGTH_RATIO_DEFAULT = 0.53;

// Solve for the leg-length ratio implied by an athlete who has BOTH raw values and a
// VueMotion chart position. Applying that ratio to everyone absorbs whatever leg-length
// definition VueMotion uses, so estimated athletes line up with the charted one.
function mpCalibratedRatio() {
  const cfg = getConfig();
  if (cfg.legRatio) return { r:+cfg.legRatio, source:'set manually' };
  for (const a of Object.values(athleteMap)) {
    const h = pf(a.height_cm); if (!h) continue;
    for (const pfx of ['acc','fly']) {
      const gv = k => latestVal(a.sessions, pfx+'_'+k);
      const chartY = gv('mp_y') != null ? gv('mp_y')
                   : (gv('mp_y_L')!=null && gv('mp_y_R')!=null ? (gv('mp_y_L')+gv('mp_y_R'))/2 : null);
      if (chartY == null) continue;
      const avg=(x,y)=>(x!=null&&y!=null)?(x+y)/2:(x!=null?x:y);
      const sA=avg(gv('sl_L'),gv('sl_R')), qA=avg(gv('sf_L'),gv('sf_R'));
      if (sA==null || !qA) continue;
      const targetRatio = MP_STUDY.slsr.mean + chartY*MP_STUDY.slsr.sd;
      if (targetRatio <= 0) continue;
      const l0 = Math.pow((sA*Math.sqrt(G_ACCEL))/(qA*targetRatio), 2/3);
      const r = l0/(h/100);
      if (r > 0.40 && r < 0.70) return { r:+r.toFixed(3), source:`calibrated from ${a.name}`, from:a.name };
    }
  }
  return null;
}

function mpLegLength(a) {
  const measured = pf(a?.leg_length_cm);
  if (measured) return { m: measured/100, estimated:false, ratio:null, calib:null };
  const h = pf(a?.height_cm); if (!h) return null;
  const cal = mpCalibratedRatio();
  const r = cal ? cal.r : LEG_LENGTH_RATIO_DEFAULT;
  return { m:(h*r)/100, estimated:true, ratio:r, calib:cal };
}

// Relative risks from Wild, Bezodis et al. — 85 professional male Rugby Union players,
// 7 seasons, 63,786 player-hours, 123 non-contact lower-limb running injuries.
// The study's own smallest-association thresholds were 1.85 (raised) and 0.38 (lowered);
// values beyond those AND statistically significant are marked below.
// Compass bearings are the study's original group names.
const MP_RR_UPPER = 1.85, MP_RR_LOWER = 0.38;
const MP_QUADRANTS = {
  bounders: { name:'Bounders', bearing:'NW', sub:'Long step length / long flight time',
              rr:{ 'Hip/groin':0.34, 'Hamstring':0.70, 'Calf':2.53 }, flag:['Calf'],
              note:'Highest overall injury burden of the four strategies. Greater plantarflexor and Achilles loading — longer flight raises downward velocity at touchdown while shorter contact demands more force per unit time.' },
  striders: { name:'Striders', bearing:'NE', sub:'Long step length / long contact time',
              rr:{ 'Hip/groin':0.70, 'Hamstring':0.55, 'Calf':0.93 }, flag:[],
              note:'Lowest risk profile across all three sites. Longer contact and shorter flight shift load toward the knee extensors rather than the plantarflexors.' },
  bouncers: { name:'Bouncers', bearing:'SW', sub:'High step rate / short contact time',
              rr:{ 'Hip/groin':2.12, 'Hamstring':0.51, 'Calf':0.86 }, flag:[],
              note:'Highest share of hip/groin injuries (35%), though not statistically significant — confidence intervals overlapped. Rapid limb repositioning spikes hip flexor force late in stance.' },
  spinners: { name:'Spinners', bearing:'SE', sub:'High step rate / short flight time',
              rr:{ 'Hip/groin':0.72, 'Hamstring':2.53, 'Calf':0.31 }, flag:['Hamstring','Calf'],
              note:'Half of all hamstring injuries in the study occurred in this group (0.84 vs 0.30 per 1000h). Higher step rate increases biceps femoris long-head demand in late swing. Notably, calf risk is 3.2× LOWER.' },
};

function mpQuadrantKey(x, y) {
  if (y >= 0) return x < 0 ? 'bounders' : 'striders';
  return x < 0 ? 'bouncers' : 'spinners';
}

// ── Population reference norms ──────────────────────────────────────────────
// 'fly' values are back-calculated from a VueMotion 20m Fly report's "vs Norms %"
// column. 'acc' values are PROVISIONAL — replace them from an acceleration report
// when one is available. Editing these two blocks re-baselines every athlete.
// Both sets back-calculated from real VueMotion "Progress Over Time" reports and
// verified against every per-leg figure to within 0.1%.
// NOTE: ground contact time is scored INVERTED by VueMotion (shorter = better %),
// which is accounted for in the derivation below.
const MP_NORMS = {
  fly: { sl:1.9932, sf:3.9463, gct:0.1525, ft:0.1047, provisional:false },
  acc: { sl:1.3925, sf:4.3359, gct:0.1702, ft:0.0626, provisional:false },
};


// ── Cohort statistics from your own athletes ────────────────────────────────
// Motor preference axes are z-scores, which need each metric's standard deviation.
// VueMotion never prints those, so we derive them from every session in the sheet.
// Reference group = your roster, not VueMotion's population.
function mpCohortStats(pfx) {
  const cols = { sl:[], sf:[], gct:[], ft:[] };
  const avg = (a,b) => (a!=null&&b!=null) ? (a+b)/2 : (a!=null?a:b);
  Object.values(athleteMap).forEach(a => {
    (a.sessions||[]).forEach(s => {
      const sl  = avg(s[pfx+'_sl_L'],  s[pfx+'_sl_R']);
      const sf  = avg(s[pfx+'_sf_L'],  s[pfx+'_sf_R']);
      const gct = avg(s[pfx+'_gct_L'], s[pfx+'_gct_R']);
      const ft  = avg(s[pfx+'_ft_L'],  s[pfx+'_ft_R']);
      if (sl!=null)  cols.sl.push(sl);
      if (sf!=null)  cols.sf.push(sf);
      if (gct!=null) cols.gct.push(gct);
      if (ft!=null)  cols.ft.push(ft);
    });
  });
  const stat = arr => {
    const n = arr.length; if (n < 2) return null;
    const m = arr.reduce((x,y)=>x+y,0)/n;
    const sd = Math.sqrt(arr.reduce((acc,v)=>acc+Math.pow(v-m,2),0)/(n-1));
    return { n, mean:m, sd };
  };
  const out = { sl:stat(cols.sl), sf:stat(cols.sf), gct:stat(cols.gct), ft:stat(cols.ft) };
  const ok = ['sl','sf','gct','ft'].every(k => out[k] && out[k].sd > 0);
  out.n = Math.min(...['sl','sf','gct','ft'].map(k => out[k] ? out[k].n : 0));
  out.usable = ok && out.n >= 3;
  return out;
}

function mpSpeedBand(v) {
  if (v == null)   return { col:'#94a3b8', label:'no speed recorded' };
  if (v < 7.2)     return { col:'#dc2626', label:'below 7.2 m/s' };
  if (v <= 8.09)   return { col:'#f59e0b', label:'around cohort average' };
  return             { col:'#16a34a', label:'above 8.09 m/s' };
}

  if (btn) btn.classList.add('active');
  renderMotorPref();
}

// Percentage deviation of a ratio from its population norm
function mpPct(val, norm) { return (norm && val!=null) ? +(((val-norm)/norm)*100).toFixed(1) : null; }

function mpData(sessions, pfx, athlete) {
  const g = k => latestVal(sessions, pfx+'_'+k);
  const N = MP_NORMS[pfx]; if (!N) return null;

  // ── Preferred path: coordinates transcribed from the VueMotion chart ──
  // These are true z-scores against VueMotion's cohort and are authoritative.
  const vx=g('mp_x'), vy=g('mp_y');
  const vxL=g('mp_x_L'), vxR=g('mp_x_R'), vyL=g('mp_y_L'), vyR=g('mp_y_R');
  const haveLegs = [vxL,vxR,vyL,vyR].every(v=>v!=null);
  if (vx!=null && vy!=null || haveLegs) {
    const X = vx!=null ? vx : (vxL+vxR)/2;
    const Y = vy!=null ? vy : (vyL+vyR)/2;
    let dt=null;
    for (const s of sessions){ if (s[pfx+'_mp_x']!=null||s[pfx+'_mp_x_L']!=null){ dt=s.test_date; break; } }
    return { xL:vxL, xR:vxR, yL:vyL, yR:vyR, x:+X.toFixed(2), y:+Y.toFixed(2),
      l2:+Math.sqrt(X*X+Y*Y).toFixed(2),
      asym: haveLegs ? +Math.sqrt(Math.pow(vxL-vxR,2)+Math.pow(vyL-vyR,2)).toFixed(2) : null,
      maxSpeed:g('max_speed'), date:dt, unit:'SD', source:'VueMotion chart',
      ctft:null, slsr:null, ctftNorm:null, slsrNorm:null };
  }


  const raw = { slL:g('sl_L'), slR:g('sl_R'), sfL:g('sf_L'), sfR:g('sf_R'),
                gctL:g('gct_L'), gctR:g('gct_R'), ftL:g('ft_L'), ftR:g('ft_R') };
  if (Object.values(raw).every(v=>v==null)) return null;

  // ── Study reference: Wild & Bezodis pooled z-scores ──
  if (mpReference === 'study') {
    const avgS = (a,b) => (a!=null&&b!=null)?(a+b)/2:(a!=null?a:b);
    const gA=avgS(g('gct_L'),g('gct_R')), fA=avgS(g('ft_L'),g('ft_R'));
    const sA=avgS(g('sl_L'),g('sl_R')),   qA=avgS(g('sf_L'),g('sf_R'));
    const LL = mpLegLength(athlete);
    if (gA!=null && fA && sA!=null && qA && LL) {
      // CT/FT is unaffected by Hof normalisation — the leg-length term cancels.
      const ctftR = gA/fA;
      // SL/SR does NOT cancel: SL*sqrt(g) / (SR * l0^1.5)
      const slsrR = (sA*Math.sqrt(G_ACCEL)) / (qA * Math.pow(LL.m,1.5));
      const zx = (ctftR - MP_STUDY.ctft.mean)/MP_STUDY.ctft.sd;
      const zy = (slsrR - MP_STUDY.slsr.mean)/MP_STUDY.slsr.sd;
      const legZ = (gv,fv,sv,qv) => {
        if(gv==null||!fv||sv==null||!qv) return [null,null];
        return [ +(((gv/fv)-MP_STUDY.ctft.mean)/MP_STUDY.ctft.sd).toFixed(2),
                 +((((sv*Math.sqrt(G_ACCEL))/(qv*Math.pow(LL.m,1.5)))-MP_STUDY.slsr.mean)/MP_STUDY.slsr.sd).toFixed(2) ];
      };
      const [sxL,syL] = legZ(g('gct_L'),g('ft_L'),g('sl_L'),g('sf_L'));
      const [sxR,syR] = legZ(g('gct_R'),g('ft_R'),g('sl_R'),g('sf_R'));
      let dtS=null;
      for (const s of sessions){ if (s[pfx+'_gct_L']!=null||s[pfx+'_gct_R']!=null){ dtS=s.test_date; break; } }
      return { xL:sxL, xR:sxR, yL:syL, yR:syR,
        x:+zx.toFixed(2), y:+zy.toFixed(2),
        l2:+Math.sqrt(zx*zx+zy*zy).toFixed(2),
        asym:(sxL!=null&&sxR!=null&&syL!=null&&syR!=null)
          ? +Math.sqrt(Math.pow(sxL-sxR,2)+Math.pow(syL-syR,2)).toFixed(2) : null,
        maxSpeed:g('max_speed'), date:dtS, unit:'SD',
        source:'Wild & Bezodis study reference',
        ctft:+ctftR.toFixed(3), slsr:+slsrR.toFixed(3),
        ctftNorm:MP_STUDY.ctft.mean, slsrNorm:MP_STUDY.slsr.mean,
        legLen:LL.m, legEstimated:LL.estimated, legRatio:LL.ratio, legCalib:LL.calib };
    }
  }

  // ── Second choice: z-scores against your own roster ──
  const CS = mpCohortStats(pfx);
  if (mpReference === 'roster' && CS.usable) {
    const z = (v,k) => (v==null) ? null : (v - CS[k].mean) / CS[k].sd;
    const avg2 = (a,b) => (a!=null&&b!=null)?(a+b)/2:(a!=null?a:b);
    const gA=avg2(g('gct_L'),g('gct_R')), fA=avg2(g('ft_L'),g('ft_R'));
    const sA=avg2(g('sl_L'),g('sl_R')),   qA=avg2(g('sf_L'),g('sf_R'));
    if (gA!=null && fA!=null && sA!=null && qA!=null) {
      // x = contact vs flight · y = step length vs step rate
      const X = z(gA,'gct') - z(fA,'ft');
      const Y = z(sA,'sl')  - z(qA,'sf');
      const legX = (gv,fv) => (gv!=null&&fv!=null) ? +(z(gv,'gct')-z(fv,'ft')).toFixed(2) : null;
      const legY = (sv,qv) => (sv!=null&&qv!=null) ? +(z(sv,'sl') -z(qv,'sf')).toFixed(2) : null;
      const zxL=legX(g('gct_L'),g('ft_L')), zxR=legX(g('gct_R'),g('ft_R'));
      const zyL=legY(g('sl_L'),g('sf_L')),  zyR=legY(g('sl_R'),g('sf_R'));
      let dt2=null;
      for (const s of sessions){ if (s[pfx+'_gct_L']!=null||s[pfx+'_gct_R']!=null){ dt2=s.test_date; break; } }
      return { xL:zxL, xR:zxR, yL:zyL, yR:zyR,
        x:+X.toFixed(2), y:+Y.toFixed(2),
        l2:+Math.sqrt(X*X+Y*Y).toFixed(2),
        asym:(zxL!=null&&zxR!=null&&zyL!=null&&zyR!=null)
          ? +Math.sqrt(Math.pow(zxL-zxR,2)+Math.pow(zyL-zyR,2)).toFixed(2) : null,
        maxSpeed:g('max_speed'), date:dt2, unit:'SD',
        source:`your roster · n=${CS.n} sessions`, cohortN:CS.n,
        ctft:null, slsr:null, ctftNorm:null, slsrNorm:null };
    }
  }

  const ctftNorm = N.gct / N.ft;    // contact ÷ flight at population norm
  const slsrNorm = N.sl  / N.sf;    // step length ÷ step rate at population norm

  // Per-leg ratios → % deviation from norm
  const legX = (gct,ft) => (gct!=null&&ft) ? mpPct(gct/ft, ctftNorm) : null;
  const legY = (sl,sf)  => (sl!=null&&sf)  ? mpPct(sl/sf,  slsrNorm) : null;
  const xL=legX(raw.gctL,raw.ftL), xR=legX(raw.gctR,raw.ftR);
  const yL=legY(raw.slL,raw.sfL),  yR=legY(raw.slR,raw.sfR);

  // Session average — from averaged raw values where both legs exist
  const avg=(a,b)=>(a!=null&&b!=null)?(a+b)/2:(a!=null?a:b);
  const gctA=avg(raw.gctL,raw.gctR), ftA=avg(raw.ftL,raw.ftR);
  const slA =avg(raw.slL,raw.slR),   sfA=avg(raw.sfL,raw.sfR);
  const x = (gctA!=null&&ftA) ? mpPct(gctA/ftA, ctftNorm) : null;
  const y = (slA!=null&&sfA)  ? mpPct(slA/sfA,  slsrNorm) : null;
  if (x==null || y==null) return null;

  const asym = (xL!=null&&xR!=null&&yL!=null&&yR!=null)
    ? +Math.sqrt(Math.pow(xL-xR,2)+Math.pow(yL-yR,2)).toFixed(1) : null;

  let date=null;
  for (const s of sessions){ if (s[pfx+'_gct_L']!=null||s[pfx+'_gct_R']!=null){ date=s.test_date; break; } }

  return { xL,xR,yL,yR, x, y,
    l2:+Math.sqrt(x*x+y*y).toFixed(1), asym,
    maxSpeed:g('max_speed'), date, raw, unit:'%', source:'computed from raw values',
    ctft:(gctA!=null&&ftA)?+(gctA/ftA).toFixed(3):null,
    slsr:(slA!=null&&sfA)?+(slA/sfA).toFixed(3):null,
    ctftNorm:+ctftNorm.toFixed(3), slsrNorm:+slsrNorm.toFixed(3),
    provisional:N.provisional };
}

function renderMotorPref() {
  const a = athleteMap[selectedId];
  const el = document.getElementById('mpContent');
  if (!a || !el) return;

  const pfx = mpRunType === 'acc' ? 'acc' : 'fly';
  const runLabel = mpRunType === 'acc' ? 'Acceleration' : 'Fly (max velocity)';
  const d = mpData(a.sessions, pfx, a);

  const toggle = `
    <div class="quad-ctrl-row" style="justify-content:center">
      <span class="control-label">Reference</span>
      <button class="axis-btn mp-ref-btn${mpReference==='study'?' active':''}" onclick="setMpReference('study',this)">Study (n=85 pro rugby)</button>
      <button class="axis-btn mp-ref-btn${mpReference==='roster'?' active':''}" onclick="setMpReference('roster',this)">My roster</button>
    </div>
    <div class="quad-ctrl-row" style="justify-content:center">
      <span class="control-label">Run type</span>
      <button class="axis-btn mp-run-btn${mpRunType==='acc'?' active':''}" onclick="setMpRunType('acc',this)">Acceleration</button>
      <button class="axis-btn mp-run-btn${mpRunType==='fly'?' active':''}" onclick="setMpRunType('fly',this)">Fly (max velocity)</button>
    </div>`;

  if (!d) {
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px;align-items:center">${toggle}
      <div style="padding:28px 20px;text-align:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;max-width:460px">
        <h3 style="font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">No ${runLabel.toLowerCase()} profile recorded</h3>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.6">
          Transcribe these raw values from the VueMotion report — the dashboard z-scores them
          against your own roster automatically:<br>
          <strong>${pfx}_sl_L / ${pfx}_sl_R</strong> (step length) ·
          <strong>${pfx}_sf_L / ${pfx}_sf_R</strong> (step frequency) ·
          <strong>${pfx}_gct_L / ${pfx}_gct_R</strong> (ground contact) ·
          <strong>${pfx}_ft_L / ${pfx}_ft_R</strong> (flight time)<br><br>
          <span style="font-size:11.5px">If you also have that athlete's Motor Preference chart, adding
          <strong>${pfx}_mp_x</strong> and <strong>${pfx}_mp_y</strong> will match VueMotion exactly.</span>
          </p></div></div>`;
    return;
  }

  const qk = mpQuadrantKey(d.x, d.y);
  const q  = MP_QUADRANTS[qk];
  const band = mpSpeedBand(d.maxSpeed);

  // ── Quadrant SVG ────────────────────────────────────────────────────────
  const W=520, H=500, CX=W/2, CY=245, R=175;
  // Axis auto-scales so no point can ever render outside the plot area.
  const isSD = d.unit === 'SD';
  const mpPts = [d.x, d.y, d.xL, d.xR, d.yL, d.yR].filter(v=>v!=null).map(Math.abs);
  const mpMax = mpPts.length ? Math.max(...mpPts) : 0;
  const LIM = isSD ? Math.max(3.5, Math.ceil(mpMax*1.15*2)/2)
                   : Math.max(45,  Math.ceil((mpMax*1.15)/10)*10);
  const tickStep = isSD ? (LIM<=3.5?1:LIM<=7?2:5)
                        : (LIM<=45?10:LIM<=100?20:LIM<=200?50:100);
  const ticks = []; for(let v=-LIM+tickStep; v<LIM; v+=tickStep){ if(Math.abs(v)>0.01) ticks.push(v); }
  const ringVals = (isSD ? [0.5,1.5,2.5] : [10,20,30]).filter(r=>r<LIM);
  const U = isSD ? '' : '%';
  const sx = v => CX + (v/LIM)*R;
  const sy = v => CY - (v/LIM)*R;

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">`;
  // SD rings
  ringVals.forEach(sd=>{
    const half=(sd/LIM)*R;
    s+=`<rect x="${CX-half}" y="${CY-half}" width="${half*2}" height="${half*2}" fill="none" stroke="rgba(15,23,42,0.18)" stroke-width="1" stroke-dasharray="4,3"/>`;
  });
  // Axes
  s+=`<line x1="${CX-R}" y1="${CY}" x2="${CX+R}" y2="${CY}" stroke="#334155" stroke-width="1.2"/>`;
  s+=`<line x1="${CX}" y1="${CY-R}" x2="${CX}" y2="${CY+R}" stroke="#334155" stroke-width="1.2"/>`;
  // Ticks
  ticks.forEach(v=>{
    s+=`<line x1="${sx(v)}" y1="${CY-3}" x2="${sx(v)}" y2="${CY+3}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${sx(v)}" y="${CY+13}" font-size="6.5" letter-spacing=".5" fill="#A8A7A3" text-anchor="middle">${v>0?'+':''}${v}</text>`;
    s+=`<line x1="${CX-3}" y1="${sy(v)}" x2="${CX+3}" y2="${sy(v)}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${CX-7}" y="${sy(v)+2.5}" font-size="6.5" letter-spacing=".5" fill="#A8A7A3" text-anchor="end">${v>0?'+':''}${v}</text>`;
  });
  // Quadrant labels
  const qlab=[
    ['Bounders','long step length / long flight time', CX-R+4, CY-R+14, 'start', qk==='bounders'],
    ['Striders','long step length / long contact time', CX+R-4, CY-R+14, 'end',   qk==='striders'],
    ['Bouncers','high step rate / short contact time',  CX-R+4, CY+R-8,  'start', qk==='bouncers'],
    ['Spinners','high step rate / short flight time',   CX+R-4, CY+R-8,  'end',   qk==='spinners'],
  ];
  qlab.forEach(([t,sub,x,y,anch,isCur])=>{
    s+=`<text x="${x}" y="${y}" font-size="12" font-weight="700" fill="${isCur?'#0d1117':'#94a3b8'}" text-anchor="${anch}">${t}</text>`;
    s+=`<text x="${x}" y="${y+11}" font-size="7.5" fill="${isCur?'#64748b':'#c3c9d1'}" text-anchor="${anch}">${sub}</text>`;
  });
  // Axis descriptors
  s+=`<text x="${CX}" y="${CY-R-20}" font-size="7.5" letter-spacing="1.4" fill="#706F6D" text-anchor="middle">GREATER STEP LENGTH REL. TO STEP RATE</text>`;
  s+=`<text x="${CX}" y="${CY+R+26}" font-size="7.5" letter-spacing="1.4" fill="#706F6D" text-anchor="middle">GREATER STEP RATE REL. TO STEP LENGTH</text>`;
  s+=`<text x="${CX-R-6}" y="${CY-8}" font-size="7.5" letter-spacing="1.4" fill="#706F6D" text-anchor="middle" transform="rotate(-90,${CX-R-6},${CY-8})">GREATER FLIGHT TIME REL. TO CONTACT</text>`;
  s+=`<text x="${CX+R+8}" y="${CY-8}" font-size="7.5" letter-spacing="1.4" fill="#706F6D" text-anchor="middle" transform="rotate(90,${CX+R+8},${CY-8})">GREATER CONTACT TIME REL. TO FLIGHT</text>`;
  // Study group centroids, shown faintly for context when using the study reference
  if (d.source.indexOf('Wild')>=0) {
    Object.entries(MP_STUDY.groups).forEach(([key,gr])=>{
      const gz = { x:(gr.ctft-MP_STUDY.ctft.mean)/MP_STUDY.ctft.sd,
                   y:(gr.slsr-MP_STUDY.slsr.mean)/MP_STUDY.slsr.sd };
      if (Math.abs(gz.x)>LIM||Math.abs(gz.y)>LIM) return;
      s+=`<circle cx="${sx(gz.x)}" cy="${sy(gz.y)}" r="7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.75"/>`;
      s+=`<text x="${sx(gz.x)}" y="${sy(gz.y)+2.5}" font-size="6.5" fill="#94a3b8" text-anchor="middle">${key.slice(0,2).toUpperCase()}</text>`;
    });
  }

  // Session-average bubble
  s+=`<circle cx="${sx(d.x)}" cy="${sy(d.y)}" r="15" fill="${band.col}" fill-opacity="0.5" stroke="${band.col}" stroke-width="1.5"/>`;
  // Per-leg markers
  if (d.xL!=null&&d.yL!=null)
    s+=`<circle cx="${sx(d.xL)}" cy="${sy(d.yL)}" r="5.5" fill="#2A4FB7" stroke="#ECEAE4" stroke-width="1.8"/>`;
  if (d.xR!=null&&d.yR!=null)
    s+=`<circle cx="${sx(d.xR)}" cy="${sy(d.yR)}" r="5.5" fill="#C2563B" stroke="#ECEAE4" stroke-width="1.8"/>`;
  if (d.xL!=null&&d.xR!=null&&d.yL!=null&&d.yR!=null)
    s+=`<line x1="${sx(d.xL)}" y1="${sy(d.yL)}" x2="${sx(d.xR)}" y2="${sy(d.yR)}" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>`;
  s+='</svg>';

  // ── 1-D axis bars ───────────────────────────────────────────────────────
  const bar = (leftLbl,rightLbl,val) => {
    const BW=440, BH=60, BML=18, BCW=BW-BML*2, ByC=38;
    const bTicks=[]; for(let v=-LIM; v<=LIM; v+=tickStep) bTicks.push(v);
    const bx = v => BML + ((v+LIM)/(2*LIM))*BCW;
    let b=`<svg viewBox="0 0 ${BW} ${BH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${BW}px">`;
    b+=`<text x="${BML}" y="12" font-size="8" letter-spacing="1.4" fill="#706F6D">${leftLbl.toUpperCase()}</text>`;
    b+=`<text x="${BW-BML}" y="12" font-size="8" letter-spacing="1.4" fill="#706F6D" text-anchor="end">${rightLbl.toUpperCase()}</text>`;
    b+=`<line x1="${BML}" y1="${ByC}" x2="${BW-BML}" y2="${ByC}" stroke="#334155" stroke-width="1.2"/>`;
    bTicks.forEach(v=>{
      b+=`<line x1="${bx(v)}" y1="${ByC-4}" x2="${bx(v)}" y2="${ByC+4}" stroke="#94a3b8" stroke-width="1"/>`;
      b+=`<text x="${bx(v)}" y="${ByC+16}" font-size="7" fill="#94a3b8" text-anchor="middle">${v>0?'+':''}${v}</text>`;
    });
    b+=`<circle cx="${bx(val)}" cy="${ByC}" r="11" fill="${band.col}" fill-opacity="0.55" stroke="${band.col}" stroke-width="1.5"/>`;
    b+=`<text x="${bx(val)}" y="${ByC+3.5}" font-size="7.5" letter-spacing=".4" fill="#161616" text-anchor="middle">${val>0?'+':''}${val}${U}</text>`;
    b+='</svg>';
    return b;
  };

  // ── Injury relative risk — coach view only ──────────────────────────────
  const rrRows = Object.entries(q.rr).map(([site,rr])=>{
    const sig = q.flag.includes(site);
    const raised = rr >= MP_RR_UPPER, lowered = rr <= MP_RR_LOWER;
    const col = raised ? '#dc2626' : lowered ? '#16a34a' : '#64748b';
    const barW = Math.min(100, (rr/3)*100);
    return `<div style="margin-bottom:7px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="flex:1;font-size:11px;color:var(--text-secondary)">${site}</span>
        <span style="font-size:14px;font-weight:300;color:${col};font-variant-numeric:tabular-nums">${rr.toFixed(2)}×${sig?' *':''}</span>
      </div>
      <div style="height:4px;background:#eef0f2;border-radius:2px;margin-top:2px;position:relative">
        <div style="position:absolute;left:0;top:0;height:4px;border-radius:2px;width:${barW}%;background:${col}"></div>
        <div style="position:absolute;left:33.3%;top:-2px;width:1px;height:8px;background:#c3c9d1" title="RR = 1.0"></div>
      </div>
    </div>`;
  }).join('') + `<p style="font-size:10px;color:var(--text-secondary);line-height:1.55;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)">${q.note}</p>`;

  const card=(l,v,sub)=>`<div class="brk" style="flex:1;min-width:118px;padding:15px 18px 17px">
    <div class="eb">${l}</div>
    <div class="big" style="font-size:26px;margin-top:9px">${v}</div>
    ${sub?`<div style="font-size:9.5px;color:var(--text-muted);margin-top:2px">${sub}</div>`:''}</div>`;

  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;align-items:center;width:100%">
      ${toggle}
      <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:center">
        <span class="control-label">Preference</span>
        <span class="chip c-line" style="gap:8px">
          <span style="width:9px;height:9px;border-radius:50%;background:${band.col};display:inline-block"></span>
          <span style="font-size:11px;letter-spacing:.14em">${q.name}</span></span>
        <span style="font-size:12px;color:var(--text-secondary)">${q.sub}</span>
      </div>
      ${s}
      <div style="display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--text-muted);flex-wrap:wrap;justify-content:center">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#2563eb;margin-right:4px"></span>Left leg</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#C2563B;margin-right:4px"></span>Right leg</span>
        <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${band.col};opacity:.5;margin-right:4px;vertical-align:middle"></span>Session average — ${band.label}</span>
        <span style="color:#c3c9d1">Rings = ${ringVals.join(' / ')}${isSD?' SD':'% from norm'} · axis ±${LIM}${U}</span>
        ${d.source.indexOf('Wild')>=0?'<span style="color:#c3c9d1">Dashed circles = study group centroids</span>':''}
        <span style="color:${d.source.indexOf('VueMotion')>=0?'#5E9E76':(isSD&&!d.legEstimated)?'#2A4FB7':'#C2563B'}">${
          d.source.indexOf('VueMotion')>=0 ? '✓ VueMotion chart values'
          : d.source.indexOf('Wild')>=0 ? (d.legEstimated
              ? '<span style="color:#c2410c">⚠ leg length estimated'+(d.legCalib?' (calibrated)':'')+'</span>'
              : '◆ z-scores vs Wild &amp; Bezodis (n=85)')
          : isSD ? '◆ z-scores vs '+d.source
          : '⚠ estimated from raw values'}</span>
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;width:100%;max-width:520px">
        ${card('Preference strength', d.l2+U, isSD?'distance from cohort mean':'distance from norm')}
        ${card('Asymmetry', d.asym!=null?d.asym+U:'—', 'L–R separation')}
        ${d.ctft!=null?card('Contact ÷ flight', d.ctft, `ref ${d.ctftNorm} · ${d.x>0?'+':''}${d.x}${U||' SD'}`):''}
        ${d.slsr!=null?card('Step len ÷ rate', d.slsr, `ref ${d.slsrNorm} · ${d.y>0?'+':''}${d.y}${U||' SD'}`):''}
        ${card('Max speed', d.maxSpeed!=null?d.maxSpeed+' m/s':'—', band.label)}
        ${card('Tested', d.date||'—', runLabel)}
      </div>
      <div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:2px">
        ${bar('flight time','ground contact time', d.x)}
        ${bar('step frequency','step length', d.y)}
      </div>
      <div class="no-print" style="width:100%;max-width:540px;padding:16px 20px 18px" class="brk coachonly">
        <div class="eb" style="margin-bottom:12px">
          Injury association — ${q.name} · coach reference only</div>
        ${rrRows}
        <p style="font-size:9.5px;color:var(--text-muted);line-height:1.55;margin-top:7px">
          ${d.source.indexOf('VueMotion')>=0
            ? 'Position taken directly from the VueMotion Motor Preference chart, so it matches that report exactly.'
            : d.source.indexOf('Wild')>=0
            ? 'Z-scored against the published reference: SL/SR '+MP_STUDY.slsr.mean+' ± '+MP_STUDY.slsr.sd
              +', CT/FT '+MP_STUDY.ctft.mean+' ± '+MP_STUDY.ctft.sd+' (pooled from Fig. 1, n=85). '
              +'Ratios are Hof-normalised. Contact ÷ flight needs no leg length — it cancels — but '
              +'step length ÷ step rate scales with leg length<sup>1.5</sup>.'
              + (d.legEstimated
                 ? (d.legCalib
                    ? ' <strong style="color:#c2410c">Leg length estimated, not measured</strong> — '
                      +d.legRatio+' × height ('+(d.legLen*100).toFixed(1)+' cm), '+d.legCalib.source+', '
                      +'i.e. the ratio that makes that athlete\'s computed position match their VueMotion chart. '
                      +'Better than a textbook ratio, but this axis scales with leg length<sup>1.5</sup> and body '
                      +'proportions vary between athletes. Measure greater trochanter to floor and add '
                      +'<strong>leg_length_cm</strong> to the Athletes tab for an exact position.'
                    : ' <strong style="color:#c2410c">Leg length estimated at '+d.legRatio+' × height ('
                      +(d.legLen*100).toFixed(1)+' cm) — uncalibrated.</strong> This axis scales with leg '
                      +'length<sup>1.5</sup>, so a 9 cm error can move an athlete across the boundary. Either measure it '
                      +'(<strong>leg_length_cm</strong>, Athletes tab) or add <strong>'+pfx+'_mp_x</strong> / '
                      +'<strong>'+pfx+'_mp_y</strong> for one athlete so the ratio can be calibrated for everyone.')
                 : ' Leg length measured: '+(d.legLen*100).toFixed(1)+' cm.')
            : isSD
            ? 'True z-scores, but computed against <strong>your own roster</strong> ('+d.cohortN+' sessions) rather than '
              +'VueMotion\'s population. An athlete at zero is average <em>for your group</em>. '
              +'Reliability improves as you add athletes. To pin an athlete to VueMotion exactly, add '
              +'<strong>'+pfx+'_mp_x</strong> and <strong>'+pfx+'_mp_y</strong> from their chart.'
            : '<strong style="color:#c2410c">Estimated position — may not match your VueMotion chart.</strong> '
              +'Derived from raw values as % deviation from population norms. VueMotion plots z-scores '
              +'(deviation ÷ standard deviation) against a narrower cohort, and because step frequency varies '
              +'far less than step length, the two methods can disagree on which quadrant an athlete falls in. '
              +'For an exact match, add <strong>'+pfx+'_mp_x</strong> and <strong>'+pfx+'_mp_y</strong> read off the chart.'}<br>
          Relative risk vs the other three strategies. <strong>*</strong> = statistically significant and beyond the
          study's own smallest-association thresholds (${MP_RR_UPPER} raised / ${MP_RR_LOWER} lowered).
          Tick on each bar marks RR&nbsp;=&nbsp;1.0.<br><br>
          Source: Wild, Bezodis et al., <em>"Sprint acceleration technique is associated with lower-limb injury
          epidemiology in professional male Rugby Union players: a seven-season analysis"</em> — 85 players,
          63,786 player-hours, 123 non-contact lower-limb running injuries. Group is <strong>${q.bearing}</strong>
          in the paper's compass notation.<br><br>
          The authors note findings may be specific to that single club, and that acceleration strategy is
          <em>one component of a multifactorial risk profile, not a direct cause of injury</em>. Applying it to
          football is a further extrapolation. Not shown on athlete reports.</p>
      </div>
    </div>`;
}

function togglePrintMenu(e) {
  if (e) e.stopPropagation();
  const m = document.getElementById('printMenu'); if (!m) return;
  m.style.display = (m.style.display === 'none' || !m.style.display) ? 'block' : 'none';
}
document.addEventListener('click', e => {
  const m = document.getElementById('printMenu');
  if (m && m.style.display === 'block' && !e.target.closest('.print-menu-wrap')) m.style.display = 'none';
});

loadData();

// ─── STRENGTH-SPEED QUADRANT ─────────────────────────────────────────────────
// Extensible axis options — add new entries here as tests are added.
// Future option example (when force plate available):
//   { key: 'cmj_peak_power_bw', label: 'CMJ peak power ×BW' }


function applyPreset(x, y) {
  currentXAxis = x; currentYAxis = y;
  const xs = document.getElementById('xAxisSel');
  const ys = document.getElementById('yAxisSel');
  if(xs) xs.value = x;
  if(ys) ys.value = y;
  document.querySelectorAll('.axis-btn').forEach(b => b.classList.remove('active'));
  const match = [...document.querySelectorAll('.axis-btn')].find(b => b.textContent === QUAD_PRESETS.find(p=>p.x===x&&p.y===y)?.name);
  if(match) match.classList.add('active');
  drawQuadrant(x, y);
}

function setQuadAxes(x, y) {
  currentXAxis = x; currentYAxis = y;
  // Clear preset button active states; re-highlight if combination matches a preset
  document.querySelectorAll('.axis-btn').forEach(b => {
    const p = QUAD_PRESETS.find(p=>p.name===b.textContent);
    if(p) b.classList.toggle('active', p.x===x && p.y===y);
  });
  drawQuadrant(x, y);
}

// Keep backward-compat alias
function setStrengthAxis(key) { setQuadAxes(key, currentYAxis); }

function drawQuadrant(xKey, yKey) {
  const container = document.getElementById('quadrantContainer');
  if (!container) return;

  // If a flight-height axis has no data, fall back to the standard height measure
  // (same benchmark band). Track whether a fallback was actually used, for labelling.
  const xDef = QUAD_X_AXES.find(o=>o.key===xKey);
  const yDef = QUAD_Y_AXES.find(o=>o.key===yKey);
  const xFb = xDef?.fb || null;
  const yFb = yDef?.fb || null;
  let xUsedFb = false, yUsedFb = false;
  const xNorm = NORMS[xKey];
  const yNorm = NORMS[yKey];
  if (!xNorm || !yNorm) {
    container.innerHTML=`<p style="padding:20px;color:var(--text-muted)">No normative data for selected axes.</p>`;
    return;
  }

  const yLb = !!yNorm.lb; // true = lower is better (sprint times)

  // Quad labels: use preset if combination matches, else generic
  const preset = QUAD_PRESETS.find(p => p.x===xKey && p.y===yKey);
  const ql = preset ? preset.ql : {
    tl:[`High ${yNorm.label}`, `Low ${xNorm.label}`],
    tr:['Well-rounded','→ Maintain'],
    bl:['Developing','→ Foundation needed'],
    br:[`High ${xNorm.label}`, `Low ${yNorm.label}`]
  };

  const allAthletes = Object.values(athleteMap);
  const points = [];

  allAthletes.forEach(a => {
    const ld = buildLatestAcrossSessions(a.sessions);
    let xv = ld[xKey], yv = ld[yKey];
    if (xv == null && xFb && ld[xFb] != null) { xv = ld[xFb]; xUsedFb = true; }
    if (yv == null && yFb && ld[yFb] != null) { yv = ld[yFb]; yUsedFb = true; }
    if (xv == null || yv == null) return;
    const isCurrent = a.id === selectedId;
    const ini = a.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const trail = [];
    if (isCurrent && a.sessions.length > 1) {
      a.sessions.slice(1).forEach(s => {
        const sx2 = s[xKey] ?? (xFb ? s[xFb] : null);
        const sy2 = s[yKey] ?? (yFb ? s[yFb] : null);
        if(sx2!=null&&sy2!=null) trail.push({xv:sx2,yv:sy2,date:s.test_date});
      });
      trail.reverse();
    }
    points.push({id:a.id,name:a.name,ini,xv,yv,isCurrent,trail});
  });

  const W=580,H=460,ML=56,MR=24,MT=24,MB=56;
  const CW=W-ML-MR, CH=H-MT-MB;

  const xPad=(xNorm.max-xNorm.min)*0.7, yPad=(yNorm.max-yNorm.min)*1.0;
  let xMin=Math.max(0,xNorm.min-xPad), xMax=xNorm.max+xPad;
  let yMin=Math.max(0,yNorm.min-yPad), yMax=yNorm.max+yPad;

  if(points.length){
    const aX=points.map(p=>p.xv), aY=points.map(p=>p.yv);
    const xP=(xMax-xMin)*0.12, yP=(yMax-yMin)*0.12;
    xMin=Math.min(xMin,Math.min(...aX)-xP); xMax=Math.max(xMax,Math.max(...aX)+xP);
    yMin=Math.min(yMin,Math.min(...aY)-yP); yMax=Math.max(yMax,Math.max(...aY)+yP);
  }

  if (xMax===xMin) { xMax = xMin + 1; }
  if (yMax===yMin) { yMax = yMin + 1; }
  const sx = v => ML+(v-xMin)/(xMax-xMin)*CW;
  // Invert Y for lb=true metrics (lower val = higher on chart = better)
  const sy = yLb
    ? v => MT+(v-yMin)/(yMax-yMin)*CH
    : v => MT+CH-(v-yMin)/(yMax-yMin)*CH;

  const xDiv=(xNorm.min+xNorm.max)/2, yDiv=(yNorm.min+yNorm.max)/2;
  const xDivPx=sx(xDiv), yDivPx=sy(yDiv);

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:440px;font-family:-apple-system,BlinkMacSystemFont,sans-serif">`;

  // Quadrant backgrounds (TL=amber, TR=green, BL=red, BR=blue)
  // Quadrant tints are deliberately absent — the report keeps plots unshaded and
  // lets hairline dividers and one accent dot carry the reading.
  s+=`<rect x="${ML}" y="${MT}" width="${CW}" height="${CH}" fill="rgba(22,22,22,.015)"/>`;

  // Norm band overlays
  s+=`<rect x="${sx(xNorm.min)}" y="${MT}" width="${sx(xNorm.max)-sx(xNorm.min)}" height="${CH}" fill="rgba(42,79,183,.045)"/>`;
  const yNormTop=sy(yLb?yNorm.min:yNorm.max), yNormBot=sy(yLb?yNorm.max:yNorm.min);
  s+=`<rect x="${ML}" y="${yNormTop}" width="${CW}" height="${yNormBot-yNormTop}" fill="rgba(26,86,219,0.04)"/>`;

  // Norm boundary dashes
  [sx(xNorm.min),sx(xNorm.max)].forEach(px=>{s+=`<line x1="${px}" y1="${MT}" x2="${px}" y2="${H-MB}" stroke="rgba(42,79,183,.30)" stroke-width="1" stroke-dasharray="2,3"/>`;});
  [sy(yLb?yNorm.min:yNorm.max),sy(yLb?yNorm.max:yNorm.min)].forEach(py=>{s+=`<line x1="${ML}" y1="${py}" x2="${W-MR}" y2="${py}" stroke="rgba(26,86,219,0.2)" stroke-width="1" stroke-dasharray="3,3"/>`;});

  // Main dividers
  s+=`<line x1="${xDivPx}" y1="${MT}" x2="${xDivPx}" y2="${H-MB}" stroke="#A8A7A3" stroke-width="1" stroke-dasharray="3,4"/>`;
  s+=`<line x1="${ML}" y1="${yDivPx}" x2="${W-MR}" y2="${yDivPx}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>`;

  // Border
  s+=`<rect x="${ML}" y="${MT}" width="${CW}" height="${CH}" fill="none" stroke="#e4e6ea" stroke-width="1"/>`;

  // Quadrant labels — TL, TR, BL, BR
  [
    [ql.tl[0],ql.tl[1], ML+8,   MT+16,  'start'],
    [ql.tr[0],ql.tr[1], W-MR-8, MT+16,  'end'  ],
    [ql.bl[0],ql.bl[1], ML+8,   H-MB-8, 'start'],
    [ql.br[0],ql.br[1], W-MR-8, H-MB-8, 'end'  ],
  ].forEach(([title,sub,x,y,anchor])=>{
    s+=`<text x="${x}" y="${y}"    font-size="8" letter-spacing="1.3" fill="#706F6D" text-anchor="${anchor}">${title.toUpperCase()}</text>`;
    s+=`<text x="${x}" y="${y+13}" font-size="7.5" letter-spacing=".7" fill="#A8A7A3" text-anchor="${anchor}">${sub}</text>`;
  });

  // Axis ticks
  for(let i=0;i<=5;i++){
    const vx=xMin+(xMax-xMin)*i/5, px=sx(vx);
    s+=`<line x1="${px}" y1="${H-MB}" x2="${px}" y2="${H-MB+4}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${px}" y="${H-MB+15}" font-size="7.5" letter-spacing=".6" text-anchor="middle" fill="#8A8986">${vx.toFixed(1)}</text>`;
    const vy=yMin+(yMax-yMin)*i/5, py=sy(vy);
    s+=`<line x1="${ML-4}" y1="${py}" x2="${ML}" y2="${py}" stroke="#94a3b8" stroke-width="1"/>`;
    s+=`<text x="${ML-7}" y="${py+3}" font-size="7.5" letter-spacing=".6" text-anchor="end" fill="#8A8986">${vy.toFixed(1)}</text>`;
  }

  // Axis labels (Y label notes inversion for lb metrics)
  const yAxisLabel = (yLb ? `${yNorm.label} (${yNorm.u}) ← lower=better` : `${yNorm.label} (${yNorm.u})`)
    + (yUsedFb ? ` — using ${NORMS[yFb].label}` : '');
  const xAxisLabel = `${xNorm.label} (${xNorm.u})` + (xUsedFb ? ` — using ${NORMS[xFb].label}` : '');
  s+=`<text x="${ML+CW/2}" y="${H-6}" font-size="8" letter-spacing="1.8" text-anchor="middle" fill="#706F6D">${xAxisLabel.toUpperCase()}</text>`;
  s+=`<text x="11" y="${MT+CH/2}" font-size="8" letter-spacing="1.8" text-anchor="middle" fill="#706F6D" transform="rotate(-90,11,${MT+CH/2})">${yAxisLabel}</text>`;

  // Anonymous other athletes
  points.filter(p=>!p.isCurrent).forEach(p=>{
    s+=`<circle cx="${sx(p.xv)}" cy="${sy(p.yv)}" r="5" fill="#C7C5C0" stroke="none" opacity="0.9"/>`;
  });

  // Selected athlete
  const cur=points.find(p=>p.isCurrent);
  if(cur){
    // Trail
    if(cur.trail.length>0){
      const allT=[...cur.trail,{xv:cur.xv,yv:cur.yv}];
      s+=`<path d="${allT.map((p,i)=>`${i===0?'M':'L'}${sx(p.xv).toFixed(1)},${sy(p.yv).toFixed(1)}`).join(' ')}" fill="none" stroke="#2A4FB7" stroke-width="1" stroke-dasharray="3,3" opacity="0.35"/>`;
      cur.trail.forEach(p=>{s+=`<circle cx="${sx(p.xv)}" cy="${sy(p.yv)}" r="4" fill="none" stroke="#2A4FB7" stroke-width="1.2" opacity="0.5"/>`;});
    }
    const dotCol=sidebarCol(buildLatestAcrossSessions(athleteMap[selectedId]?.sessions||[]));
    const px=sx(cur.xv), py=sy(cur.yv);
    s+=`<circle cx="${px}" cy="${py}" r="11" fill="#2A4FB7" stroke="#F7F6F2" stroke-width="2.5"/>`;
    s+=`<text x="${px}" y="${py+4}" font-size="8" letter-spacing=".6" text-anchor="middle" fill="#fff">${cur.ini}</text>`;
    const lx=px+16>W-MR-90?px-16:px+16, la=px+16>W-MR-90?'end':'start', ly=py-10<MT+20?py+22:py-10;
    s+=`<text x="${lx}" y="${ly}"    font-size="9" letter-spacing="1.2" text-anchor="${la}" fill="#161616">${cur.name.toUpperCase()}</text>`;
    s+=`<text x="${lx}" y="${ly+13}" font-size="8.5" text-anchor="${la}" fill="#8A8986">${cur.xv}${xNorm.u} · ${cur.yv}${yNorm.u}</text>`;
  } else {
    // Name exactly which axis is missing so it's actionable
    const selA = athleteMap[selectedId];
    const selLd = selA ? buildLatestAcrossSessions(selA.sessions) : {};
    const missing = [];
    if (selLd[xKey] == null && !(xFb && selLd[xFb] != null)) missing.push(xNorm.label);
    if (selLd[yKey] == null && !(yFb && selLd[yFb] != null)) missing.push(yNorm.label);
    const msg = missing.length
      ? `Missing: ${missing.join(' and ')}`
      : 'No data for this athlete on selected axes.';
    s+=`<text x="${ML+CW/2}" y="${MT+CH/2-14}" font-size="13" text-anchor="middle" fill="#7a8290" font-weight="600">${msg}</text>`;
    s+=`<text x="${ML+CW/2}" y="${MT+CH/2+8}" font-size="11" text-anchor="middle" fill="#94a3b8">Add to your Google Sheet, or pick different axes above.</text>`;
    // List axes this athlete DOES have data for
    const haveX = QUAD_X_AXES.filter(o=>selLd[o.key]!=null).map(o=>o.label);
    const haveY = QUAD_Y_AXES.filter(o=>selLd[o.key]!=null).map(o=>o.label);
    if (haveX.length && haveY.length) {
      s+=`<text x="${ML+CW/2}" y="${MT+CH/2+30}" font-size="10" text-anchor="middle" fill="#94a3b8">Available X: ${haveX.join(', ')}</text>`;
      s+=`<text x="${ML+CW/2}" y="${MT+CH/2+45}" font-size="10" text-anchor="middle" fill="#94a3b8">Available Y: ${haveY.join(', ')}</text>`;
    }
  }

  s+='</svg>';
  container.innerHTML=s;
}
</script>
</body>
</html>
