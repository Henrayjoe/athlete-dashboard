  /* ══ FOOTBALLFIT REPORT SYSTEM ════════════════════════════════════════════
     Ported from the GPS match report source. Dark base page; each section is a
     "sheet" that overlaps the one above it with a rounded top, and a light
     sheet simply re-declares the token set. One gradient, dark blue into
     near-white, used for every bar and line.
     ───────────────────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#2A2A2A; --bg2:#242424; --ink:#F2EFE9; --muted:#A6A39D; --dim:#77756F;
    --rule:rgba(255,255,255,.14); --rule2:rgba(255,255,255,.07);
    --blue:#1E44B0; --cream:#F4F6FB; --accent:#9FB6F0;
    --grad:linear-gradient(90deg,#1E44B0 0%,#7C9BEA 50%,#F4F6FB 100%);
    --g1:#1E44B0; --g2:#7C9BEA; --g3:#F4F6FB;
    --sv-fg:#F4F6FB; --sv-cur:#F4F6FB; --sv-halo:#7C9BEA; --sv-dot:#8F8D88;
    --sv-br:rgba(242,239,233,.55); --sv-bg:#2A2A2A; --tipbg:#383837;
    --font:'Neue Haas Display','Inter','Helvetica Neue',Arial,sans-serif;
    --r-sheet:30px;
    /* aliases kept so the older panel code still resolves */
    --paper:#F7F6F2; --stone:#ECEAE4; --white:#FFFFFF; --dark:#2A2A2A; --dark-2:#383837;
    --dark-3:#4A4A49; --text:var(--ink); --text-2:var(--muted); --onDark:#F2EFE9;
    --onDark-soft:#A6A39D; --onDark-dim:#77756F; --surface:#FFFFFF; --surface-alt:#F2EFE9;
    --border:var(--rule); --line-soft:var(--rule2); --charcoal:#2A2A2A; --charcoal-2:#383837;
    --text-primary:var(--ink); --text-secondary:var(--muted); --text-muted:var(--dim);
    --accent-light:#EEF2FC; --radius:10px; --radius-sm:0; --radius-lg:14px;
    --grad-0:#1E44B0; --grad-mid:#7C9BEA; --grad-1:#F4F6FB;
    --flag:#C2563B; --amber:#D9A95B; --sage:#5E9E76;
    color-scheme:dark;
  }
  html, body { background:var(--bg); }
  body{ color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55;
        font-weight:300; -webkit-font-smoothing:antialiased; }
  p,h1,h2,h3,ul{ margin:0 }
  b,strong{ font-weight:500 }
  button,input,select,textarea{ font:inherit; color:inherit }
  .wrap{ max-width:1040px; margin:0 auto; padding-left:24px; padding-right:24px }
  .wrap.wide{ max-width:1180px }
  .eb{ font-size:11px; font-weight:400; letter-spacing:.28em; text-transform:uppercase; color:var(--muted) }
  .gline{ height:3px; background:var(--grad) }
  .num{ font-variant-numeric:tabular-nums }

  /* brackets */
  .brk{ position:relative; padding:22px 26px }
  .brk::before,.brk::after{ content:""; position:absolute; top:0; bottom:0; width:9px;
    border:1px solid var(--sv-br); pointer-events:none }
  .brk::before{ left:0;  border-right:0 }
  .brk::after { right:0; border-left:0 }

  /* ── hero ──────────────────────────────────────────────────────────────── */
  .hero{ background:var(--bg) }
  .hero .wrap{ max-width:1180px; padding-top:24px; padding-bottom:76px }
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px;
           flex-wrap:wrap; padding-bottom:20px; border-bottom:1px solid var(--rule) }
  .brandmark{ display:flex; align-items:center; gap:14px }
  .brandmark img, .plogo img{ height:21px; width:auto; display:block;
    filter:brightness(0) invert(1) }
  .plogo{ display:inline-flex; align-items:center; flex:0 0 auto }
  .brandmark .bsub{ display:none }
  /* always-visible build stamp: the quickest way to confirm a fresh upload
     actually took effect. Static markup, so it shows even if the JS fails. */
  .buildtag{ font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
             border:1px solid var(--rule); padding:3px 9px; white-space:nowrap }
  @media print{ .buildtag{ display:none } }
  .ctrls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .hsel,.hbtn{ background:transparent; border:1px solid var(--rule); color:var(--ink);
    border-radius:0; padding:8px 14px; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; cursor:pointer; font-weight:400; font-family:var(--font) }
  .hsel{ text-transform:none; letter-spacing:.02em; font-size:13px; max-width:240px }
  .hsel option{ color:#161616 }
  .hbtn:hover,.hsel:hover{ border-color:var(--ink) }
  .seg2{ display:inline-flex; border:1px solid var(--rule) }
  .seg2 button{ background:transparent; border:0; color:var(--dim); padding:8px 14px;
    font-size:12px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; font-family:var(--font) }
  .seg2 button[aria-pressed="true"]{ background:var(--ink); color:#1d1d1d }
  .heroGrid{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:36px;
             align-items:center; margin-top:40px }
  .hero h1{ font-size:clamp(36px,6vw,58px); line-height:1.02; font-weight:300;
            letter-spacing:-.02em; margin-top:16px; color:var(--ink) }
  .hero .sub{ font-size:17px; color:var(--muted); margin-top:18px; max-width:540px; line-height:1.6 }
  .hero .sub b{ color:var(--ink); font-weight:400 }
  .hero .sub .hl-blue{ color:var(--accent); font-weight:400 }
  .meta{ display:flex; gap:34px; flex-wrap:wrap; margin-top:30px }
  .meta div{ display:flex; flex-direction:column; gap:4px }
  .meta b{ font-weight:300; font-size:22px; font-variant-numeric:tabular-nums; color:var(--ink) }
  .meta span{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--dim) }
  .ringBox{ display:flex; flex-direction:column; align-items:center; gap:8px }
  .ringBox svg{ max-width:100%; height:auto }
  .rcap{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
         text-align:center; max-width:280px; line-height:1.6 }
  .hnote{ display:grid; grid-template-columns:28px minmax(0,1fr); gap:16px; align-items:center;
          background:var(--tipbg); border-radius:14px; padding:20px 22px; margin-top:30px; color:var(--ink) }
  .hnote p{ font-size:15px; line-height:1.55; margin-top:3px }

  /* ── sheets ────────────────────────────────────────────────────────────── */
  main{ padding-bottom:0 }
  .sec{ position:relative; border-radius:var(--r-sheet) var(--r-sheet) 0 0; margin-top:-30px;
        padding:60px 0 84px; box-shadow:0 -14px 34px rgba(0,0,0,.28); scroll-margin-top:60px;
        background:var(--bg); }
  .sec.dark{ background:#2A2A2A; --sv-bg:#2A2A2A }
  .sec.light, .sec.alt{
    background:#F7F6F2; color:#161616;
    --ink:#161616; --muted:#5F5D58; --dim:#8A8883;
    --rule:rgba(0,0,0,.12); --rule2:rgba(0,0,0,.07); --bg:#F7F6F2; --tipbg:#ECEAE4;
    --grad:linear-gradient(90deg,#1E44B0 0%,#4F74DB 55%,#A9BEF2 100%);
    --g1:#1E44B0; --g2:#4F74DB; --g3:#A9BEF2; --accent:#1E44B0;
    --grad-0:#1E44B0; --grad-mid:#4F74DB; --grad-1:#A9BEF2;
    --sv-fg:#161616; --sv-cur:#1E44B0; --sv-halo:#1E44B0; --sv-dot:#B9B6AF;
    --sv-br:rgba(22,22,22,.4); --sv-bg:#F7F6F2;
  }
  .sec.alt{ background:#ECEAE4; --bg:#ECEAE4; --sv-bg:#ECEAE4; --tipbg:#E0DDD6 }
  .sec.first{ margin-top:-30px }
  .sechd{ margin-bottom:0 }
  .ebrow{ display:flex; align-items:center; gap:12px }
  .ebrow svg{ width:26px; height:26px; flex-shrink:0; color:var(--ink) }
  .h2{ font-size:34px; font-weight:300; letter-spacing:-.015em; margin-top:14px; color:var(--ink) }
  .lead{ font-size:19px; line-height:1.5; color:var(--ink); max-width:700px; margin-top:14px; font-weight:300 }

  /* callout */
  .callout{ display:grid; grid-template-columns:28px minmax(0,1fr); gap:16px; align-items:center;
            background:var(--tipbg); border-radius:14px; padding:20px 22px; margin-top:30px; color:var(--ink) }
  .callout p, .callout div{ font-size:15px; line-height:1.55 }
  .callout b{ font-weight:600 }
  .callout svg{ width:24px; height:24px }

  /* ── tiles ─────────────────────────────────────────────────────────────── */
  .hlgrid, .hcgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; margin-top:28px }
  .hl, .hcard{ position:relative; display:flex; flex-direction:column; gap:6px; min-width:0;
    background:transparent; border:0; padding:20px 22px }
  .hl::before,.hl::after,.hcard::before,.hcard::after{ content:""; position:absolute; top:0; bottom:0;
    width:9px; border:1px solid var(--sv-br); pointer-events:none }
  .hl::before,.hcard::before{ left:0;  border-right:0 }
  .hl::after, .hcard::after { right:0; border-left:0 }
  .big, .hcard .hval{ font-size:44px; font-weight:200; letter-spacing:-.02em;
        font-variant-numeric:tabular-nums; line-height:1; margin-top:10px; color:var(--ink) }
  .big small, .hcard .hval small{ font-size:13px; color:var(--muted); margin-left:6px;
        letter-spacing:.12em; font-weight:300 }
  .cap, .word{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-top:6px }
  .cap.blue, .word.best{ color:var(--accent); font-weight:600 }
  .hcard p.hdesc{ font-size:13.5px; line-height:1.55; color:var(--muted); font-weight:300;
                  letter-spacing:0; text-transform:none; margin-top:10px }
  .hcard .hfoot{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
                 margin-top:auto; padding-top:10px }
  .hpill{ align-self:flex-start; font-size:10px; letter-spacing:.22em; text-transform:uppercase;
          font-weight:600; padding:0; background:none !important; margin-top:6px }
  .hpill.ok{ color:var(--accent) } .hpill.high{ color:var(--accent) } .hpill.warn{ color:#D9A95B }
  .hbar{ position:relative; height:6px; background:var(--rule2); border-radius:3px; margin-top:14px }
  .hbar .zone{ position:absolute; top:0; bottom:0; background:var(--grad); border-radius:3px; opacity:.85 }
  .hbar .pin{ position:absolute; top:-4px; width:3px; height:14px; margin-left:-1.5px; background:var(--sv-fg) }
  .hscale{ display:flex; justify-content:space-between; gap:8px; font-size:10px;
           letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin-top:9px }
  .hscale b{ color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums }
  .keyrow, .status-key{ display:flex; gap:26px; flex-wrap:wrap; font-size:10.5px; letter-spacing:.2em;
          text-transform:uppercase; color:var(--dim); margin-top:22px; align-items:center }
  .key-label{ color:var(--dim) }

  /* ── compare rows (the full battery) ───────────────────────────────────── */
  .split{ display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:30px;
          margin-top:28px; align-items:start }
  .rhead{ display:grid; grid-template-columns:190px minmax(0,1fr) 40px; gap:20px;
          font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
          padding-bottom:10px; border-bottom:1px solid var(--rule); margin-top:24px }
  .rhead span:nth-child(2){ display:none }
  .row{ all:unset; box-sizing:border-box; display:grid; grid-template-columns:190px minmax(0,1fr) 40px;
        gap:20px; align-items:center; padding:16px 0; border-bottom:1px dashed var(--rule2);
        cursor:pointer; width:100% }
  .row:last-of-type{ border-bottom:0 }
  .row:hover .lbl{ color:var(--ink) }
  .row[aria-pressed="true"] .lbl{ color:var(--ink) }
  .row[aria-pressed="true"] .bar .mk{ box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--sv-fg) }
  .row:focus-visible{ outline:1px solid var(--accent); outline-offset:3px }
  .row .lbl{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); line-height:1.5 }
  .row .lbl small{ display:block; font-size:10.5px; letter-spacing:.02em; text-transform:none;
                   color:var(--dim); margin-top:4px }
  .row .val{ display:none }
  .ghead{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim);
          padding:30px 0 4px }

  /* the measure itself: gradient bar with the value sitting at its end */
  .bar{ position:relative; height:26px }
  .bar .trk{ position:absolute; left:0; right:0; top:12px; height:2px; background:var(--rule2) }
  .bar .band{ position:absolute; top:10px; height:6px; border-radius:3px; background:var(--grad) }
  .bar .tick{ position:absolute; top:6px; height:14px; width:0; border-left:1px dashed var(--sv-fg); opacity:.5 }
  .bar .mk{ position:absolute; top:7.5px; width:11px; height:11px; margin-left:-5.5px; border-radius:50%;
            background:var(--sv-cur) }
  .bar .cx{ position:absolute; top:-4px; font-size:10px; letter-spacing:.14em; color:var(--dim);
            transform:translateX(-50%); font-variant-numeric:tabular-nums }
  .bar .rv{ position:absolute; right:0; top:50%; transform:translateY(-50%); font-size:13px;
            color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;
            background:var(--bg); padding-left:10px }
  .bar .rv small{ font-size:10px; color:var(--muted); margin-left:3px; letter-spacing:.12em; text-transform:uppercase }
  .bar.none{ display:flex; align-items:center; font-size:10.5px; letter-spacing:.18em;
             text-transform:uppercase; color:var(--dim) }
  .chg{ display:flex; justify-content:center }
  .cbadge{ width:30px; height:30px; border-radius:50%; border:1px solid var(--rule);
           display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted) }
  .cbadge.on{ border-color:var(--ink); color:var(--ink) }
  .cbadge.off{ opacity:.6 }
  .cbadge.none{ border-color:transparent; opacity:.3 }
  .cpct{ display:none }

  /* inspector */
  .trend{ position:sticky; top:52px; min-width:0 }
  .trend h3{ font-size:26px; font-weight:300; margin-top:12px; letter-spacing:-.015em; color:var(--ink) }
  .trend svg{ width:100%; height:auto; display:block; margin-top:16px }
  .tleg{ display:flex; gap:26px; flex-wrap:wrap; font-size:10.5px; letter-spacing:.2em;
         text-transform:uppercase; color:var(--dim); margin-top:14px }
  .tleg i{ display:inline-block; width:18px; height:2px; margin-right:8px; vertical-align:3px }
  .trend .note{ font-size:12.5px; color:var(--dim); margin-top:12px }
  .trend .src{ font-size:11px; color:var(--dim); margin-top:10px; font-style:italic }

  /* ── section nav ───────────────────────────────────────────────────────── */
  .secnav{ position:sticky; top:0; z-index:60; margin-bottom:30px; background:rgba(42,42,42,.96);
           backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,.14) }
  .secnav .wrap{ max-width:1180px; display:flex; gap:0; overflow-x:auto; scrollbar-width:none; padding-block:0 }
  .secnav .wrap::-webkit-scrollbar{ display:none }
  .secnav a{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#77756F;
             text-decoration:none; padding:12px 16px; white-space:nowrap;
             border-bottom:2px solid transparent; margin-bottom:-1px }
  .secnav a:hover{ color:#F2EFE9 }
  .secnav a.on{ color:#F2EFE9; border-bottom-color:#7C9BEA }

  /* ── charts ────────────────────────────────────────────────────────────── */
  .charts-body{ display:flex; flex-direction:column; gap:20px }
  .chart-grid{ display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:28px }
  .chart-wrap{ background:transparent; border:0; padding:22px 26px; position:relative }
  .chart-wrap::before,.chart-wrap::after{ content:""; position:absolute; top:0; bottom:0; width:9px;
    border:1px solid var(--sv-br); pointer-events:none }
  .chart-wrap::before{ left:0; border-right:0 } .chart-wrap::after{ right:0; border-left:0 }
  .chart-title{ font-size:11px; font-weight:400; color:var(--muted); text-transform:uppercase;
                letter-spacing:.24em; margin-bottom:14px }
  .chart-note{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
               display:flex; gap:26px; flex-wrap:wrap; margin-top:10px }

  /* ── controls ──────────────────────────────────────────────────────────── */
  .quadrant-controls,.quad-ctrl-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  .control-label{ font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim) }
  .axis-btn{ border:0; background:transparent; padding:10px 16px; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent;
    font-family:var(--font) }
  .axis-btn:hover{ color:var(--ink) }
  .axis-btn.active{ color:var(--ink); border-bottom-color:var(--g2) }
  .axis-select{ font-size:13px; padding:8px 12px; border:1px solid var(--rule); border-radius:0;
                background:transparent; color:var(--ink); cursor:pointer; font-family:var(--font) }
  .axis-select option{ color:#161616 }
  .axis-select:focus{ outline:none; border-color:var(--ink) }
  .quadrant-legend{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; margin-top:22px;
                    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim) }
  .ql-dot{ display:inline-block; width:11px; height:11px; border-radius:50% }
  .ql-you{ background:var(--sv-cur) } .ql-anon{ background:var(--sv-dot) }

  /* ── buttons ───────────────────────────────────────────────────────────── */
  .btn{ background:var(--ink); color:#1d1d1d; border:1px solid var(--ink); border-radius:0;
        padding:10px 18px; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
        font-weight:500; cursor:pointer; font-family:var(--font); margin-top:0 }
  .btn.ghost{ background:transparent; color:var(--ink) }
  .btn-sm{ background:transparent; color:var(--ink); border:1px solid var(--rule); border-radius:0;
           padding:8px 14px; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
           cursor:pointer; font-family:var(--font) }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:18px }
  .msg{ font-size:13px; color:var(--muted) }

  /* ── drawer ────────────────────────────────────────────────────────────── */
  .drawer{ background:var(--bg2); border-bottom:1px solid var(--rule) }
  .drawer .wrap{ max-width:1180px; padding-block:30px 36px }
  .dgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; margin-top:18px }
  .field{ display:flex; flex-direction:column; gap:6px }
  .field label{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim) }
  .field input{ width:100%; border:1px solid var(--rule); border-radius:0; padding:9px 11px;
                font-size:13px; background:var(--bg2); color:var(--ink); font-family:var(--font) }
  .field input:focus{ outline:none; border-color:var(--ink) }

  /* ── details ───────────────────────────────────────────────────────────── */
  details{ margin-top:34px; border-top:1px solid var(--rule); padding-top:18px }
  details > summary{ cursor:pointer; font-size:11px; letter-spacing:.24em; text-transform:uppercase;
                     color:var(--muted); list-style:none }
  details > summary::-webkit-details-marker{ display:none }
  details > summary::before{ content:'+ '; }
  details[open] > summary::before{ content:'– '; }

  /* ── log table ─────────────────────────────────────────────────────────── */
  table{ width:100%; border-collapse:collapse; margin-top:14px; font-size:13px }
  thead th{ font-size:10px; font-weight:400; letter-spacing:.2em; text-transform:uppercase;
            color:var(--dim); text-align:right; padding:0 8px 10px; border-bottom:1px solid var(--rule);
            white-space:nowrap; background:transparent }
  thead th:first-child{ text-align:left }
  tbody td{ padding:10px 8px; border-bottom:1px solid var(--rule2); text-align:right;
            font-variant-numeric:tabular-nums }
  tbody td:first-child{ text-align:left }
  tbody tr:hover{ background:rgba(0,0,0,.02) }
  td.lbl{ color:var(--muted) }
  .miss{ color:var(--dim); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase }
  .rval{ font-size:17px; font-weight:300; font-variant-numeric:tabular-nums }
  .runit{ font-size:10px; color:var(--muted); margin-left:3px; letter-spacing:.12em; text-transform:uppercase }
  .rsub{ font-size:11px; color:var(--dim); margin-left:6px }
  .delta{ font-size:12.5px; font-variant-numeric:tabular-nums }

  /* ── legacy chips / pills still emitted by the panels ──────────────────── */
  .chip{ display:inline-block; padding:3px 10px; font-size:10.5px; letter-spacing:.2em;
         text-transform:uppercase; border:1px solid var(--rule); color:var(--muted) }
  .c-s4,.c-s3{ border-color:var(--g2); color:var(--accent) }
  .c-s2{ border-color:#D9A95B; color:#D9A95B }
  .c-s1,.c-s0{ border-color:#C2563B; color:#D98166 }
  .c-line{ border-color:var(--rule); color:var(--muted) }
  .c-dark{ background:var(--ink); color:#1d1d1d; border-color:var(--ink) }
  .pill{ display:inline-flex; align-items:center; gap:7px; padding:3px 10px; font-size:10px;
         letter-spacing:.18em; text-transform:uppercase; border:1px solid var(--rule); color:var(--muted) }
  .pill-dot{ width:6px; height:6px; border-radius:50%; display:inline-block }
  .p4,.p3{ border-color:var(--g2); color:var(--accent) }
  .p2{ border-color:#D9A95B; color:#D9A95B }
  .p1,.p0{ border-color:#C2563B; color:#D98166 }
  .calc-badge{ display:inline-block; font-size:9px; border:1px solid var(--rule); color:var(--dim);
               padding:2px 7px; margin-left:7px; text-transform:uppercase; letter-spacing:.18em }
  .pb-badge{ display:inline-flex; font-size:9px; border:1px solid #D9A95B; color:#D9A95B;
             padding:2px 7px; margin-left:7px; text-transform:uppercase; letter-spacing:.18em }
  .norm-source{ display:block; font-size:10px; color:var(--dim); margin-top:3px; font-style:italic }
  @media print{ .norm-source{ display:none !important } }
  .sec-heading{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); margin-bottom:12px }

  /* ── feedback ──────────────────────────────────────────────────────────── */
  .feedback-empty{ display:flex; flex-direction:column; align-items:center; padding:48px 20px;
                   gap:16px; text-align:center }
  .feedback-empty h3{ font-size:26px; font-weight:300; letter-spacing:-.015em }
  .feedback-empty p{ font-size:15px; color:var(--muted); max-width:440px; line-height:1.6 }
  .feedback-loading{ display:flex; flex-direction:column; align-items:center; padding:48px 20px; gap:14px }
  .spinner{ width:28px; height:28px; border:2px solid var(--rule); border-top-color:var(--accent);
            border-radius:50%; animation:spin .8s linear infinite }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .feedback-section{ margin-top:26px; border-top:1px solid var(--rule); padding-top:18px }
  .feedback-section-head{ display:flex; align-items:center; justify-content:space-between; gap:14px }
  .feedback-section-label{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted) }
  .feedback-section-label span{ font-size:11px; margin-left:10px; text-transform:none; letter-spacing:.02em; color:var(--dim) }
  .feedback-text{ font-size:15px; line-height:1.7; white-space:pre-wrap; margin-top:14px; color:var(--ink) }
  .copy-btn{ background:transparent; color:var(--ink); border:1px solid var(--rule); border-radius:0;
             padding:7px 13px; font-size:10px; letter-spacing:.2em; text-transform:uppercase;
             cursor:pointer; font-family:var(--font) }
  .copy-btn.copied{ border-color:var(--g2); color:var(--accent) }
  .feedback-meta{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim) }
  .regenerate-row{ display:flex; justify-content:flex-end; padding-top:10px }

  /* ── footer ────────────────────────────────────────────────────────────── */
  .ffoot{ padding:22px 0 26px; background:var(--bg); border-top:3px solid transparent;
          border-image:var(--grad) 1 }
  .ffoot .wrap{ max-width:1180px; display:flex; justify-content:space-between; align-items:center;
                gap:10px; flex-wrap:wrap; font-size:10.5px; letter-spacing:.2em;
                text-transform:uppercase; color:var(--dim) }
  .ffoot img, .ffoot .plogo img{ height:14px; width:auto; display:block;
    filter:brightness(0) invert(1) }
  .ffoot span{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim) }

  /* ── print menu ────────────────────────────────────────────────────────── */
  .print-menu-wrap{ position:relative; display:inline-block }
  .print-menu{ position:absolute; right:0; top:calc(100% + 8px); z-index:50; background:#F7F6F2;
               border:1px solid rgba(0,0,0,.14); padding:16px 18px; min-width:252px; color:#161616 }
  .print-menu h4{ font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#8A8883;
                  margin-bottom:11px; font-weight:400 }
  .print-menu label{ display:flex; align-items:center; gap:10px; font-size:13px; color:#5F5D58;
                     padding:5px 0; cursor:pointer }
  .print-menu input{ cursor:pointer; margin:0; accent-color:#1E44B0 }
  .print-menu .pm-note{ font-size:11px; color:#8A8883; margin-top:11px; padding-top:11px;
                        border-top:1px solid rgba(0,0,0,.12); line-height:1.55 }

  /* ── misc ──────────────────────────────────────────────────────────────── */
  .tc{ display:block }
  .print-header{ display:none }
  body[data-view="athlete"] .coachonly{ display:none !important }
  @media print{ .coachonly{ display:none !important } }
  .state-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center;
                 min-height:50vh; gap:14px; text-align:center }
  .hint{ font-size:12px; color:var(--dim); margin-top:10px }
  .pchips{ display:flex; gap:10px; flex-wrap:wrap; margin-top:22px }
  .pchip{ border:1px solid var(--rule); padding:7px 15px; font-size:11px; letter-spacing:.18em;
          text-transform:uppercase; color:var(--muted) }

  /* ══ PAIRED-BAR PANELS ═════════════════════════════════════════════════════
     The explanatory layer, built on the same tokens so it inverts with the
     sheet it sits on.
     ───────────────────────────────────────────────────────────────────────── */
  .ppanel{ margin-top:34px; border-top:1px solid var(--rule); padding-top:28px }
  .ppanel h3{ font-size:26px; font-weight:300; letter-spacing:-.015em; margin-top:12px; color:var(--ink) }
  .ppanel .pdesc{ font-size:16px; color:var(--muted); margin-top:12px; max-width:640px;
                  line-height:1.55; font-weight:300 }
  .pgrid{ display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:30px; margin-top:26px; align-items:start }
  .prow{ margin-bottom:18px }
  .prow .ptop{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px }
  .prow .pname{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted) }
  .prow .pv{ font-size:15px; font-variant-numeric:tabular-nums; color:var(--ink) }
  .prow .pv small{ font-size:10px; color:var(--muted); margin-left:4px; letter-spacing:.12em;
                   text-transform:uppercase }
  .ptrack{ height:6px; background:var(--rule2); border-radius:3px; overflow:hidden }
  .pfill{ height:6px; border-radius:3px }
  .pfill.ink{ background:var(--grad) }
  .pfill.blue{ background:var(--grad) }
  .pfill.grey{ background:var(--sv-dot) }
  .pfill.gold{ background:var(--sv-dot) }
  .pverdict{ font-size:14px; color:var(--muted); margin-top:18px; line-height:1.55 }

  /* the index tile reads as a bracketed stat, not a floating dark card */
  .itile{ position:relative; padding:22px 26px }
  .itile::before,.itile::after{ content:""; position:absolute; top:0; bottom:0; width:9px;
    border:1px solid var(--sv-br); pointer-events:none }
  .itile::before{ left:0; border-right:0 } .itile::after{ right:0; border-left:0 }
  .itile .ival{ font-size:44px; font-weight:200; letter-spacing:-.02em; line-height:1; margin-top:10px;
                font-variant-numeric:tabular-nums; color:var(--ink) }
  .itile .ipill{ display:block; margin-top:8px; font-size:10px; letter-spacing:.22em;
                 text-transform:uppercase; font-weight:600; color:var(--accent); background:none }
  .itile .ipill.warn{ color:#D9A95B }
  .itile .iscale{ position:relative; height:6px; background:var(--rule2); border-radius:3px; margin-top:18px }
  .itile .iscale .zone{ position:absolute; top:0; bottom:0; background:var(--grad); border-radius:3px; opacity:.85 }
  .itile .iscale .pin{ position:absolute; top:-4px; width:3px; height:14px; margin-left:-1.5px;
                       background:var(--sv-fg) }
  .itile .ikeys{ display:flex; justify-content:space-between; gap:8px; margin-top:10px;
                 font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim) }
  .itile .ikeys b{ color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums }
  .itile .inote{ font-size:12.5px; color:var(--dim); margin-top:14px; line-height:1.5 }

  @media screen and (max-width:820px){
    .heroGrid,.pgrid,.split{ grid-template-columns:1fr }
    .hlgrid,.hcgrid{ grid-template-columns:1fr }

  /* ── print ────────────────────────────────────────────────────────────── */
  /* The printout is not a separate document: #printAll is filled with the live
     sections' own markup, so the PDF can never drift from the screen. */
  #printAll{ display:none }
  @page{ size:A4; margin:0 }
  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important }
    /* the UA dark canvas (color-scheme:dark) paints behind the body, so the
       page edges come out near-black unless it is switched off for print */
    /* Pin the root to the sheet. Without this any single wide element makes
       Chrome's print dialog shrink the whole document to fit, which is what
       pushed the content into the left two-thirds of the page. */
    html, body{ width:210mm !important; max-width:210mm !important; min-width:0 !important;
                overflow-x:hidden !important; margin:0 }
    html{ background:#2A2A2A !important }
    body{ background:#2A2A2A !important }
    /* every wrap inside the printout fills the sheet, hero included */
    #printAll .wrap, .ppage .wrap, .pflow .wrap, .ppage .hero .wrap{
      max-width:none !important; width:100% !important;
      padding-left:13mm !important; padding-right:13mm !important }
    body.pall #main, body.pall .secnav, body.pall > .hero, body.pall .drawer,
    .no-print, .ctrls{ display:none !important }
    body.pall #printAll{ display:block !important }
    #printAll, #printAll *{ max-width:100% }
    #printAll img, #printAll svg, #printAll canvas{ height:auto }
    #printAll [style*="overflow-x"]{ overflow:hidden !important }
    /* the session log has one column per test and is the one element that can
       push past the sheet, which makes the print dialog scale everything down */
    #printAll table{ table-layout:fixed !important; width:100% !important }
    #printAll th, #printAll td{ white-space:normal !important; overflow-wrap:anywhere;
      font-size:6.5px !important; letter-spacing:.05em !important; padding:4px 2px !important }

    .ppage{ background:#2A2A2A; break-after:page; page-break-after:always; position:relative;
            padding-bottom:10mm }
    .ppage:last-child{ break-after:auto; page-break-after:auto }
    .ppage .wrap{ max-width:none; padding-left:14mm; padding-right:14mm }

    /* running header on every page after the first */
    .runhdr{ background:#2A2A2A; padding:10mm 0 6mm }
    .runhdr .wrap{ display:flex; justify-content:space-between; align-items:center; gap:12px;
                   font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; color:#A6A39D }
    .runhdr img, .runhdr .plogo img{ height:13px !important; width:auto !important;
      display:block; filter:brightness(0) invert(1) }

    .ppage .plogo img, .ppage .plogo img, .pflow .plogo img{ height:17px !important; width:auto !important;
      filter:brightness(0) invert(1) !important }
    .ppage .ffoot .plogo img{ height:13px !important }
    .ppage .topbar{ padding-bottom:9mm; border-bottom:1px solid rgba(255,255,255,.14) }
    .ppage.cover .hero{ width:100% }
    .ppage .hero .wrap{ padding-top:11mm; padding-bottom:11mm }
    .ppage .hero h1{ font-size:38px; margin-top:10px }
    .ppage .hero .sub{ font-size:13px; margin-top:10px; line-height:1.5 }
    .ppage .heroGrid{ grid-template-columns:minmax(0,1fr) 220px !important; gap:18px; margin-top:18px }
    .ppage .meta{ margin-top:16px; gap:20px }
    .ppage .meta b{ font-size:17px } .ppage .meta span{ font-size:7.5px; letter-spacing:.2em }
    .ppage .ringBox svg{ width:220px } .ppage .rcap{ font-size:8px }
    .ppage .hnote{ margin-top:14px; padding:12px 14px } .ppage .hnote p{ font-size:12px }


    .ppage .sec .h2, .pflow .sec .h2, .ppage .sec .h2, .pflow .sec .h2{ font-size:22px; margin-top:9px }
    .ppage .ebrow svg, .ppage .ebrow svg, .pflow .ebrow svg{ width:19px; height:19px }
    .ppage .eb, .ppage .eb, .pflow .eb{ font-size:8.5px; letter-spacing:.24em }
    .ppage .lead, .ppage .lead, .pflow .lead{ font-size:13px; margin-top:8px; max-width:none }
    .ppage .hlgrid, .ppage .hcgrid, .ppage .hlgrid, .ppage .hcgrid, .pflow .hlgrid, .pflow .hcgrid{ grid-template-columns:repeat(3,minmax(0,1fr)) !important;
                                    gap:14px; margin-top:18px }
    .ppage .big, .ppage .hcard .hval, .ppage .itile .ival, .ppage .big, .ppage .hcard .hval, .ppage .itile .ival, .pflow .big, .pflow .hcard .hval, .pflow .itile .ival{ font-size:30px; margin-top:7px }
    .ppage .hcard p.hdesc, .ppage .hcard p.hdesc, .pflow .hcard p.hdesc{ font-size:10.5px; margin-top:7px }
    .ppage .hcard .hfoot, .ppage .hcard .hfoot, .pflow .hcard .hfoot{ font-size:8px; padding-top:7px }
    .ppage .brk, .ppage .chart-wrap, .ppage .itile, .ppage .brk, .ppage .chart-wrap, .ppage .itile, .pflow .brk, .pflow .chart-wrap, .pflow .itile{ padding:14px 18px }
    .ppage .chart-grid, .ppage .chart-grid, .pflow .chart-grid{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:14px; margin-top:16px }
    .ppage .chart-title, .ppage .chart-title, .pflow .chart-title{ font-size:8px; letter-spacing:.22em; margin-bottom:8px }
    .ppage .split, .ppage .split, .pflow .split{ grid-template-columns:minmax(0,1fr) !important; gap:16px; margin-top:16px }
    .ppage .trend, .pflow .trend{ display:none !important }
    .ppage .rhead, .ppage .rhead, .pflow .rhead{ grid-template-columns:150px minmax(0,1fr) 32px; gap:14px; font-size:8px; margin-top:14px }
    .ppage .row, .ppage .row, .pflow .row{ grid-template-columns:150px minmax(0,1fr) 32px; gap:14px; padding:8px 0 }
    .ppage .row .lbl, .ppage .row .lbl, .pflow .row .lbl{ font-size:9px; letter-spacing:.18em }

    .ppage .bar, .ppage .bar, .pflow .bar{ height:20px } .ppage .bar .rv{ font-size:11px }
    .ppage .bar .cx, .ppage .bar .cx, .pflow .bar .cx{ font-size:8px } .ppage .cbadge, .pflow .cbadge{ width:24px; height:24px; font-size:8px }
    .ppage .ghead, .ppage .ghead, .pflow .ghead{ font-size:8.5px; padding:16px 0 2px }
    .ppage .callout, .ppage .callout, .pflow .callout{ margin-top:18px; padding:13px 16px } .ppage .callout div{ font-size:12px }
    .ppage .ppanel, .ppage .ppanel, .pflow .ppanel{ margin-top:20px; padding-top:18px }
    .ppage .ppanel h3, .ppage .ppanel h3{ font-size:19px }

    .row, .hcard, .hl, .chart-wrap, .ppanel, .itile, .callout, .brk,
    .hlgrid, .hcgrid, .ringBox, tr{ break-inside:avoid }
    .eb, .h2, .lead, .ebrow, .sechd{ break-after:avoid }
    .coachonly{ display:none !important }
    a{ color:inherit; text-decoration:none }
  }

  /* ══ PAIRED-BAR PANELS ═════════════════════════════════════════════════════
     The explanatory layer, built on the same tokens so it inverts with the
     sheet it sits on.
     ───────────────────────────────────────────────────────────────────────── */
  .ppanel{ margin-top:34px; border-top:1px solid var(--rule); padding-top:28px }
  .ppanel h3{ font-size:26px; font-weight:300; letter-spacing:-.015em; margin-top:12px; color:var(--ink) }
  .ppanel .pdesc{ font-size:16px; color:var(--muted); margin-top:12px; max-width:640px;
                  line-height:1.55; font-weight:300 }
  .pgrid{ display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:30px; margin-top:26px; align-items:start }
  .prow{ margin-bottom:18px }
  .prow .ptop{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px }
  .prow .pname{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted) }
  .prow .pv{ font-size:15px; font-variant-numeric:tabular-nums; color:var(--ink) }
  .prow .pv small{ font-size:10px; color:var(--muted); margin-left:4px; letter-spacing:.12em;
                   text-transform:uppercase }
  .ptrack{ height:6px; background:var(--rule2); border-radius:3px; overflow:hidden }
  .pfill{ height:6px; border-radius:3px }
  .pfill.ink{ background:var(--grad) }
  .pfill.blue{ background:var(--grad) }
  .pfill.grey{ background:var(--sv-dot) }
  .pfill.gold{ background:var(--sv-dot) }
  .pverdict{ font-size:14px; color:var(--muted); margin-top:18px; line-height:1.55 }

  /* the index tile reads as a bracketed stat, not a floating dark card */
  .itile{ position:relative; padding:22px 26px }
  .itile::before,.itile::after{ content:""; position:absolute; top:0; bottom:0; width:9px;
    border:1px solid var(--sv-br); pointer-events:none }
  .itile::before{ left:0; border-right:0 } .itile::after{ right:0; border-left:0 }
  .itile .ival{ font-size:44px; font-weight:200; letter-spacing:-.02em; line-height:1; margin-top:10px;
                font-variant-numeric:tabular-nums; color:var(--ink) }
  .itile .ipill{ display:block; margin-top:8px; font-size:10px; letter-spacing:.22em;
                 text-transform:uppercase; font-weight:600; color:var(--accent); background:none }
  .itile .ipill.warn{ color:#D9A95B }
  .itile .iscale{ position:relative; height:6px; background:var(--rule2); border-radius:3px; margin-top:18px }
  .itile .iscale .zone{ position:absolute; top:0; bottom:0; background:var(--grad); border-radius:3px; opacity:.85 }
  .itile .iscale .pin{ position:absolute; top:-4px; width:3px; height:14px; margin-left:-1.5px;
                       background:var(--sv-fg) }
  .itile .ikeys{ display:flex; justify-content:space-between; gap:8px; margin-top:10px;
                 font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim) }
  .itile .ikeys b{ color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums }
  .itile .inote{ font-size:12.5px; color:var(--dim); margin-top:14px; line-height:1.5 }

  @media screen and (max-width:820px){

    .brk,.chart-wrap,.itile{ padding:18px 20px }
    .sec{ border-radius:22px 22px 0 0; margin-top:-22px; padding:44px 0 64px }
    .sec .h2{ font-size:27px } .lead{ font-size:17px }
    .trend{ position:static }
  }

  /* ── print ────────────────────────────────────────────────────────────── */
  /* page box is set once, above — a second @page here would win and leave a band */
  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important }
    html,body{ background:#2A2A2A !important }
    .ctrls,.secnav,.drawer,.no-print,details,#tip{ display:none !important }

          break-inside:auto }

    .hero h1{ font-size:40px } .hero .sub{ font-size:14px } .hero .wrap{ padding-bottom:56px }

    .sec .h2{ font-size:24px } .lead{ font-size:14px }
    .hlgrid,.hcgrid{ grid-template-columns:repeat(3,minmax(0,1fr)) !important; gap:14px }
    .big,.hcard .hval,.itile .ival{ font-size:30px }
    .chart-grid{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:14px }
    .row,.hcard,.hl,.chart-wrap,.ppanel,.itile,.callout{ break-inside:avoid }
    .eb,.h2,.lead{ break-after:avoid }
    body{ font-size:13px }
    a{ color:inherit; text-decoration:none }
  }

  /* ── responsive ────────────────────────────────────────────────────────── */
  @media(max-width:980px){
    .heroGrid { grid-template-columns:1fr; gap:28px; }
    .split { grid-template-columns:1fr; }
    .trend { position:static; }
    .hlgrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .chart-grid { grid-template-columns:1fr; }
    .cat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media(max-width:620px){
    .hlgrid, .cat-grid { grid-template-columns:1fr; }

    .rhead span:nth-child(3), .row .bar { display:none; }
    .sec { padding:32px 0 34px; }
  }

<script>
// ─── NORMATIVE BANDS ─────────────────────────────────────────────────────────
// Sources:
//   Jump/RSI:  Badby, Comfort et al. JSS 2025; McMahon et al. Sensors 2022
//   EUR:       McGuigan et al. JSCR 2006
//   DSI:       Thomas, Dos'Santos, Jones. Sports 2017
//   IMTP:      Badby et al. JSS 2025 (professional soccer N/kg benchmarks)
//   Aerobic:   Cardamone et al. Front Physiol 2025 (Serie A VO2 ~61.5); Buchheit & Laursen
//   Strength:  Comfort et al. JSCR 2019; professional football literature
//   Speed:     Haugen et al. IJSPP 2019
// lb:true = lower is better

const NORMS = {
  // ── Jump / Power ──────────────────────────────────────────────────────────
  broad_jump:    { min:220,  max:260,  u:'cm',        lb:false, label:'Broad jump',              cat:'jump', source:'Loturco et al.; professional football literature' },
  // No validated professional football-specific normative dataset exists for SL broad jump absolute distance.
  // Tracked for individual longitudinal comparison only — no min/max scoring applied.
  slbj_L:        { min:null, max:null, u:'cm',        lb:false, label:'SL broad jump — L',       cat:'jump', noNorm:true, source:'No validated professional norm' },
  slbj_R:        { min:null, max:null, u:'cm',        lb:false, label:'SL broad jump — R',       cat:'jump', noNorm:true, source:'No validated professional norm' },
  // LSI: healthy footballers show natural variance of 97-106% (scoping review, 27 studies, JOSPT 2024).
  // <90% is a distinct injury-risk threshold (not a benchmark tier) — flagged separately in the UI.
  slbj_LSI:      { min:90,   max:100,  u:'%',         lb:false, label:'SL broad jump LSI',       cat:'jump', injuryFloor:90, source:'JOSPT scoping review 2024 (27 studies, soccer)' },
  // Triple hop (single-leg): collegiate male soccer/basketball average 632±72cm (Myers et al. 2014).
  // No professional-specific dataset found — moderate confidence, not pro-validated.
  triple_hop:    { min:560,  max:704,  u:'cm',        lb:false, label:'Triple hop (SL) — best leg', cat:'jump', note:'Collegiate data, not pro-specific', source:'Myers et al. 2014 (collegiate soccer/basketball)' },
  // L/R legs tracked individually — no separate norm, benchmarked against the same band
  triple_hop_L:  { min:560,  max:704,  u:'cm',        lb:false, label:'Triple hop — L',          cat:'jump', source:'Myers et al. 2014 (collegiate soccer/basketball)' },
  triple_hop_R:  { min:560,  max:704,  u:'cm',        lb:false, label:'Triple hop — R',          cat:'jump', source:'Myers et al. 2014 (collegiate soccer/basketball)' },
  // LSI: healthy athletes average 98.8% (SD 4.6); post-ACLR collegiate ~94.4%. <90% = flag.
  triple_hop_LSI:{ min:90,   max:100,  u:'%',         lb:false, label:'Triple hop LSI',          cat:'jump', injuryFloor:90, source:'Healthy mean 98.8% (Pilot ref values 2018); post-ACLR ~94.4% (IJSPT)' },
  // Height-normalised — removes the advantage taller athletes have on absolute distance
  triple_hop_norm:{min:3.2,  max:4.0,  u:'×height',   lb:false, label:'Triple hop ÷ height',     cat:'jump', note:'Distance ÷ body height', source:'Normalisation method per Compound Hop Index, JCM 2022 (first-league soccer)' },
  cmj:           { min:35,   max:55,   u:'cm',        lb:false, label:'CMJ height',              cat:'jump', source:'Badby et al. 2025; VALD ForceDecks normative data' },
  sj:            { min:30,   max:50,   u:'cm',        lb:false, label:'Squat jump (SJ)',         cat:'jump', source:'Professional football literature' },
  // Flight-time derived jump heights (force plate / jump mat). Same benchmark band as impulse-derived height.
  cmj_flight:    { min:35,   max:55,   u:'cm',        lb:false, label:'CMJ flight height',       cat:'jump', note:'Flight-time derived', source:'Systematic review: 33.6–57.2 cm across 54 studies, senior professional soccer' },
  sj_flight:     { min:30,   max:50,   u:'cm',        lb:false, label:'SJ flight height',        cat:'jump', note:'Flight-time derived', source:'Professional football literature' },
  // CMJ concentric (propulsive) force — benchmarked relative to body mass, not absolute N
  cmj_con_force: { min:25.7, max:31.4, u:'N/kg',      lb:false, label:'CMJ concentric force',    cat:'jump', note:'Requires force plate · relative to BW', source:'EFL professional soccer benchmarks 2025 (relative peak propulsive force)' },
  eur:           { min:0.90, max:1.15, u:'EUR',       lb:false, label:'EUR (CMJ÷SJ)',            cat:'jump',  note:'Auto: CMJ÷SJ', source:'McGuigan et al. 2006' },
  // mRSI: CMJ jump height (m) ÷ contraction time (s). Pro football ~0.8–1.4 (McMahon/Badby)
  cmj_mrsi:      { min:0.80, max:1.40, u:'m/s',       lb:false, label:'CMJ mRSI',               cat:'jump',  note:'Auto: JH(m)÷CT(s) — needs contraction time', source:'McMahon et al. 2022; Badby et al. 2025' },
  // DJ RSI: DJ height (m) ÷ contact time (s). Pro football ~1.0–1.8 (McMahon 2021)
  dj_rsi:        { min:1.00, max:1.80, u:'m/s',       lb:false, label:'DJ RSI',                 cat:'jump',  note:'Auto: JH(m)÷CT(s) — needs contact time', source:'McMahon et al. 2021' },
  dj:            { min:30,   max:50,   u:'cm',        lb:false, label:'Drop jump height (DJ)',   cat:'jump', source:'Professional football literature' },
  // DSI: ballistic PF ÷ isometric PF. Optimal 0.60–0.80 (Thomas et al. 2017)
  // >0.80 = needs strength work; <0.60 = needs plyometric work
  dsi:           { min:0.60, max:0.80, u:'DSI',       lb:false, label:'DSI',                    cat:'jump',  note:'Requires force plate', source:'Thomas, Dos\'Santos & Jones 2017' },
  // ── Aerobic ───────────────────────────────────────────────────────────────
  mas:           { min:4.5,  max:5.0,  u:'m/s',       lb:false, label:'MAS',          cat:'aero', source:'Elite benchmarks: professional soccer 4.5–5.0 m/s, rugby 4.5–4.8 m/s' },
  vo2max:        { min:58,   max:68,   u:'ml/kg/min', lb:false, label:'Est. VO₂ max',            cat:'aero', source:'Cardamone et al. 2025 (Serie A ~61.5 ml/kg/min); Buchheit' },
  // ── Strength ──────────────────────────────────────────────────────────────
  sq_1rm_bw:     { min:1.5,  max:2.0,  u:'×BW',       lb:false, label:'Back squat',             cat:'strength', source:'Comfort et al. 2019 (professional football)' },
  tb_1rm_bw:     { min:2.0,  max:2.8,  u:'×BW',       lb:false, label:'Trap bar DL',            cat:'strength', source:'Professional football literature' },
  bp_1rm_bw:     { min:0.9,  max:1.3,  u:'×BW',       lb:false, label:'Bench press',            cat:'strength', source:'Professional football literature' },
  // IMTP: relative peak force N/kg. Pro soccer median ~40 N/kg (Badby et al. 2025)
  // <30 N/kg = below norm for professional; 30–45 = within range; >45 = exceeds
  imtp:          { min:30,   max:45,   u:'N/kg',      lb:false, label:'IMTP',                   cat:'strength', note:'Requires force plate', source:'Badby et al. 2025 (professional soccer; median ~40 N/kg)' },
  // ── Additional aerobic tests ──────────────────────────────────────────────
  // Beep test (MSFT) level norm — professional footballers typically reach level 13–16.
  beep_level:   { min:13, max:16, u:'level', lb:false, label:'Beep test level', cat:'aero', source:'Ramsbottom et al. 1988; professional football literature' },
  // Bronco: time in seconds, lower is better. Limited football data; rugby league reference.
  bronco:       { min:240,  max:280,  u:'s',   lb:true,  label:'Bronco',     cat:'aero', note:'Lower is better · Limited football data', source:'Rugby league reference; limited football-specific data' },
  // Yo-Yo IR2: total distance in metres (Castagna et al. 2006 professional football data)
  yoyo_ir2:     { min:640,  max:1200, u:'m',   lb:false, label:'Yo-Yo IR2',  cat:'aero', note:'Castagna et al. 2006', source:'Castagna et al. 2006; professional football' },
  // ── Speed ─────────────────────────────────────────────────────────────────
  sprint10:      { min:1.65, max:1.80, u:'s',         lb:true,  label:'10m sprint',             cat:'speed', tiers:[0.05,0.12], source:'Haugen et al. 2019' },
  sprint20:      { min:2.85, max:3.05, u:'s',         lb:true,  label:'20m sprint',             cat:'speed', tiers:[0.05,0.12], source:'Haugen et al. 2019' },
  // Match-derived peak speed: pro average ~31-32 km/h (8.6-8.9 m/s); EPL all-time fastest ~37.4 km/h (10.4 m/s, Van de Ven).
  // 8.3-9.5 m/s covers typical professional range; >9.5 m/s is genuinely elite outlier territory.
  max_vel:       { min:8.3,  max:9.5,  u:'m/s',       lb:false, label:'Max velocity (20m fly)', cat:'speed', source:'LaLiga match-speed data; EPL fastest-ever ~10.4 m/s' },
};

let currentYAxis = QUAD_PRESETS[0].y;


const CAT_LABELS = { jump:'Jump / Power', aero:'Aerobic', strength:'Strength', speed:'Speed' };
const SL = ['Primary Focus','Building','Approaching Standard','At Standard','Above Standard'];
const SC = ['p0','p1','p2','p3','p4'];
// Five-tier colour scale, index 0 (worst) -> 4 (best).
// Deliberately separated in hue so adjacent tiers never read as the same colour:
// red -> orange -> amber -> blue -> green.
// House data gradient: [start, mid, end, secondary-series]. Mirrors --grad-* in
// the stylesheet; change both together.
const GRAD = ['#1E44B0','#4F74DB','#A9BEF2','#B9B6AF'];
Chart.defaults.font.family = "'Neue Haas Display','Inter',-apple-system,sans-serif";
Chart.defaults.color = '#8A8883';   // trend charts sit on a light sheet

const SCORE_COLS = ['#C2563B','#D07D4A','#D9A95B','#4F74DB','#1E44B0'];
const SD = SCORE_COLS;
const CC = ['#1a56db','#7c3aed','#0891b2','#16a34a','#dc2626','#c2410c','#6b7280'];

// ─── CALCULATIONS ─────────────────────────────────────────────────────────────
const pf  = v => { const n = parseFloat(v); return isNaN(n) || n === 0 ? null : n; };
const epley = (kg, reps) => { const k=pf(kg),r=pf(reps); if(!k||!r)return null; return r===1?k:+(k*(1+r/30)).toFixed(1); };
const masFromDist = d => { const v=pf(d); return v?+(v/300).toFixed(2):null; }; // m/s
// Léger & Mercier (1984): VO2max (ml/kg/min) = MAS (km/h) × 3.5. MAS is stored in m/s, so convert to km/h first.
const vo2FromMas  = mas_ms => { const v=pf(mas_ms); return v?+((v*3.6)*3.5).toFixed(1):null; };
const calcLSI     = (L,R) => { const l=pf(L),r=pf(R); return(l&&r)?+(Math.min(l,r)/Math.max(l,r)*100).toFixed(1):null; };
// Format seconds → MM:SS
const fmtTime = s => { if(!s)return'—'; const m=Math.floor(s/60),sec=Math.round(s%60); return `${m}:${String(sec).padStart(2,'0')}`; };
// VO2max from any distance TT — Daniels & Gilbert 1979
function vo2FromDistTT(dist_m, time_s) {
  if(!dist_m||!time_s||time_s<60)return null;
  const v=(dist_m/time_s)*60; // m/min
  const t=time_s/60;          // min
  const frac=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
  const vo2v=-4.60+0.182258*v+0.000104*v*v;
  const est=+(vo2v/frac).toFixed(1);
  return est>20&&est<100?est:null; // sanity bounds
}
// VO2max from Yo-Yo IR2 distance — Castagna et al. 2006
const vo2FromYoyo = d => { const v=pf(d); return v?+(v*0.0136+45.3).toFixed(1):null; };
// Beep test speed (km/h) from level
const beepSpeed = lvl => { const v=pf(lvl); return v?+(8.5+(v-1)*0.5):null; };
// VO2max from beep test level + age — Léger et al. 1988
function vo2FromBeep(level, age_yr) {
  const v=beepSpeed(level); if(!v)return null;
  const a=parseFloat(age_yr)||25;
  const est=+(31.025+3.238*v-3.248*a+0.1536*v*a).toFixed(1);
  return est>20&&est<100?est:null;
}
const bwRatio     = (rm,bw) => (rm&&bw)?+(rm/bw).toFixed(2):null;
const imtpNkg     = (N,bw) => { const n=pf(N),b=pf(bw); return(n&&b)?+(n/b).toFixed(2):null; };
// mRSI = jump height (m) ÷ contraction time (s)
const calcMrsi    = (cm,ms) => { const h=pf(cm),t=pf(ms); return(h&&t)?+((h/100)/(t/1000)).toFixed(2):null; };
// DJ RSI = jump height (m) ÷ contact time (s)
const calcDjRsi   = (cm,ms) => { const h=pf(cm),t=pf(ms); return(h&&t)?+((h/100)/(t/1000)).toFixed(2):null; };
// EUR = CMJ ÷ SJ (jump height)
const calcEur     = (cmj,sj) => { const c=pf(cmj),s=pf(sj); return(c&&s)?+(c/s).toFixed(2):null; };

function deriveSession(row, bw_kg, age_yr, height_cm) {
  // Per-session bodyweight takes priority; falls back to athlete's profile weight
  const bw = pf(row.weight_kg) || pf(bw_kg);
  const d  = {};
  d.weight_kg   = bw; // store whichever was used, for display
  d.notes       = (row.notes || '').trim();
  // Jump — direct
  d.broad_jump  = pf(row.broad_jump_cm);
  d.slbj_L      = pf(row.slbj_L_cm);
  d.slbj_R      = pf(row.slbj_R_cm);
  d.slbj_LSI    = calcLSI(row.slbj_L_cm, row.slbj_R_cm);
  // Triple hop — accepts L/R split, or a single legacy triple_hop_cm value
  d.triple_hop_L   = pf(row.triple_hop_L_cm);
  d.triple_hop_R   = pf(row.triple_hop_R_cm);
  d.triple_hop_LSI = calcLSI(row.triple_hop_L_cm, row.triple_hop_R_cm);
  // Headline value = best leg if L/R given, else the legacy single column
  d.triple_hop = (d.triple_hop_L!=null||d.triple_hop_R!=null)
    ? Math.max(d.triple_hop_L||0, d.triple_hop_R||0) || null
    : pf(row.triple_hop_cm);
  // Height-normalised (distance cm ÷ height cm)
  const _ht = pf(height_cm);
  d.triple_hop_norm = (d.triple_hop && _ht) ? +(d.triple_hop/_ht).toFixed(2) : null;
  d.cmj         = pf(row.cmj_cm);
  d.sj          = pf(row.sj_cm);
  d.dj          = pf(row.dj_cm);
  // EUR — auto from CMJ and SJ
  d.eur         = calcEur(row.cmj_cm, row.sj_cm);
  // mRSI — auto if contraction time provided, else null (future-proof)
  d.cmj_ct_ms   = pf(row.cmj_contraction_time_ms);
  d.cmj_mrsi    = calcMrsi(row.cmj_cm, row.cmj_contraction_time_ms);
  // DJ RSI — auto if contact time provided
  d.dj_ct_ms    = pf(row.dj_contact_time_ms);
  d.dj_rsi      = calcDjRsi(row.dj_cm, row.dj_contact_time_ms);
  // DSI — direct (force plate only)
  d.dsi         = pf(row.dsi);
  // Aerobic
  d.tt5min_dist = pf(row.tt5min_dist_m);
  d.mas         = masFromDist(row.tt5min_dist_m);
  d.mas_vo2max  = d.mas ? vo2FromMas(d.mas) : null;
  // General distance TT (any distance)
  d.tt_dist     = pf(row.tt_dist_m);
  d.tt_time     = pf(row.tt_time_s);
  d.tt_speed    = (d.tt_dist&&d.tt_time)?+(d.tt_dist/d.tt_time).toFixed(3):null; // m/s
  d.tt_vo2max   = vo2FromDistTT(d.tt_dist, d.tt_time);
  // Yo-Yo IR2
  d.yoyo_ir2     = pf(row.yoyo_ir2_dist_m);
  d.yoyo_vo2max  = vo2FromYoyo(row.yoyo_ir2_dist_m);
  // Beep test (MSFT)
  d.beep_level   = pf(row.beep_level);
  d.beep_shuttle = pf(row.beep_shuttle);
  d.beep_speed   = beepSpeed(row.beep_level); // km/h
  d.beep_vo2max  = vo2FromBeep(row.beep_level, age_yr);
  // Bronco
  d.bronco       = pf(row.bronco_time_s);
  // Best available VO2max — 5-min TT first priority, then others
  d.vo2max = d.mas_vo2max || d.tt_vo2max || d.yoyo_vo2max || d.beep_vo2max || pf(row.vo2max);
  // ── MAS resolution ──────────────────────────────────────────────────────
  // A maximal TT of ~4-8 min has an average speed that approximates MAS directly.
  // Outside that window a duration correction is applied: efforts shorter than ~4 min
  // are run above MAS, efforts longer than ~8 min below it.
  d.mas_src = d.mas ? '5-min TT' : null;
  if (d.mas == null && d.tt_speed != null && d.tt_time != null) {
    const tmin = d.tt_time / 60;
    let corr;
    if      (tmin < 3)   corr = 0.92;
    else if (tmin < 4)   corr = 0.96;
    else if (tmin <= 8)  corr = 1.00;   // avg speed ≈ MAS
    else if (tmin <= 12) corr = 1.04;
    else if (tmin <= 20) corr = 1.08;
    else                 corr = 1.12;
    d.mas = +(d.tt_speed * corr).toFixed(2);
    d.mas_src = `${d.tt_dist}m TT` + (corr !== 1.00 ? ` (${tmin.toFixed(1)}min, ×${corr})` : ` (${tmin.toFixed(1)}min)`);
  }
  // Bronco (1200m shuttle, 30 direction changes): apply World Rugby's 0.7s per
  // change-of-direction correction to get an equivalent straight-line 1200m time,
  // then treat it like any other distance TT.
  if (d.mas == null && d.bronco != null) {
    const BRONCO_DIST = 1200, BRONCO_TURNS = 30, TURN_COST = 0.7;
    const corrT = d.bronco - (BRONCO_TURNS * TURN_COST);
    if (corrT > 60) {
      const tmin = corrT / 60;
      let corr;
      if      (tmin < 3)   corr = 0.92;
      else if (tmin < 4)   corr = 0.96;
      else if (tmin <= 8)  corr = 1.00;
      else if (tmin <= 12) corr = 1.04;
      else                 corr = 1.08;
      d.mas = +((BRONCO_DIST / corrT) * corr).toFixed(2);
      d.mas_src = `Bronco ${fmtTime(d.bronco)} (turn-corrected)`;
    }
  }
  // Yo-Yo / beep only: back-calculate MAS from estimated VO2max as a last resort
  if (d.mas == null && d.vo2max != null) {
    d.mas = +(((d.vo2max/3.5)/3.6)).toFixed(2);
    d.mas_src = 'estimated from VO\u2082max';
  }
  // Strength — Epley → BW ratio (uses session bodyweight)
  const sq1rm   = epley(row.sq_kg, row.sq_reps);
  const tb1rm   = epley(row.tb_kg, row.tb_reps);
  const bp1rm   = epley(row.bp_kg, row.bp_reps);
  d.sq_1rm      = sq1rm; d.sq_kg_raw = pf(row.sq_kg); d.sq_reps_raw = pf(row.sq_reps);
  d.tb_1rm      = tb1rm; d.tb_kg_raw = pf(row.tb_kg); d.tb_reps_raw = pf(row.tb_reps);
  d.bp_1rm      = bp1rm; d.bp_kg_raw = pf(row.bp_kg); d.bp_reps_raw = pf(row.bp_reps);
  d.sq_1rm_bw   = bwRatio(sq1rm, bw);
  d.tb_1rm_bw   = bwRatio(tb1rm, bw);
  d.bp_1rm_bw   = bwRatio(bp1rm, bw);
  // Flight-time derived jump heights (optional — separate from impulse-derived cmj/sj)
  d.cmj_flight  = pf(row.cmj_flight_cm);
  d.sj_flight   = pf(row.sj_flight_cm);
  // CMJ concentric force — raw Newtons in, N/kg out (same pattern as IMTP)
  d.cmj_con_force_N = pf(row.cmj_con_force_N);
  d.cmj_con_force   = (d.cmj_con_force_N && bw) ? +(d.cmj_con_force_N / bw).toFixed(1) : null;
  d.imtp_raw_N  = pf(row.imtp_N);
  d.imtp        = imtpNkg(row.imtp_N, bw);
  // Speed
  d.sprint10    = pf(row.sprint10_s);
  d.sprint20    = pf(row.sprint20_s);
  d.max_vel     = pf(row.max_vel_ms);
  // ── Motor preference (VueMotion) — z-scores per leg, per run type ──
  // ── Motor preference (VueMotion) — RAW values transcribed from the report ──
  // Run types: 'acc' (Run Type: Acc) and 'fly' (Run Type: Fly / max velocity).
  ['acc','fly'].forEach(pfx=>{
    d[pfx+'_sl_L']      = pf(row[pfx+'_sl_L']);      // step length, m
    d[pfx+'_sl_R']      = pf(row[pfx+'_sl_R']);
    d[pfx+'_sf_L']      = pf(row[pfx+'_sf_L']);      // step frequency, Hz
    d[pfx+'_sf_R']      = pf(row[pfx+'_sf_R']);
    d[pfx+'_gct_L']     = pf(row[pfx+'_gct_L']);     // ground contact time, s
    d[pfx+'_gct_R']     = pf(row[pfx+'_gct_R']);
    d[pfx+'_ft_L']      = pf(row[pfx+'_ft_L']);      // flight time, s
    d[pfx+'_ft_R']      = pf(row[pfx+'_ft_R']);
    d[pfx+'_max_speed'] = pf(row[pfx+'_max_speed']);
    // Authoritative: z-score coordinates read straight off the VueMotion
    // Motor Preference chart. These override anything computed from raw values.
    d[pfx+'_mp_x']   = pf(row[pfx+'_mp_x']);
    d[pfx+'_mp_y']   = pf(row[pfx+'_mp_y']);
    d[pfx+'_mp_x_L'] = pf(row[pfx+'_mp_x_L']);
    d[pfx+'_mp_x_R'] = pf(row[pfx+'_mp_x_R']);
    d[pfx+'_mp_y_L'] = pf(row[pfx+'_mp_y_L']);
    d[pfx+'_mp_y_R'] = pf(row[pfx+'_mp_y_R']);
  });
  // Legacy 'mv_' prefix accepted as an alias for 'fly_'
  ['sl_L','sl_R','sf_L','sf_R','gct_L','gct_R','ft_L','ft_R','max_speed'].forEach(k=>{
    if (d['fly_'+k]==null && row['mv_'+k]!=null) d['fly_'+k] = pf(row['mv_'+k]);
  });
  d.test_date   = row.test_date;
  return d;
}

// ─── BENCHMARK SCORING ───────────────────────────────────────────────────────
// Tier bands are measured OUTWARD from the boundary an athlete falls short of:
//   higher-is-better -> below n.min ;  lower-is-better -> above n.max
// A norm can override the default 10% / 20% via  tiers:[near, far].
function bs(v, nk) {
  const n = NORMS[nk]; if (!n || v==null || n.noNorm) return null;
  const [t1,t2] = n.tiers || [0.10, 0.20];
  if (n.lb) {
    if (v<=n.min) return 4; if (v<=n.max) return 3;
    if (v<=n.max*(1+t1)) return 2; if (v<=n.max*(1+t2)) return 1; return 0;
  } else {
    if (v>=n.max) return 4; if (v>=n.min) return 3;
    if (v>=n.min*(1-t1)) return 2; if (v>=n.min*(1-t2)) return 1; return 0;
  }
}
function injuryFlag(v, nk) {
  const n = NORMS[nk];
  if (!n || !n.injuryFloor || v==null) return null;
  return v < n.injuryFloor;
}
function pill(s) {
  if (s===null) return '';
  return `<span class="pill ${SC[s]}"><span class="pill-dot" style="background:${SD[s]}"></span>${SL[s]}</span>`;
}
function dHtml(val, prev, lb) {
  if (val==null||prev==null) return '<span class="miss">—</span>';
  const d=((val-prev)/prev*100), imp=lb?d<0:d>0, unc=Math.abs(d)<0.5;
  const col=unc?'#7a8290':imp?'#16a34a':'#dc2626';
  return `<span class="delta" style="color:${col}">${unc?'→':imp?'↑':'↓'} ${d>0?'+':''}${d.toFixed(1)}%</span>`;
}
function catLabel(avg) {
  if (avg===null) return null;
  if (avg>=3.5) return {l:'Above Standard', c:SCORE_COLS[4]};
  if (avg>=2.5) return {l:'At Standard',    c:SCORE_COLS[3]};
  if (avg>=1.5) return {l:'Building',       c:SCORE_COLS[1]};
  return              {l:'Primary Focus',  c:SCORE_COLS[0]};
}
function catCard(catKey, keys, d) {
  const scores = keys.map(k=>bs(d[k],k)).filter(s=>s!==null);
  if (!scores.length) return `<div class="cat-card"><div class="cat-name">${CAT_LABELS[catKey]}</div><div class="cat-status" style="color:#7a8290">No data</div></div>`;
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  const cl  = catLabel(avg);
  return `<div class="cat-card" style="border-left:3px solid ${cl.c}"><div class="cat-name">${CAT_LABELS[catKey]}</div><div class="cat-status" style="color:${cl.c}">${cl.l}</div></div>`;
}
function sidebarCol(d) {
  if (!d) return '#7a8290';
  const scores = Object.keys(NORMS).map(k=>bs(d[k],k)).filter(s=>s!==null);
  if (!scores.length) return '#7a8290';
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  return SCORE_COLS[Math.max(0,Math.min(4,Math.round(avg)))];
}
// Get most recently tested value for a key across all sessions (sessions sorted newest-first)
function latestVal(sessions, key) {
  for (const s of sessions) { if (s[key]!=null) return s[key]; }
  return null;
}
// Build a composite "best available" data object across all sessions for category scoring
// Raw / derived fields that are not scored against a norm but are still needed for
// display (the "150kg x 3 -> est. 1RM 164kg" sub-lines, IMTP Newtons, TT inputs).
// Carried here so EVERY consumer gets them — the results table, the print report and
// the feedback builder all read the same object.
const CARRY_KEYS = [
  'sq_1rm','tb_1rm','bp_1rm','sq_kg_raw','tb_kg_raw','bp_kg_raw',
  'sq_reps_raw','tb_reps_raw','bp_reps_raw','imtp_raw_N','cmj_con_force_N',
  'tt5min_dist','tt_dist','tt_time','tt_speed','tt_vo2max',
  'yoyo_vo2max','beep_level','beep_shuttle','beep_speed','beep_vo2max',
  'cmj_ct_ms','dj_ct_ms','bronco_time_s',
];

function buildLatestAcrossSessions(sessions) {
  const out = {};
  Object.keys(NORMS).forEach(k => { out[k] = latestVal(sessions, k); });
  CARRY_KEYS.forEach(k => { const v = latestVal(sessions, k); if (v != null) out[k] = v; });
  // carry the MAS source label from whichever session supplied the MAS value
  for (const s of sessions) { if (s.mas != null) { out.mas_src = s.mas_src; break; } }
  return out;
}

// ─── TABLE ROW BUILDERS ───────────────────────────────────────────────────────
let _rSessions=[]; // set in renderMain for PB detection
let _rDateSrc={};   // metric -> session date it came from
let _rLatestDate=null;

function mRow(nk, val, prevVal, subtext, isAuto) {
  const n = NORMS[nk]; if (!n) return '';
  const normText = n.noNorm ? 'No validated norm' : `${n.min}–${n.max} ${n.u}`;
  const normStyle = n.noNorm ? 'font-style:italic;color:var(--text-muted)' : 'color:var(--text-muted)';
  if (val==null) return `<tr><td class="lbl">${n.label}${n.note?` <span style="font-size:10px;color:var(--text-muted)">(${n.note})</span>`:''}</td><td colspan="2" class="miss">— not tested</td><td style="font-size:11px;${normStyle}">${normText}${n.source?`<span class="norm-source">${n.source}</span>`:''}</td><td class="miss">—</td></tr>`;
  const s = bs(val, nk);
  const sub = subtext ? `<span class="rsub">${subtext}</span>` : '';
  const badge = isAuto ? '<span class="calc-badge">auto</span>' : '';
  const flagged = injuryFlag(val, nk);
  // PB detection
  let pbHtml = '';
  if (val != null && _rSessions.length >= 2) {
    const hist = _rSessions.map(sess=>sess[nk]).filter(v=>v!=null);
    if (hist.length >= 2) {
      const best = n.lb ? Math.min(...hist) : Math.max(...hist);
      if (val === best) pbHtml = '<span class="pb-badge">★ PB</span>';
    }
  }
  const statusCell = n.noNorm
    ? `<span style="font-size:11px;color:var(--text-muted);font-style:italic">Track individually</span>`
    : flagged
      ? `<span class="pill p0" style="background:#fef2f2"><span class="pill-dot" style="background:#dc2626"></span>Below symmetry threshold (&lt;${n.injuryFloor}%)</span>`
      : pill(s);
  return `<tr>
    <td class="lbl">${n.label}</td>
    <td><span class="rval">${val}</span><span class="runit">${n.u}</span>${sub}${badge}${pbHtml}${(_rDateSrc[nk]&&_rLatestDate&&_rDateSrc[nk]!==_rLatestDate)?`<span class="rsub" style="color:#b0b6bd">tested ${_rDateSrc[nk]}</span>`:''}</td>
    <td>${statusCell}</td>
    <td style="font-size:11px;${normStyle}">${normText}${n.source?`<span class="norm-source">${n.source}</span>`:''}</td>
    <td>${dHtml(val, prevVal, n.lb)}</td>
  </tr>`;
}
function strengthRow(nk, d, pv, label) {
  const n = NORMS[nk];
  const normText  = `${n.min}–${n.max} ${n.u}`;
  const srcAttr   = '';
  const srcIcon   = '';
  const srcText   = n.source ? `<span class="norm-source">${n.source}</span>` : '';
  const val  = d[nk], prev = pv?pv[nk]:null;
  const pfx  = nk.replace('_1rm_bw','');
  const kg   = d[pfx+'_kg_raw'], reps = d[pfx+'_reps_raw'], rm1 = d[pfx+'_1rm'];
  if (val==null) return `<tr><td class="lbl">${label}</td><td colspan="2" class="miss">— not tested</td><td style="font-size:11px;color:var(--text-muted)">${normText}${n.source?`<span class="norm-source">${n.source}</span>`:''}</td><td class="miss">—</td></tr>`;
  const s = bs(val, nk);
  let sub = reps&&reps>1 ? `<span class="rsub">(${kg}kg × ${reps} → est. 1RM ${rm1}kg)</span>` : rm1?`<span class="rsub">(1RM ${rm1}kg)</span>`:'';
  return `<tr>
    <td class="lbl">${label}</td>
    <td><span class="rval">${val}</span><span class="runit">×BW</span>${sub}<span class="calc-badge">auto</span></td>
    <td>${pill(s)}</td>
    <td style="font-size:11px;color:var(--text-muted)">${normText}${srcText}</td>
    <td>${dHtml(val, prev, false)}</td>
  </tr>`;
}

const getConfig = () => { try{return JSON.parse(localStorage.getItem('dashConfig')||'{}')}catch(e){return{}} };
const saveConfig = c => localStorage.setItem('dashConfig', JSON.stringify(c));

async function fetchSheet(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} — check the URL`);
  return r.text();
}
function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => {
    const cols=[]; let cur='', inQ=false;
    for (const ch of l) {
      if (ch==='"'){inQ=!inQ} else if (ch===','&&!inQ){cols.push(cur.trim());cur=''} else {cur+=ch}
    }
    cols.push(cur.trim()); return cols;
  });
  const headers = lines[0].map(h=>h.trim());
  return lines.slice(1).filter(r=>r.some(c=>c)).map(r=>{
    const obj={}; headers.forEach((h,i)=>obj[h]=(r[i]||'').trim()); return obj;
  });
}
async function loadData() {
  const cfg = getConfig();
  if (!cfg.athletesUrl||!cfg.resultsUrl){showSetup();return;}
  showLoading();
  try {
    const [aText,rText] = await Promise.all([fetchSheet(cfg.athletesUrl),fetchSheet(cfg.resultsUrl)]);
    const athletes=parseCSV(aText), results=parseCSV(rText);
    athleteMap={};
    athletes.forEach(a=>{
      // Calculate age from birthdate (YYYY-MM-DD) if present; fall back to static age field
      let computedAge = null;
      if (a.birthdate && /\d{4}-\d{2}-\d{2}/.test(a.birthdate)) {
        const diff = Date.now() - new Date(a.birthdate).getTime();
        computedAge = Math.floor(diff / (365.25*24*60*60*1000));
      } else {
        computedAge = parseFloat(a.age) || null;
      }
      athleteMap[a.id]={...a, age:computedAge, leg_length_cm:a.leg_length_cm, sessions:[]};
    });
    results.forEach(r=>{
      if(athleteMap[r.athlete_id]) athleteMap[r.athlete_id].sessions.push(deriveSession(r,athleteMap[r.athlete_id].weight_kg,athleteMap[r.athlete_id].age,athleteMap[r.athlete_id].height_cm));
    });
    Object.values(athleteMap).forEach(a=>a.sessions.sort((x,y)=>new Date(y.test_date)-new Date(x.test_date)));
    const st=document.getElementById('syncMsg');
    if(st) st.textContent=`Synced — ${athletes.length} athletes · ${results.length} sessions`;
    renderList();
    const ids=Object.keys(athleteMap);
    if(ids.length){selectedId=ids[0];renderMain();}
  } catch(e){showError(e.message);}
}

function hCard(nk, val, d, sessionCount){
  const n = NORMS[nk]; if (!n || val==null) return '';
  const sc = bs(val, nk);
  let pill = { cls:'ok', txt:'In range' };
  if (sc===null)      pill = { cls:'high', txt:'No norm' };
  else if (sc>=4)     pill = { cls:'high', txt:n.lb?'Faster than range':'Above range' };
  else if (sc===3)    pill = { cls:'ok',   txt:'In range' };
  else                pill = { cls:'warn', txt:n.lb?'Slower than range':'Below range' };

  let bar = '';
  if (n.min!=null && !n.noNorm){
    const span=(n.max-n.min)||Math.abs(n.max||1)*0.2||1;
    const lo=n.min-span*0.95, hi=n.max+span*0.95;
    const pc=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
    bar = `<div class="hbar">
        <div class="zone" style="left:${pc(n.min).toFixed(1)}%;width:${(pc(n.max)-pc(n.min)).toFixed(1)}%"></div>
        <div class="pin" style="left:${pc(val).toFixed(1)}%"></div>
      </div>
      <div class="hscale"><span>${n.lb?'Slower':'Lower'}</span><b>${n.min}–${n.max}</b><span>${n.lb?'Faster':'Higher'}</span></div>`;
  }
  const tested = sessionCount<=1 ? 'First test'
    : `${sessionCount} sessions recorded`;
  return `<div class="hcard">
    <div class="eb">${n.label}</div>
    <div class="hval">${val}<small>${n.u||''}</small></div>
    <span class="hpill ${pill.cls}">${pill.txt}</span>
    ${bar}
    ${PLAIN[nk]?`<p class="hdesc">${PLAIN[nk]}</p>`:''}
    <div class="hfoot">${tested}</div>
  </div>`;
}

function highlightSection(set, d, a){
  const cards = set.keys.map(k => hCard(k, d[k], d, a.sessions.length)).filter(Boolean);
  if (!cards.length) return '';
  return secHead(set.icon, set.eb, set.title, set.lead)
    + `<div class="hcgrid">${cards.slice(0,6).join('')}</div>`;
}

// ─── PAIRED-BAR PANEL ─────────────────────────────────────────────────────────
// eyebrow + heading + explanation, two or three measured bars, and a dark tile
// carrying the derived index with its own reference scale.
function pPanel({eb, title, desc, bars, tile, verdict}){
  // Each bar scales against its own reference where one is given, so rows in
  // different units (seconds against metres per second) stay comparable.
  const groupMax = Math.max(...bars.map(b=>b.v||0), 0.0001);
  const barHtmlP = bars.map(b=>{
    const m = b.max || groupMax;
    return `
    <div class="prow">
      <div class="ptop"><span class="pname">${b.name}</span>
        <span class="pv">${b.v}<small>${b.u||''}</small></span></div>
      <div class="ptrack"><div class="pfill ${b.cls||'ink'}" style="width:${Math.max(5,Math.min(100,(b.v/m)*100)).toFixed(1)}%"></div></div>
    </div>`;
  }).join('');
  let tileHtml = '';
  if (tile){
    const pc = v => Math.max(0,Math.min(100, ((v-tile.lo)/(tile.hi-tile.lo))*100));
    tileHtml = `<div class="itile">
      <div class="eb">${tile.label}</div>
      <div class="ival">${tile.value}</div>
      <span class="ipill hpill ${tile.cls}">${tile.status}</span>
      <div class="iscale">
        <div class="zone" style="left:${pc(tile.bandLo).toFixed(1)}%;width:${(pc(tile.bandHi)-pc(tile.bandLo)).toFixed(1)}%"></div>
        <div class="pin" style="left:${pc(tile.at).toFixed(1)}%"></div>
      </div>
      <div class="ikeys"><span>${tile.loLabel}</span><b>${tile.bandLo}–${tile.bandHi}</b><span>${tile.hiLabel}</span></div>
      ${tile.note?`<p class="inote">${tile.note}</p>`:''}
    </div>`;
  }
  return `<div class="ppanel">
    <div class="eb">${eb}</div>
    <h3>${title}</h3>
    ${desc?`<p class="pdesc">${desc}</p>`:''}
    <div class="pgrid"><div>${barHtmlP}</div>${tileHtml}</div>
    ${verdict?`<p class="pverdict">${verdict}</p>`:''}
  </div>`;
}

// ─── LOCOMOTION: "HOW <NAME> RUNS" ────────────────────────────────────────────
// Built from the sprint splits and the VueMotion step data. Everything here is
// raw kinematics and athlete-safe — the injury associations stay in the
// coach-only motor preference section.
function runsSection(a, d){
  const first = a.name.split(' ')[0];
  const S = a.sessions;
  const pick = k => { for (const x of S) if (x[k]!=null) return x[k]; return null; };
  const avg2 = (l,r) => (l!=null&&r!=null) ? (l+r)/2 : (l!=null?l:(r!=null?r:null));

  const slL=pick('fly_sl_L'), slR=pick('fly_sl_R');
  const sfL=pick('fly_sf_L'), sfR=pick('fly_sf_R');
  const gcL=pick('fly_gct_L'), gcR=pick('fly_gct_R');
  const ftL=pick('fly_ft_L'),  ftR=pick('fly_ft_R');
  const SL=avg2(slL,slR), SF=avg2(sfL,sfR), GC=avg2(gcL,gcR), FT=avg2(ftL,ftR);

  const panels = [];
  const chips  = [];

  // ── acceleration vs top speed ──────────────────────────────────────────
  if (d.sprint10!=null || d.max_vel!=null){
    const bars=[];
    if (d.sprint10!=null) bars.push({name:'10 m from a standstill', v:d.sprint10, u:'s',  cls:'ink',  max:2.2});
    if (d.sprint20!=null) bars.push({name:'20 m from a standstill', v:d.sprint20, u:'s',  cls:'grey', max:3.6});
    if (d.max_vel!=null)  bars.push({name:'Top speed, flying 20 m', v:d.max_vel,  u:'m/s', cls:'blue', max:11.5});
    let tile=null;
    if (d.sprint10!=null && d.max_vel!=null){
      // share of top speed already reached inside the first 10 m
      const early = (10/d.sprint10) / d.max_vel;
      const pctv = +(early*100).toFixed(0);
      const ok = early>=0.62;
      tile = { label:'Early acceleration', value:pctv+'%',
        status: ok?'Strong off the mark':'Build the first steps',
        cls: ok?'ok':'warn',
        lo:40, hi:85, bandLo:62, bandHi:72, at:pctv,
        loLabel:'Slower start', hiLabel:'Faster start',
        note:`Average speed over the first 10 m as a share of your top speed.` };
      chips.push(ok?'Quick off the mark':'Acceleration to build');
    }
    panels.push(pPanel({ eb:'Acceleration', title:'Getting up to speed',
      desc:'How quickly you reach speed from a standstill, and how fast you are once you are there.',
      bars, tile,
      verdict: (d.max_vel!=null && bs(d.max_vel,'max_vel')>=3)
        ? 'Top-end speed is at the professional standard. The work is in reaching it sooner.'
        : 'Top-end speed is the clearest place to add. Max velocity exposure once a week is the lever.' }));
  }

  // ── step length vs step rate ───────────────────────────────────────────
  if (SL!=null && SF!=null){
    const ratio = +(SL/SF).toFixed(3);
    const longStride = ratio > 0.38;
    chips.push(longStride ? 'Long stride' : 'High turnover');
    panels.push(pPanel({ eb:'Stride', title:'Step length versus step rate',
      desc:'Two ways to run fast: cover more ground per step, or take more steps per second. Most athletes lean one way.',
      bars:[
        {name:'Step length', v:+SL.toFixed(2), u:'m',  cls:'ink',  max:2.4},
        {name:'Step rate',   v:+SF.toFixed(2), u:'Hz', cls:'gold', max:5.2},
      ],
      tile:{ label:'Length ÷ rate', value:ratio.toFixed(2),
        status: longStride?'Stride-driven':'Turnover-driven', cls: longStride?'high':'ok',
        lo:0.28, hi:0.50, bandLo:0.36, bandHi:0.42, at:ratio,
        loLabel:'More steps', hiLabel:'Longer steps',
        note:`${longStride?'You cover ground with fewer, longer steps.':'You run with quicker, shorter steps.'}` },
      verdict: (slL!=null&&slR!=null&&Math.abs(slL-slR)/Math.max(slL,slR)>0.05)
        ? `Your legs are not matched: ${slL.toFixed(2)} m left against ${slR.toFixed(2)} m right. Worth a closer look.`
        : 'Left and right step length are well matched.' }));
  }

  // ── ground contact vs flight ───────────────────────────────────────────
  if (GC!=null && FT!=null){
    const cf = +(GC/FT).toFixed(2);
    const quick = GC <= 0.14;
    chips.push(quick ? 'Quick off the ground' : 'Longer contacts');
    panels.push(pPanel({ eb:'Reactive', title:'Time on the ground',
      desc:'At top speed the foot is down for roughly a tenth of a second. Shorter contacts mean a stiffer, faster spring.',
      bars:[
        {name:'Ground contact time', v:+(GC*1000).toFixed(0), u:'ms', cls:'ink',  max:220},
        {name:'Flight time',         v:+(FT*1000).toFixed(0), u:'ms', cls:'grey', max:220},
      ],
      tile:{ label:'Contact ÷ flight', value:cf.toFixed(2),
        status: quick?'Fast spring':'Spring to develop', cls: quick?'ok':'warn',
        lo:0.8, hi:3.2, bandLo:1.3, bandHi:1.9, at:cf,
        loLabel:'More flight', hiLabel:'More contact',
        note:`${(GC*1000).toFixed(0)} ms on the ground per step at top speed.` },
      verdict: quick
        ? 'Contact times are short — the elastic qualities are there to build on.'
        : 'Longer contacts than ideal. Low-amplitude plyometrics and sprint drills are the route in.' }));
  }

  if (!panels.length) return '';
  return secHead('person','Locomotion',`How ${first} runs`,
      'Raw sprint mechanics from your timing gates and VueMotion run — what your running is made of, '
    + 'rather than only how fast it came out.')
    + (chips.length?`<div class="pchips">${chips.map(c=>`<span class="pchip">${c}</span>`).join('')}</div>`:'')
    + panels.join('');
}
